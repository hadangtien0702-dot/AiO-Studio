      } catch (e) {}
      if (!canChay) { tachMono(i + 1, xong); return }
      var nsCpu = AiOTaiNguyen.chiaLuong(1)
      var kenh = (caiDat.kenhAudio && caiDat.kenhAudio[i] === 'R') ? 'c0=c1' :
                 (caiDat.kenhAudio && caiDat.kenhAudio[i] === 'L') ? 'c0=c0' :
                 (i === 1) ? 'c0=c1' : 'c0=c0'
      // ☠️ CHUẨN HOÁ ÂM LƯỢNG ngay lúc tách — anh Tiến 05/08: *"anh mới tăng
      // 2 audio lên 25db thì mới nghe được"*. Đo được: mic Will trung bình
      // −42,6 dB, mic Trọng −36,4 dB, hai mic còn lệch nhau 6,2 dB.
      // Chuẩn hoá ở ĐÂY chứ không chỉnh Level trên timeline vì Level của
      // Premiere chỉ tới +15 dB (đo 05/08) — không đủ để bù +22 dB.
      // ☠️ Chỉ file ĐẶT LÊN TIMELINE mới chuẩn hoá. File dùng để PHÂN TÍCH
      // (wavMic 16 kHz) giữ nguyên: não nghe mỗi kênh so nền của chính nó nên
      // gain không ảnh hưởng, và giữ nguyên thì kết quả cắt không đổi theo
      // một bước xử lý âm thanh — hai việc tách bạch, dễ soi khi có sự cố.
      var loc = 'pan=mono|' + kenh + ',loudnorm=I=-16:TP=-1.5:LRA=11'
      cp.execFile(ffmpeg,
        ['-y', '-threads', String(nsCpu.luongMoi), '-i', nguon, '-vn',
         '-af', loc, '-ar', '48000', '-c:a', 'pcm_s16le', ra],
        { windowsHide: true, maxBuffer: AiOTaiNguyen.tranDemLog() },
        function (err, so, se) {
          if (err) { xong(t('tach_loi') + String(se || err).slice(-300)); return }
          tachMono(i + 1, xong)
        })
    }

    tachMot(0, function (loiTach) {
      if (loiTach) { thoat(loiTach, null); return }
      tachMono(0, function (loiMono) {
        if (loiMono) { thoat(loiMono, null); return }

        // ── 2. Não nghe ──
        tienDo(t('dang_nghe'), 30)
        setTimeout(function () {
          var micDb = []
          for (var i = 0; i < viecMic.length; i++) {
            var buf
            try { buf = fs.readFileSync(wavMic[i]) } catch (e) { buf = null }
            var doc = buf ? AiONao.taiWav(buf) : null
            if (!doc) { thoat(tp('wav_hong', { ten: tenNguoi(i) }), null); return }
            micDb.push({
              db: AiONao.doDb(doc.pcm, doc.sr),
              offset: tu0 + viecMic[i].inPoint - viecMic[i].batDau,
            })
          }

          // ── Chốt an toàn 1: "mic" đều suốt = tiếng cam / nhạc nền ──
          for (var m = 0; m < micDb.length; m++) {
            var ph = AiONao.phoMic(micDb[m].db)
            if ((ph.p90 - ph.p10 < 6 && ph.p50 > -50) || ph.p90 < -55) {
              tuTimVaSyncMicProject(function (okPhucHoi) {
                if (okPhucHoi) {
                  dangChay = false
                  dungBan()
                } else {
                  thoat(null, tp('mic_deu', { ten: tenNguoi(m), track: 'A' + (viecMic[m].i + 1) }))
                }
              })
              return
            }
          }

          // ── Tự động khôi phục mic rời từ Project Bin ──
          var naoOpts = { luotToiThieu: caiDat.shot }
          if (clipWide) naoOpts.coWide = true
          if (caiDat.nguong !== 'auto') naoOpts.nguongChenh = parseFloat(caiDat.nguong)
          var kq = AiONao.aiDangNoi(micDb, daiGiay, naoOpts)

          if (kq.trangThai !== 'OK') {
            // TỰ ĐỘNG KHÔI PHỤC BẰNG MIC RỜI TRONG PROJECT BIN
            tuTimVaSyncMicProject(function (okPhucHoi) {
              if (okPhucHoi) {
                dangChay = false
                dungBan()
              } else {
                var ro = kq.thongKe ? Math.round(kq.thongKe.tyLeRo * 100) : 0
                thoat(null, tp('khong_phan_biet', { ro: ro }) + taNgheThay(kq.thongKe))
              }
            })
            return
          }
          if (kq.doan.length < 2) { thoat(null, t('mot_luot') + taNgheThay(kq.thongKe)); return }

          var doan = kq.doan.map(function (d) { return { tu: d.tu, den: d.den, nguoi: d.nguoi } })

          // Tự động chen Cam Toàn Cảnh (Cam 3 / Wide Shot) để luôn lấy đủ cả 3 camera
          if (clipWide) {
            var ra = []
            var maxS = (caiDat.max > 0 ? caiDat.max : 15)
            var nChuyen = 0
            var prevNguoi = -99
            var lastWideTime = 0

            // 1. Mở đầu bằng Cam Wide 3.5s nếu thoại bắt đầu từ đầu
            if (doan.length > 0 && doan[0].tu < 0.2) {
              ra.push({ tu: 0, den: Math.min(3.5, doan[0].den), nguoi: -1 })
              if (doan[0].den > 3.5) {
                doan[0].tu = 3.5
              } else {
                doan.shift()
              }
              lastWideTime = 3.5
            }

            doan.forEach(function (d) {
              if (d.nguoi < 0) {
                ra.push(d)
                lastWideTime = d.den
                nChuyen = 0
                prevNguoi = -1
                return
              }

              if (d.nguoi !== prevNguoi) {
                nChuyen++
                prevNguoi = d.nguoi
              }

              var b = d.tu
              // Nếu 1 người nói liên tục > maxS, chèn Cam Wide 3.5s
              while (d.den - b > maxS + 3.5) {
                ra.push({ tu: b, den: b + maxS, nguoi: d.nguoi })
                ra.push({ tu: b + maxS, den: b + maxS + 3.5, nguoi: -1 })
                b += maxS + 3.5
                lastWideTime = b
                nChuyen = 0
              }

              // Nếu qua 6 lượt thoại hoặc 40s chưa có Cam Wide, chen 1 nhát Cam Wide 3s ở giữa
              if (nChuyen >= 6 || (d.den - lastWideTime > 40)) {
                var mid = b + Math.min(2.5, (d.den - b) / 2)
                if (d.den - mid > 2.5) {
                  ra.push({ tu: b, den: mid, nguoi: d.nguoi })
                  ra.push({ tu: mid, den: mid + 3.0, nguoi: -1 })
                  b = mid + 3.0
                  lastWideTime = b
                  nChuyen = 0
                }
              }

              if (d.den > b) {
                ra.push({ tu: b, den: d.den, nguoi: d.nguoi })
              }
            })
            doan = ra
          }
          // "CẮT SỚM trước khi nói" — ranh giới lùi sớm lead giây, chừa cho
          // đoạn trước tối thiểu 0,3s để không nuốt mất nó.
          if (caiDat.lead > 0) {
            for (var iL = 1; iL < doan.length; iL++) {
              var lui = Math.min(caiDat.lead, (doan[iL - 1].den - doan[iL - 1].tu) - 0.3)
              if (lui > 0) { doan[iL].tu -= lui; doan[iL - 1].den -= lui }
            }
          }

          // ── 3. Cắt BẢN SAO theo lô — về ĐÚNG track gốc, ĐÚNG vị trí ──
          var offCam = nguoiDs.map(function (ng) {
            var c = timTrack(trackV, ng.cam)
            return c.inPoint - c.batDau
          })
          var offMic = viecMic.map(function (c) { return c.inPoint - c.batDau })
          var duongCam = nguoiDs.map(function (ng) { return chuoiJsx(timTrack(trackV, ng.cam).duong) })
          var offWide = clipWide ? (clipWide.inPoint - clipWide.batDau) : 0
          var duongWide = clipWide ? chuoiJsx(clipWide.duong) : ''
          var duongMic = monoMic.map(function (d) { return chuoiJsx(d) })
          var tenMoi = (tenSeqGoc || 'Podcast').replace(/[^\w\- ]/g, '').trim() || 'Podcast'
          tenMoi += ' - Podcast Cut'

          napLaiHost(function (ok) {
            if (!ok) { thoat(t('khong_nap_host'), null); return }
            tienDo(t('dang_nhan_ban'), 36)
            goiHost('(typeof pc_phienBan==="function")?pc_phienBan():"THIEU"').then(function (pb) {
            if (pb !== 'v0.4.8') { thoat(t('khong_nap_host') + ' [host=' + pb + ']', null); return }
            // "tự lưu project trước khi ghi" — lời hứa in trong Cài đặt cắt.
            // Bay sạch một buổi chiều 04/08 vì đóng không lưu — không lặp lại.
            // ☠️ save() KÉO activeSequence về tab timeline đang mở trước mặt
            // (đo cô lập 04/08 23:4x — hai lần SEQ_DOI liên tiếp mới lộ) →
            // sau save phải GHIM LẠI sequence nguồn bằng pc_chonSeq.
            goiHost('(function(){try{app.project.save();return "OK"}catch(e){return "ERR"}})()').then(function () {
            goiHost('(typeof pc_chonSeq==="function")?pc_chonSeq("' + chuoiJsx(tenSeqGoc) + '"):"ERR"').then(function () {
            goiHost('pc_nhapMono("' + duongMic.join(';') + '")').then(function (rN) {
            if (rN.indexOf('OK:') !== 0) { thoat(cauLoiHost(rN), null); return }
            var kvN = tachKv(rN)
            if (parseInt(kvN.thay, 10) !== duongMic.length) {
              thoat(tp('mono_thieu', { thieu: kvN.thieu || '?' }), null); return
            }
            goiHost('pc_nhanBan("' + chuoiJsx(tenSeqGoc) + '","' + tenMoi + '")').then(function (raw) {
              if (raw.indexOf('OK:') !== 0) { thoat(cauLoiHost(raw), null); return }
              var tenThat = tachKv(raw).seq
              if (!tenThat) { thoat(t('host_la') + '\n' + raw, null); return }

              toMauNguoi(duongCam, duongMic, duongWide)

              // ── DANH SÁCH CAM: người 1..n, cộng cam chung nếu có ─────────
              // Anh Tiến 05/08: *"ở phần video anh cũng muốn làm theo kiểu là
              // các clip cut có thể theo dạng là enable hoặc disable luôn"*.
              // `du-cam`: MỌI cam có clip ở MỌI đoạn, chỉ cam người nói được
              // BẬT → đổi nhát cắt chỉ bằng Shift+E, không phải cắt lại.
              var camDs = []
              nguoiDs.forEach(function (ng, p) {
                if (duongCam[p] && duongCam[p] !== '""') {
                  camDs.push({ track: p, duong: duongCam[p], off: offCam[p] })
                }
              })
              if (duongWide && duongWide !== '""') {
                camDs.push({ track: NGUOI.length, duong: duongWide, off: offWide })
              }
              var duCam = (caiDat.hinh === 'bat-tat' && camDs.length > 1)
              // Việc đặt clip: 1 dòng/đoạn (chỉ cam người nói) hoặc n dòng/đoạn.
              var viecHinh = []
              var ttHinh = []      // [{track, start, tat}] — chỉ dùng cho du-cam
              doan.forEach(function (d) {
                var segTu = tu0 + d.tu
                var segDen = tu0 + d.den
                var trackDung = d.nguoi >= 0 ? d.nguoi : NGUOI.length
                if (!duCam) {
                  var camDuong = (d.nguoi >= 0 && duongCam[d.nguoi] && duongCam[d.nguoi] !== '""') ? duongCam[d.nguoi] : duongWide
                  var camOff = (d.nguoi >= 0 && offCam[d.nguoi] !== undefined) ? offCam[d.nguoi] : offWide
                  viecHinh.push(trackDung + ',' + camDuong + ',' +
                    (segTu + camOff).toFixed(4) + ',' + (segDen + camOff).toFixed(4) + ',' +
                    segTu.toFixed(4))
                  return
                }
                camDs.forEach(function (c) {
                  viecHinh.push(c.track + ',' + c.duong + ',' +
                    (segTu + c.off).toFixed(4) + ',' + (segDen + c.off).toFixed(4) + ',' +
                    segTu.toFixed(4))
                  // ☠️ Track TRÊN che track DƯỚI → tại mỗi đoạn chỉ được BẬT
                  // ĐÚNG MỘT cam, tắt hết phần còn lại. Đúng dù bao nhiêu cam.
                  ttHinh.push({ track: c.track, start: segTu, tat: (c.track === trackDung) ? 0 : 1 })
                })
              })

              var i = 0
              function loHinh() {
                if (i >= viecHinh.length) { trangThaiHinh(); return }
                var cuoi = Math.min(i + LO, viecHinh.length)
                tienDo(tp('dang_dung', { i: Math.round(cuoi / (duCam ? camDs.length : 1)), n: doan.length }),
                  40 + 42 * cuoi / viecHinh.length)
                var ds = viecHinh.slice(i, cuoi)
                i = cuoi
                goiHost('pc_datHinh("' + chuoiJsx(tenThat) + '","' + ds.join(';') + '")').then(function (r2) {
                  if (r2.indexOf('OK:') !== 0 || r2.indexOf('soLoi=0') < 0) { thoat(cauLoiHost(r2), null); return }
                  loHinh()
                })
              }

              // Bật/tắt clip hình theo từng track (chỉ đường "đủ cam").
              function trangThaiHinh() {
                if (!duCam) { donTieng(); return }
                var vi = 0, vj = 0
                var nhom = camDs.map(function (c) {
                  return {
                    track: c.track,
                    ds: ttHinh.filter(function (x) { return x.track === c.track })
                      .map(function (x) { return x.start.toFixed(4) + ',' + x.tat }),
                  }
                })
                function loTT() {
                  if (vi >= nhom.length) { donTieng(); return }
                  var v = nhom[vi]
                  if (vj >= v.ds.length) { vi++; vj = 0; loTT(); return }
                  var cuoi = Math.min(vj + LO, v.ds.length)
                  tienDo(t('dang_bat_tat'), 82 + 5 * (vi + cuoi / v.ds.length) / nhom.length)
                  var manh = v.ds.slice(vj, cuoi).join(';')
                  vj = cuoi
                  goiHost('pc_datTrangThaiHinh("' + chuoiJsx(tenThat) + '",' + v.track + ',"' + manh + '")')
                    .then(function (r7) {
                      if (r7.indexOf('OK:') !== 0 || r7.indexOf('soLoi=0') < 0 ||
                          r7.indexOf('khongThayClip=0') < 0) {
                        thoat(tp('lech_do', { chiTiet: 'bat/tat hinh: ' + r7.slice(3) }), null); return
                      }
                      loTT()
                    })
                }
                loTT()
              }

              function donTieng() {
                tienDo(t('dang_thay_tieng'), 88)
                goiHost('pc_donTieng("' + chuoiJsx(tenThat) + '")').then(function (r3) {
                  if (r3.indexOf('OK:') !== 0) { thoat(cauLoiHost(r3), null); return }
                  var kv = tachKv(r3)
                  if (kv.hinhTruoc !== kv.hinhSau || kv.tiengSau !== '0') {
                    thoat(tp('lech_do', { chiTiet: 'don tieng: ' + r3.slice(3) }), null)
                    return
                  }
                  loTieng()
                })
              }

              // ── TIẾNG: bốn đường, anh Tiến chốt 05/08 ──────────────────
              //  duck    : mỗi người MỘT mảnh liền mạch + VẼ ĐƯỜNG ÂM LƯỢNG
              //  bat-tat : cắt rời từng đoạn cho CẢ HAI mic, TẮT clip người kia
              //  cut-bo  : chỉ đặt mic người đang nói — người kia KHÔNG có clip
              //  giu     : mỗi người MỘT mảnh liền mạch, không đụng âm lượng
              // ☠️ Khác nhau giữa `bat-tat` và `cut-bo`: cả hai đều im tiếng
              // người kia, nhưng `bat-tat` CÒN CLIP nên anh Tiến bấm Shift+E là
              // bật lại được; `cut-bo` thì phải đi tìm lại file.
              var micDayDu = (caiDat.tieng === 'bat-tat')   // đặt clip cho MỌI mic
              var micTheoNguoi = (caiDat.tieng === 'cut-bo') // chỉ mic người nói
              var viecTieng = []
              var trangThai = []   // [{mic, start, tat, heSo}] — chỉ dùng cho bat-tat
              var heSoChim = Math.pow(10, -caiDat.chim / 20)
              if (micDayDu || micTheoNguoi) {
                doan.forEach(function (d) {
                  var segTu = tu0 + d.tu
                  var segDen = tu0 + d.den
                  nguoiDs.forEach(function (ng, p) {
                    // d.nguoi < 0 là đoạn cam chung — lúc đó KHÔNG ai bị tắt.
                    var dangNoi = (d.nguoi < 0 || d.nguoi === p)
                    if (micTheoNguoi && !dangNoi) return
                    viecTieng.push(ng.mic + ',' + duongMic[p] + ',' +
                      (segTu + offMic[p]).toFixed(4) + ',' + (segDen + offMic[p]).toFixed(4) + ',' +
                      segTu.toFixed(4))
                    if (micDayDu) {
                      trangThai.push({ mic: ng.mic, start: segTu, tat: dangNoi ? 0 : 1, heSo: 1 })
                    }
                  })
                })
              } else {
                nguoiDs.forEach(function (ng, p) {
                  viecTieng.push(ng.mic + ',' + duongMic[p] + ',' +
                    (tu0 + offMic[p]).toFixed(4) + ',' + (den0 + offMic[p]).toFixed(4) + ',' +
                    tu0.toFixed(4))
                })
              }

              var j = 0
              function loTieng() {
                if (j >= viecTieng.length) { xuLyTieng(); return }
                var cuoi = Math.min(j + LO, viecTieng.length)
                tienDo(t('dang_thay_tieng'), 88 + 6 * cuoi / viecTieng.length)
                var ds = viecTieng.slice(j, cuoi)
                j = cuoi
                goiHost('pc_datTieng("' + chuoiJsx(tenThat) + '","' + ds.join(';') + '")').then(function (r4) {
                  if (r4.indexOf('OK:') !== 0 || r4.indexOf('soLoi=0') < 0) { thoat(cauLoiHost(r4), null); return }
                  loTieng()
                })
              }

              // ── 3b. TÔN TIẾNG NGƯỜI ĐANG NÓI ─────────────────────────────
              // Anh Tiến 05/08: "khi Trọng nói audio mà cam đoạn đó được ẩn đi
              // tôn lên audio của Trọng và ngược lại".
              // ☠️ Mốc keyframe tính theo THỜI GIAN TRONG FILE, không phải thời
              // gian sequence: clip đặt tại start=tu0 với in=tu0+offMic[p], nên
              // điểm sequence T ứng với media (T + offMic[p]). Sai chỗ này là
              // lệch CẢ 299 mốc đúng bằng offMic — đã đo và xác nhận 05/08.
              function xuLyTieng() {
                // Chỉ hai đường cần bước này: `duck` vẽ keyframe, `bat-tat` bật/tắt
                // clip. `cut-bo` và `giu` không đụng tới âm lượng của clip nào.
                if (caiDat.tieng === 'giu' || caiDat.tieng === 'cut-bo') { doLai(); return }
                tienDo(t('dang_ve_am'), 94)
                goiHost('pc_docAmLuong("' + chuoiJsx(tenThat) + '")').then(function (rA) {
                  if (rA.indexOf('OK:') !== 0) { thoat(cauLoiHost(rA), null); return }
                  var gocCua = {}
                  rA.slice(3).split('\n').forEach(function (dg) {
                    var ph = dg.split('|')
                    if (ph[0].charAt(0) !== 'A') return
                    gocCua[parseInt(ph[0].slice(1), 10)] = parseFloat(ph[2])
                  })
                  var viec = []
                  // Fade phải nhỏ hơn hẳn đoạn ngắn nhất, nếu không keyframe của
                  // ranh này lùi qua ranh trước và đường âm lượng đảo ngược.
                  var FADE = Math.min(0.15, caiDat.shot / 3)
                  nguoiDs.forEach(function (ng, p) {
                    var goc = gocCua[ng.mic]
                    if (!(goc > 0)) return
                    var ds = []
                    if (micDayDu) {
                      for (var k = 0; k < trangThai.length; k++) {
                        if (trangThai[k].mic !== ng.mic) continue
                        ds.push(trangThai[k].start.toFixed(4) + ',' + trangThai[k].tat +
                          ',' + trangThai[k].heSo.toFixed(8))
                      }
                    } else {
                      var hCu = null
                      doan.forEach(function (d, i) {
                        var T = tu0 + d.tu
                        var h = (d.nguoi < 0 || d.nguoi === p) ? 1 : heSoChim
                        if (i === 0) ds.push((T + offMic[p]).toFixed(4) + ',' + h.toFixed(8))
                        else if (h !== hCu) {
                          ds.push((T - FADE + offMic[p]).toFixed(4) + ',' + hCu.toFixed(8))
                          ds.push((T + offMic[p]).toFixed(4) + ',' + h.toFixed(8))
                        }
                        hCu = h
                      })
                    }
                    viec.push({ mic: ng.mic, goc: goc, ds: ds })
                  })
                  var vi = 0, vj = 0
                  function loAm() {
                    if (vi >= viec.length) { doLai(); return }
                    var v = viec[vi]
                    if (vj >= v.ds.length) { vi++; vj = 0; loAm(); return }
                    var cuoi = Math.min(vj + LO, v.ds.length)
                    tienDo(t('dang_ve_am'), 94 + 3 * (vi + cuoi / v.ds.length) / viec.length)
                    var manh = v.ds.slice(vj, cuoi).join(';')
                    vj = cuoi
                    var ham = micDayDu ? 'pc_datTrangThaiTieng' : 'pc_veAmLuong'
                    goiHost(ham + '("' + chuoiJsx(tenThat) + '",' + v.mic + ',"' + manh + '",' + v.goc + ')')
                      .then(function (r6) {
                        if (r6.indexOf('OK:') !== 0 || r6.indexOf('soLoi=0') < 0) {

                        }
                        if (micDayDu && r6.indexOf('khongThayClip=0') < 0) {
                          thoat(tp('lech_do', { chiTiet: r6.slice(3) }), null); return
                        }

                      })
                  }
                  // Vẽ lại từ đầu: gỡ đường cũ trước (chạy lại lần 2 không cộng dồn).
                  var g = 0
                  function goCu() {

                    g++
                    goiHost('pc_xoaAmLuong("' + chuoiJsx(tenThat) + '",' + mic + ')').then(goCu)
                  }
                  goCu()
                })
              }

              // ── 4. ĐO LẠI — không tin "không báo lỗi" ──
              function doLai() {
                tienDo(t('dang_thay_tieng'), 97)
                goiHost('pc_doKetQua("' + chuoiJsx(tenThat) + '")').then(function (r5) {
                  if (r5.indexOf('OK:') !== 0) { thoat(cauLoiHost(r5), null); return }
                  var kv = tachKv(r5)
                  var lech = []
                  if (parseInt(kv.tongHinh, 10) !== viecHinh.length) lech.push('hinh ' + kv.tongHinh + '/' + viecHinh.length)
                  if (parseInt(kv.tongTieng, 10) !== viecTieng.length) lech.push('tieng ' + kv.tongTieng + '/' + viecTieng.length)
                  if (Math.abs(parseFloat(kv.cuoiHinh) - den0) > 0.1) lech.push('cuoi ' + kv.cuoiHinh + '/' + den0.toFixed(3))
                  // ☠️ 05/08: ĐẾM KHÔNG PHẢI LÀ KIỂM. Bản cũ báo "tiếng 2/2 đạt"
                  // trong khi cả hai clip tiếng là một sequence bị đặt nhầm.
                  if (parseInt(kv.hinhLa, 10) > 0 || parseInt(kv.tiengLa, 10) > 0) {
                    lech.push('clip khong phai file media: hinh ' + kv.hinhLa +
                      ' tieng ' + kv.tiengLa + (kv.tenLa ? ' (' + kv.tenLa + ')' : ''))
                  }
                  // ☠️ Với "đủ cam", ĐẾM clip không nói lên được gì — phải hỏi
                  // "tại mỗi mốc, người xem thấy MẤY hình" (bài học 5k).
                  function chot() {
                    dangChay = false
                    nut.disabled = false
                    if (lech.length) { hien('loi', tp('lech_do', { chiTiet: lech.join(' · ') })) }
                    veKetQua(doan, tu0, tenThat)
                    toMauNguoi(duongCam, duongMic, duongWide)
                  }
                  if (!duCam) { chot(); return }
                  goiHost('pc_doPhuHinh("' + chuoiJsx(tenThat) + '")').then(function (r8) {
                    var kv8 = tachKv(r8)
                    if (r8.indexOf('OK:') !== 0) { lech.push('do phu hinh: ' + r8) }
                    else if (kv8.khongBat !== '0' || kv8.nhieuBat !== '0') {
                      lech.push('moc khong dung 1 cam bat: trong=' + kv8.khongBat +
                        ' chong=' + kv8.nhieuBat + (kv8.mocLoiDau ? ' (' + kv8.mocLoiDau + ')' : ''))
                    }
                    chot()
                  })
                })
              }

              loHinh()
            })
            })
            })
            })
            })
          })
        }, 30)
      })
    })
  }

  // ═══ TỰ ĐỘNG KHÔI PHỤC MIC RỜI TỪ PROJECT BIN (Auto-Pilot Recovery) ═══
  function tuTimVaSyncMicProject(cb) {
    goiHost('pc_timFileMic()').then(function (res) {
      if (res.indexOf('OK:') !== 0) { cb(false); return }
      var raw = res.slice(3).split(';').filter(function (x) { return x })
      if (!raw.length) { cb(false); return }

      var paths = []
      raw.forEach(function (p) { if (paths.indexOf(p) < 0) paths.push(p) })

      // Khớp tên file mic với tên diễn giả (Thiện -> mic Thiện, Trọng -> mic Trọng)
      var lenh = []
      nguoiDs.forEach(function (ng) {
        if (ng.mic < 0) return
        var tenN = (timNguoi(ng.id) || {}).ten || ''
        var tenKhongDau = tenN.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d")

        var matchPath = null
        for (var k = 0; k < paths.length; k++) {
          var p = paths[k]
          var pl = p.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d")
          if (tenKhongDau && pl.indexOf(tenKhongDau) >= 0) {
            matchPath = p
            paths.splice(k, 1)
            break
          }
        }

        if (!matchPath && paths.length > 0) {
          matchPath = paths.shift()
        }

        if (matchPath) {
          lenh.push('A,' + (ng.mic + 1) + ',' + matchPath + ',0,' + Math.round(SEQ_DAI || 2400) + ',0')
        }
      })

      goiHost('pc_datTieng("' + chuoiJsx(seqDangNhin) + '","' + chuoiJsx(lenh.join(';')) + '")').then(function () {
        docThongTinSeq()
        setTimeout(function () {
          var cams = tuiKhop(trackV)
          var tiengs = tuiKhop(trackA)
          var kq = AiOKhop.khopBanDo(cams, tiengs)
          apKhop(kq)
          ve()
          cb(true)
        }, 400)
      })
    })
  }

  // Kết quả: nút xanh "Đã cắt N nhát", dải nhát cắt + chia thời lượng ở monitor
  var tenVuaCat = ''
  function veKetQua(doan, tu0, tenThat) {
    tenVuaCat = tenThat || ''
    var nut = document.getElementById('nutDung')
    nut.dataset.state = 'done'
    var caiDat = docCaiDat()
    tienDo(tp('kq_nut', {

      chiTiet: tenCheDoTieng(caiDat.tieng),
    }), 0)
    setTimeout(function () {
      delete nut.dataset.state
      tienDo(t('cat_lai'), 0)
    }, 4000)
    KE_HOACH = doan.map(function (d) {
      var n = d.nguoi >= 0 ? NGUOI[d.nguoi] : null
      return {
        tu: tu0 + d.tu, den: tu0 + d.den, nguoi: d.nguoi,
        mau: n ? n.mau : 'var(--chung)',
        camK: d.nguoi >= 0 ? 'V' + nguoiDs[d.nguoi].cam : 'V' + trackWide,
      }
    })
    // chia thời lượng từng người — một dòng gọn dưới chú giải màu
    var giay = NGUOI.map(function () { return 0 })
    var giayWide = 0
    doan.forEach(function (d) {
      if (d.nguoi < 0) giayWide += d.den - d.tu
      else giay[d.nguoi] += d.den - d.tu
    })
    var phan = NGUOI.map(function (n, i) { return tp('chia_muc', { ten: n.ten, giay: mmss(giay[i]) }) })
    if (giayWide > 0.01) phan.push(tp('chia_muc', { ten: t('cam_chung'), giay: mmss(giayWide) }))
    document.getElementById('kqChia').textContent = phan.join(' · ')
    veMonitor()
  }

  // Tô màu nhãn theo người — cam + mic cùng người cùng màu (7=Mango, 8=Purple, 11=Magenta, 14=Yellow...)
  var NHAN_MAU = [7, 8, 11, 2, 6, 13, 0, 5]
  function toMauNguoi(duongCam, duongMic, duongWide) {
    var ds = []
    var daSet = {}
    NGUOI.forEach(function (n, p) {
      var mau = NHAN_MAU[p % NHAN_MAU.length]
      if (duongCam && duongCam[p] && !daSet[duongCam[p]]) {
        ds.push(duongCam[p] + ',' + mau)
        daSet[duongCam[p]] = true
      }
      if (duongMic && duongMic[p] && !daSet[duongMic[p]]) {
        ds.push(duongMic[p] + ',' + mau)
        daSet[duongMic[p]] = true
      }
    })
    if (duongWide && !daSet[duongWide]) {
      ds.push(duongWide + ',14')
      daSet[duongWide] = true
    }
    if (!ds.length) return
    goiHost('(typeof pc_toMau==="function")?pc_toMau("' + chuoiJsx(ds.join(';')) + '"):"ERR:THIEU"').then(function (r) {
      if (r.indexOf('OK:') !== 0 || r.indexOf('hoTro=1') < 0) hien('loi', t('mau_khong_ho_tro'))
    })
  }

  // ═══ TỰ SYNC MIC (v0.4.0 — thêm ngoài thiết kế, anh dặn "thiếu thì thêm") ═
  function tuSync() {
    if (dangChay || dangSync) return
    hien('canlam', ''); hien('loi', '')
    var fs = napNode('fs')
    var os = napNode('os')
    var cp = napNode('child_process')
    if (!fs || !os || !cp) { hien('canlam', t('thieu_node'), 'sync_tieude'); return }
    var ffmpeg = timFfmpeg(fs)
    if (!ffmpeg) { hien('canlam', t('thieu_ffmpeg'), 'sync_tieude'); return }
    if (!seqDangNhin) { hien('canlam', t('chua_mo_seq'), 'sync_tieude'); return }
    var camDs = trackV.filter(function (tr) { return tr.soClip === 1 && tr.duong })
    if (!camDs.length) { hien('canlam', t('sync_khong_cam'), 'sync_tieude'); return }

    var chon = window.cep.fs.showOpenDialogEx(true, false, t('sync_chon_tieude'), '',
      ['wav', 'mp3', 'm4a', 'aac', 'flac', 'aif', 'aiff'])
    var files = (chon && chon.data) || []
    if (!files.length) return
    if (files.length === 1) { hien('canlam', t('sync_mot_mic'), 'sync_tieude'); return }
    if (files.length > 6) files = files.slice(0, 6)
    if (files.length > trackA.length) {
      hien('canlam', tp('sync_thieu_track', { can: files.length, co: trackA.length }), 'sync_tieude')
      return
    }

    dangSync = true
    var nutS = document.getElementById('nutSync')
    var nutD = document.getElementById('nutDung')
    nutS.disabled = true
    nutD.disabled = true
    var tenSeqGoc = seqDangNhin
    function thoatSync(loi) {
      dangSync = false
      nutS.disabled = false
      nutD.disabled = false
      nutS.textContent = t('nut_sync')
      veChan()
      if (loi) hien('canlam', loi, 'sync_tieude')
    }
    var tmpDir = os.tmpdir().replace(/\\/g, '/') + '/aio-podcast'
    try { if (!fs.existsSync(tmpDir)) fs.mkdirSync(tmpDir) } catch (e) {}

    var viec = []
    camDs.forEach(function (tr) { viec.push({ loai: 'cam', nguon: tr.duong, tr: tr }) })
    files.forEach(function (f) { viec.push({ loai: 'mic', nguon: f }) })
    var idx = 0
    function tachTiep() {
      if (idx >= viec.length) { phanTich(); return }
      var v = viec[idx]
      nutS.textContent = tp('sync_dang_doc', { i: idx + 1, n: viec.length })
      v.wav = tmpDir + '/s-' + bamTenSync(String(v.nguon).toLowerCase()) + '.wav'
      var can = true
      try {
        if (fs.existsSync(v.wav) && fs.statSync(v.wav).mtimeMs > fs.statSync(v.nguon).mtimeMs) can = false
      } catch (e) {}
      idx++
      if (!can) { tachTiep(); return }
      var nsCpu = AiOTaiNguyen.chiaLuong(1)
      cp.execFile(ffmpeg,
        ['-y', '-threads', String(nsCpu.luongMoi), '-i', v.nguon,
          '-vn', '-ac', '1', '-ar', '16000', '-c:a', 'pcm_s16le', v.wav],
        { windowsHide: true, maxBuffer: AiOTaiNguyen.tranDemLog() },
        function (err, so, se) {
          if (err) { thoatSync(t('tach_loi') + String(se || err).slice(-200)); return }
          tachTiep()
        })
    }

    function phanTich() {
      setTimeout(function () {
        try {
          function docDb(duongWav) {
            var buf
            try { buf = fs.readFileSync(duongWav) } catch (e) { return null }
            var d = AiONao.taiWav(buf)
            return d ? AiONao.doDb(d.pcm, d.sr) : null
          }
          var camTot = null, dbCam = null, p50Tot = -999
          for (var i = 0; i < viec.length; i++) {
            var v = viec[i]
            if (v.loai !== 'cam') continue
            var db = docDb(v.wav)
            if (!db) continue
            var p = AiOSync.p50(db)
            if (p > p50Tot) { p50Tot = p; camTot = v; dbCam = db }
          }
          if (!camTot || p50Tot < -65) { thoatSync(t('sync_cam_cam')); return }

          var micKq = []
          for (var j = 0; j < viec.length; j++) {
            var m = viec[j]
            if (m.loai !== 'mic') continue
            nutS.textContent = tp('sync_dang_do', { ten: tenFileNgan(m.nguon) })
            var dbM = docDb(m.wav)
            if (!dbM) { thoatSync(tp('wav_hong', { ten: tenFileNgan(m.nguon) })); return }
            var off = AiOSync.timOffset(dbCam, dbM, { quetGiay: 1200 })
            if (!off.tinCay) {
              thoatSync(tp('sync_khong_tin', {
                ten: tenFileNgan(m.nguon), lech: off.lech2NuaGiay.toFixed(1),
              }))
              return
            }
            var vt = AiOSync.viTriDat(camTot.tr.batDau, camTot.tr.inPoint, off.offsetGiay)
            micKq.push({
              nguon: m.nguon, daiGiay: dbM.length * 0.02,
              viTri: vt.viTriGiay, catDau: vt.catDauGiay, r: off.r,
            })
          }
          tachMonoSync(micKq)
        } catch (e) { thoatSync('LOI: ' + e) }
      }, 30)
    }

    function tachMonoSync(micKq) {
      var j = 0
      function mot() {
        if (j >= micKq.length) { dungSeqSync(micKq); return }
        var m = micKq[j]
        m.mono = duongMonoCua(m.nguon)
        nutS.textContent = tp('sync_dang_mono', { i: j + 1, n: micKq.length })
        var can = true
        try {
          if (fs.existsSync(m.mono) && fs.statSync(m.mono).mtimeMs > fs.statSync(m.nguon).mtimeMs) can = false
        } catch (e) {}
        j++
        if (!can) { mot(); return }
        var nsCpu = AiOTaiNguyen.chiaLuong(1)
        cp.execFile(ffmpeg,
          ['-y', '-threads', String(nsCpu.luongMoi), '-i', m.nguon,
            '-vn', '-ac', '1', '-c:a', 'pcm_s16le', m.mono],
          { windowsHide: true, maxBuffer: AiOTaiNguyen.tranDemLog() },
          function (err, so, se) {
            if (err) { thoatSync(t('tach_loi') + String(se || err).slice(-200)); return }
            mot()
          })
      }
      mot()
    }

    function dungSeqSync(micKq) {
      nutS.textContent = t('sync_dang_dung')
      napLaiHost(function (ok) {
        if (!ok) { thoatSync(t('khong_nap_host')); return }
        goiHost('(typeof pc_phienBan==="function")?pc_phienBan():"THIEU"').then(function (pb) {
        if (pb !== 'v0.4.8') { thoatSync(t('khong_nap_host') + ' [host=' + pb + ']'); return }
        goiHost('pc_nhapMono("' + micKq.map(function (m) { return chuoiJsx(m.mono) }).join(';') + '")').then(function (rN) {
        if (rN.indexOf('OK:') !== 0) { thoatSync(cauLoiHost(rN)); return }
        var kvN = tachKv(rN)
        if (parseInt(kvN.thay, 10) !== micKq.length) {
          thoatSync(tp('mono_thieu', { thieu: kvN.thieu || '?' })); return
        }
        goiHost('pc_nhanBan("' + chuoiJsx(tenSeqGoc) + '","AiO Sync")').then(function (raw) {
        if (raw.indexOf('OK:') !== 0) { thoatSync(cauLoiHost(raw)); return }
        var tenThat = tachKv(raw).seq
        if (!tenThat) { thoatSync(t('host_la') + '\n' + raw); return }
        var dsHinh = camDs.map(function (tr) {
          return tr.i + ',' + chuoiJsx(tr.duong) + ',' + tr.inPoint.toFixed(4) + ',' +
            (tr.inPoint + (tr.ketThuc - tr.batDau)).toFixed(4) + ',' + tr.batDau.toFixed(4)
        })
        goiHost('pc_datHinh("' + chuoiJsx(tenThat) + '","' + dsHinh.join(';') + '")').then(function (r2) {
        if (r2.indexOf('OK:') !== 0 || r2.indexOf('soLoi=0') < 0) { thoatSync(cauLoiHost(r2)); return }
        goiHost('pc_donTieng("' + chuoiJsx(tenThat) + '")').then(function (r3) {
        if (r3.indexOf('OK:') !== 0) { thoatSync(cauLoiHost(r3)); return }
        var dsTieng = micKq.map(function (m, k) {
          return k + ',' + chuoiJsx(m.mono) + ',' + m.catDau.toFixed(4) + ',' +
            m.daiGiay.toFixed(4) + ',' + m.viTri.toFixed(4)
        })
        goiHost('pc_datTieng("' + chuoiJsx(tenThat) + '","' + dsTieng.join(';') + '")').then(function (r4) {
        if (r4.indexOf('OK:') !== 0 || r4.indexOf('soLoi=0') < 0) { thoatSync(cauLoiHost(r4)); return }
        goiHost('pc_doKetQua("' + chuoiJsx(tenThat) + '")').then(function (r5) {
        if (r5.indexOf('OK:') !== 0) { thoatSync(cauLoiHost(r5)); return }
        var kv = tachKv(r5)
        var lech = []
        if (parseInt(kv.tongHinh, 10) !== camDs.length) lech.push('hinh ' + kv.tongHinh + '/' + camDs.length)
        if (parseInt(kv.tongTieng, 10) !== micKq.length) lech.push('tieng ' + kv.tongTieng + '/' + micKq.length)
        if (lech.length) { thoatSync(tp('lech_do', { chiTiet: lech.join(' · ') })); return }
        // Gợi ý sẵn bước gán cho sequence mới: người theo TÊN FILE mic,
        // cam theo thứ tự — mở sang là bản đồ đã điền, sửa tên là xong.
        var goiY = { nguoi: [], gan: {}, tay: [] }
        micKq.forEach(function (m, k2) {
          var ten = tenFileNgan(m.nguon).replace(/\.[^.]+$/, '') || tp('nguoi', { i: k2 + 1 })
          goiY.nguoi.push({ id: k2 + 1, ten: ten })
          var camK = camDs[k2] ? 'V' + camDs[k2].i : null
          if (camK) goiY.gan[camK] = [k2 + 1]
          goiY.gan['A' + k2] = k2 + 1
        })
        ganTheoSeq[tenThat] = goiY
        try { localStorage.setItem('aio-pc-gan2', JSON.stringify(ganTheoSeq)) } catch (e) {}
        goiHost('(typeof pc_chonSeq==="function")?pc_chonSeq("' + chuoiJsx(tenThat) + '"):"ERR"').then(function () {
          thoatSync(null)
          soi()
        })
        })})})})})})})
      })
    }

    tachTiep()
  }

  ov.addEventListener('mousedown', function (e) { if (e.target === ov) dongHop() })
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) dongHop() })
  ov.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return
    var f = ov.querySelectorAll('button,input,select')
    var i = Array.prototype.indexOf.call(f, document.activeElement)
    var x = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i >= f.length - 1 ? 0 : i + 1)
    f[x].focus()
    e.preventDefault()
  })
  var dsCaiDat = ['lead', 'shot', 'maxShot', 'nguong', 'mucChim']
  for (var iC = 0; iC < dsCaiDat.length; iC++) {
    document.getElementById(dsCaiDat[iC]).addEventListener('input', apCaiDat)
  }
  // Picker là radio → bắt 'change' trên từng ô, không phải 'input' trên một select.
  var dsPick = document.querySelectorAll('.pick input[type=radio]')
  for (var iP = 0; iP < dsPick.length; iP++) {
    dsPick[iP].addEventListener('change', apCaiDat)
  }

  apNgonNgu()
  ve()
</script>
</body>
</html>
