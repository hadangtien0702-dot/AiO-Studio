<head>
<meta charset="utf-8">
<title>AiO Studio — Auto Podcast</title>
<!--
  Panel v0.6.5 — GIAO DIỆN theo thiết kế anh Tiến chốt 04/08/2026
  (AiO Design System/AiO Auto Podcast/AiO Auto Podcast.html — "Studio Console").
  ENGINE giữ nguyên bản đã kiểm chứng (não nao.js + sync.js + host v0.4.8).

  ☠️ v0.6.1 (05/08, phiên soát toàn bộ) — BỐN LỖI CÓ THỂ PHÁ TIMELINE THẬT.
  Bản v0.6.0 bấm "Auto Match" lúc một file media offline là XOÁ TRẮNG
  timeline. Đo được bằng tests/kiem-host.mjs chạy ngược trên bản v0.6.0:
  video 3 clip → 0, audio 2 clip → 0, mà host vẫn trả "OK:".
    A. host pc_sapXepClipsLenTrack xoá sạch mọi clip TRƯỚC rồi mới đi tìm
       project item → tìm trượt cái nào là clip đó bay. Nay QUÉT KHO TRƯỚC,
       thiếu một item là trả ERR:THIEU_ITEM và không đụng timeline dòng nào.
    B. panel BỎ QUA giá trị host trả về → xếp hỏng vẫn báo "đã khớp N người".
       Nay đọc mã lỗi + soLoi, hỏng thì hiện khung lỗi to (bài học 5l).
    C. host pc__item khớp đường dẫn bằng CHUỖI CON HAI CHIỀU rồi lấy ứng viên
       gặp đầu tiên → "A.wav" ăn khớp vào "mic_data.wav". Nay chấm điểm 4/3/2/1
       và duyệt hết bin lấy cao nhất (bài học 5i).
    D. VÒNG LẶP VÔ HẠN: thiếu mic → tuTimVaSyncMicProject → cb(true) chỉ cần
       bin có ≥1 file mic → tuKhop() → vẫn thiếu → lặp mãi, mỗi vòng ghi đè
       timeline. Nay chỉ được thử phục hồi ĐÚNG MỘT LẦN.
  Cổng kiểm mới: `node tests/kiem-host.mjs` — 22 phép, dựng `app` Premiere giả.
  Bốn bộ kiểm cũ (nao 16 · sync 9 · khop 32 · stress 12) đều BÁO ĐẠT suốt thời
  gian bốn lỗi này nằm trong sản phẩm — vì không bộ nào chạm tới host.

  v0.6.0 (05/08): nút "Auto Match" thay chỗ nút thêm mic ở chân thẻ — anh
  Tiến: "anh sẽ kéo toàn bộ source clip vào sequence bấm một nút auto match".
  Não ở khop.js. Nút "Auto Sync" KHÔNG mất, chỉ ẩn đi và tự hiện lại khi đo ra
  là cần (thiếu mic riêng, hoặc mic dán đúng đầu clip cam).
  Ba nhãn nút anh Tiến tự chốt 05/08 (giữ nguyên ở CẢ HAI ngôn ngữ, đọc thành
  một họ): "Auto Match" · "Auto Sync" · "Auto Podcast".

  Khác thiết kế ở những chỗ THIẾT KẾ CHƯA CÓ hoặc PREMIERE KHÔNG CHO
  (anh Tiến 04/08: "có một số chỗ anh bị thiếu em hãy thêm nếu cần"):
  - Nút "Auto Sync" (v0.4.0, ra đời sau bản thiết kế).
  - Khung báo lỗi to có tiêu đề (bài học v0.3.4: thất bại phải TO).
  - Cảnh báo "mic dán đầu clip cam" (bẫy đo được 04/08 tối).
  - KHÔNG có nút thêm/bớt track: API Premiere không cho panel thêm track
    vào sequence — nút bấm được mà không ăn thật là công tắc vô nghĩa
    (bài học sổ thiết kế #11).
-->
<style>
/* ============ FONT ============ */
@font-face{font-family:'Inter var';font-style:normal;font-weight:100 900;
  font-display:swap;src:url('./fonts/Inter.woff2') format('woff2');}
@font-face{font-family:'Inter var';font-style:italic;font-weight:100 900;
  font-display:swap;src:url('./fonts/Inter-Italic.woff2') format('woff2');}

/* ============ TOKENS — chép từ DESIGN-SYSTEM.md §15 ============ */
:root{
  --bg-0:#0e0e0e; --bg-1:#141414; --bg-2:#181818; --bg-3:#1f1f1f;
  --bg-4:#282828; --bg-5:#333333; --bg-6:#161616;
  --bg-hover:rgb(255 255 255 /5%); --bg-active:rgb(255 255 255 /9%);
  --line-1:rgb(255 255 255 /6%); --line-2:rgb(255 255 255 /10%); --line-strong:rgb(255 255 255 /16%);
  --text-1:#f5f5f7; --text-2:#c3c3c8; --text-3:#8d8d95; --text-meta:#9b9ba3; --icon-dim:#8f8f97;
  --accent:#f86820; --accent-hover:#ff7d3c; --accent-pressed:#e0590e;
  --accent-soft:rgb(248 104 32 /16%); --accent-line:rgb(248 104 32 /40%);
  --accent-text:#ffb891; --accent-on:#ffffff;
  --ok:#4ec98a; --warn:#e8c05a; --danger:#ff5f6d; --danger-strong:#ff4757;
  --font-ui:'Inter var','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px; --fs-xl:19px;
  --fw-normal:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
  --lh-tight:1.25; --lh:1.45; --ls-display:-0.014em;
  --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:24px;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;
  --shadow-sm:0 1px 2px rgb(0 0 0 /30%); --shadow-md:0 8px 24px rgb(0 0 0 /45%);
  --h-ctrl-sm:24px; --h-ctrl:28px; --h-ctrl-lg:34px; --h-topbar:44px;
  --dur:150ms; --ease:cubic-bezier(.32,.72,0,1);
  --focus-ring:0 0 0 3px var(--accent-soft);
  --z-dropdown:100; --z-sticky:200; --z-modal:300; --z-toast:400; --z-tooltip:500;
  /* màu NGƯỜI NÓI — mỗi người một màu xuyên suốt: ô gõ → monitor → dải cắt.
     Tránh cam (màu hành động) và tránh xanh lá (màu "xong"). */
  --p1:#4f8ff7; --p2:#a78bfa; --p3:#e8c05a; --p4:#3fb6a8;
  --p5:#f2789b; --p6:#7cc4f0; --p7:#c0a2e8; --p8:#9fbf5e;
  /* cam thấy NHIỀU người (cam chung / wide) — trung tính, không của riêng ai */
  --chung:#94a0b4;
}

/* ============ NỀN ============ */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul{list-style:none;padding:0}
body{background:var(--bg-2);color:var(--text-1);font:var(--fw-normal) var(--fs-md)/var(--lh) var(--font-ui);
  -webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1;}
svg{display:block}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:14px;height:14px}
.spacer{flex:1}

:where(button,[tabindex],input,select):focus-visible{
  outline:none;border-color:var(--accent-line);box-shadow:var(--focus-ring)}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgb(255 255 255 /14%);border-radius:var(--r-pill);
  border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgb(255 255 255 /22%);background-clip:content-box}

/* ============ THANH TRÊN ============ */
.topbar{height:var(--h-topbar);background:var(--bg-1);border-bottom:1px solid var(--line-1);
  display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5)}
.brand-ico{color:var(--accent)}
.brand{font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.ver{font-size:var(--fs-xs);color:var(--text-3)}
.host{font-size:var(--fs-sm);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.host b{color:var(--text-2);font-weight:var(--fw-medium)}
.host i{color:var(--text-3);font-style:normal;margin:0 var(--sp-2)}

/* ============ NÚT — HAI họ, không hơn ============ */
.btn{height:var(--h-ctrl);padding:0 var(--sp-4);display:inline-flex;align-items:center;gap:var(--sp-2);
  background:var(--bg-4);border:1px solid var(--line-2);border-radius:var(--r-sm);
  color:var(--text-1);font:var(--fw-medium) var(--fs-sm)/1 var(--font-ui);
  text-transform:none;letter-spacing:normal;cursor:pointer;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.btn:hover{background:var(--bg-5)}
.btn:active{transform:scale(.97);transition:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn--sm{height:var(--h-ctrl-sm);padding:0 var(--sp-3);font-size:var(--fs-xs)}
/* nút phụ báo XONG: nhìn màu là biết, khỏi đọc chữ (luật anh Tiến 28/07) */
.btn[data-state="done"]{border-color:var(--ok);color:var(--ok)}
.btn--icon{width:var(--h-ctrl-sm);height:var(--h-ctrl-sm);padding:0;justify-content:center;color:var(--text-2)}
.btn--primary{position:relative;overflow:hidden;height:var(--h-ctrl-lg);justify-content:center;gap:var(--sp-3);
  background:var(--accent);border:none;border-radius:var(--r-md);
  color:var(--accent-on);font-size:var(--fs-lg);font-weight:var(--fw-bold);padding:0 var(--sp-6)}
.btn--primary:hover{background:var(--accent-hover)}
.btn--primary:active{background:var(--accent-pressed)}
.btn--primary:disabled{background:var(--bg-4);color:var(--text-3);opacity:1;cursor:not-allowed}
.btn--primary[data-state="run"]{background:var(--bg-4);color:var(--text-1);cursor:progress}
.btn--primary[data-state="done"]{background:var(--ok);color:#0e2a1c}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);
  border-radius:0 2px 2px 0;transition:width var(--dur) linear}

/* ============ KHUNG ============ */
.wrap{padding:var(--sp-5);max-width:940px;width:100%;margin-inline:auto;
  height:calc(100vh - var(--h-topbar));overflow:auto}
.card{background:var(--bg-3);border:1px solid var(--line-1);border-radius:var(--r-lg);padding:var(--sp-5)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.card-t{font-size:var(--fs-md);font-weight:var(--fw-semibold)}
.sub{font-size:var(--fs-xs);color:var(--text-3)}
.main{display:flex;flex-direction:column;max-height:100%;padding-bottom:0}

.dot{width:9px;height:9px;border-radius:var(--r-pill);flex:none;background:var(--c)}

/* ============ CHỌN SEQUENCE — tự vẽ, không dùng <select> gốc ============ */
.cbx{position:relative;min-width:0;max-width:280px;flex:0 1 auto}
.cbx-btn{width:100%;height:var(--h-ctrl);padding:0 var(--sp-2);display:inline-flex;align-items:center;
  gap:var(--sp-2);min-width:0;text-align:left;background:var(--bg-0);border:1px solid var(--line-2);
  border-radius:var(--r-sm);color:var(--text-1);font:var(--fw-medium) var(--fs-sm)/1 var(--font-ui);cursor:pointer}
.cbx-btn:hover{border-color:var(--line-strong)}
.cbx-btn:disabled{opacity:.5;cursor:default}
.cbx-btn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbx-btn .chev{margin-left:auto;flex:0 0 auto;color:var(--text-3);transition:transform var(--dur) var(--ease)}
.cbx-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.cbx-list{position:absolute;top:calc(100% + var(--sp-1));right:0;min-width:100%;width:max-content;
  max-width:min(340px,calc(100vw - var(--sp-6)));z-index:var(--z-dropdown);
  margin:0;padding:var(--sp-1);list-style:none;max-height:220px;overflow-y:auto;
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-sm);
  box-shadow:0 8px 24px rgb(0 0 0 /40%)}
.cbx-opt{padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);font-size:var(--fs-sm);
  color:var(--text-1);cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-2);white-space:normal;overflow-wrap:break-word}
.cbx-opt.active{background:var(--bg-4)}
.cbx-opt[aria-selected="true"]{color:var(--accent-text);font-weight:var(--fw-semibold)}
.cbx-opt .tick{width:14px;height:14px;flex:0 0 auto;color:var(--accent-text);visibility:hidden}
.cbx-opt[aria-selected="true"] .tick{visibility:visible}

/* ============ BẢN ĐỒ TRACK ============ */
.work{display:block;min-height:0}
.scroller{min-height:0;overflow-y:auto;margin:0 calc(var(--sp-2) * -1);padding:var(--sp-2)}
.tracks{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:40px minmax(180px,1fr) 220px;
  align-items:center;gap:var(--sp-3);padding:var(--sp-3);
  border-radius:var(--r-sm);border:1px solid transparent}
.tr:hover{background:var(--bg-hover)}
.tr[data-xem]{background:var(--bg-hover);border-color:var(--line-2)}
.tr .lbl{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);
  font-weight:var(--fw-semibold);color:var(--text-2);font-variant-numeric:tabular-nums}
.tr .bar{width:3px;height:16px;border-radius:2px;background:var(--line-2);flex:none}
.tr[data-ai] .bar{background:var(--c)}
.tr .file{min-width:0;font-size:var(--fs-sm);color:var(--text-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .file small{display:block;font-size:var(--fs-2xs);color:var(--text-2);font-weight:var(--fw-normal)}
.tr .empty-note{font-size:var(--fs-xs);color:var(--text-3)}
.tr.trong{opacity:.55}
.tsep{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-3) var(--sp-2);
  font-size:var(--fs-2xs);font-weight:var(--fw-semibold);color:var(--text-3);
  text-transform:uppercase;letter-spacing:.06em}
.tsep::after{content:"";flex:1;height:1px;background:var(--line-1)}

/* ============ GÁN NGƯỜI CHO TRACK ============ */
.nhap{width:100%;min-width:0;height:var(--h-ctrl);padding:0 var(--sp-2);
  background:var(--bg-0);border:1px solid var(--line-2);border-radius:var(--r-sm);
  color:var(--text-1);font:var(--fw-medium) var(--fs-sm)/1 var(--font-ui)}
.nhap::placeholder{color:var(--text-3);font-weight:var(--fw-normal)}
.nhap:hover{border-color:var(--line-strong)}
.tr[data-warn="1"]{background:rgb(232 192 90 /8%);border:1px solid rgb(232 192 90 /40%);border-left:4px solid var(--warn)}
.tr[data-error="1"]{background:rgb(242 120 155 /10%);border:1px solid rgb(242 120 155 /50%);border-left:4px solid var(--danger)}
.badge-warn{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;background:rgb(232 192 90 /18%);color:var(--warn);font-size:11px;font-weight:600;margin-left:6px}
.badge-error{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;background:rgb(242 120 155 /20%);color:var(--danger);font-size:11px;font-weight:600;margin-left:6px}
.hint{display:block;font-size:var(--fs-2xs);color:var(--warn);margin-top:2px}
.chuamedia{color:var(--text-2)}

/* ============ MONITOR ============ */
.mon{display:none!important}
.mon-box{position:relative;width:100%;aspect-ratio:var(--ar,16/9);border-radius:var(--r-md);
  overflow:hidden;background:var(--bg-0);border:1px solid var(--line-2)}
.frame{position:absolute;inset:0}
.frame i{position:absolute;inset:0;display:block}
.frame .l1{background:linear-gradient(200deg,hsl(var(--h) 18% 15%),hsl(calc(var(--h) + 20) 14% 8%))}
.frame .l2{background:radial-gradient(85% 75% at 74% 68%,hsl(calc(var(--h) + 45) 24% 24%) 0%,transparent 58%)}
.frame .l3{background:radial-gradient(60% 58% at 44% 42%,hsl(var(--h) 30% 42%) 0%,transparent 62%)}
.frame .l4{background:radial-gradient(115% 95% at 50% 45%,transparent 38%,rgb(0 0 0 /62%) 100%)}
.frame[data-chung] .l3{background:
  radial-gradient(34% 44% at 30% 48%,hsl(var(--h) 30% 42%) 0%,transparent 66%),
  radial-gradient(34% 44% at 70% 48%,hsl(calc(var(--h) + 70) 26% 38%) 0%,transparent 66%)}
.mon-badge{position:absolute;left:var(--sp-3);top:var(--sp-3);display:flex;align-items:center;gap:var(--sp-2);
  height:22px;padding:0 var(--sp-3) 0 var(--sp-2);border-radius:var(--r-pill);
  background:rgb(14 14 14 /78%);border:1px solid var(--line-2);
  font-size:var(--fs-2xs);font-weight:var(--fw-semibold);color:var(--text-1);white-space:nowrap}
.mon-tc{position:absolute;right:var(--sp-3);bottom:var(--sp-3);padding:2px 6px;border-radius:4px;
  background:rgb(14 14 14 /78%);font-size:var(--fs-2xs);color:var(--text-2);font-variant-numeric:tabular-nums}
.mon-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--sp-2);color:var(--text-3);font-size:var(--fs-xs);text-align:center;padding:var(--sp-4);
  background:var(--bg-0)}

/* dải nhát cắt — cả tập trên một dải, ai lên hình lúc nào */
.cut{position:relative;height:26px;border-radius:var(--r-sm);background:var(--bg-0);
  border:1px solid var(--line-2);cursor:ew-resize;overflow:hidden;touch-action:none}
.cut:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.cut-seg{position:absolute;inset:0}
.cut-seg i{position:absolute;top:0;bottom:0;background:var(--c)}
.cut.chua .cut-seg{background:repeating-linear-gradient(135deg,transparent 0 5px,rgb(255 255 255 /5%) 5px 10px)}
.kim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text-1);
  box-shadow:0 0 0 1px rgb(0 0 0 /55%);pointer-events:none}
.mon-key{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-4);font-size:var(--fs-2xs);color:var(--text-3)}
.mon-key span{display:flex;align-items:center;gap:var(--sp-1)}

/* ============ CHÂN — nút chính ============ */
.main-ft{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-1) var(--sp-1);
  border-top:1px solid var(--line-1);min-width:0;margin-top:var(--sp-4)}

/* cảnh báo mic dán đầu cam — thêm ngoài thiết kế (bẫy đo được 04/08) */
.canhbao{font-size:var(--fs-xs);color:var(--warn);margin-top:var(--sp-3);line-height:1.5}

/* ============ KHUNG BÁO DỪNG/LỖI — thất bại phải TO (v0.3.4) ============ */
.box-canlam,.box-loi{margin-top:var(--sp-4);padding:var(--sp-4);border-radius:var(--r-md);
  font-size:var(--fs-sm);line-height:1.55;white-space:pre-wrap;overflow-wrap:break-word}
.box-canlam{background:var(--bg-6);border:1px solid var(--warn);border-left:4px solid var(--warn);color:var(--text-1)}
.box-canlam::before{content:attr(data-tieude);display:block;font-size:var(--fs-2xs);
  font-weight:var(--fw-bold);letter-spacing:.07em;text-transform:uppercase;color:var(--warn);
  margin-bottom:var(--sp-2)}
.box-loi{background:var(--bg-6);border:1px solid var(--danger);border-left:4px solid var(--danger);
  color:var(--text-1);font-family:inherit}
.box-loi::before{content:attr(data-tieude);display:block;font-size:var(--fs-2xs);
  font-weight:var(--fw-bold);letter-spacing:.07em;text-transform:uppercase;color:var(--danger);
  margin-bottom:var(--sp-2)}

/* ============ HỘP THOẠI ============ */
.ov{position:fixed;inset:0;z-index:var(--z-modal);background:rgb(0 0 0 /55%);
  display:flex;align-items:center;justify-content:center;padding:var(--sp-5)}
.modal{width:100%;max-width:460px;background:var(--bg-6);border:1px solid var(--line-2);
  border-radius:var(--r-lg);box-shadow:0 18px 52px rgb(0 0 0 /62%);padding:var(--sp-5);
  display:flex;flex-direction:column;gap:var(--sp-3);max-height:min(86vh,660px)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.modal-body{flex:1;min-height:0;overflow-y:auto;margin-right:calc(var(--sp-2) * -1);padding-right:var(--sp-2)}
.mrow{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-4) 0;border-bottom:1px solid var(--line-1)}
.mrow .lbl{flex:1;min-width:0;margin-right:var(--sp-3)}
.mrow .lbl b{display:block;font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--text-1)}
.mrow .lbl span{display:block;font-size:var(--fs-xs);color:var(--text-3);margin-top:2px}
.mrow .stat{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs)}
/* ── PICKER (segmented) ─────────────────────────────────────────────────
   Radio thật + label; input ẩn nhưng VẪN nhận focus để bàn phím dùng được.
   Hàng chuyển sang xếp DỌC (.mcot) vì 4 lựa chọn không đủ chỗ nằm ngang
   trong panel hẹp — chữ bị cắt là lỗi nặng hơn là tốn thêm một dòng. */
.mrow.mcot{flex-direction:column;align-items:stretch;gap:var(--sp-2)}
.mrow.mcot .lbl{margin-right:0}
.pick{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg-0);
  border:1px solid var(--line-2);border-radius:var(--r-md);padding:3px}
.pick input{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.pick label{flex:1 1 auto;min-width:0;text-align:center;cursor:pointer;
  padding:0 var(--sp-3);height:calc(var(--h-ctrl) - 6px);line-height:calc(var(--h-ctrl) - 6px);
  border-radius:calc(var(--r-md) - 3px);font-size:var(--fs-xs);
  font-weight:var(--fw-medium);color:var(--text-2);white-space:nowrap;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.pick label:hover{background:var(--bg-hover);color:var(--text-1)}
/* ☠️ Chữ TRẮNG trên nền accent (#f86820) chỉ đạt tương phản 3,0 — TRƯỢT AA cho
   chữ nhỏ (cần 4,5). Đo thật 05/08/2026, đúng bài học sổ thiết kế #25: nền
   accent/vàng-cam rất hay trượt. Chữ TỐI trên cùng nền đó đạt 6,4. */
.pick input:checked + label{background:var(--accent);color:var(--bg-0);
  font-weight:var(--fw-semibold)}
.pick input:focus-visible + label{outline:2px solid var(--accent-hover);outline-offset:1px}
.modal-ft{display:flex;align-items:center;gap:var(--sp-3);padding-top:var(--sp-4);border-top:1px solid var(--line-1)}
.num{width:74px;height:var(--h-ctrl);padding:0 var(--sp-2);background:var(--bg-0);border:1px solid var(--line-2);
  border-radius:var(--r-sm);color:var(--text-1);font:var(--fw-medium) var(--fs-sm)/1 var(--font-ui);
  text-align:right;font-variant-numeric:tabular-nums}
select{height:var(--h-ctrl);padding:0 var(--sp-2);background:var(--bg-0);
  border:1px solid var(--line-2);border-radius:var(--r-sm);color:var(--text-1);
  font:var(--fw-medium) var(--fs-sm)/1 var(--font-ui);cursor:pointer}
select:hover{border-color:var(--line-strong)}
select option{background:var(--bg-2);color:var(--text-1)}
.tr .nhap,.tr select{width:100%;min-width:0;box-sizing:border-box}

/* ---- dock hẹp — ĐẶT CUỐI BẢNG để thắng các luật trên ---- */
@media (max-width:1000px){
  .work{grid-template-columns:1fr;gap:var(--sp-4)}
  .mon{order:-1;padding-top:0}
  .mon-box{max-height:min(34vh,240px);margin-inline:auto}
}
@media (max-width:820px){
  .tr{grid-template-columns:34px minmax(110px,1fr) 150px}
}
@media (max-width:560px){
  .wrap{padding:var(--sp-3)}
  .card{padding:var(--sp-4)}
  .topbar{padding:0 var(--sp-3)}
  .host{display:none}
  .tr{grid-template-columns:32px minmax(0,1fr) 150px}
  .main-ft{flex-wrap:wrap;gap:var(--sp-2)}
  .main-ft .btn--primary{flex:1 0 100%}
}
@media (max-width:360px){
  .tr{grid-template-columns:28px minmax(0,1fr);row-gap:var(--sp-2)}
  .tr .nhap,.tr select{grid-column:1/-1}
  .brand{font-size:var(--fs-md)}
  .ver{display:none}
  .btn--primary{height:auto;min-height:var(--h-ctrl-lg);padding:var(--sp-3) var(--sp-4);
    font-size:var(--fs-md);line-height:1.3;text-align:center}
}
</style>
</head>
<body>

<header class="topbar">
  <svg class="ico brand-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4M8 22h8"/></svg>
  <h1 class="brand">Auto Podcast</h1>
  <span class="ver">v0.6.5</span>
  <span class="spacer"></span>
  <span class="host" id="host"></span>
  <button class="btn btn--sm" id="lang"></button>
  <button class="btn btn--icon" id="moCaiDat">
    <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>
  </button>
</header>

<div class="wrap">
  <section class="card main">
    <div class="card-hd">
      <h2 class="card-t" id="cardT"></h2>
      <div class="cbx" id="seqCbx">
        <button type="button" class="cbx-btn" id="seqBtn" aria-haspopup="listbox" aria-expanded="false"
          aria-controls="seqList">
          <span id="seqBtnLabel"></span>
          <svg class="chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <ul class="cbx-list" id="seqList" role="listbox" tabindex="-1" hidden></ul>
      </div>
    </div>

    <datalist id="dsNguoi"></datalist>

    <div class="work">
      <div class="scroller">
        <div class="tracks" id="tracks"></div>
        <p class="canhbao" id="canhbaoGan" style="display:none"></p>
      </div>

      <aside class="mon">
        <div class="mon-box" id="monBox">
          <div class="frame" id="frame" hidden><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i></div>
          <span class="mon-badge" id="monBadge" hidden></span>
          <span class="mon-tc" id="monTc" hidden>0:00</span>
          <div class="mon-empty" id="monEmpty">
            <svg class="ico" style="width:22px;height:22px" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 13 5.2 3.1a1 1 0 0 0 1.5-.9V8.8a1 1 0 0 0-1.5-.9L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
            <span id="monEmptyChu"></span>
          </div>
        </div>
        <div class="cut chua" id="cut" role="slider" tabindex="0"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="cut-seg" id="cutSeg"></div>
          <span class="kim" id="kim" style="left:0"></span>
        </div>
        <div class="mon-key" id="monKey"></div>
        <div class="sub" id="kqChia"></div>
      </aside>
    </div>

    <div class="main-ft">
      <button class="btn" id="nutKhop" onclick="tuKhop()"></button>
      <button class="btn" id="nutSync" onclick="tuSync()" hidden></button>
      <span class="spacer"></span>
      <button class="btn btn--primary" id="nutDung" onclick="dungBan()" disabled>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
        <span id="goLabel"></span>
        <span class="prog" id="prog" style="width:0"></span>
      </button>
    </div>

    <pre class="box-canlam" id="canlam" style="display:none"></pre>
    <pre class="box-loi" id="loi" style="display:none"></pre>
  </section>
</div>

<!-- ============ HỘP THOẠI: CÀI ĐẶT CẮT ============ -->
<div class="ov" id="ov" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdT">
    <div class="modal-hd">
      <h2 class="card-t" id="mdT"></h2>
      <button class="btn btn--icon" id="dong">
        <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="mrow" style="padding-top:var(--sp-2)">
        <span class="lbl"><b id="cdLeadT"></b><span id="cdLeadS"></span></span>
        <input class="num" type="text" inputmode="decimal" id="lead" value="0,40">
        <span class="sub" id="giay1"></span>
      </div>
      <div class="mrow">
        <span class="lbl"><b id="cdShotT"></b><span id="cdShotS"></span></span>
        <input class="num" type="text" inputmode="decimal" id="shot" value="1,0">
        <span class="sub" id="giay2"></span>
      </div>
      <div class="mrow">
        <span class="lbl"><b id="cdMaxT"></b><span id="cdMaxS"></span></span>
        <input class="num" type="text" inputmode="decimal" id="maxShot" value="18">
        <span class="sub" id="giay3"></span>
      </div>
      <div class="mrow">
        <span class="lbl"><b id="cdNguongT"></b><span id="cdNguongS"></span></span>
        <select id="nguong" style="width:112px">
          <option value="auto"></option>
          <option value="6">6 dB</option>
          <option value="9">9 dB</option>
        </select>
      </div>
      <!-- ☠️ PICKER dựng bằng RADIO THẬT, không phải div + onclick.
           Anh Tiến 05/08: "đưa gọn gàng thành các picker để người dùng chọn
           nhanh luôn — click là được". Radio cho không: Tab vào nhóm, mũi tên
           chuyển lựa chọn, đọc màn hình hiểu đúng (quy tắc vàng #3, #4). -->
      <div class="mrow mcot">
        <span class="lbl"><b id="cdHinhT"></b><span id="cdHinhS"></span></span>
        <div class="pick" id="pickHinh" role="radiogroup" aria-labelledby="cdHinhT">
          <input type="radio" name="cheDoHinh" id="ph-bat-tat" value="bat-tat" checked>
          <label for="ph-bat-tat" id="phL-bat-tat"></label>
          <input type="radio" name="cheDoHinh" id="ph-cut-bo" value="cut-bo">
          <label for="ph-cut-bo" id="phL-cut-bo"></label>
        </div>
      </div>
      <div class="mrow mcot">
        <span class="lbl"><b id="cdTiengT"></b><span id="cdTiengS"></span></span>
        <div class="pick" id="pickTieng" role="radiogroup" aria-labelledby="cdTiengT">
          <input type="radio" name="cheDoTieng" id="pt-duck" value="duck" checked>
          <label for="pt-duck" id="ptL-duck"></label>
          <input type="radio" name="cheDoTieng" id="pt-bat-tat" value="bat-tat">
          <label for="pt-bat-tat" id="ptL-bat-tat"></label>
          <input type="radio" name="cheDoTieng" id="pt-cut-bo" value="cut-bo">
          <label for="pt-cut-bo" id="ptL-cut-bo"></label>
          <input type="radio" name="cheDoTieng" id="pt-giu" value="giu">
          <label for="pt-giu" id="ptL-giu"></label>
        </div>
      </div>
      <div class="mrow" id="rowChim">
        <span class="lbl"><b id="cdChimT"></b><span id="cdChimS"></span></span>
        <select id="mucChim" style="width:112px">
          <option value="8">-8 dB</option>
          <option value="15" selected>-15 dB</option>
          <option value="24">-24 dB</option>
        </select>
      </div>
      <div class="mrow" style="border-bottom:0">
        <span class="lbl"><b id="cdGocT"></b><span id="cdGocS"></span></span>
        <span class="stat" style="color:var(--ok)">
          <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.8 10A10 10 0 1 1 17 3.34"/><path d="m9 11 3 3L22 4"/></svg>
          <span id="cdGocOk"></span>
        </span>
      </div>
    </div>
    <div class="modal-ft">
      <span class="sub" id="tomTat" style="flex:1;min-width:0"></span>
      <button class="btn" id="dong2"></button>
    </div>
  </div>
</div>

  function timFfmpeg(fs) {
    var goc = cs.getSystemPath(SystemPath.EXTENSION).replace(/\\/g, '/')
    var ung = ['com.aiostudio.transcript', 'com.aiostudio.autocut']
    for (var i = 0; i < ung.length; i++) {
      var p = goc.replace(/com\.aiostudio\.[a-z]+$/, ung[i]) + '/bin/win64/ffmpeg.exe'
      try { if (fs.existsSync(p)) return p } catch (e) {}
    }
    return null
  }
  function napLaiHost(xong) {

    cs.evalScript(lenh, function (kq) { xong(String(kq).indexOf('OK') === 0) })
  }

      try { cs.evalScript(lenh, function (raw) { res(String(raw)) }) }

    })
  }

    raw.slice(3).split('|').forEach(function (d) {

  function bamTenSync(s) {
    var h = 5381

  function chuan(s) { return String(s).trim().replace(/\s+/g, ' ') }
  /**
   * Người dùng gõ gì thì coi là "cam chung"? Nhận cả tiếng Việt lẫn tiếng Anh,
   * có dấu hay không, vì đây là chữ họ ĐỌC THẤY trên nhãn cột nên gõ lại y vậy.
   */
  function laChuCamChung(s) {
    var x = chuan(s).toLowerCase()
      .replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g, 'a').replace(/[èéẹẻẽêềếệểễ]/g, 'e')
      .replace(/[òóọỏõôồốộổỗơờớợởỡ]/g, 'o').replace(/[ùúụủũưừứựửữ]/g, 'u')
      .replace(/[ìíịỉĩ]/g, 'i').replace(/[ỳýỵỷỹ]/g, 'y').replace(/đ/g, 'd')
      .replace(/[^a-z]/g, '')
    return x === 'camchung' || x === 'camtoancanh' || x === 'toancanh' ||
      x === 'widecam' || x === 'wide' || x === 'camwide' || x === 'master' ||
      x === 'canhrong' || x === 'camrong' || x === 'twoshot' || x === 'groupshot'
  }

  function nguoiTheoTen(ten) {

    if (!x) return null
    for (var i = 0; i < NGUOI.length; i++) {
      if (NGUOI[i].ten.toLowerCase() === x.toLowerCase()) return NGUOI[i]
    }
    var id = 1
    NGUOI.forEach(function (n) { if (n.id >= id) id = n.id + 1 })

    NGUOI.forEach(function (n, i) { n.mau = mauCua(i) })
    var xoa = []
    gan.forEach(function (v, k) { if (typeof v === 'number' && !con[v]) xoa.push(k) })

  /** Đọc giá trị đang chọn của một picker radio. */
  function docPick(ten, macDinh) {
    var el = document.querySelector('input[name="' + ten + '"]:checked')
    return el ? el.value : macDinh
  }
  /** Chọn một giá trị trên picker; trả về true nếu có ô khớp. */
  function datPick(ten, gt) {
    var el = document.querySelector('input[name="' + ten + '"][value="' + gt + '"]')
    if (!el) return false
    el.checked = true
    return true
  }
  /** Quy giá trị cài đặt cũ về khuôn mới — xem chú thích trong docCaiDat. */
  function quyKhuonCu(loai, v) {
    if (loai === 'hinh') return (v === 'du-cam') ? 'bat-tat' : (v === '1-cam') ? 'cut-bo' : v
    if (v === 'theo') return 'cut-bo'
    if (v === 'cat-tat') return 'bat-tat'
    if (v === 'cat-chim') return 'duck'
    return v
  }
  /**
   * Dịch mã lỗi host thành câu người đọc được.
   * ☠️ 05/08/2026: anh Tiến thấy nguyên văn `Build failed: ERR:SEQ_DOI|` trên
   * màn hình. Câu tử tế `seq_doi` CÓ khai báo từ lâu mà KHÔNG chỗ nào gọi —
   * host trả mã đó ở 13 chỗ, panel dán thẳng mã ra giao diện. Nhãn lỗi phải
   * nói người dùng LÀM GÌ tiếp, không phải in tên hằng số ra cho họ đoán.
   */
  function cauLoiHost(r) {
    var s = String(r || '')
    if (s.indexOf('ERR:SEQ_DOI') >= 0) return t('seq_doi')
    if (s.indexOf('ERR:CHUA_MO_PROJECT') >= 0) return t('chua_project')
    if (s.indexOf('ERR:CHUA_MO_SEQUENCE') >= 0) return t('khop_chua_seq')
    if (s.indexOf('ERR:THIEU_ITEM') >= 0) {
      var kv = tachKv(s.replace(/^ERR:THIEU_ITEM\|/, ''))
      return tp('khop_thieu_item', { so: kv.so || '?', ds: kv.ds || '' })
    }
    // ☠️ THIEU_TRACK: soát 05/08 tìm ra. Trước đây lệnh trỏ vào track không tồn
    // tại bị NUỐT im lặng SAU KHI đã xoá sạch timeline, host vẫn trả OK:soLoi=0.
    if (s.indexOf('ERR:THIEU_TRACK') >= 0) {
      var kt = tachKv(s)
      return tp('khop_thieu_track', {
        canV: kt.canV || '?', coV: kt.coV || '?', canA: kt.canA || '?', coA: kt.coA || '?',
      })
    }
    return t('dung_loi') + s
  }
  /** Nhãn của một chế độ tiếng — dùng cho cả picker lẫn dòng tóm tắt. */
  function tenCheDoTieng(v) {
    if (v === 'giu') return t('cd_tieng_giu')
    if (v === 'bat-tat') return t('cd_tieng_battat')
    if (v === 'cut-bo') return t('cd_tieng_cutbo')
    return t('cd_tieng_duck')
  }
  function apCaiDat() {
    var c = docCaiDat()
    // Mức chìm chỉ có nghĩa với chế độ CÓ chìm — "giữ nguyên" và "tắt clip"
    // thì ô đó là công tắc vô nghĩa (bài học sổ thiết kế #11), nên ẩn đi.
    document.getElementById('rowChim').style.display = (c.tieng === 'duck') ? '' : 'none'
    document.getElementById('tomTat').textContent = tp('tomtat', {
      lead: vietSo(c.lead.toFixed(2)), shot: vietSo(c.shot.toFixed(1)), max: c.max,
      nguong: c.nguong === 'auto' ? t('tomtat_auto') : c.nguong + ' dB',
      tieng: (c.hinh === 'bat-tat' ? t('cd_hinh_battat') : t('cd_hinh_cutbo')) + ' · ' +
        tenCheDoTieng(c.tieng) + ((c.tieng === 'duck') ? ' −' + c.chim + ' dB' : ''),
    })
    try { localStorage.setItem('aio-pc-caidat', JSON.stringify(c)) } catch (e) {}
    ve()
  }
  ;(function napCaiDat() {
    var c = null
    try { c = JSON.parse(localStorage.getItem('aio-pc-caidat') || 'null') } catch (e) {}
    // chuyển tuỳ chọn "tiếng liền mạch" cũ (v0.3.5) sang khuôn mới
    if (!c) {
      try { if (localStorage.getItem('aio-pc-tienglien') === '1') c = { tieng: 'giu' } } catch (e) {}
    }
    if (!c) return
    if (c.lead !== undefined) document.getElementById('lead').value = vietSo(String(c.lead))
    if (c.shot !== undefined) document.getElementById('shot').value = vietSo(String(c.shot))
    if (c.max !== undefined) document.getElementById('maxShot').value = String(c.max)
    if (c.nguong) document.getElementById('nguong').value = c.nguong
    // 'theo' là khuôn cũ ≤ v0.6.1 — quy về 'cat-tat' (xem docCaiDat).
    if (c.tieng) datPick('cheDoTieng', quyKhuonCu('tieng', c.tieng))
    if (c.hinh) datPick('cheDoHinh', quyKhuonCu('hinh', c.hinh))
    if (c.chim) document.getElementById('mucChim').value = String(c.chim)
  })()

  // ═══ KIỂM: đủ điều kiện dựng chưa — dựng luôn cầu nguoiDs cho engine ═════
  function kiem() {
    nguoiDs = []
    trackWide = -1
    var dung = function (ds) { return ds.filter(function (tr) { return tr.soClip > 0 }) }
    var camDung = dung(trackV)
    var loi = ''
    var wideDs = camDung.filter(function (tr) { return aiCua('V' + tr.i).length > 1 })
    if (wideDs.length > 1) loi = t('hai_wide')
    if (wideDs.length === 1) trackWide = wideDs[0].i

    var thieuMic = []
    NGUOI.forEach(function (n, i) {
      var rieng = camDung.filter(function (tr) {
        var a = aiCua('V' + tr.i)
        return a.length === 1 && a[0] === n.id
      })
      var mics = dung(trackA).filter(function (tr) { return gan.get('A' + tr.i) === n.id })
      if (!loi && rieng.length > 1) loi = tp('hai_cam', { ten: n.ten, n: rieng.length })
      if (!loi && mics.length > 1) loi = t('trung_mic')
      if (!mics.length) thieuMic.push(n)
      nguoiDs.push({
        cam: rieng.length === 1 ? rieng[0].i : -1,
        mic: mics.length === 1 ? mics[0].i : -1,
      })
    })
    if (!loi && NGUOI.length < 2) loi = t('it_nguoi')
    if (!loi) {
      for (var i = 0; i < NGUOI.length; i++) {
        var ng = nguoiDs[i]
        if (ng.cam < 0 || ng.mic < 0) { loi = t('thieu_gan'); break }
        var tV = timTrack(trackV, ng.cam)
        var tA = timTrack(trackA, ng.mic)
        if (tV.soClip !== 1) { loi = tp('track_nhieu_clip', { track: 'V' + (ng.cam + 1), n: tV.soClip }); break }
        if (tA.soClip !== 1) { loi = tp('track_nhieu_clip', { track: 'A' + (ng.mic + 1), n: tA.soClip }); break }
      }
    }
    if (!loi && trackWide >= 0) {
      var tW = timTrack(trackV, trackWide)
      if (tW && tW.soClip !== 1) loi = tp('track_nhieu_clip', { track: 'V' + (trackWide + 1), n: tW.soClip })
    }
    return { ok: !loi, loi: loi, thieuMic: thieuMic }
  }

  // ═══ VẼ ═════════════════════════════════════════════════════════════════
  function veNguoi() {
    document.getElementById('dsNguoi').innerHTML =
      NGUOI.map(function (n) { return '<option value="' + n.ten.replace(/"/g, '&quot;') + '"></option>' }).join('')
  }

  function veTrack() {
    var kt = kiem()
    // nhắc thiếu mic ĐÚNG MỘT LẦN — ở hàng mic trống đầu tiên
    var kNhac = null
    if (kt.thieuMic.length) {
      var tr0 = trackA.filter(function (tr) { return tr.soClip > 0 && gan.get('A' + tr.i) === undefined })[0]
      if (tr0) kNhac = 'A' + tr0.i
    }
    function trungMic(k) {
      var v = gan.get(k)
      if (typeof v !== 'number') return false
      return trackA.filter(function (x) { return x.soClip > 0 && gan.get('A' + x.i) === v }).length > 1
    }
    function hang(tr, loai) {
      var k = loai + tr.i
      var ai = aiCua(k)
      var trong = tr.soClip === 0
      var mau = ai.length > 1 ? 'var(--chung)' : (ai.length ? (timNguoi(ai[0]) || {}).mau || '' : '')
      var isCamAudio = false
      if (loai === 'A' && !trong) {
        var vIdxCheck = videoCungMedia(tr.duong)
        if (vIdxCheck >= 0) isCamAudio = true
      }
      var isWarn = (!trong && !ai.length && loai === 'V') || isCamAudio
      var isError = (!trong && trungMic(k))

      var badge = ''
      if (isCamAudio) {
        badge = '<span class="badge-warn">' + t('badge_tieng_cam') + '</span>'
      } else if (!trong && !ai.length && loai === 'V') {
        badge = '<span class="badge-warn">' + t('badge_chua_gan') + '</span>'
      } else if (isError) {
        badge = '<span class="badge-error">' + t('badge_trung_mic') + '</span>'
      }

      var chon
      if (loai === 'V') {
        chon = '<span><input class="nhap" list="dsNguoi" data-k="' + k + '" value="' +
          tenCua(k).replace(/"/g, '&quot;') + '" placeholder="' + t('o_ten') + '" aria-label="' +
          tp('o_ten_al', { ten: tr.ten }) + '">' +
          (ai.length || trong ? '' : '<small class="hint">' + t('chua_ten') + '</small>') + '</span>'
      } else {
        var v = gan.get(k)
        var opts = '<option value="">' + t('chon_nguoi') + '</option>' +
          NGUOI.map(function (n) {
            return '<option value="' + n.id + '"' + (v === n.id ? ' selected' : '') + '>' + n.ten + '</option>'
          }).join('') +
          '<option value="x"' + (v === 'x' ? ' selected' : '') + '>' + t('khong_dung') + '</option>'
        var nhac = ''
        if (trungMic(k)) nhac = '<small class="hint">' + t('trung_mic') + '</small>'
        else if (k === kNhac) {
          nhac = '<small class="hint">' +
            tp('chua_mic', { ten: kt.thieuMic.map(function (n) { return n.ten }).join(', ') }) +
            '</small>'
        }
        chon = '<span><select data-k="' + k + '" aria-label="' + tp('o_mic_al', { ten: tr.ten }) + '">' + opts + '</select>' + nhac + '</span>'
      }
      var ghiChu = ''
      if (loai === 'A' && !trong && isCamAudio) {
        var vIdx = videoCungMedia(tr.duong)
        ghiChu = ' <span style="color:var(--text-3)">· ' + tp('tieng_cua_cam', { ten: 'V' + (vIdx + 1) }) + '</span>'
      }
      var thongTin = trong
        ? '<span class="empty-note">' + t('track_trong') + '</span><span class="empty-note">—</span>'
        : '<span class="file" title="' + (tr.tenClip || '').replace(/"/g, '&quot;') + '">' +
          (tr.tenClip || '<span class="chuamedia">' + t('chua_clip') + '</span>') + ghiChu + badge +
          '<small>' + mmss(Math.max(0, tr.ketThuc - tr.batDau)) +
          (tr.soClip > 1 ? ' · ' + tp('nhieu_clip', { n: tr.soClip }) : '') + '</small></span>' + chon

      var statusAttr = ''
      if (isError) statusAttr = ' data-error="1"'
      else if (isWarn) statusAttr = ' data-warn="1"'

      return '<div class="tr' + (trong ? ' trong' : '') + '" data-loai="' + loai + '" data-k="' + k + '"' + statusAttr +
        (ai.length ? ' data-ai="1" style="--c:' + mau + '"' : '') + '>' +
        '<span class="lbl"><span class="bar"></span>' + loai + (tr.i + 1) + '</span>' + thongTin + '</div>'
    }
    var coGi = trackV.some(function (tr) { return tr.soClip > 0 }) || trackA.some(function (tr) { return tr.soClip > 0 })
    if (!coGi) {
      document.getElementById('tracks').innerHTML =
        '<div class="tsep">' + t('ban_do') + '</div><p class="sub" style="padding:0 var(--sp-3)">' + t('khong_track') + '</p>'
      return
    }
    // Hình xếp NGƯỢC chỉ số (V3 trên cùng — như Premiere), tiếng xếp xuôi.
    var vRows = trackV.slice().sort(function (a, b) { return b.i - a.i })
      .map(function (tr) { return hang(tr, 'V') }).join('')
    var aRows = trackA.slice().sort(function (a, b) { return a.i - b.i })
      .map(function (tr) { return hang(tr, 'A') }).join('')
    document.getElementById('tracks').innerHTML =
      // ☠️ Hai dòng chia mục "Hình — cam nào thấy ai" / "Tiếng — mic riêng của
      // ai" đã BỎ (anh Tiến 05/08: "2 dòng text dư thừa"). Cột V1–V4 / A1–A5
      // đã tự nói ra điều đó, còn vế "giữ nguyên, chỉ dùng để nghe" thì lặp
      // lại đúng thứ picker Tiếng đang nói — một thông điệp chỉ nói MỘT nơi.
      vRows + '<div class="tsep"></div>' + aRows
  }

  function veChan() {
    var kt = kiem()
    var nut = document.getElementById('nutDung')
    if (!dangChay && !nut.dataset.state) {
      nut.disabled = !kt.ok || !seqDangNhin
      nut.title = kt.ok ? '' : kt.loi
    }
  }

  // cảnh báo "mic dán đầu clip cam" — thêm ngoài thiết kế (bẫy 04/08)
  function capNhatCanhBaoGan() {
    var el = document.getElementById('canhbaoGan')
    var ds = []
    kiem()
    NGUOI.forEach(function (n, i) {
      var ng = nguoiDs[i]
      if (!ng || ng.cam < 0 || ng.mic < 0) return
      var tV = timTrack(trackV, ng.cam)
      var tA = timTrack(trackA, ng.mic)
      if (tV && tA && tV.soClip > 0 && tA.soClip > 0 &&
          videoCungMedia(tA.duong) === -1 &&
          Math.abs(tA.batDau - tV.batDau) < 0.021 && tA.inPoint < 0.021) ds.push(n.ten)
    })
    el.style.display = ds.length ? '' : 'none'
    el.textContent = ds.length ? tp('mic_dinh_cam', { ten: ds.join(', ') }) : ''
  }

  // ═══ MONITOR + DẢI NHÁT CẮT ═════════════════════════════════════════════
  function hueCua(k) { return (k.charCodeAt(1) * 97 + 41) % 360 }
  function camDaGan() {
    return trackV.filter(function (tr) { return tr.soClip > 0 && aiCua('V' + tr.i).length })
  }
  function camTaiMoc() {
    var ds = camDaGan()
    if (!ds.length) return null
    if (KE_HOACH) {
      for (var i = 0; i < KE_HOACH.length; i++) {
        if (moc >= KE_HOACH[i].tu && moc < KE_HOACH[i].den) {
          var tr = ds.filter(function (x) { return 'V' + x.i === KE_HOACH[i].camK })[0]
          if (tr) return tr
        }
      }
    }
    if (camXem) {
      var x = ds.filter(function (d) { return 'V' + d.i === camXem })[0]
      if (x) return x
    }
    return ds[ds.length - 1]
  }
  function veMonitor() {
    var tr = camTaiMoc()
    document.getElementById('monEmpty').hidden = !!tr
    document.getElementById('frame').hidden = !tr
    document.getElementById('monBadge').hidden = !tr
    document.getElementById('monTc').hidden = !tr
    var rows = document.querySelectorAll('.tr[data-loai=V]')
    for (var i = 0; i < rows.length; i++) {
      if (tr && rows[i].getAttribute('data-k') === 'V' + tr.i) rows[i].setAttribute('data-xem', '1')
      else rows[i].removeAttribute('data-xem')
    }
    if (tr) {
      var k = 'V' + tr.i
      var ai = aiCua(k).map(timNguoi).filter(Boolean)
      var fr = document.getElementById('frame')
      fr.style.setProperty('--h', hueCua(k))
      if (ai.length > 1) fr.setAttribute('data-chung', '1'); else fr.removeAttribute('data-chung')
      document.getElementById('monBadge').innerHTML = ai.map(function (n) {
        return '<span class="dot" style="--c:' + n.mau + ';width:7px;height:7px"></span>'
      }).join('') + 'V' + (tr.i + 1) + ' · ' + (ai.length > 1 ? t('cam_chung') : (ai[0] ? ai[0].ten : ''))
      document.getElementById('monTc').textContent = mmss(moc) + ' / ' + mmss(SEQ_DAI)
    }
    var cut = document.getElementById('cut')
    cut.classList.toggle('chua', !KE_HOACH)
    cut.setAttribute('aria-valuemax', String(Math.round(SEQ_DAI)))
    cut.setAttribute('aria-valuenow', String(Math.round(moc)))
    cut.setAttribute('aria-label', t('mon_keo'))
    document.getElementById('cutSeg').innerHTML = KE_HOACH ? KE_HOACH.map(function (d) {
      return '<i style="--c:' + d.mau + ';left:' + (d.tu / SEQ_DAI * 100) + '%;width:' +
        ((d.den - d.tu) / SEQ_DAI * 100) + '%"></i>'
    }).join('') : ''
    document.getElementById('kim').style.left = (moc / SEQ_DAI * 100) + '%'
    // chú giải màu
    var ds = camDaGan()
    var coChung = ds.some(function (x) { return aiCua('V' + x.i).length > 1 })
    document.getElementById('monKey').innerHTML = NGUOI.filter(function (n) {
      return ds.some(function (x) { return aiCua('V' + x.i).indexOf(n.id) >= 0 })
    }).map(function (n) {
      return '<span><span class="dot" style="--c:' + n.mau + '"></span>' + n.ten + '</span>'
    }).join('') + (coChung ? '<span><span class="dot" style="--c:var(--chung)"></span>' + t('cam_chung') + '</span>' : '')
  }
  function datMoc(el, x) {
    var r = el.getBoundingClientRect()
    moc = Math.max(0, Math.min(SEQ_DAI, (x - r.left) / r.width * SEQ_DAI))
    veMonitor()
  }
  document.getElementById('cut').addEventListener('pointerdown', function (e) {
    document.getElementById('cut').setPointerCapture(e.pointerId)
    datMoc(document.getElementById('cut'), e.clientX)
  })
  document.getElementById('cut').addEventListener('pointermove', function (e) {
    if (e.buttons) datMoc(document.getElementById('cut'), e.clientX)
  })
  document.getElementById('cut').addEventListener('keydown', function (e) {
    var b = { ArrowLeft: -15, ArrowRight: 15, Home: -1e9, End: 1e9 }[e.key]
    if (b === undefined) return
    moc = Math.max(0, Math.min(SEQ_DAI, moc + b))
    veMonitor()
    e.preventDefault()
  })

  function ve() { veNguoi(); veTrack(); veChan(); veMonitor(); capNhatCanhBaoGan(); capNhatNutSync() }

  // ═══ TƯƠNG TÁC BẢN ĐỒ ═══════════════════════════════════════════════════
  // V1 đi với A1, V2 với A2… — mic cùng số tự ăn theo, trừ khi đã chốt tay.
  function tuDienMic(trV, ids) {
    var mic = trackA.filter(function (x) { return x.i === trV.i && x.soClip > 0 })[0]
    if (!mic) return
    var kM = 'A' + mic.i
    if (tuChinh.has(kM)) return
    if (ids.length === 1) gan.set(kM, ids[0])
    else gan.delete(kM)
  }
  document.getElementById('tracks').addEventListener('change', function (e) {
    var o = e.target
    if (!o || !o.getAttribute) return
    var k = o.getAttribute('data-k')
    if (!k) return
    if (o.className === 'nhap' || (o.classList && o.classList.contains('nhap'))) {
      var trV = timTrack(trackV, parseInt(k.slice(1), 10))
      var ids = []
      // ☠️ Anh Tiến 05/08: V3 là cam chung, anh gõ thẳng chữ "Cam chung" vào ô
      // — hoàn toàn hợp lý, vì nhãn cột hiện đúng chữ đó. Panel lại hiểu là
      // TÊN MỘT NGƯỜI thứ ba, người đó không có mic nên nút Cắt khoá câm.
      // Nay nhận luôn cách gõ đó: chữ nghĩa "cam chung" = gán CẢ MỌI NGƯỜI.
      if (laChuCamChung(o.value)) {
        // Chỉ gán NGƯỜI CÓ MIC. Nếu vơ hết NGUOI thì một "người ma" (do lần
        // trước gõ nhầm chữ vào ô tên) sẽ bị kéo vào và khoá nút Cắt câm lặng
        // — đúng ca anh Tiến vấp 05/08: ô hiện "Will, Trọng, Cam chung".
        var coMic = {}
        trackA.forEach(function (tr) {
          var g = gan.get('A' + tr.i)
          if (typeof g === 'number') coMic[g] = 1
        })
        NGUOI.forEach(function (n) {
          if (coMic[n.id] && ids.indexOf(n.id) < 0) ids.push(n.id)
        })
        // Chưa gán mic nào thì đành lấy hết — còn hơn không gán gì.
        if (!ids.length) NGUOI.forEach(function (n) { ids.push(n.id) })
      } else
      String(o.value).split(',').forEach(function (ten) {
        var ng = nguoiTheoTen(ten)
        if (ng && ids.indexOf(ng.id) < 0) ids.push(ng.id)
      })
      if (ids.length) gan.set(k, new Set(ids)); else gan.delete(k)
      donNguoi()
      if (trV) tuDienMic(trV, ids.filter(function (id) { return timNguoi(id) }))
      if (ids.length) camXem = k
    } else {
      var v = o.value
      tuChinh.add(k)
      if (!v) gan.delete(k)
      else gan.set(k, v === 'x' ? 'x' : parseInt(v, 10))
    }
    KE_HOACH = null
    document.getElementById('kqChia').textContent = ''
    delete document.getElementById('nutDung').dataset.state
    luuGan()
    ve()
    apNgonNguNut()
  })
  document.getElementById('tracks').addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('input,select')) return
    var tr = e.target.closest ? e.target.closest('.tr[data-loai=V][data-ai]') : null
    if (tr) { camXem = tr.getAttribute('data-k'); ve() }
  })

  // ═══ ĐÈN TRẠNG THÁI + CHỌN SEQUENCE ═════════════════════════════════════
  var dsSeq = []
  var dangSoi = false
  function soi() {
    if (dangChay || dangSync || dangSoi) return
    dangSoi = true
    goiHost('pc_trangThai()').then(function (raw) {
      dangSoi = false
      var host = document.getElementById('host')
      if (raw.indexOf('OK:') !== 0) {
        napLaiHost(function () {})
        host.textContent = t('cho_premiere')
        return
      }
      var p = raw.slice(3).split('|')
      host.innerHTML = p[0]
        ? '<b>Premiere ' + p[0] + '</b>' + (p[1] ? '<i>·</i>' + p[1] : '')
        : t('cho_premiere')
      var tenSeq = p[2] || ''
      capNhatChonSeq((p[6] || '').split(';;').filter(function (x) { return x }), tenSeq)
      if (!tenSeq) {

        document.getElementById('nutDung').disabled = true
        document.getElementById('seqBtnLabel').textContent = t('chua_mo_seq')
        return
      }

        seqDangNhin = tenSeq

      }
      veChan()
    })
  }
  window.setInterval(soi, 1000)

  // combobox tự vẽ — không dùng <select> gốc (hộp trắng của HĐH lạc bảng màu)
  var cbxMo = false
  function capNhatChonSeq(ds, tenDangMo) {
    dsSeq = ds
    var btn = document.getElementById('seqBtn')
    if (cbxMo) return // đang mở thì đừng vẽ lại giữa tay người dùng
    btn.disabled = !ds.length
    document.getElementById('seqBtnLabel').textContent = tenDangMo || (ds.length ? ds[0] : t('chua_mo_seq'))
    btn.title = tenDangMo || ''
  }
  ;(function () {
    var btn = document.getElementById('seqBtn')
    var list = document.getElementById('seqList')
    var active = 0
    function dungDs() {
      list.innerHTML = dsSeq.map(function (q, i) {
        var chon = q === seqDangNhin
        return '<li class="cbx-opt" id="seqOpt' + i + '" role="option" aria-selected="' + chon + '">' +
          '<span>' + q + '</span>' +
          '<svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></li>'
      }).join('')
    }
    function sang() {
      for (var i = 0; i < list.children.length; i++) {
        list.children[i].classList.toggle('active', i === active)
      }
      if (list.children[active]) list.children[active].scrollIntoView({ block: 'nearest' })
    }
    function ngoai(e) { if (!document.getElementById('seqCbx').contains(e.target)) dong(false) }
    function mo() {
      if (!dsSeq.length) return
      dungDs()
      active = Math.max(0, dsSeq.indexOf(seqDangNhin))
      list.hidden = false
      cbxMo = true
      btn.setAttribute('aria-expanded', 'true')
      sang()
      list.focus()
      document.addEventListener('click', ngoai, true)
    }
    function dong(veNut) {
      list.hidden = true
      cbxMo = false
      btn.setAttribute('aria-expanded', 'false')
      document.removeEventListener('click', ngoai, true)
      if (veNut) btn.focus()
    }
    function chon(i) {
      var ten = dsSeq[i]
      dong(true)
      if (!ten || ten === seqDangNhin || dangChay || dangSync) return
      goiHost('(typeof pc_chonSeq==="function")?pc_chonSeq("' + chuoiJsx(ten) + '"):"ERR:CHUA_NAP|"').then(function (r) {
        if (String(r).indexOf('OK:') !== 0) {
          napLaiHost(function (ok) {
            if (ok) goiHost('pc_chonSeq("' + chuoiJsx(ten) + '")').then(function () { soi() })
          })
          return
        }
        soi()
      })
    }
    btn.addEventListener('click', function () { list.hidden ? mo() : dong(true) })
    list.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(dsSeq.length - 1, active + 1); sang() }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); sang() }
      else if (e.key === 'Home') { e.preventDefault(); active = 0; sang() }
      else if (e.key === 'End') { e.preventDefault(); active = dsSeq.length - 1; sang() }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chon(active) }
      else if (e.key === 'Escape') { e.preventDefault(); dong(true) }
      else if (e.key === 'Tab') { dong(false) }
    })
    list.addEventListener('click', function (e) {
      var li = e.target.closest ? e.target.closest('.cbx-opt') : null
      if (!li) return
      chon(Array.prototype.indexOf.call(list.children, li))
    })
  })()

  function docThongTinSeq() {
    napLaiHost(function (ok) {
      if (!ok) return
      goiHost('pc_thongTinSeq()').then(function (raw) {
        trackV = []; trackA = []
        if (raw.indexOf('OK:') === 0) {
          raw.slice(3).split('\n').forEach(function (dong) {
            var p = dong.split('|')
            if (p.length < 9 || (p[0] !== 'V' && p[0] !== 'A')) return
            var tr = {
              i: parseInt(p[1], 10), ten: p[2], soClip: parseInt(p[3], 10),
              tenClip: p[4], duong: p[5],
              batDau: parseFloat(p[6]) || 0, inPoint: parseFloat(p[7]) || 0, ketThuc: parseFloat(p[8]) || 0,
            }
            if (p[0] === 'V') trackV.push(tr); else trackA.push(tr)
          })
        }
        SEQ_DAI = 1
        trackV.concat(trackA).forEach(function (tr) { if (tr.ketThuc > SEQ_DAI) SEQ_DAI = tr.ketThuc })
        // Dựng xong panel tự nhìn sang BẢN VỪA CẮT (active đổi) — kết quả
        // phải ĐỨNG LẠI cho người dùng xem, đừng xoá (vấp E2E 04/08 23:5x:
        // kết quả hiện đúng 1 giây rồi biến vì chính khối reset dưới đây).
        var giuKetQua = seqDangNhin === tenVuaCat && KE_HOACH
        if (!giuKetQua) {
          KE_HOACH = null
          camXem = null
          moc = 0
          document.getElementById('kqChia').textContent = ''
          delete document.getElementById('nutDung').dataset.state
          var nho = ganTheoSeq[seqDangNhin]
          if (nho) {
            napGan(nho)
            donNguoi()
          } else {
            NGUOI = []; gan = new Map(); tuChinh = new Set()
            tuDongGoiYGan()
          }
        }
        ve()
        apNgonNguNut()
      })
    })
  }

  // ═══ TỰ KHỚP (auto match) ═══════════════════════════════════════════════
  // Anh Tiến 05/08: "kéo toàn bộ source clip vào sequence, bấm một nút auto match".
  // Bộ não nằm ở khop.js (thuần, có bộ kiểm) — ở đây chỉ lấy track ra, gọi nó,
  // rồi đổ kết quả vào bản đồ. Đọc đầu khop.js trước khi đụng vào: chuyện ghép
  // cam↔mic BẰNG TIẾNG CAM đã đo và đã trượt 3/4 ca trên liệu thật.

  /** Track → dạng khop.js hiểu. Ưu tiên tên clip, không có thì lấy tên file. */
  function tuiKhop(ds) {
    return ds.filter(function (tr) { return tr.soClip > 0 })
      .sort(function (a, b) { return a.i - b.i })
      .map(function (tr) {
        return {
          k: (ds === trackV ? 'V' : 'A') + tr.i,
          ten: tr.tenClip || tenFileNgan(tr.duong || ''),
          duong: tr.duong || '',
        }
      })
  }

  /** Đổ kết quả khớp vào NGUOI/gan. Trả về số người dựng được. */
  function apKhop(kq) {
    NGUOI = []; gan = new Map(); tuChinh = new Set()
    kq.cap.forEach(function (c, i) {
      var ng = nguoiTheoTen(c.ten || tp('nguoi', { i: i + 1 }))
      if (!ng) return
      gan.set(c.camK, new Set([ng.id]))
      gan.set(c.micK, ng.id)
      // Cặp do tool chốt: đánh dấu "đã chốt tay" để tuDienMic (V1↔A1) đừng
      // giật mic sang track cùng số khi người dùng sửa tên.
      tuChinh.add(c.micK)
    })
    if (kq.camChung && NGUOI.length > 1) {
      gan.set(kq.camChung, new Set(NGUOI.map(function (n) { return n.id })))
    }
    // Tiếng đi kèm cam: chắc chắn không phải mic riêng → Không dùng.
    kq.tiengCam.forEach(function (k) { gan.set(k, 'x'); tuChinh.add(k) })
    luuGan()
    return NGUOI.length
  }

  // Chạy NGẦM khi mở sang sequence chưa có bản đồ nhớ sẵn. Chỉ chạy khi mỗi
  // track đúng 1 clip liền (nguồn hợp lệ) — sequence KẾT QUẢ với hàng chục
  // clip mỗi track thì đừng bịa tên vào (vấp E2E 04/08).
  function tuDongGoiYGan() {
    var coV = trackV.filter(function (tr) { return tr.soClip === 1 })
    var coA = trackA.filter(function (tr) { return tr.soClip === 1 })
    if (coV.length !== trackV.filter(function (t) { return t.soClip > 0 }).length) return
    if (coA.length !== trackA.filter(function (t) { return t.soClip > 0 }).length) return
    if (coV.length < 2 || coA.length < 2) return
    apKhop(AiOKhop.khopBanDo(tuiKhop(trackV), tuiKhop(trackA)))
  }

  /**
   * Nút "Tự khớp" — người dùng chủ động bấm, tự động xếp track timeline & khớp bản đồ.
   * @param daThuPhucHoi true = da mot lan tu nap mic tu Project Bin roi.
   *   ☠️ Chot chong LAP VO HAN. Ban truoc 05/08: thieu mic -> goi
   *   tuTimVaSyncMicProject -> callback tra true chi can bin co >=1 file mic
   *   (khong kiem da du 2 mic chua, tham chi khong dat gi khi chua ai duoc gan
   *   mic) -> goi lai tuKhop() -> van thieu -> lap mai, moi vong ghi de
   *   timeline. Nay chi duoc thu phuc hoi DUNG MOT LAN.
   */
  function tuKhop(daThuPhucHoi) {
    if (dangChay || dangSync) return
    hien('canlam', ''); hien('loi', '')
    var nutK = document.getElementById('nutKhop')
    clearTimeout(nutK._hen)
    delete nutK.dataset.state
    nutK.textContent = t('nut_khop')
    if (!seqDangNhin) { hien('canlam', t('khop_chua_seq'), 'khop_tieude'); return }

    // 1. Đọc chi tiết toàn bộ clip trên sequence (kể cả khi bị dồn trên V0/A0)
    goiHost('pc_docChiTietClips()').then(function (rDoc) {
      if (rDoc.indexOf('OK:') !== 0) {
        hien('loi', rDoc)
        return
      }

      var lines = rDoc.split('\n')
      var dsClips = { video: [], audio: [] }
      for (var i = 1; i < lines.length; i++) {
        if (!lines[i]) continue
        var parts = lines[i].split('|')
        if (parts.length >= 9) {
          var item = {
            loai: parts[0],
            trackIdx: parseInt(parts[1], 10),
            clipIdx: parseInt(parts[2], 10),
            ten: parts[3],
            duong: parts[4],
            batDau: parseFloat(parts[5]),
            inPoint: parseFloat(parts[6]),
            ketThuc: parseFloat(parts[7])
          }
          if (item.loai === 'V') dsClips.video.push(item)
          else if (item.loai === 'A') dsClips.audio.push(item)
        }
      }

      var resXep = AiOKhop.phanNhomVaSapXepTrack(dsClips)
      var buocXep = Promise.resolve()

      if (resXep.lenhXepStr && (resXep.dsCamKeys.length > 1 || resXep.dsMicKeys.length > 1)) {
        buocXep = goiHost('pc_sapXepClipsLenTrack("' + chuoiJsx(seqDangNhin) + '","' + chuoiJsx(resXep.lenhXepStr) + '")')
      }

      buocXep.then(function (rXep) {
        // ☠️ PHAI DOC KET QUA. Ban truoc 05/08 bo qua gia tri tra ve, nen khi
        // host xep track that bai thi panel van chay tiep va bao "da khop N
        // nguoi" — bai hoc 5l: khong bao loi khong co nghia la da ghi.
        if (typeof rXep === 'string' && rXep.indexOf('OK:') !== 0) {
          // cauLoiHost đã dịch sẵn THIEU_ITEM / THIEU_TRACK / SEQ_DOI… ra câu
          // nói người dùng LÀM GÌ tiếp; mã lạ mới rơi về khuôn "xếp lỗi".
          var cau = cauLoiHost(rXep)
          hien('loi', cau === t('dung_loi') + rXep ? tp('khop_xep_loi', { loi: rXep }) : cau, 'khop_tieude')
          return
        }
        // Xep xong ma con clip khong dat lai duoc thi noi thang, dung im lang.
        if (typeof rXep === 'string') {
          var mLoi = /soLoi=(\d+)/.exec(rXep)
          if (mLoi && parseInt(mLoi[1], 10) > 0) {
            var mDau = /loiDau=([^|]*)/.exec(rXep)
            hien('loi', tp('khop_xep_loi', { loi: mLoi[1] + ' clip: ' + ((mDau && mDau[1]) || '?') }), 'khop_tieude')
            return
          }
        }
        docThongTinSeq()
        setTimeout(function () {
          var cams = tuiKhop(trackV)
          var tiengs = tuiKhop(trackA)
          var kq = AiOKhop.khopBanDo(cams, tiengs)
          var soMicRieng = tiengs.length - kq.tiengCam.length
          if (cams.length < 2 || soMicRieng < 2) {
            if (daThuPhucHoi) {
              // Đã tự nạp mic một lần mà vẫn thiếu — dừng, nói thật, không lặp.
              hien('canlam', tp('khop_it_track', { nCam: cams.length, nMic: soMicRieng }), 'khop_tieude')
              capNhatNutSync()
              return
            }
            tuTimVaSyncMicProject(function (okPhucHoi) {
              if (okPhucHoi) {
                // Đã tự động nạp mic rời từ Project Bin -> chạy lại ĐÚNG MỘT LẦN
                tuKhop(true)
              } else {
                hien('canlam', tp('khop_it_track', { nCam: cams.length, nMic: soMicRieng }), 'khop_tieude')
                capNhatNutSync()
              }
            })
            return
          }
          if (!kq.cap.length) {
            hien('canlam', tp('khop_khong_ra', { nCam: cams.length, nMic: soMicRieng }), 'khop_tieude')
            capNhatNutSync()
            return
          }

          apKhop(kq)
          ve()

          nutK.dataset.state = 'done'
          nutK.textContent = tp('khop_xong', { n: kq.cap.length })
          clearTimeout(nutK._hen)
          nutK._hen = setTimeout(function () {
            delete nutK.dataset.state
            nutK.textContent = t('nut_khop')
          }, 6000)

          var canhBao = []
          var doan = kq.cap.filter(function (c) { return c.nguon === 'thu-tu' })
          if (doan.length === kq.cap.length) canhBao.push(t('khop_doan_het'))
          else if (doan.length) {
            canhBao.push(tp('khop_doan_vai', {
              ds: doan.map(function (c) { return nhan(c.camK) + '+' + nhan(c.micK) }).join(', '),
            }))
          }
          if (kq.camThua.length) canhBao.push(tp('khop_them_camthua', { ds: kq.camThua.map(nhan).join(', ') }))
          if (kq.micThua.length) canhBao.push(tp('khop_them_micthua', { ds: kq.micThua.map(nhan).join(', ') }))
          if (canhBao.length) hien('canlam', canhBao.join('\n'), 'khop_tieude_ngo')
          capNhatNutSync()
        }, 100)
      })
    })
  }

  /** 'V2' → 'V3' (người dùng đếm từ 1). */
  function nhan(k) { return k.charAt(0) + (parseInt(k.slice(1), 10) + 1) }

  // Nút tự sync CHỈ hiện khi thật sự cần — hai tình huống ĐO ĐƯỢC:
  //   (1) sequence chưa đủ 2 mic riêng (mic còn nằm ngoài, chưa kéo vào), hoặc
  //   (2) mic đang dán đúng đầu clip cam — dấu hiệu chưa sync bằng đo.
  // Không bày sẵn nút cho tình huống chưa xảy ra (một thông điệp, một nơi).
  function capNhatNutSync() {
    var cams = tuiKhop(trackV)
    var tiengs = tuiKhop(trackA)
    var soMicRieng = cams.length
      ? tiengs.length - AiOKhop.khopBanDo(cams, tiengs).tiengCam.length
      : tiengs.length
    var dinhDau = document.getElementById('canhbaoGan').style.display !== 'none'
    document.getElementById('nutSync').hidden = !((cams.length >= 2 && soMicRieng < 2) || dinhDau)
  }

  // ═══ TIẾN ĐỘ TRÊN NÚT CHÍNH ═════════════════════════════════════════════
  function tienDo(chu, pt) {
    document.getElementById('goLabel').textContent = chu
    if (pt !== undefined) document.getElementById('prog').style.width = Math.max(0, Math.min(100, pt)) + '%'
  }
  function apNgonNguNut() {
    var nut = document.getElementById('nutDung')
    if (!dangChay && !nut.dataset.state) tienDo(t('nut_dung'), 0)
    if (!dangSync) document.getElementById('nutSync').textContent = t('nut_sync')
    var nutK = document.getElementById('nutKhop')
    if (!nutK.dataset.state) nutK.textContent = t('nut_khop')
  }

  // ═══ DỰNG — tách WAV → não → cắt BẢN SAO theo lô (engine đã kiểm chứng) ══
  var LO = 20

  function dungBan() {
    if (dangChay || dangSync) return
    var nut = document.getElementById('nutDung')
    delete nut.dataset.state
    var kt = kiem()
    hien('canlam', ''); hien('loi', '')
    if (!kt.ok) { hien('canlam', kt.loi, 'canlam_tieude_gan'); return }

    var fs = napNode('fs')
    var os = napNode('os')
    var cp = napNode('child_process')
    if (!fs || !os || !cp) { hien('loi', t('thieu_node')); return }
    var ffmpeg = timFfmpeg(fs)
    if (!ffmpeg) { hien('canlam', t('thieu_ffmpeg'), 'canlam_tieude_gan'); return }

    var caiDat = docCaiDat()
    dangChay = true
    nut.disabled = true
    nut.dataset.state = 'run'
    var tenSeqGoc = seqDangNhin

    var clipWide = trackWide >= 0 ? timTrack(trackV, trackWide) : null
    var cacClip = []
    nguoiDs.forEach(function (ng) {
      cacClip.push(timTrack(trackV, ng.cam))
      cacClip.push(timTrack(trackA, ng.mic))
    })
    if (clipWide) cacClip.push(clipWide)
    var tu0 = Math.max.apply(null, cacClip.map(function (c) { return c.batDau }))
    var den0 = Math.min.apply(null, cacClip.map(function (c) { return c.ketThuc }))
    var daiGiay = den0 - tu0

    function thoat(loiText, canLamText) {
      dangChay = false
      delete nut.dataset.state
      nut.disabled = false
      tienDo(t('nut_dung'), 0)
      if (loiText) hien('loi', loiText)
      if (canLamText) hien('canlam', canLamText)
    }

    // ── 1. Tách WAV 16k mono từng mic (tuần tự, cache theo mtime) ──
    var tmpDir = os.tmpdir().replace(/\\/g, '/') + '/aio-podcast'
    try { if (!fs.existsSync(tmpDir)) fs.mkdirSync(tmpDir) } catch (e) {}
    var viecMic = nguoiDs.map(function (ng) { return timTrack(trackA, ng.mic) })
    // ☠️ Tên WAV tạm theo ĐƯỜNG DẪN NGUỒN — đổi bước gán mà tên vẫn "mic0"
    // là tái dụng nhầm tiếng của track cũ.
    var wavMic = viecMic.map(function (c) {
      return tmpDir + '/m-' + bamTenSync(String(c.duong).toLowerCase()) + '.wav'
    })
    // ☠️ Bản MONO chất lượng gốc để ĐẶT LÊN TIMELINE — mp3 stereo đặt thẳng
    // là Premiere xé 2 kênh ra 2 track (đo 04/08). Nằm CẠNH file gốc, không
    // nằm %TEMP% (dọn %TEMP% là project offline).
    var monoMic = viecMic.map(function (c) { return duongMonoCua(c.duong) })

    function tachMot(i, xong) {
      if (i >= viecMic.length) { xong(null); return }
      tienDo(tp('dang_tach', { i: i + 1, n: viecMic.length }), 4 + 12 * i / viecMic.length)
      var nguon = viecMic[i].duong
      var ra = wavMic[i]
      var canChay = true
      try {
        if (fs.existsSync(ra) && fs.statSync(ra).mtimeMs > fs.statSync(nguon).mtimeMs) canChay = false
      } catch (e) {}
      if (!canChay) { tachMot(i + 1, xong); return }
      // Trần CPU dùng chung cả bộ (design-system/tai-nguyen.js). FFmpeg không
      // tự bung hết máy — ghim TRẦN rộng còn nhanh hơn ghim chặt (đo 04/08).
      var nsCpu = AiOTaiNguyen.chiaLuong(1)
      var kAudioOpt = (caiDat.kenhAudio && caiDat.kenhAudio[i] === 'R') ? ['-af', 'pan=mono|c0=c1'] :
                      (caiDat.kenhAudio && caiDat.kenhAudio[i] === 'L') ? ['-af', 'pan=mono|c0=c0'] :
                      (i === 1) ? ['-af', 'pan=mono|c0=c1'] : ['-af', 'pan=mono|c0=c0']
      cp.execFile(ffmpeg,
        ['-y', '-threads', String(nsCpu.luongMoi), '-i', nguon, '-vn'].concat(kAudioOpt).concat(['-ar', '16000', '-c:a', 'pcm_s16le', ra]),
        { windowsHide: true, maxBuffer: AiOTaiNguyen.tranDemLog() },
        function (err, so, se) {
          if (err) { xong(t('tach_loi') + String(se || err).slice(-300)); return }
          tachMot(i + 1, xong)
        })
    }
    function tachMono(i, xong) {

      var nguon = viecMic[i].duong

      var canChay = true
