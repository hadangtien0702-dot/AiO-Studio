<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>AiO Auto Podcast</title>
<link rel="stylesheet" href="./tokens.css" />
<style>
  /* v0.3 — làm lại UI theo yêu cầu anh Tiến 01/08: "chưa đẹp và trực quan".
     Ba đổi lớn: (1) bước GÁN thành BẢN ĐỒ TRACK như mini-timeline Premiere
     (gán theo track — đúng tư duy "track nào là cam ai"), (2) mỗi người một
     màu chạy xuyên suốt chip → track → minh hoạ → kết quả, (3) kết quả có
     thanh "ai nói bao nhiêu". Luật Studio Console giữ nguyên: tối, hairline,
     cam chỉ cho CTA/focus, MỘT nút chính, không viết hoa trên nút. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg-2);
    color: var(--text-1);
    font-family: var(--font-ui);
    font-size: var(--fs-md);
    line-height: var(--lh);
    user-select: none;
  }
  .topbar {
    height: var(--h-topbar);
    background: var(--bg-1);
    border-bottom: 1px solid var(--line-1);
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 0 var(--sp-5);
  }
  .topbar__ten { font-weight: var(--fw-semibold); }
  .topbar__ver { color: var(--text-3); font-size: var(--fs-xs); }
  .topbar__host { margin-left: auto; color: var(--text-3); font-size: var(--fs-xs); }
  .lang {
    height: var(--h-ctrl-sm);
    padding: 0 var(--sp-3);
    border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    background: none; color: var(--text-2);
    font-family: var(--font-ui); font-size: var(--fs-2xs); font-weight: var(--fw-semibold);
    letter-spacing: 0.06em;
    cursor: pointer; transition: all var(--dur) var(--ease);
  }
  .lang:hover { background: var(--bg-hover); color: var(--text-1); }

  .than {
    max-width: 640px; margin: 0 auto;
    padding: var(--sp-5);
    display: flex; flex-direction: column; gap: var(--sp-6);
  }
  .muc { display: flex; flex-direction: column; gap: var(--sp-3); }
  .muc__nhan {
    font-size: var(--fs-2xs); font-weight: var(--fw-semibold);
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3);
  }

  /* ── Hướng dẫn lần đầu ── */
  .hd {
    background: var(--bg-3); border: 1px solid var(--accent-line);
    border-radius: var(--r-lg); padding: var(--sp-4);
    display: flex; flex-direction: column; gap: var(--sp-3);
  }
  .hd__buoc { display: flex; align-items: baseline; gap: var(--sp-3); font-size: var(--fs-sm); color: var(--text-2); }
  .hd__so {
    flex: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-text);
    font-size: var(--fs-2xs); font-weight: var(--fw-bold);
    display: inline-flex; align-items: center; justify-content: center;
    transform: translateY(2px);
  }
  .hd__ok { align-self: flex-end; }

  /* ── Minh hoạ: hai cam + dải lượt nói theo MÀU NGƯỜI, quét 1 lần ── */
  .mh { display: flex; flex-direction: column; gap: var(--sp-3); cursor: pointer; }
  .mh__cams { display: flex; gap: var(--sp-3); }
  .mh__cam {
    flex: 1; aspect-ratio: 16/9; position: relative;
    background: var(--bg-0);
    border: 2px solid var(--line-1); border-radius: var(--r-md);
    transition: border-color 120ms linear, box-shadow 120ms linear;
    overflow: hidden;
  }
  .mh__nguoi { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
  .mh__dau { border-radius: 50%; background: var(--text-3); margin: 0 auto; width: 15px; height: 15px; }
  .mh__minh { border-radius: 8px 8px 0 0; background: var(--text-3); opacity: 0.7; width: 25px; height: 17px; margin-top: 3px; }
  .mh__tag {
    position: absolute; top: 5px; left: 6px;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: var(--fs-2xs); color: var(--text-2);
  }
  .cham { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .mh__dai {
    position: relative; height: 16px;
    border-radius: var(--r-sm); overflow: hidden; display: flex;
    background: var(--bg-0);
  }
  .mh__doan { height: 100%; opacity: 0.55; }
  .mh__kim {
    position: absolute; top: 0; bottom: 0; left: 0; width: 2px;
    background: var(--text-1);
  }
  .mh__chu { color: var(--text-2); font-size: var(--fs-sm); }
  .mh__chu b { color: var(--text-1); }

  .den {
    display: flex; align-items: center; gap: var(--sp-3);
    font-size: var(--fs-sm); color: var(--text-2);
  }
  .den__cham {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-3); flex: none;
    transition: background var(--dur) var(--ease);
  }
  .den--ok .den__cham { background: var(--ok); }
  .den--cho .den__cham { background: var(--warn); }
  /* Ô chọn sequence làm việc — anh Tiến 04/08: mở nhiều sequence thì panel
     tự bám activeSequence làm việc SAI CHỖ; người dùng phải được CHỌN. */
  .den__chon {
    flex: 1; min-width: 0; max-width: 320px;
    height: var(--h-ctrl);
    padding: 0 var(--sp-2);
    background: var(--bg-4); color: var(--text-1);
    border: 1px solid var(--line-2); border-radius: var(--r-sm);
    font-family: var(--font-ui); font-size: var(--fs-sm);
    text-overflow: ellipsis;
  }
  .den__chon:disabled { opacity: 0.5; }

  /* ── Chip người ── */
  .nguoi-ds { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .chip {
    height: var(--h-ctrl-sm);
    display: inline-flex; align-items: center; gap: var(--sp-2);
    padding: 0 var(--sp-3);
    background: var(--bg-3); border: 1px solid var(--line-1);
    border-radius: 999px;
    font-size: var(--fs-sm); color: var(--text-1);
  }
  .chip__xoa {
    border: none; background: none; color: var(--text-3);
    font-family: var(--font-ui); font-size: var(--fs-sm);
    cursor: pointer; padding: 0 2px; line-height: 1;
  }
  .chip__xoa:hover { color: var(--danger); }
  .chip--them {
    background: none; border: 1px dashed var(--line-strong);
    color: var(--text-2); cursor: pointer;
    font-family: var(--font-ui);
    transition: all var(--dur) var(--ease);
  }
  .chip--them:hover { background: var(--bg-hover); color: var(--text-1); }

  /* ── Bản đồ track — mini timeline ── */
  .bando {
    background: var(--bg-3); border: 1px solid var(--line-1);
    border-radius: var(--r-lg); overflow: hidden;
  }
  .bando__nhom {
    padding: var(--sp-2) var(--sp-4);
    background: var(--bg-1);
    font-size: var(--fs-2xs); color: var(--text-3);
    font-weight: var(--fw-semibold); letter-spacing: 0.08em; text-transform: uppercase;
  }
  .bando__nhom + .hang { border-top: none; }
  .hang {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-2) var(--sp-4);
    border-top: 1px solid var(--line-1);
    border-left: 2px solid transparent;
  }
  .hang__track {
    flex: none; width: 26px;
    font-size: var(--fs-xs); font-weight: var(--fw-semibold);
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .hang__clip {
    flex: 1; min-width: 0;
    font-size: var(--fs-sm); color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hang__clip i { font-style: normal; color: var(--warn); }
  .hang__chon {
    flex: none; width: 118px;
    height: var(--h-ctrl);
    padding: 0 var(--sp-2);
    background: var(--bg-4); color: var(--text-1);
    border: 1px solid var(--line-2); border-radius: var(--r-sm);
    font-family: var(--font-ui); font-size: var(--fs-sm);
  }
  .bando__trong {
    padding: var(--sp-4);
    color: var(--text-3); font-size: var(--fs-sm);
  }

  .btn-phu {
    height: var(--h-ctrl);
    padding: 0 var(--sp-4);
    border: 1px solid var(--line-strong); border-radius: var(--r-md);
    background: none; color: var(--text-2);
    font-family: var(--font-ui); font-size: var(--fs-md);
    cursor: pointer; transition: all var(--dur) var(--ease);
  }
  .btn-phu:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-1); }
  .btn-phu:disabled { opacity: 0.5; cursor: default; }

  .btn-chinh {
    height: var(--h-ctrl-lg);
    border: none; border-radius: var(--r-md);
    background: var(--accent); color: var(--accent-on);
    font-family: var(--font-ui); font-size: var(--fs-md); font-weight: var(--fw-semibold);
    cursor: pointer; transition: background var(--dur) var(--ease);
    width: 100%;
  }
  .btn-chinh:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-chinh:disabled { opacity: 0.55; cursor: default; }

  .canlam { color: var(--text-2); font-size: var(--fs-sm); white-space: pre-wrap; }
  .loi { color: var(--danger); font-size: var(--fs-sm); white-space: pre-wrap; user-select: text; }

  /* ── Kết quả ── */
  .ketqua {
    background: var(--bg-3); border: 1px solid var(--line-1);
    border-radius: var(--r-lg); padding: var(--sp-4);
    display: none; flex-direction: column; gap: var(--sp-4);
  }
  .ketqua--hien { display: flex; }
  .ketqua__so { display: flex; gap: var(--sp-3); }
  .ketqua__so > div {
    flex: 1; background: var(--bg-4); border-radius: var(--r-md);
    padding: var(--sp-3); text-align: center;
  }
  .ketqua__so b {
    display: block; font-size: var(--fs-xl);
    font-family: var(--font-display); letter-spacing: var(--ls-display);
  }
  .ketqua__so span { color: var(--text-3); font-size: var(--fs-2xs); }
  .chia { display: flex; flex-direction: column; gap: var(--sp-2); }
  .chia__nhan { font-size: var(--fs-2xs); color: var(--text-3); font-weight: var(--fw-semibold); letter-spacing: 0.08em; text-transform: uppercase; }
  .chia__thanh {
    display: flex; height: 12px;
    border-radius: var(--r-sm); overflow: hidden;
    background: var(--bg-0);
  }
  .chia__phan { height: 100%; }
  .chia__giai { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); }
  .chia__muc {
    display: inline-flex; align-items: center; gap: var(--sp-2);
    font-size: var(--fs-sm); color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .ketqua__dong { color: var(--text-2); font-size: var(--fs-sm); user-select: text; }
  .ketqua__dong b { color: var(--text-1); }
</style>
</head>

    <span class="topbar__ten">Auto Podcast</span>
    <span class="topbar__ver">v0.3.2</span>
    <span class="topbar__host" id="host"></span>
    <button class="lang" id="lang" onclick="doiNgonNgu()"></button>
  </div>

  <div class="than">
    <div class="hd" id="hd" style="display:none">
      <div class="hd__buoc"><span class="hd__so">1</span><span id="hd1"></span></div>
      <div class="hd__buoc"><span class="hd__so">2</span><span id="hd2"></span></div>
      <div class="hd__buoc"><span class="hd__so">3</span><span id="hd3"></span></div>
      <button class="btn-phu hd__ok" id="hdOk" onclick="dongHuongDan()"></button>
    </div>

    <div class="mh" id="mh" title="">
      <div class="mh__cams">
        <div class="mh__cam" id="mhCamA">
          <span class="mh__tag"><span class="cham" id="mhChamA"></span>CAM A</span>

    <div class="muc">

      <div class="bando" id="bando"></div>
    </div>

    <div class="muc">
      <span class="muc__nhan" id="nhanDung"></span>
      <button class="btn-chinh" id="nutDung" onclick="dungBan()"></button>
      <p class="canlam" id="canlam" style="display:none"></p>
      <pre class="loi" id="loi" style="display:none"></pre>
    </div>

    <div class="ketqua" id="ketqua">
      <div class="ketqua__so">
        <div><b id="kqLuot">0</b><span id="nhanLuot"></span></div>
        <div><b id="kqDai">—</b><span id="nhanDai"></span></div>

      <div class="chia">
        <span class="chia__nhan" id="nhanChia"></span>
        <div class="chia__thanh" id="chiaThanh"></div>
        <div class="chia__giai" id="chiaGiai"></div>
      </div>
      <p class="ketqua__dong" id="kqDong"></p>
    </div>
  </div>

<script src="./CSInterface.js"></script>

  // ═══ Node helpers ════════════════════════════════════════════════════════
  function napNode(mod) {
    try { if (window.cep_node && window.cep_node.require) return window.cep_node.require(mod) } catch (e) {}

  function timFfmpeg(fs) {
    var goc = cs.getSystemPath(SystemPath.EXTENSION).replace(/\\/g, '/')
    var ung = ['com.aiostudio.transcript', 'com.aiostudio.autocut']
    for (var i = 0; i < ung.length; i++) {
      var p = goc.replace(/com\.aiostudio\.[a-z]+$/, ung[i]) + '/bin/win64/ffmpeg.exe'
      try { if (fs.existsSync(p)) return p } catch (e) {}
    }
    return null
  }
  function napLaiHost(xong) {
    var ext = cs.getSystemPath(SystemPath.EXTENSION).replace(/\\/g, '/')
    var lenh = 'var __n="OK"; try { $.evalFile("' + ext + '/host/index.jsx") } catch(e) { __n="ERR:"+e } __n'
    cs.evalScript(lenh, function (kq) { xong(String(kq).indexOf('OK') === 0) })
  }

    raw.slice(3).split('|').forEach(function (d) {

  // ═══ Bước GÁN — bản đồ track (gán theo TRACK, đúng tư duy Premiere) ══════
  var trackV = [] // {i, ten, soClip, tenClip, duong, batDau, inPoint, ketThuc}
  var trackA = []
  var nguoiDs = [ { cam: -1, mic: -1 }, { cam: -1, mic: -1 } ]
  // CAM CHUNG — anh Tiến 04/08: quay thật có cam toàn cảnh 2 người, phải có
  // chỗ gán. -1 = không có; ngược lại là chỉ số track V. Không thuộc về ai.
  var trackWide = -1
  var seqDangNhin = ''
  var dangChay = false

  // Nhớ bước gán THEO TỪNG SEQUENCE — dựng xong panel nhìn sang bản dựng,
  // quay lại sequence nguồn thì lựa chọn cũ phải còn nguyên.
  var ganTheoSeq = {}
  try { ganTheoSeq = JSON.parse(localStorage.getItem('aio-pc-gan') || '{}') } catch (e) {}
  function luuGan() {
    if (!seqDangNhin) return
    // Dạng mới {ds, wide}; bản cũ lưu thẳng mảng — đọc phải chịu được cả hai.
    ganTheoSeq[seqDangNhin] = { ds: JSON.parse(JSON.stringify(nguoiDs)), wide: trackWide }
    try { localStorage.setItem('aio-pc-gan', JSON.stringify(ganTheoSeq)) } catch (e) {}
  }

  function docThongTinSeq() {
    napLaiHost(function (ok) {
      if (!ok) return
      goiHost('pc_thongTinSeq()').then(function (raw) {
        if (raw.indexOf('OK:') !== 0) { trackV = []; trackA = []; veGan(); return }
        trackV = []; trackA = []
        raw.slice(3).split('\n').forEach(function (dong) {
          var p = dong.split('|')
          if (p.length < 9 || (p[0] !== 'V' && p[0] !== 'A')) return
          var tr = {
            i: parseInt(p[1], 10), ten: p[2], soClip: parseInt(p[3], 10),
            tenClip: p[4], duong: p[5],
            batDau: parseFloat(p[6]), inPoint: parseFloat(p[7]), ketThuc: parseFloat(p[8]),
          }
          if (p[0] === 'V') trackV.push(tr); else trackA.push(tr)
        })
        var nho = ganTheoSeq[seqDangNhin]
        trackWide = -1
        if (nho) {
          if (Array.isArray(nho)) {
            // Bản lưu cũ (trước 04/08): mảng người, chưa có wide.
            if (nho.length >= 2) nguoiDs = JSON.parse(JSON.stringify(nho))
          } else {
            if (nho.ds && nho.ds.length >= 2) nguoiDs = JSON.parse(JSON.stringify(nho.ds))
            if (typeof nho.wide === 'number') trackWide = nho.wide
          }
        }
        veGan()
      })
    })
  }

  function tenNguoi(i) { return tp('nguoi', { i: i + 1 }) }
  function timTrack(ds, i) {
    for (var k = 0; k < ds.length; k++) if (ds[k].i === i) return ds[k]
    return null
  }
  /** Người nào đang giữ track này? (loai: 'cam'|'mic') */
  function nguoiCuaTrack(loai, i) {
    for (var n = 0; n < nguoiDs.length; n++) if (nguoiDs[n][loai] === i) return n
    return -1
  }
  /**
   * Gán track cho người — độc quyền: track một chủ, người một track mỗi loại.
   * Giá trị -2 (chỉ track HÌNH) = CAM CHUNG: không thuộc về ai, chỉ một track
   * được làm cam chung.
   */
  function ganTrack(loai, trackIdx, nguoiIdx) {
    if (loai === 'cam' && nguoiIdx === -2) {
      for (var n0 = 0; n0 < nguoiDs.length; n0++) {
        if (nguoiDs[n0].cam === trackIdx) nguoiDs[n0].cam = -1
      }
      trackWide = trackIdx
      luuGan()
      veGan()
      return
    }
    if (loai === 'cam' && trackWide === trackIdx) trackWide = -1
    for (var n = 0; n < nguoiDs.length; n++) {
      if (nguoiDs[n][loai] === trackIdx) nguoiDs[n][loai] = -1
    }
    if (nguoiIdx >= 0) nguoiDs[nguoiIdx][loai] = trackIdx
    luuGan()
    veGan()
  }

  function veGan() {
    // ── Chip người ──
    var chips = document.getElementById('dsChip')
    chips.innerHTML = ''
    nguoiDs.forEach(function (ng, i) {
      var c = document.createElement('span')
      c.className = 'chip'
      var cham = document.createElement('span')
      cham.className = 'cham'
      cham.style.background = MAU_NGUOI[i % MAU_NGUOI.length]
      c.appendChild(cham)
      c.appendChild(document.createTextNode(tenNguoi(i)))
      if (nguoiDs.length > 2) {
        var x = document.createElement('button')
        x.className = 'chip__xoa'
        x.textContent = '×'
        x.setAttribute('aria-label', t('xoa_nguoi'))
        x.onclick = function () { nguoiDs.splice(i, 1); luuGan(); veGan() }
        c.appendChild(x)
      }
      chips.appendChild(c)
    })
    var soToiDa = Math.min(trackV.length || 9, trackA.length || 9, 6)
    if (nguoiDs.length < soToiDa) {
      var them = document.createElement('button')
      them.className = 'chip chip--them'
      them.textContent = t('them_nguoi')
      them.onclick = function () { nguoiDs.push({ cam: -1, mic: -1 }); luuGan(); veGan() }
      chips.appendChild(them)
    }

    // ── Bản đồ track: hình xếp NGƯỢC chỉ số (V2 trên V1 — như Premiere),
    //    tiếng xếp xuôi (A1 trên A2). Chỉ hiện track có clip. ──
    var bando = document.getElementById('bando')
    bando.innerHTML = ''
    var coV = trackV.filter(function (tr) { return tr.soClip > 0 })
    var coA = trackA.filter(function (tr) { return tr.soClip > 0 })
    if (!coV.length && !coA.length) {
      var trong = document.createElement('div')
      trong.className = 'bando__trong'
      trong.textContent = t('khong_track')
      bando.appendChild(trong)
      return
    }
    function veNhom(nhanKey, ds, loai, tienTo, nguocLai) {
      if (!ds.length) return
      var nhan = document.createElement('div')
      nhan.className = 'bando__nhom'
      nhan.textContent = t(nhanKey)
      bando.appendChild(nhan)
      var sx = ds.slice()
      if (nguocLai) sx.reverse()
      sx.forEach(function (tr) {
        var hang = document.createElement('div')
        hang.className = 'hang'
        var chu = nguoiCuaTrack(loai, tr.i)
        var laWide = (loai === 'cam' && tr.i === trackWide)
        hang.style.borderLeftColor = laWide ? 'var(--text-3)'
          : (chu >= 0 ? MAU_NGUOI[chu % MAU_NGUOI.length] : 'transparent')
        var nh = document.createElement('span')
        nh.className = 'hang__track'
        nh.textContent = tienTo + (tr.i + 1)
        hang.appendChild(nh)
        var clip = document.createElement('span')
        clip.className = 'hang__clip'
        clip.textContent = tr.tenClip || tr.ten
        clip.title = tr.tenClip || tr.ten
        if (tr.soClip > 1) {
          clip.appendChild(document.createTextNode(' '))
          var canh = document.createElement('i')
          canh.textContent = '(' + tp('nhieu_clip', { n: tr.soClip }) + ')'
          clip.appendChild(canh)
        }
        hang.appendChild(clip)
        var sel = document.createElement('select')
        sel.className = 'hang__chon'
        sel.setAttribute('aria-label', tienTo + (tr.i + 1))
        var o0 = document.createElement('option')
        o0.value = '-1'
        o0.textContent = t('khong_ai')
        sel.appendChild(o0)
        nguoiDs.forEach(function (ng, ni) {
          var o = document.createElement('option')
          o.value = String(ni)
          o.textContent = tenNguoi(ni)
          sel.appendChild(o)
        })
        if (loai === 'cam') {
          // CAM CHUNG — chỉ track hình mới có lựa chọn này.
          var oW = document.createElement('option')
          oW.value = '-2'
          oW.textContent = t('cam_chung')
          sel.appendChild(oW)
        }
        sel.value = laWide ? '-2' : String(chu)
        sel.onchange = function () { ganTrack(loai, tr.i, parseInt(sel.value, 10)) }
        hang.appendChild(sel)
        bando.appendChild(hang)
      })
    }
    veNhom('nhom_hinh', coV, 'cam', 'V', true)
    veNhom('nhom_tieng', coA, 'mic', 'A', false)
  }

  /** Soát bước gán — trả chuỗi lỗi hoặc '' nếu ổn. */
  function soatGan() {
    var daDung = {}
    for (var i = 0; i < nguoiDs.length; i++) {
      var ng = nguoiDs[i]
      if (ng.cam < 0 || ng.mic < 0) return t('thieu_gan')
      var kV = 'V' + ng.cam, kA = 'A' + ng.mic
      if (daDung[kV]) return tp('trung_track', { a: daDung[kV], b: tenNguoi(i) })
      if (daDung[kA]) return tp('trung_track', { a: daDung[kA], b: tenNguoi(i) })
      daDung[kV] = tenNguoi(i); daDung[kA] = tenNguoi(i)
      var tV = timTrack(trackV, ng.cam), tA = timTrack(trackA, ng.mic)
      if (!tV || !tA) return t('thieu_gan')
      if (tV.soClip !== 1) return tp('track_nhieu_clip', { track: 'V' + (ng.cam + 1), n: tV.soClip })
      if (tA.soClip !== 1) return tp('track_nhieu_clip', { track: 'A' + (ng.mic + 1), n: tA.soClip })
    }
    // Cam chung: không cần mic, nhưng track phải còn tồn tại và 1 clip liền.
    if (trackWide >= 0) {
      var tW = timTrack(trackV, trackWide)
      if (!tW) { trackWide = -1 }
      else if (tW.soClip !== 1) {
        return tp('track_nhieu_clip', { track: 'V' + (trackWide + 1), n: tW.soClip })
      }
    }
    return ''
  }

  // ═══ DỰNG — tách WAV → não → cắt BẢN SAO timeline theo lô ═══════════════
  var LO = 20 // số đoạn mỗi evalScript — giữ Premiere còn thở, panel còn báo %

  function nutChu(chu) { document.getElementById('nutDung').textContent = chu }

  /** Phổ âm lượng mic — công thức nằm trong nao.js để bộ kiểm đo cùng một thứ. */
  function phoMic(db) { return AiONao.phoMic(db) }

  function dungBan() {
    if (dangChay) return
    var loiGan = soatGan()
    hien('canlam', ''); hien('loi', '')
    document.getElementById('ketqua').className = 'ketqua'
    if (loiGan) { hien('canlam', loiGan); return }

    var fs = napNode('fs')
    var os = napNode('os')
    var cp = napNode('child_process')
    if (!fs || !os || !cp) { hien('loi', t('thieu_node')); return }
    var ffmpeg = timFfmpeg(fs)
    if (!ffmpeg) { hien('canlam', t('thieu_ffmpeg')); return }

    dangChay = true
    document.getElementById('nutDung').disabled = true
    var tenSeqGoc = seqDangNhin

    // Vùng phủ = giao của mọi clip được gán (trục sequence gốc).
    // Cam chung (nếu có) cũng phải phủ đủ — đoạn wide lấy hình từ nó.
    var clipWide = trackWide >= 0 ? timTrack(trackV, trackWide) : null
    var cacClip = []
    nguoiDs.forEach(function (ng) {
      cacClip.push(timTrack(trackV, ng.cam))
      cacClip.push(timTrack(trackA, ng.mic))
    })
    if (clipWide) cacClip.push(clipWide)
    var tu0 = Math.max.apply(null, cacClip.map(function (c) { return c.batDau }))
    var den0 = Math.min.apply(null, cacClip.map(function (c) { return c.ketThuc }))
    var daiGiay = den0 - tu0

    function thoat(loiText, canLamText) {
      dangChay = false
      document.getElementById('nutDung').disabled = false
      nutChu(t('nut_dung'))
      if (loiText) hien('loi', loiText)
      if (canLamText) hien('canlam', canLamText)
    }

    // ── 1. Tách WAV 16k mono từng mic (tuần tự, người dùng đang đợi) ──
    var tmpDir = os.tmpdir().replace(/\\/g, '/') + '/aio-podcast'
    try { if (!fs.existsSync(tmpDir)) fs.mkdirSync(tmpDir) } catch (e) {}
    var viecMic = nguoiDs.map(function (ng) { return timTrack(trackA, ng.mic) })
    // ☠️ Ten WAV tam theo DUONG DAN NGUON, khong theo so thu tu — nguoi dung
    // doi buoc gan ma ten van "mic0" la tai dung nham tieng cua track cu.
    function bamTen(s) {
      var h = 5381
      for (var x = 0; x < s.length; x++) h = ((h << 5) + h + s.charCodeAt(x)) | 0
      return (h >>> 0).toString(36)
    }
    var wavMic = viecMic.map(function (c) {
      return tmpDir + '/m-' + bamTen(String(c.duong).toLowerCase()) + '.wav'
    })

    // ☠️ FILE TIENG MONO CHO VIEC DUNG — do that 04/08/2026.
    //
    // Mic cua nguoi dung thuong la mp3 STEREO (dual-mono: L va R giong het
    // nhau, do duoc ca hai deu -50,6 dB). Dat clip stereo len track audio
    // thi Premiere TACH 2 KENH ra 2 TRACK lien tiep -> Mic-Trong an A1+A2,
    // Mic-Dilys an A2+A3, A2 chua ca hai nguoi va Premiere de them A4.
    // Anh Tien thay tren timeline: cac clip dan nhan "L" va "R" roi rac.
    //
    // Thu nghiem tren sequence rieng:
    //     mp3 STEREO vao A1 -> [1, 1]  <- tran sang A2
    //     WAV MONO  vao A2  -> [1, 2]  <- nam gon 1 track
    //
    // API doi kieu kenh (`getAudioChannelMapping`) KHONG co trong Premiere
    // Beta 26.5. Nen tach san file mono roi dat file do. Dung ban chat:
    // mic cai ao VON LA MONO, vo stereo chi la tieng nhan doi.
    //
    // De CANH FILE GOC chu khong trong %TEMP%: %TEMP% bi don thi project
    // cua nguoi dung mo lai se bao media offline. Cung quy uoc voi bo dem
    // nghe cua Autocut/Transcripts.
    function duongMono(nguon) {
      var d = String(nguon).replace(/\\/g, '/')
      return d.replace(/\.[^./]+$/, '') + '.aio-mono.wav'
    }
    var monoMic = viecMic.map(function (c) { return duongMono(c.duong) })

    function tachMot(i, xong) {
      if (i >= viecMic.length) { xong(null); return }
      nutChu(tp('dang_tach', { i: i + 1, n: viecMic.length }))
      var nguon = viecMic[i].duong
      var ra = wavMic[i]
      var canChay = true
      try {
        if (fs.existsSync(ra) && fs.statSync(ra).mtimeMs > fs.statSync(nguon).mtimeMs) canChay = false
      } catch (e) {}
      if (!canChay) { tachMot(i + 1, xong); return }
      // ── Ngân sách CPU dùng chung cả bộ (design-system/tai-nguyen.js) ──
      //    Tách WAV chạy TUẦN TỰ (mỗi lúc 1 tiến trình) nên cả trần rơi vào
      //    một tiến trình.
      //
      //    ☠️ ĐO THẬT 04/08 — đừng tin câu "không ghim thì FFmpeg bung hết
      //    máy", nó SAI. Encode 4K→720p bằng libopenh264 trên máy 32 luồng:
      //      không ghim  → 10,5 luồng (32,8%) · 5,2 giây
      //      ghim 22     → 16,0 luồng (50,0%) · 3,6 giây   ← NHANH HƠN 31%
      //      ghim 4      →  4,4 luồng (13,8%) · 9,0 giây
      //    FFmpeg tự chọn số luồng theo codec, thường THẤP hơn ta tưởng.
      //    `-threads` là cái TRẦN, không phải mức ép dùng — đặt trần rộng
      //    còn cho phép nó chạy nhanh hơn mà vẫn không vượt 70%.
      //    (Tách WAV từ mp3 nhẹ hơn nhiều: đo được 8,4% CPU, xong ~2 giây.)
      var nsCpu = AiOTaiNguyen.chiaLuong(1)
      cp.execFile(ffmpeg,
        ['-y', '-threads', String(nsCpu.luongMoi), '-i', nguon,
          '-vn', '-ac', '1', '-ar', '16000', '-c:a', 'pcm_s16le', ra],
        { windowsHide: true, maxBuffer: AiOTaiNguyen.tranDemLog() },
        function (err, so, se) {
          if (err) { xong(t('tach_loi') + String(se || err).slice(-300)); return }
          tachMot(i + 1, xong)
        })
    }

    /**
     * Tách bản MONO chất lượng gốc để ĐẶT LÊN TIMELINE (khác WAV 16 kHz ở
     * trên — bản đó chỉ để não nghe, quá thấp để làm tiếng thành phẩm).
     * Giữ nguyên sample rate của file gốc, chỉ trộn 2 kênh về 1.
     */
    function tachMono(i, xong) {
      if (i >= viecMic.length) { xong(null); return }
      nutChu(tp('dang_tach_mono', { i: i + 1, n: viecMic.length }))
      var nguon = viecMic[i].duong
      var ra = monoMic[i]
      var canChay = true
      try {
        if (fs.existsSync(ra) && fs.statSync(ra).mtimeMs > fs.statSync(nguon).mtimeMs) canChay = false
      } catch (e) {}
      if (!canChay) { tachMono(i + 1, xong); return }
      var ns2 = AiOTaiNguyen.chiaLuong(1)
      cp.execFile(ffmpeg,
        ['-y', '-threads', String(ns2.luongMoi), '-i', nguon,
          '-vn', '-ac', '1', '-c:a', 'pcm_s16le', ra],
        { windowsHide: true, maxBuffer: AiOTaiNguyen.tranDemLog() },
        function (err, so, se) {
          if (err) { xong(t('tach_loi') + String(se || err).slice(-300)); return }
          tachMono(i + 1, xong)
        })
    }

    tachMot(0, function (loiTach) {
      if (loiTach) { thoat(loiTach, null); return }
      tachMono(0, function (loiMono) {
      if (loiMono) { thoat(loiMono, null); return }

      // ── 2. Não nghe ──
      nutChu(t('dang_nghe'))
      setTimeout(function () { // nhả một nhịp cho nút kịp vẽ chữ
        var micDb = []
        for (var i = 0; i < viecMic.length; i++) {
          var buf
          try { buf = fs.readFileSync(wavMic[i]) } catch (e) { buf = null }
          var doc = buf ? AiONao.taiWav(buf) : null
          if (!doc) { thoat(tp('wav_hong', { ten: tenNguoi(i) }), null); return }
          micDb.push({
            db: AiONao.doDb(doc.pcm, doc.sr),
            offset: tu0 + viecMic[i].inPoint - viecMic[i].batDau,
          })
        }

        // ── Chốt an toàn 1: "mic" âm lượng đều suốt = tiếng cam / nhạc nền.
        //    Vấp thật 01/08: gán A1 (tiếng cam) làm mic → cả tập thành 1 lượt. ──
        for (var m = 0; m < micDb.length; m++) {
          var ph = phoMic(micDb[m].db)
          if (ph.p90 - ph.p10 < 6 && ph.p50 > -50) {
            thoat(null, tp('mic_deu', { ten: tenNguoi(m), track: 'A' + (viecMic[m].i + 1) }))
            return
          }
        }

        // CAM CHUNG: bật luật wide trong não khi có track được gán làm cam
        // chung — im quá 2 giây thì về toàn cảnh thay vì đoán giữ người trước.
        var kq = AiONao.aiDangNoi(micDb, daiGiay, clipWide ? { coWide: true } : {})
        if (kq.trangThai !== 'OK') {
          var ro = kq.thongKe ? Math.round(kq.thongKe.tyLeRo * 100) : 0
          thoat(null, tp('khong_phan_biet', { ro: ro }))
          return
        }
        // ── Chốt an toàn 2: cả tập một lượt = gần như chắc gán sai. ──
        if (kq.doan.length < 2) { thoat(null, t('mot_luot')); return }

        // ── 3. Cắt BẢN SAO theo lô — mỗi đoạn về ĐÚNG track gốc, ĐÚNG vị trí ──
        var doan = kq.doan
        var offCam = nguoiDs.map(function (ng) {
          var c = timTrack(trackV, ng.cam)
          return c.inPoint - c.batDau
        })
        var offMic = viecMic.map(function (c) { return c.inPoint - c.batDau })
        var duongCam = nguoiDs.map(function (ng) { return chuoiJsx(timTrack(trackV, ng.cam).duong) })
        var offWide = clipWide ? (clipWide.inPoint - clipWide.batDau) : 0
        var duongWide = clipWide ? chuoiJsx(clipWide.duong) : ''
        // ☠️ Tiếng lấy từ bản MONO, KHÔNG lấy file gốc — file gốc stereo thì
        //    Premiere xé 2 kênh ra 2 track (xem khối chú thích ở `duongMono`).
        var duongMic = monoMic.map(function (d) { return chuoiJsx(d) })
        var tenMoi = (tenSeqGoc || 'Podcast').replace(/[^\w\- ]/g, '').trim() || 'Podcast'
        tenMoi += ' - Podcast Cut'

        napLaiHost(function (ok) {
          if (!ok) { thoat(t('khong_nap_host'), null); return }
          nutChu(t('dang_nhan_ban'))
          // Chốt phiên bản: evalFile có thể nuốt file GIỮA CHỪNG không báo
          // lỗi (đo 01/08) — hàm cuối file trả lời đúng = cả file đã nạp.
          goiHost('(typeof pc_phienBan==="function")?pc_phienBan():"THIEU"').then(function (pb) {
          if (pb !== 'v0.3.1') { thoat(t('khong_nap_host') + ' [host=' + pb + ']', null); return }
          // Nhập bản mono vào project — host tìm projectItem theo đường dẫn,
          // chưa nhập thì `pc_datTieng` không thấy gì để đặt.
          goiHost('pc_nhapMono("' + duongMic.join(';') + '")').then(function (rN) {
          if (rN.indexOf('OK:') !== 0) { thoat(t('dung_loi') + rN, null); return }
          var kvN = tachKv(rN)
          if (parseInt(kvN.thay, 10) !== duongMic.length) {
            thoat(tp('mono_thieu', { thieu: kvN.thieu || '?' }), null); return
          }
          goiHost('pc_nhanBan("' + chuoiJsx(tenSeqGoc) + '","' + tenMoi + '")').then(function (raw) {
            if (raw.indexOf('OK:') !== 0) { thoat(t('dung_loi') + raw, null); return }
            var tenThat = tachKv(raw).seq
            if (!tenThat) { thoat(t('host_la') + '\n' + raw, null); return }

            var i = 0
            function loHinh() {
              if (i >= doan.length) { donTieng(); return }
              var cuoi = Math.min(i + LO, doan.length)
              nutChu(tp('dang_dung', { i: cuoi, n: doan.length }))
              var ds = []
              for (var k = i; k < cuoi; k++) {
                var d = doan[k]
                var segTu = tu0 + d.tu
                var segDen = tu0 + d.den
                // nguoi = -1 là CAM CHUNG — hình lấy từ track wide.
                var camIdx = d.nguoi >= 0 ? nguoiDs[d.nguoi].cam : trackWide
                var camDuong = d.nguoi >= 0 ? duongCam[d.nguoi] : duongWide
                var camOff = d.nguoi >= 0 ? offCam[d.nguoi] : offWide
                ds.push(camIdx + ',' + camDuong + ',' +
                  (segTu + camOff).toFixed(4) + ',' + (segDen + camOff).toFixed(4) + ',' +
                  segTu.toFixed(4))
              }
              i = cuoi
              goiHost('pc_datHinh("' + chuoiJsx(tenThat) + '","' + ds.join(';') + '")').then(function (r2) {
                if (r2.indexOf('OK:') !== 0 || r2.indexOf('soLoi=0') < 0) { thoat(t('dung_loi') + r2, null); return }
                loHinh()
              })
            }

            function donTieng() {
              nutChu(t('dang_thay_tieng'))
              goiHost('pc_donTieng("' + chuoiJsx(tenThat) + '")').then(function (r3) {
                if (r3.indexOf('OK:') !== 0) { thoat(t('dung_loi') + r3, null); return }
                var kv = tachKv(r3)
                if (kv.hinhTruoc !== kv.hinhSau || kv.tiengSau !== '0') {
                  thoat(tp('lech_do', { chiTiet: 'don tieng: ' + r3.slice(3) }), null)
                  return
                }
                loTieng()
              })
            }

            // TIẾNG — danh sách phẳng tính TRƯỚC rồi mới chia lô:
            //   đoạn của một người  → 1 mảnh (mic người đó, track của họ)
            //   đoạn CAM CHUNG      → mỗi mic MỘT mảnh (cả phòng cùng lên,
            //                         tiếng tự nhiên; ai track nấy như cũ)
            // Nhờ tính trước nên bước ĐO LẠI biết chính xác phải có bao nhiêu
            // clip tiếng — không lấy doan.length làm chuẩn nữa.
            var viecTieng = []
            doan.forEach(function (d) {
              var segTu = tu0 + d.tu
              var segDen = tu0 + d.den
              var dsNguoi = d.nguoi >= 0 ? [d.nguoi] : nguoiDs.map(function (_, p) { return p })
              dsNguoi.forEach(function (p) {
                viecTieng.push(nguoiDs[p].mic + ',' + duongMic[p] + ',' +
                  (segTu + offMic[p]).toFixed(4) + ',' + (segDen + offMic[p]).toFixed(4) + ',' +
                  segTu.toFixed(4))
              })
            })

            var j = 0
            function loTieng() {
              if (j >= viecTieng.length) { doLai(); return }
              var cuoi = Math.min(j + LO, viecTieng.length)
              var ds = viecTieng.slice(j, cuoi)
              j = cuoi
              goiHost('pc_datTieng("' + chuoiJsx(tenThat) + '","' + ds.join(';') + '")').then(function (r4) {
                if (r4.indexOf('OK:') !== 0 || r4.indexOf('soLoi=0') < 0) { thoat(t('dung_loi') + r4, null); return }
                loTieng()
              })
            }

            // ── 4. ĐO LẠI — không tin "không báo lỗi" ──
            function doLai() {
              goiHost('pc_doKetQua("' + chuoiJsx(tenThat) + '")').then(function (r5) {
                if (r5.indexOf('OK:') !== 0) { thoat(t('dung_loi') + r5, null); return }
                var kv = tachKv(r5)
                var lech = []
                if (parseInt(kv.tongHinh, 10) !== doan.length) lech.push('hinh ' + kv.tongHinh + '/' + doan.length)
                if (parseInt(kv.tongTieng, 10) !== viecTieng.length) lech.push('tieng ' + kv.tongTieng + '/' + viecTieng.length)
                if (Math.abs(parseFloat(kv.cuoiHinh) - den0) > 0.1) lech.push('cuoi ' + kv.cuoiHinh + '/' + den0.toFixed(3))
                dangChay = false
                document.getElementById('nutDung').disabled = false
                nutChu(t('nut_dung'))
                if (lech.length) { hien('loi', tp('lech_do', { chiTiet: lech.join(' · ') })) }
                veKetQua(kv.seq, doan, daiGiay)
              })
            }

            loHinh()
          })
          })
          })
        })
      }, 30)
    })
    })
  }

  // ═══ Kết quả — số + thanh "ai nói bao nhiêu" theo màu người ══════════════
  function giayDep(giay) {
    var ph = Math.floor(giay / 60)
    return ph + ':' + ('0' + Math.round(giay % 60)).slice(-2)
  }
  function veKetQua(tenSeq, doan, daiGiay) {
    document.getElementById('kqLuot').textContent = String(doan.length)
    document.getElementById('kqDai').textContent = giayDep(daiGiay)
    var luotNguoi = nguoiDs.map(function () { return 0 })
    var giayNguoi = nguoiDs.map(function () { return 0 })
    var luotWide = 0
    var giayWide = 0
    doan.forEach(function (d) {
      if (d.nguoi < 0) { luotWide++; giayWide += d.den - d.tu; return }
      luotNguoi[d.nguoi]++
      giayNguoi[d.nguoi] += d.den - d.tu
    })
    var thanh = document.getElementById('chiaThanh')
    var giai = document.getElementById('chiaGiai')
    thanh.innerHTML = ''
    giai.innerHTML = ''
    nguoiDs.forEach(function (ng, i) {
      var mau = MAU_NGUOI[i % MAU_NGUOI.length]
      var phan = document.createElement('div')
      phan.className = 'chia__phan'
      phan.style.width = (giayNguoi[i] / daiGiay * 100).toFixed(1) + '%'
      phan.style.background = mau
      phan.title = tenNguoi(i)
      thanh.appendChild(phan)
      var muc = document.createElement('span')
      muc.className = 'chia__muc'
      var cham = document.createElement('span')
      cham.className = 'cham'
      cham.style.background = mau
      muc.appendChild(cham)
      muc.appendChild(document.createTextNode(
        tp('chia_muc', { ten: tenNguoi(i), luot: luotNguoi[i], giay: giayDep(giayNguoi[i]) })))
      giai.appendChild(muc)
    })
    // Ngăn CAM CHUNG — xám, đứng cuối. Không vẽ khi 0 giây (không bày thừa).
    if (giayWide > 0.01) {
      var mauW = 'var(--text-3)'
      var phanW = document.createElement('div')
      phanW.className = 'chia__phan'
      phanW.style.width = (giayWide / daiGiay * 100).toFixed(1) + '%'
      phanW.style.background = mauW
      phanW.title = t('cam_chung')
      thanh.appendChild(phanW)
      var mucW = document.createElement('span')
      mucW.className = 'chia__muc'
      var chamW = document.createElement('span')
      chamW.className = 'cham'
      chamW.style.background = mauW
      mucW.appendChild(chamW)
      mucW.appendChild(document.createTextNode(
        tp('chia_muc', { ten: t('cam_chung'), luot: luotWide, giay: giayDep(giayWide) })))
      giai.appendChild(mucW)
    }
    document.getElementById('kqDong').innerHTML = tp('kq_dong', { ten: tenSeq })
    document.getElementById('ketqua').className = 'ketqua ketqua--hien'
  }

  // ═══ Đèn trạng thái — một cú đọc mỗi giây, tự lành ══════════════════════
  var dangSoi = false
  function soi() {
    if (dangChay || dangSoi) return
    dangSoi = true
    goiHost('pc_trangThai()').then(function (raw) {
      dangSoi = false
      var den = document.getElementById('den')
      var chu = document.getElementById('denChu')
      var host = document.getElementById('host')
      if (raw.indexOf('OK:') !== 0) {
        // Host chưa nạp pc_* — nạp rồi thử lại ở nhịp sau.
        napLaiHost(function () {})
        host.textContent = t('cho_premiere')
        den.className = 'den den--cho'
        chu.textContent = t('premiere_chua')
        return
      }
      var p = raw.slice(3).split('|')
      host.textContent = p[0] ? 'Premiere ' + p[0] + (p[1] ? ' · ' + p[1] : '') : t('cho_premiere')
      var tenSeq = p[2] || ''
      capNhatChonSeq((p[6] || '').split(';;').filter(function (x) { return x }), tenSeq)
      if (!tenSeq) {
        den.className = 'den den--cho'
        chu.textContent = t('chua_mo_seq')
        document.getElementById('nutDung').disabled = true
        seqDangNhin = ''
        return
      }
      den.className = 'den den--ok'
      chu.textContent = tp('dang_mo', { ten: tenSeq, v: p[4], a: p[5] })
      document.getElementById('nutDung').disabled = false
      if (tenSeq !== seqDangNhin) {
        seqDangNhin = tenSeq
        docThongTinSeq()
      }
    })
  }
  window.setInterval(soi, 1000)

  /**
   * Ô CHỌN sequence làm việc — anh Tiến 04/08: *"anh không được chọn đúng
   * sequence làm việc của mình"*. Trước đây panel tự bám activeSequence:
   * mở nhiều sequence là nó nhảy theo tab đang mở, người dùng không có
   * quyền chọn. Giờ danh sách lấy từ host mỗi nhịp soi, chọn là host đổi
   * activeSequence — mọi chốt an toàn sẵn có (SEQ_DOI…) giữ nguyên.
   */
  function capNhatChonSeq(ds, tenDangMo) {
    var sel = document.getElementById('chonSeq')
    // Đang mở dropdown thì đừng vẽ lại — vẽ lại là nó sập xuống giữa tay người dùng.
    if (document.activeElement === sel) return
    var khoa = ds.join(';;') + '@' + tenDangMo
    if (sel.getAttribute('data-khoa') === khoa) return
    sel.setAttribute('data-khoa', khoa)
    sel.innerHTML = ''
    sel.setAttribute('aria-label', t('chon_seq'))
    if (!ds.length) { sel.disabled = true; return }
    sel.disabled = false
    for (var i = 0; i < ds.length; i++) {
      var o = document.createElement('option')
      o.value = ds[i]
      o.textContent = ds[i]
      sel.appendChild(o)
    }
    sel.value = tenDangMo || ds[0]
  }

  function doiSeq() {
    var sel = document.getElementById('chonSeq')
    var ten = sel.value
    if (!ten || dangChay) return
    sel.blur() // nhả focus để nhịp soi sau được phép vẽ lại danh sách
    goiHost('(typeof pc_chonSeq==="function")?pc_chonSeq("' + chuoiJsx(ten) + '"):"ERR:CHUA_NAP|"').then(function (r) {
      if (String(r).indexOf('OK:') !== 0) {
        // Host chưa nạp bản mới — nạp rồi thử lại một lần.
        napLaiHost(function (ok) {
          if (ok) goiHost('pc_chonSeq("' + chuoiJsx(ten) + '")').then(function () { soi() })
        })
        return
      }
      soi() // cập nhật ngay, khỏi đợi nhịp 1 giây
    })
  }

  function dongHuongDan() {
    document.getElementById('hd').style.display = 'none'
    try { localStorage.setItem('aio-pc-daXemHuongDan', '1') } catch (e) {}
  }
  try {
    if (!localStorage.getItem('aio-pc-daXemHuongDan')) {
      document.getElementById('hd').style.display = ''
    }
  } catch (e) {}

  apNgonNgu()
  veMinhHoa()
  soi()
</script>
