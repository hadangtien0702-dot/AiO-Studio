<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bản đồ Brain — sống</title>
<style>
  :root{
    --bg-0:#0e0e0e; --bg-1:#141414; --bg-2:#181818; --bg-3:#1f1f1f; --bg-4:#282828;
    --text-1:#f5f5f7; --text-2:#c3c3c8; --text-3:#8d8d95;
    --accent:#f86820; --accent-hover:#ff7d3c; --accent-text:#ffb891;
    --c-nguyen-tac:#f86820; --c-do-luong:#ffb891; --c-skill:#7cc4ff;
    --c-thiet-ke:#c39bff; --c-ngan-nho:#5fd39a; --c-du-an:#ffd166;
    --ok:#5fd39a; --canh-bao:#ffd166; --loi:#ff6b5e;
    --vien:rgb(255 255 255 / 10%);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg-0); color:var(--text-1);
    font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }

  /* ---------- Thanh trên ---------- */
  header{
    position:fixed; inset:0 0 auto 0; z-index:20; height:52px;
    display:flex; align-items:center; gap:14px; padding:0 16px;
    flex-wrap:nowrap; overflow:hidden;
    background:color-mix(in srgb, var(--bg-1) 88%, transparent);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--vien);
  }
  .hieu{display:flex; align-items:baseline; gap:9px; font-weight:700; letter-spacing:.2px; flex:none; min-width:0}
  .hieu span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .den{flex:none; white-space:nowrap}
  .hieu b{color:var(--accent)}
  .hieu span{font-weight:400; font-size:12px; color:var(--text-3)}
  .den{
    display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text-2);
    padding:5px 10px; border:1px solid var(--vien); border-radius:999px; background:var(--bg-2);
  }
  .cham{width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 rgb(95 211 154/.6); animation:tho 2.4s ease-out infinite}
  @keyframes tho{0%{box-shadow:0 0 0 0 rgb(95 211 154/.55)}70%{box-shadow:0 0 0 8px rgb(95 211 154/0)}100%{box-shadow:0 0 0 0 rgb(95 211 154/0)}}
  .cham.moi{background:var(--accent); animation-name:tho-cam}
  @keyframes tho-cam{0%{box-shadow:0 0 0 0 rgb(248 104 32/.6)}70%{box-shadow:0 0 0 10px rgb(248 104 32/0)}100%{box-shadow:0 0 0 0 rgb(248 104 32/0)}}
  #tim{
    flex:0 1 260px; margin-left:auto; padding:7px 12px; border-radius:9px;
    border:1px solid var(--vien); background:var(--bg-2); color:var(--text-1); font:inherit; font-size:13px;
  }
  #tim:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  #tim::placeholder{color:var(--text-3)}
  .nut{
    padding:7px 12px; border-radius:9px; border:1px solid var(--vien);
    background:var(--bg-2); color:var(--text-2); font:inherit; font-size:12.5px; cursor:pointer;
  }
  .nut:hover{background:var(--bg-4); color:var(--text-1)}
  .nut[aria-pressed="true"]{background:var(--accent); border-color:transparent; color:#fff; font-weight:600}

  /* ---------- Khung vẽ ---------- */
  #khung{position:fixed; inset:52px 0 0 0; touch-action:none; cursor:grab}
  #khung.keo{cursor:grabbing}
  svg{width:100%; height:100%; display:block}
  .canh{fill:none; stroke-width:1; opacity:.28; transition:opacity .18s, stroke-width .18s}
  .canh.ho-hang{stroke:var(--accent); opacity:.42}
  .canh.vap-o{stroke:#ffd166; opacity:.16; stroke-dasharray:3 4}
  .canh.nhanh{stroke:currentColor; opacity:.2}
  .canh.sang{opacity:.95; stroke-width:1.9}
  .canh.mo{opacity:.05}
  .goi{fill:var(--accent); opacity:.9}
  .nut-do{cursor:pointer}
  .nut-do circle.than{transition:r .18s, opacity .18s}
  .nut-do:hover circle.than{r:var(--r-hover)}
  .nut-do.mo{opacity:.18}
  .nut-do text{font-size:10.5px; fill:var(--text-2); pointer-events:none; paint-order:stroke; stroke:var(--bg-0); stroke-width:3px}
  .nut-do.hub text{font-size:12.5px; font-weight:700; fill:var(--text-1); letter-spacing:.6px}
  .nut-do.tam text{font-size:15px; font-weight:800; fill:var(--text-1)}
  .nut-do.chon circle.than{stroke:#fff; stroke-width:2}
  .quang{fill:var(--accent); opacity:.10}
  .nut-do.tam:hover .quang{opacity:.18}
  .nut-do.tam image{pointer-events:none}
  .vong-nguy{fill:none; stroke:var(--loi); stroke-width:1.4; opacity:.75}

  /* ---------- Bảng chi tiết ---------- */
  aside{
    position:fixed; right:12px; top:64px; bottom:12px; width:min(370px, calc(100vw - 24px));
    background:color-mix(in srgb, var(--bg-2) 94%, transparent); backdrop-filter:blur(14px);
    border:1px solid var(--vien); border-radius:14px; padding:16px; overflow:auto; z-index:15;
    transform:translateX(calc(100% + 20px)); transition:transform .22s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 18px 50px rgb(0 0 0/.5);
  }
  aside.hien{transform:none}
  aside h2{margin:0 0 4px; font-size:16px; line-height:1.35}
  aside .ma{color:var(--accent); font-weight:800}
  aside .the{display:inline-block; font-size:11px; padding:3px 8px; border-radius:999px; background:var(--bg-4); color:var(--text-2); margin:0 6px 6px 0}
  aside .than{white-space:pre-wrap; font-size:12.5px; line-height:1.65; color:var(--text-2); margin-top:12px;
    background:var(--bg-0); border:1px solid var(--vien); border-radius:10px; padding:12px; max-height:44vh; overflow:auto}
  aside h3{font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-3); margin:16px 0 7px}
  aside ul{margin:0; padding-left:16px; font-size:12.5px; color:var(--text-2)}
  aside li{margin-bottom:4px}
  .dong{cursor:pointer; color:var(--accent-text)}
  .dong:hover{text-decoration:underline}
  #dong-x{position:absolute; right:10px; top:10px; background:none; border:0; color:var(--text-3); font-size:20px; cursor:pointer; line-height:1; padding:4px}
  #dong-x:hover{color:var(--text-1)}

  /* ---------- Sức khoẻ + chú giải ---------- */
  #suc-khoe{
    position:fixed; left:12px; top:64px; z-index:15; width:min(290px, calc(100vw - 24px));
    background:color-mix(in srgb, var(--bg-2) 90%, transparent); backdrop-filter:blur(12px);
    border:1px solid var(--vien); border-radius:14px; padding:13px 14px;
  }
  #suc-khoe h3{margin:0 0 9px; font-size:11px; letter-spacing:.9px; text-transform:uppercase; color:var(--text-3)}
  .hang{display:flex; gap:9px; align-items:flex-start; font-size:12.5px; margin-bottom:7px; color:var(--text-2)}
  .hang b{color:var(--text-1); font-weight:600}
  .bieu{flex:none; width:15px; text-align:center}
  .bieu.ok{color:var(--ok)} .bieu.cb{color:var(--canh-bao)} .bieu.loi{color:var(--loi)}
  #chu-giai{
    position:fixed; left:12px; bottom:12px; z-index:15; display:flex; flex-wrap:wrap; gap:6px;
    max-width:min(420px, calc(100vw - 24px));
  }
  .cg{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-2);
    background:color-mix(in srgb, var(--bg-2) 88%, transparent); border:1px solid var(--vien);
    border-radius:999px; padding:4px 10px; cursor:pointer}
  .cg:hover{color:var(--text-1)}
  .cg .o{width:9px; height:9px; border-radius:50%}
  .cg[aria-pressed="false"]{opacity:.4}
  #meo{position:fixed; right:12px; bottom:12px; z-index:14; font-size:11.5px; color:var(--text-3)}

  @media (max-width:820px){
    aside{top:auto; bottom:0; right:0; left:0; width:100%; max-height:62vh; border-radius:16px 16px 0 0;
      transform:translateY(calc(100% + 20px))}
    aside.hien{transform:none}
    #suc-khoe{display:none}
    #chu-giai{bottom:8px; left:8px; max-width:calc(100vw - 16px)}
    #meo{display:none}
    /* Khoi hep: bo dong tom tat + chu "quet", giu lai den bao va o tim. */
    .hieu span{display:none}
    .den{padding:5px 8px; font-size:11px}
    #tim{flex:1 1 auto; min-width:0}
    #nut-nhan{display:none}
    header{gap:10px; padding:0 10px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
</style>
</head>
<body>

<header>
  <div class="hieu"><b>BRAIN</b> <span id="tom">đang đọc…</span></div>
  <div class="den"><i class="cham" id="cham"></i><span id="nhip">—</span></div>
  <input id="tim" type="search" placeholder="Tìm bài học, dự án, skill…" autocomplete="off">
  <button class="nut" id="nut-nhan" aria-pressed="true" title="Chấm chạy dọc dây = quan hệ họ hàng giữa các bài học">Nhịp</button>
</header>

<div id="khung"><svg id="ve" xmlns="http://www.w3.org/2000/svg"></svg></div>

<section id="suc-khoe"><h3>Sức khoẻ brain</h3><div id="sk-noi"></div></section>

<div id="chu-giai"></div>
<div id="meo">Lăn chuột = phóng · kéo = di · bấm nút = xem chi tiết</div>

<aside id="bang">
  <button id="dong-x" aria-label="Đóng">×</button>
  <div id="bang-noi"></div>
</aside>

<script>
const SVG='http://www.w3.org/2000/svg';
const ve=document.getElementById('ve'), khung=document.getElementById('khung');
const bang=document.getElementById('bang'), bangNoi=document.getElementById('bang-noi');
const W=1760, H=1320, CX=W/2, CY=H/2;
ve.setAttribute('viewBox',`0 0 ${W} ${H}`);

const CUM=[
  {id:'nguyen-tac', ten:'NGUYÊN TẮC',  phu:'cách làm việc gốc',      mau:'var(--c-nguyen-tac)', goc:-90},
  {id:'do-luong',   ten:'ĐO LƯỜNG',    phu:'bẫy thước đo · 5x',      mau:'var(--c-do-luong)',   goc:-30},
  {id:'du-an',      ten:'DỰ ÁN',       phu:'CLAUDE.md trong repo',   mau:'var(--c-du-an)',      goc:30},
  {id:'ngan-nho',   ten:'NGĂN NHỚ',    phu:'theo đường dẫn máy',     mau:'var(--c-ngan-nho)',   goc:90},
  {id:'thiet-ke',   ten:'THIẾT KẾ',    phu:'sổ bài học UI',          mau:'var(--c-thiet-ke)',   goc:150},
  {id:'skill',      ten:'SKILL',       phu:'kiến thức theo chủ đề',  mau:'var(--c-skill)',      goc:210},
];
const BAT=Object.fromEntries(CUM.map(c=>[c.id,true]));

let duLieu=null, vanTay='', nut=[], canh=[], dangChon=null, batNhip=true, tim='';
const state={k:1, x:0, y:0};

/* ---------------- lấy dữ liệu ---------------- */
async function tai(dauTien){
  try{
    const r=await fetch('/du-lieu',{cache:'no-store'});
    const d=await r.json();
    const vt=JSON.stringify([d.tong,d.skill.map(s=>s.sua),d.duAn.map(p=>[p.suaClaude,p.suaProgress]),d.nganNho.map(n=>n.ghiNho.map(g=>g.sua))]);
    const doi = vt!==vanTay;
    vanTay=vt; duLieu=d;
    if(doi||dauTien){ dung(); if(!dauTien) nhayMoi(); }
    document.getElementById('nhip').textContent =
      `quét ${new Date(d.quetLuc).toLocaleTimeString('vi-VN')} · ${d.quetMs}ms`;
    document.getElementById('cham').classList.toggle('moi', doi&&!dauTien);
  }catch(e){
    document.getElementById('nhip').textContent='mất kết nối máy quét';
    document.getElementById('cham').style.background='var(--loi)';
  }
}
function nhayMoi(){
  const c=document.getElementById('cham');
  setTimeout(()=>c.classList.remove('moi'), 4000);
}

/* ---------------- dựng nút + cạnh ---------------- */
function dung(){
  const d=duLieu;
  nut=[]; canh=[];
  const them=(o)=>{ nut.push(o); return o; };

  them({id:'TAM', cum:null, loai:'tam', nhan:'BRAIN', r:26, mau:'var(--accent)', x:CX, y:CY});

  const conCuaCum={};
  // nguyen tac (1..4, 0, 2b, 3x) vs do luong (5x)
  const nguyenTac=d.baiHoc.filter(b=>!/^5/.test(b.id));
  const doLuong  =d.baiHoc.filter(b=> /^5/.test(b.id));
  conCuaCum['nguyen-tac']=nguyenTac.map(b=>({key:'bh:'+b.id+':'+b.dong, nhan:b.id, loai:'bai-hoc', dl:b, nang:b.soDong}));
  conCuaCum['do-luong']  =doLuong .map(b=>({key:'bh:'+b.id+':'+b.dong, nhan:b.id, loai:'bai-hoc', dl:b, nang:b.soDong}));
  conCuaCum['skill']     =d.skill.map(s=>({key:'sk:'+s.ten, nhan:s.ten.replace(/-/g,' '), loai:'skill', dl:s, nang:s.soDong/6}));
  conCuaCum['thiet-ke']  =d.lessons.muc.map((m,i)=>({key:'tk:'+i, nhan:rutGon(m.tieuDe), loai:'muc-lesson', dl:m, nang:4+m.con.length*2}));
  conCuaCum['ngan-nho']  =d.nganNho.map(n=>({key:'nn:'+n.slug, nhan:rutGonSlug(n.slug), loai:'ngan-nho', dl:n, nang:3+n.ghiNho.length*2}));
  conCuaCum['du-an']     =d.duAn.map(p=>({key:'da:'+p.ten, nhan:p.ten, loai:'du-an', dl:p, nang:p.soDongClaude/14}));

  // Chia 360 do THEO SO CON (cum dong con duoc quat rong hon) — quat co dinh 52 do
  // tung lam cum "do luong" 41 bai bi nhoi trong khi cum 8 bai thi trong.
  const BK_HUB=150, RUOT=[300,392,484];
  const canNang=CUM.map(c=>Math.sqrt((conCuaCum[c.id]||[]).length||1));
  const tongNang=canNang.reduce((a,b)=>a+b,0);
  let quet=-115;                                   // bat dau tu tren, di theo chieu kim
  CUM.forEach((c,ci)=>{
    const con=conCuaCum[c.id]||[];
    const phanDo=canNang[ci]/tongNang*360;
    const giua=(quet+phanDo/2)*Math.PI/180;
    const beRong=(phanDo-11)*Math.PI/180;          // chua 11 do lam khe ho giua hai cum
    quet+=phanDo;
    c._giua=giua;

    const hx=CX+Math.cos(giua)*BK_HUB, hy=CY+Math.sin(giua)*BK_HUB;
    them({id:'hub:'+c.id, cum:c.id, loai:'hub', nhan:c.ten, phu:c.phu, soCon:con.length, r:9, mau:c.mau, x:hx, y:hy, goc:giua});
    canh.push({tu:'TAM', den:'hub:'+c.id, loai:'nhanh', mau:c.mau});

    // MOT VONG DUY NHAT moi cum (08/09): xep 2-3 vong thi nhan vong trong toa ra
    // dam xuyen nut vong ngoai — anh Tien: "chu bi trung rat kho doc". Goc da
    // chia theo so con nen mot vong van du cho: cum 41 bai ~15px/nut o r=500.
    con.forEach((k,i)=>{
      const n=con.length;
      const t=n===1?0.5:i/(n-1);
      const a=giua-beRong/2+t*beRong;
      const bk=RUOT[0]+200+(i%2)*26;                // so le nhap nho 26px de nhan khong ke sat
      them({id:k.key, cum:c.id, loai:k.loai, nhan:k.nhan, dl:k.dl,
            r:Math.max(3.4, Math.min(9, 3.4+(k.nang||4)*0.12)), mau:c.mau,
            x:CX+Math.cos(a)*bk, y:CY+Math.sin(a)*bk, goc:a});
      canh.push({tu:'hub:'+c.id, den:k.key, loai:'nhanh', mau:c.mau});
    });
  });

  // day noi that giua cac bai hoc + bai hoc -> du an
  const chiMuc=new Map();
  nut.forEach(n=>{ if(n.loai==='bai-hoc') chiMuc.set(n.dl.id, n.id); if(n.loai==='du-an') chiMuc.set('da:'+n.dl.ten, n.id); });
  d.canh.forEach(c=>{
    const a=chiMuc.get(c.tu), b=chiMuc.get(c.den);
    if(a&&b) canh.push({tu:a, den:b, loai:c.loai});
  });

  render();
  tomTat();
  sucKhoe();
  chuGiai();
}
// Nhan toi da 22 ky tu — dai hon la hai nhan canh nhau chong len nhau o vong ngoai.
const cat=(s,n=22)=>s.length>n?s.slice(0,n-1).trim()+'…':s;
const rutGon=(s)=>cat(s.replace(/^(Tuần \d+ \([^)]*\)|20\d\d-\d\d-\d\d)\s*[—-]?\s*/,'').split('—')[0].trim());
const rutGonSlug=(s)=>cat(s.replace(/^[eEgG]--\d{4}-/,'').replace(/^Production-/,'').replace(/-/g,' '));

/* ---------------- vẽ ---------------- */
function render(){
  ve.textContent='';
  const gRoot=el('g',{id:'goc'});
  const gCanh=el('g',{}), gNut=el('g',{});
  const viTri=Object.fromEntries(nut.map(n=>[n.id,n]));

  canh.forEach((c,i)=>{
    const a=viTri[c.tu], b=viTri[c.den]; if(!a||!b) return;
    const cong = c.loai==='nhanh' ? 0.12 : 0.42;         // day that vong qua giua => nhin nhu dang "noi chuyen"
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const qx=mx+(CX-mx)*cong, qy=my+(CY-my)*cong;
    const p=el('path',{d:`M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${qx.toFixed(1)},${qy.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`,
      class:'canh '+c.loai, id:'e'+i});
    if(c.mau) p.style.stroke=c.mau;
    p.dataset.tu=c.tu; p.dataset.den=c.den;
    gCanh.appendChild(p);
    if(c.loai==='ho-hang'&&batNhip){
      const g=el('circle',{r:2.1, class:'goi'});
      const am=el('animateMotion',{dur:(3.4+(i%5)*0.7)+'s', repeatCount:'indefinite', begin:(i*0.23)+'s'});
      am.appendChild(el('mpath',{href:'#e'+i}));
      g.appendChild(am); gCanh.appendChild(g);
    }
  });

  nut.forEach(n=>{
    const g=el('g',{class:'nut-do '+n.loai+(n.loai==='hub'?' hub':'')+(n.loai==='tam'?' tam':''), transform:`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`});
    g.dataset.id=n.id;
    g.style.setProperty('--r-hover',(n.r*1.5)+'px');
    if(n.loai==='bai-hoc'&&n.dl.doNguyHiem>=2) g.appendChild(el('circle',{r:n.r+3.5, class:'vong-nguy'}));
    if(n.loai==='tam'){
      // Tam = FILE brain.svg cung thu muc. Thay logo khac chi can ghi de file do.
      const quang=el('circle',{r:n.r+16, class:'quang'});      // vung sang + vung bam
      g.appendChild(quang);
      const anh=el('image',{href:'brain.svg', x:-n.r*1.5, y:-n.r*1.5, width:n.r*3, height:n.r*3});
      anh.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href','brain.svg'); // trinh duyet cu
      g.appendChild(anh);
    }else{
      const c=el('circle',{r:n.r, class:'than'});
      c.style.fill=n.mau; c.style.fillOpacity=n.loai==='bai-hoc'&&!n.dl.coSoDo?0.35:0.92;
      g.appendChild(c);
    }
    if(n.loai==='tam'||n.loai==='hub'){
      // Tam + 6 hub de NGANG: chung it va nam gan giua nen khong doa chong chu,
      // ma chu dung nguoc o dinh vong tron thi rat kho doc.
      const ben=n.x<CX?-1:1;
      const t=el('text',{x:n.loai==='tam'?0:(n.r+7)*ben, y:n.loai==='tam'?n.r*1.5+18:3.4,
        'text-anchor':n.loai==='tam'?'middle':(ben<0?'end':'start')});
      t.textContent=n.nhan; g.appendChild(t);
      if(n.loai==='hub'){
        const s=el('text',{x:(n.r+7)*ben, y:16, 'text-anchor':ben<0?'end':'start'});
        s.style.fontSize='10px'; s.style.fill='var(--text-3)'; s.style.fontWeight='400';
        s.textContent=n.soCon+' · '+n.phu; g.appendChild(s);
      }
    }else{
      // Nhan XOAY THEO PHUONG BAN KINH: xep tia thay vi xep ngang => het chong chu.
      const deg=(n.goc||0)*180/Math.PI;
      const lat=deg>90||deg<-90;                 // nua trai thi lat lai cho khoi doc nguoc
      const gT=el('g',{transform:`rotate(${lat?deg+180:deg})`});
      const t=el('text',{x:lat?-(n.r+7):(n.r+7), y:3.4, 'text-anchor':lat?'end':'start'});
      t.textContent=n.nhan; gT.appendChild(t);
      g.appendChild(gT);
    }
    g.addEventListener('click',(e)=>{e.stopPropagation(); chon(n.id);});
    g.addEventListener('pointerenter',()=>roiVao(n.id));
    g.addEventListener('pointerleave',()=>{ if(!dangChon) xoaSang(); });
    gNut.appendChild(g);
  });

  gRoot.appendChild(gCanh); gRoot.appendChild(gNut); ve.appendChild(gRoot);
  if(!daVua){ vuaKhung(gRoot); daVua=true; }
  apDungBienDoi(); locHien();
}
// Lan dau: phong cho hinh lap day khung, khong de nguoi dung phai tu zoom.
let daVua=false;
function vuaKhung(gRoot){
  const b=gRoot.getBBox(); if(!b.width||!b.height) return;
  const le=48;
  state.k=Math.min((W-le*2)/b.width, (H-le*2)/b.height, 2);
  state.x=(W-b.width*state.k)/2-b.x*state.k;
  state.y=(H-b.height*state.k)/2-b.y*state.k;
}
function el(t,a){const e=document.createElementNS(SVG,t); for(const k in a) e.setAttribute(k,a[k]); return e;}

/* ---------------- tương tác ---------------- */
function roiVao(id){
  const hangXom=new Set([id]);
  ve.querySelectorAll('path.canh').forEach(p=>{
    const dinh = p.dataset.tu===id||p.dataset.den===id;
    p.classList.toggle('sang',dinh); p.classList.toggle('mo',!dinh);
    if(dinh){hangXom.add(p.dataset.tu); hangXom.add(p.dataset.den);}
  });
  ve.querySelectorAll('g.nut-do').forEach(g=>g.classList.toggle('mo',!hangXom.has(g.dataset.id)));
}
function xoaSang(){
  ve.querySelectorAll('path.canh').forEach(p=>p.classList.remove('sang','mo'));
  ve.querySelectorAll('g.nut-do').forEach(g=>g.classList.remove('mo'));
  locHien();
}
function chon(id){
  dangChon=id; roiVao(id);
  ve.querySelectorAll('g.nut-do').forEach(g=>g.classList.toggle('chon',g.dataset.id===id));
  const n=nut.find(x=>x.id===id); if(n) moBang(n);
}
function dongBang(){ dangChon=null; bang.classList.remove('hien'); xoaSang();
  ve.querySelectorAll('g.nut-do').forEach(g=>g.classList.remove('chon')); }
document.getElementById('dong-x').onclick=dongBang;
khung.addEventListener('click',dongBang);

function moBang(n){
  const H=[]; const esc=(s)=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const ngay=(s)=>s?new Date(s).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
  if(n.loai==='bai-hoc'){
    const b=n.dl;
    H.push(`<h2><span class="ma">${esc(b.id)}</span> · ${esc(b.tieuDe)}</h2>`);
    H.push(`<div>${b.ngay?`<span class="the">vấp ${esc(b.ngay)}</span>`:''}
      <span class="the">${b.soDong} dòng</span>
      ${b.doNguyHiem?`<span class="the" style="background:rgb(255 107 94/.18);color:#ff9d94">☠️ ×${b.doNguyHiem}</span>`:''}
      <span class="the">${b.coSoDo?'có số đo':'chưa có số đo'}</span></div>`);
    const hh=duLieu.canh.filter(c=>c.loai==='ho-hang'&&(c.tu===b.id||c.den===b.id))
      .map(c=>c.tu===b.id?c.den:c.tu);
    const da=duLieu.canh.filter(c=>c.loai==='vap-o'&&c.tu===b.id).map(c=>c.den.slice(3));
    if(hh.length){H.push(`<h3>Họ hàng với</h3><ul>${[...new Set(hh)].map(x=>{
      const t=duLieu.baiHoc.find(y=>y.id===x);
      return `<li><span class="dong" data-di="${esc(x)}">${esc(x)}</span> — ${esc(t?t.tieuDe.slice(0,64):'')}</li>`;}).join('')}</ul>`);}
    if(da.length)H.push(`<h3>Vấp ở dự án</h3><ul>${[...new Set(da)].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);
    H.push(`<h3>Nguồn</h3><ul><li>CLAUDE.md tổng — dòng ${b.dong}</li></ul>`);
    H.push(`<div class="than">${esc(b.than.slice(0,2600))}</div>`);
  } else if(n.loai==='skill'){
    const s=n.dl;
    H.push(`<h2>${esc(s.ten)}</h2><div><span class="the">${s.soDong} dòng</span><span class="the">sửa ${ngay(s.sua)}</span></div>`);
    if(s.fileKhac.length)H.push(`<h3>File kèm theo</h3><ul>${s.fileKhac.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
      <p style="font-size:12.5px;color:var(--text-3)">Tổng thêm ${s.soDongKhac} dòng</p>`);
  } else if(n.loai==='ngan-nho'){
    const m=n.dl;
    H.push(`<h2>${esc(m.slug)}</h2><div><span class="the">${m.ghiNho.length} ghi nhớ</span>
      ${m.coMemoryMd?`<span class="the">MEMORY.md ${ngay(m.suaMemoryMd)}</span>`:'<span class="the" style="color:#ff9d94">thiếu MEMORY.md</span>'}
      ${m.oCuKetDinh?'<span class="the" style="background:rgb(255 209 102/.18);color:#ffd166">ổ cũ G:</span>':''}</div>`);
    if(m.ghiNho.length)H.push(`<h3>Nội dung</h3><ul>${m.ghiNho.map(g=>`<li><b>${esc(g.ten)}</b> <span style="color:var(--text-3)">(${g.loai}, ${g.soDong} dòng)</span><br>${esc(g.moTa.slice(0,150))}</li>`).join('')}</ul>`);
  } else if(n.loai==='du-an'){
    const p=n.dl;
    H.push(`<h2>${esc(p.ten)}</h2><div><span class="the">CLAUDE.md ${p.soDongClaude} dòng</span>
      ${p.coProgress?`<span class="the">PROGRESS.md ${p.soDongProgress} dòng</span>`:'<span class="the" style="background:rgb(255 107 94/.18);color:#ff9d94">KHÔNG có PROGRESS.md</span>'}</div>`);
    H.push(`<h3>Sửa lần cuối</h3><ul><li>CLAUDE.md — ${ngay(p.suaClaude)}</li>${p.coProgress?`<li>PROGRESS.md — ${ngay(p.suaProgress)}</li>`:''}</ul>`);
    const bh=duLieu.canh.filter(c=>c.loai==='vap-o'&&c.den==='da:'+p.ten).map(c=>c.tu);
    if(bh.length)H.push(`<h3>Bài học rút ở đây</h3><ul>${bh.map(x=>{const t=duLieu.baiHoc.find(y=>y.id===x);
      return `<li><span class="dong" data-di="${esc(x)}">${esc(x)}</span> — ${esc(t?t.tieuDe.slice(0,60):'')}</li>`;}).join('')}</ul>`);
    H.push(`<p style="font-size:11.5px;color:var(--text-3);margin-top:10px">${esc(p.duongDan)}</p>`);
  } else if(n.loai==='muc-lesson'){
    const m=n.dl;
    H.push(`<h2>${esc(m.tieuDe)}</h2><div><span class="the">${m.con.length} bài</span><span class="the">LESSONS.md dòng ${m.dong}</span></div>`);
    if(m.con.length)H.push(`<h3>Bài trong mục</h3><ul>${m.con.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`);
  } else if(n.loai==='hub'){
    H.push(`<h2>${esc(n.nhan)}</h2><div><span class="the">${n.soCon} nút</span><span class="the">${esc(n.phu)}</span></div>`);
  } else {
    const t=duLieu.tong;
    H.push(`<h2>BRAIN</h2><div><span class="the">${t.soBaiHoc} bài học</span><span class="the">${t.soDayNoi} dây nối</span>
      <span class="the">${duLieu.skill.length} skill</span><span class="the">${duLieu.duAn.length} dự án</span></div>`);
    H.push(`<h3>Ba tầng</h3><ul>
      <li>CLAUDE.md tổng — ${t.soDongClaudeMd} dòng, sửa ${ngay(t.suaClaudeMd)}</li>
      <li>Skill theo chủ đề — ${duLieu.skill.length} ngăn</li>
      <li>Ngăn nhớ theo máy — ${duLieu.nganNho.length} hộp</li></ul>`);
    H.push(`<h3>Cơ chế tự ghi</h3><ul><li>Lệnh: ${duLieu.coChe.lenh.map(x=>'/'+x).join(', ')||'—'}</li>
      <li>Hook Stop: ${duLieu.coChe.hookStop?'còn':'MẤT'}</li></ul>`);
  }
  bangNoi.innerHTML=H.join('');
  bangNoi.querySelectorAll('.dong').forEach(a=>a.onclick=()=>{
    const t=nut.find(x=>x.loai==='bai-hoc'&&x.dl.id===a.dataset.di); if(t) chon(t.id);
  });
  bang.classList.add('hien');
}

/* ---------------- lọc + tìm ---------------- */
function locHien(){
  const q=tim.trim().toLowerCase();
  ve.querySelectorAll('g.nut-do').forEach(g=>{
    const n=nut.find(x=>x.id===g.dataset.id); if(!n) return;
    let hien=true;
    if(n.cum&&!BAT[n.cum]) hien=false;
    if(hien&&q){
      const kho=[n.nhan, n.dl?.tieuDe, n.dl?.ten, n.dl?.slug, n.dl?.than].filter(Boolean).join(' ').toLowerCase();
      hien=kho.includes(q);
    }
    g.style.display=hien?'':'none';
  });
  ve.querySelectorAll('path.canh').forEach(p=>{
    const a=ve.querySelector(`g.nut-do[data-id="${CSS.escape(p.dataset.tu||'')}"]`);
    const b=ve.querySelector(`g.nut-do[data-id="${CSS.escape(p.dataset.den||'')}"]`);
    p.style.display=(a&&b&&a.style.display!=='none'&&b.style.display!=='none')?'':'none';
  });
}
document.getElementById('tim').addEventListener('input',e=>{tim=e.target.value; locHien();});

/* ---------------- tóm tắt + sức khoẻ + chú giải ---------------- */
function tomTat(){
  const t=duLieu.tong;
  document.getElementById('tom').textContent =
    `${t.soBaiHoc} bài học · ${duLieu.canh.filter(c=>c.loai==='ho-hang').length} dây họ hàng · ${duLieu.skill.length} skill · ${duLieu.nganNho.length} ngăn nhớ · ${duLieu.duAn.length} dự án`;
}
function sucKhoe(){
  const d=duLieu, r=[];
  const dem={};
  d.baiHoc.forEach(b=>dem[b.id]=(dem[b.id]||0)+1);
  const trung=Object.keys(dem).filter(k=>dem[k]>1);
  r.push([d.coChe.lienKet?'ok':'cb', d.coChe.lienKet?'Lối tắt brain sống':'Không đọc được liên kết', d.coChe.lienKet||'']);
  r.push([d.coChe.hookStop?'ok':'loi', d.coChe.hookStop?'Hook Stop còn':'Hook Stop MẤT','']);
  r.push([d.coChe.lenh.includes('xong')&&d.coChe.lenh.includes('brain')?'ok':'cb','Lệnh '+d.coChe.lenh.map(x=>'/'+x).join(' '),'']);
  const thieuP=d.duAn.filter(p=>!p.coProgress);
  r.push([thieuP.length?'cb':'ok', thieuP.length?thieuP.length+' dự án thiếu PROGRESS.md':'Dự án nào cũng có nhật ký', thieuP.map(p=>p.ten).join(', ')]);
  const ket=d.nganNho.filter(n=>n.oCuKetDinh);
  r.push([ket.length?'cb':'ok', ket.length?ket.length+' ngăn nhớ kẹt ổ G:':'Không ngăn nào kẹt ổ cũ','']);
  r.push([trung.length?'loi':'ok', trung.length?'Trùng mã bài học: '+trung.join(', '):'Mã bài học không trùng','']);
  const chuaDo=d.baiHoc.filter(b=>!b.coSoDo).length;
  r.push([chuaDo>d.baiHoc.length*0.3?'cb':'ok', chuaDo+'/'+d.baiHoc.length+' bài chưa kèm số đo','']);
  document.getElementById('sk-noi').innerHTML=r.map(([m,a,b])=>
    `<div class="hang"><span class="bieu ${m}">${m==='ok'?'✓':m==='cb'?'!':'✕'}</span><span><b>${a}</b>${b?`<br><span style="color:var(--text-3);font-size:11.5px">${b}</span>`:''}</span></div>`).join('');
}
function chuGiai(){
  const el=document.getElementById('chu-giai');
  el.innerHTML=CUM.map(c=>`<button class="cg" data-cum="${c.id}" aria-pressed="${BAT[c.id]}"><i class="o" style="background:${c.mau}"></i>${c.ten.toLowerCase()}</button>`).join('')
   +`<span class="cg" style="cursor:default"><i class="o" style="background:var(--accent)"></i>dây họ hàng</span>
     <span class="cg" style="cursor:default"><i class="o" style="background:#ffd166"></i>vấp ở dự án</span>
     <span class="cg" style="cursor:default"><i class="o" style="border:1.5px solid var(--loi);background:none"></i>☠️☠️</span>`;
  el.querySelectorAll('button.cg').forEach(b=>b.onclick=()=>{
    BAT[b.dataset.cum]=!BAT[b.dataset.cum]; b.setAttribute('aria-pressed',BAT[b.dataset.cum]); locHien();
  });
}
document.getElementById('nut-nhan').onclick=(e)=>{
  batNhip=!batNhip; e.currentTarget.setAttribute('aria-pressed',batNhip); render();
};

/* ---------------- phóng / kéo ---------------- */
function apDungBienDoi(){
  const g=ve.querySelector('#goc');
  if(g) g.setAttribute('transform',`translate(${state.x},${state.y}) scale(${state.k})`);
}
khung.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=khung.getBoundingClientRect(), ti=W/r.width;
  const mx=(e.clientX-r.left)*ti, my=(e.clientY-r.top)*ti;
  const k2=Math.min(4,Math.max(0.4,state.k*(e.deltaY<0?1.12:1/1.12)));
  state.x=mx-(mx-state.x)*(k2/state.k); state.y=my-(my-state.y)*(k2/state.k); state.k=k2;
  apDungBienDoi();
},{passive:false});
// Dien thoai KHONG co banh xe chuot => phai co chum hai ngon va cham hai lan,
// khong thi mo tren dien thoai chi xem duoc mot co duy nhat.
let keo=null, ngon=new Map(), chum=null;
const toaDo=(e)=>{ const r=khung.getBoundingClientRect(), ti=W/r.width;
  return {x:(e.clientX-r.left)*ti, y:(e.clientY-r.top)*ti, ti}; };

khung.addEventListener('pointerdown',e=>{
  ngon.set(e.pointerId,{x:e.clientX,y:e.clientY});
  // Bat con tro SAU khi lap trang thai: setPointerCapture co the nem loi,
  // dat truoc thi no cuon phang ca doan lap chum ben duoi.
  try{ khung.setPointerCapture(e.pointerId); }catch{}
  if(ngon.size===2){
    const [a,b]=[...ngon.values()];
    chum={kc:Math.hypot(a.x-b.x,a.y-b.y), gx:(a.x+b.x)/2, gy:(a.y+b.y)/2, k0:state.k, x0:state.x, y0:state.y};
    keo=null;
  }else if(ngon.size===1){
    keo={x:e.clientX,y:e.clientY,ox:state.x,oy:state.y}; khung.classList.add('keo');
  }
});
khung.addEventListener('pointermove',e=>{
  if(ngon.has(e.pointerId)) ngon.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=khung.getBoundingClientRect(), ti=W/r.width;
  if(chum&&ngon.size===2){
    const [a,b]=[...ngon.values()];
    const kc=Math.hypot(a.x-b.x,a.y-b.y);
    const k2=Math.min(4,Math.max(0.3,chum.k0*(kc/chum.kc)));
    const mx=(chum.gx-r.left)*ti, my=(chum.gy-r.top)*ti;
    state.x=mx-(mx-chum.x0)*(k2/chum.k0); state.y=my-(my-chum.y0)*(k2/chum.k0); state.k=k2;
    apDungBienDoi(); return;
  }
  if(!keo) return;
  state.x=keo.ox+(e.clientX-keo.x)*ti; state.y=keo.oy+(e.clientY-keo.y)*ti; apDungBienDoi();
});
['pointerup','pointercancel'].forEach(t=>khung.addEventListener(t,e=>{
  ngon.delete(e.pointerId);
  if(ngon.size<2) chum=null;
  if(ngon.size===0){ keo=null; khung.classList.remove('keo'); }
}));
// Cham hai lan: phong quanh diem cham; cham hai lan nua thi ve vua khung.
let chamCuoi=0;
khung.addEventListener('pointerup',e=>{
  const gio=Date.now();
  if(gio-chamCuoi<320){
    const p=toaDo(e);
    const k2=state.k<1.8?Math.min(4,state.k*2):1.02;
    state.x=p.x-(p.x-state.x)*(k2/state.k); state.y=p.y-(p.y-state.y)*(k2/state.k); state.k=k2;
    if(k2<=1.05){ daVua=false; const g=ve.querySelector('#goc'); if(g){ vuaKhung(g); daVua=true; } }
    apDungBienDoi();
  }
  chamCuoi=gio;
});

/* ---------------- chạy ---------------- */
tai(true);
setInterval(()=>tai(false), 5000);
