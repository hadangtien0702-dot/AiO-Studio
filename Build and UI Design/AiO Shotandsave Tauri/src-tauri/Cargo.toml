[package]
name = "aio-shot-tauri-spike"
version = "0.0.1"
description = "AiO Shot & Save - spike Tauri 2: do overlay/chup/hotkey/tray"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-drag = "2"
xcap = "0.4"
# image PHAI cung ban voi image ma xcap 0.4 dung (0.25) — de goi imageops
# len RgbaImage do xcap tra ve (lam thumbnail cho icon keo-tha)
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
