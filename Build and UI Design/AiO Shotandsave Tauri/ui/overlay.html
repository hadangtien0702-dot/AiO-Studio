<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>AiO Spike overlay</title>
  <style>
    /* Nen TRONG SUOT co lop mo 42% — dung nhu overlay ban Electron de mat
       nguoi so sanh cong bang. */
    html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden;
                 background: rgb(0 0 0 / 42%); cursor: crosshair;
                 font-family: Inter, system-ui, sans-serif; }
    .the {
      position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
      padding: 8px 16px; border-radius: 999px;
      background: rgb(20 20 20 / 88%); color: #fff; font-size: 13px;
      border: 1px solid rgb(255 255 255 / 15%);
    }
    b { color: #f86820; }
  </style>
</head>
<body>
  <div class="the"><b>AiO SPIKE</b> — overlay Tauri dang hien · Ctrl+Shift+F10 dong/mo</div>
</body>
</html>
