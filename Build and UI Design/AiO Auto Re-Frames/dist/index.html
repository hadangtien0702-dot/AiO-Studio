<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AiO Auto Re-Frames</title>
<link rel="stylesheet" href="./tokens.css" />
<style>
  /* =========================================================================
     AiO STUDIO — AUTO RE-FRAMES (STUDIO CONSOLE DESIGN SYSTEM)
     ========================================================================= */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; }
  body {
    background: var(--bg-2);
    color: var(--text-1);
    font-family: var(--font-ui);
    font-size: var(--fs-md);
    line-height: var(--lh);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Custom Scrollbar */
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: rgb(255 255 255 / 14%);
    border-radius: var(--r-pill);
  }
  *::-webkit-scrollbar-thumb:hover { background: rgb(255 255 255 / 25%); }

  .ico {
    width: 16px; height: 16px; flex: none;
    stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .ico-sm { width: 14px; height: 14px; }
  .ico-2xs { width: 10px; height: 10px; }

  /* Topbar Header */
  .topbar {
    height: var(--h-topbar);
    background: var(--bg-1);
    border-bottom: 1px solid var(--line-1);
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 0 var(--sp-4);
    position: sticky; top: 0; z-index: 100;
  }
  .brand {
    display: flex; align-items: center; gap: var(--sp-2);
    font-size: var(--fs-md); font-weight: var(--fw-bold); color: var(--text-1);
  }
  .brand__icon {
    width: 26px; height: 26px; border-radius: var(--r-sm);
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
  }
  .topbar__ten { font-weight: var(--fw-semibold); font-size: var(--fs-md); color: var(--text-1); }
  .topbar__ver {
    padding: 2px 6px; background: var(--bg-4); border: 1px solid var(--line-2);
    border-radius: var(--r-pill); color: var(--text-3); font-size: var(--fs-2xs); font-weight: var(--fw-semibold);
  }
  .topbar__host {
    margin-left: auto; color: var(--text-3); font-size: var(--fs-xs);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px;
  }
  .topbar__actions { display: flex; align-items: center; gap: var(--sp-2); }
  
  .btn-icon {
    width: var(--h-ctrl-sm); height: var(--h-ctrl-sm);
    border-radius: var(--r-sm); border: 1px solid var(--line-2);
    background: var(--bg-3); color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all var(--dur) var(--ease);
  }
  .btn-icon:hover { background: var(--bg-4); color: var(--text-1); border-color: var(--line-strong); }

  .lang {
    height: var(--h-ctrl-sm); padding: 0 var(--sp-3);
    border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    background: var(--bg-3); color: var(--text-2);
    font-family: var(--font-ui); font-size: var(--fs-2xs); font-weight: var(--fw-bold);
    letter-spacing: 0.05em; cursor: pointer; transition: all var(--dur) var(--ease);
  }
  .lang:hover { background: var(--bg-hover); color: var(--text-1); border-color: var(--accent); }

  /* Main Container */
  .than {
    max-width: 640px; margin: 0 auto;
    padding: var(--sp-4);
    display: flex; flex-direction: column; gap: var(--sp-3);
  }

  /* Onboarding Guide Box (.hd) */
  .hd {
    background: linear-gradient(135deg, var(--bg-3), var(--bg-4));
    border: 1px solid var(--accent-line);
    border-radius: var(--r-lg); padding: var(--sp-4);
    display: flex; flex-direction: column; gap: var(--sp-3);
    box-shadow: var(--shadow-sm);
  }
  .hd__header { display: flex; align-items: center; justify-content: space-between; }
  .hd__title { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--accent-text); display: flex; align-items: center; gap: var(--sp-2); }
  .hd__buoc { display: flex; align-items: flex-start; gap: var(--sp-3); font-size: var(--fs-sm); color: var(--text-2); }
  .hd__so {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line);
    font-size: var(--fs-2xs); font-weight: var(--fw-bold);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .hd__ok { align-self: flex-end; }

  /* DYNAMIC AI SUBJECT TRACKING STAGE (.mh) */
  .mh {
    background: var(--bg-3); border: 1px solid var(--line-1);
    border-radius: var(--r-lg); padding: var(--sp-4);
    display: flex; flex-direction: column; gap: var(--sp-3);
  }
  .mh__header { display: flex; align-items: center; justify-content: space-between; }
  .mh__title { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-1); display: flex; align-items: center; gap: var(--sp-2); }

  .mh__khung {
    position: relative;
    width: 100%; max-width: 520px; margin: 0 auto;
    aspect-ratio: 16 / 9; min-height: 200px;
    background: radial-gradient(circle at 50% 50%, #1e1e24 0%, #08080a 100%);
    border: 1px solid var(--accent-line); border-radius: var(--r-md);
    overflow: hidden; box-shadow: 0 4px 24px rgb(0 0 0 / 60%), inset 0 0 30px rgb(0 0 0 / 80%);
  }
  .mh__grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgb(255 87 20 / 7%) 1px, transparent 1px),
                      linear-gradient(90deg, rgb(255 87 20 / 7%) 1px, transparent 1px);
    background-size: 24px 24px; opacity: 0.7;
  }

  /* Laser Scan Line */
  .mh__scan {
    position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 10px var(--accent);
    z-index: 4; opacity: 0.8;
    animation: mhLaser 2.8s ease-in-out infinite alternate;
  }
  @keyframes mhLaser {
    0% { top: 6px; }
    100% { top: calc(100% - 8px); }
  }

  /* Dynamic Crop Frame */
  .mh__cua {
    position: absolute; z-index: 3;
    border: 2px solid var(--accent); border-radius: var(--r-sm);
    box-shadow: 0 0 0 9999px rgb(0 0 0 / 70%), 0 0 20px var(--accent);
    transition: left 0.45s cubic-bezier(0.25, 1, 0.5, 1), width 0.3s var(--ease), height 0.3s var(--ease);
  }
  .mh__hud {
    position: absolute; top: 4px; left: 6px; right: 6px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 5;
  }
  .mh__hud-tag {
    font-size: 8px; font-weight: var(--fw-bold); letter-spacing: 0.06em;
    color: var(--accent-on); background: var(--accent);
    padding: 1px 5px; border-radius: 3px; text-transform: uppercase;
    box-shadow: 0 0 8px var(--accent);
  }
  .mh__hud-acc {
    font-size: 8px; font-weight: var(--fw-bold); color: var(--ok);
    font-family: monospace; text-shadow: 0 0 4px var(--ok);
  }

  /* HUD Corner Brackets */
  .mh__goc {
    position: absolute; width: 8px; height: 8px; border: 2px solid var(--accent-text);
  }
  .mh__goc--tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 3px; }
  .mh__goc--tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-top-right-radius: 3px; }
  .mh__goc--bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-bottom-left-radius: 3px; }
  .mh__goc--br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 3px; }

  /* Animated Subject Figure */
  .mh__nguoi {
    position: absolute; z-index: 2;
    transition: left 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    filter: drop-shadow(0 4px 12px rgb(0 0 0 / 80%));
  }
  .mh__dau {
    border-radius: 50%; background: linear-gradient(180deg, var(--text-1), var(--text-2));
    margin: 0 auto; box-shadow: 0 0 10px rgb(255 255 255 / 25%);
  }
  .mh__minh {
    border-radius: 8px 8px 3px 3px;
    background: linear-gradient(180deg, var(--accent-text), var(--bg-5));
    opacity: 0.9;
  }
  .mh__chu { color: var(--text-2); font-size: var(--fs-xs); line-height: 1.45; text-align: left; }
  .mh__chu b { color: var(--text-1); font-weight: var(--fw-semibold); }

  /* Upper Quick Action Pill Toolbar (.pills-row) */
  .pills-row {
    display: flex; align-items: center; gap: var(--sp-2);
  }
  .btn-pill {
    height: 32px; padding: 0 var(--sp-3);
    border-radius: var(--r-pill); border: 1px solid var(--line-strong);
    background: var(--bg-3); color: var(--text-2);
    font-family: var(--font-ui); font-size: var(--fs-xs); font-weight: var(--fw-medium);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; transition: all var(--dur) var(--ease); white-space: nowrap;
    flex: 1;
  }
  .btn-pill:hover:not(:disabled) {
    background: var(--bg-4); color: var(--text-1); border-color: var(--accent-line);
    box-shadow: 0 2px 8px rgb(255 87 20 / 15%);
  }
  .btn-pill:disabled { opacity: 0.45; cursor: not-allowed; }

  /* STUDIO CONSOLE CUSTOM DROPDOWN COMPONENT */
  .pill-group {
    display: inline-flex; align-items: center;
    border-radius: var(--r-pill); border: 1px solid var(--line-strong);
    background: var(--bg-3); flex: 1; position: relative;
    height: 32px;
    transition: border-color var(--dur) var(--ease);
  }
  .pill-group:hover { border-color: var(--accent-line); }
  .btn-pill--left {
    height: 100%; padding: 0 var(--sp-3); border: none;
    border-top-left-radius: var(--r-pill); border-bottom-left-radius: var(--r-pill);
    background: transparent; color: var(--text-2);
    font-family: var(--font-ui); font-size: var(--fs-xs); font-weight: var(--fw-medium);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; transition: all var(--dur) var(--ease); flex: 1;
  }
  .btn-pill--left:hover:not(:disabled) { background: var(--bg-4); color: var(--text-1); }
  .btn-pill--left:disabled { opacity: 0.45; cursor: not-allowed; }
  
  .custom-dropdown {
    position: relative;
    display: inline-flex; height: 100%;
  }
  .custom-dropdown__trigger {
    height: 100%; padding: 0 10px; border: none; border-left: 1px solid var(--line-2);
    border-top-right-radius: var(--r-pill); border-bottom-right-radius: var(--r-pill);
    background: var(--bg-4); color: var(--accent-text);
    font-family: var(--font-ui); font-size: var(--fs-xs); font-weight: var(--fw-bold);
    display: inline-flex; align-items: center; gap: 4px;
    cursor: pointer; outline: none;
    transition: all var(--dur) var(--ease);
  }
  .custom-dropdown__trigger:hover {
    background: var(--bg-5); color: var(--accent-hover);
  }
  
  .custom-dropdown__menu {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 9999;
    min-width: 100px;
    background: var(--bg-3); border: 1px solid var(--accent-line);
    border-radius: var(--r-md); padding: 4px;
    box-shadow: 0 8px 24px rgb(0 0 0 / 70%), 0 0 16px rgb(255 87 20 / 20%);
    display: flex; flex-direction: column; gap: 2px;
    backdrop-filter: blur(12px);
    animation: ddFadeIn 150ms var(--ease);
  }
  @keyframes ddFadeIn {
    from { opacity: 0; transform: translateY(-4px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .custom-dropdown__item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; border-radius: var(--r-sm);
    color: var(--text-2); font-size: var(--fs-xs); font-weight: var(--fw-medium);
    cursor: pointer; transition: all var(--dur) var(--ease);
  }
  .custom-dropdown__item:hover {
    background: var(--bg-hover); color: var(--text-1);
  }
  .custom-dropdown__item--selected {
    background: var(--accent-soft); color: var(--accent-text); font-weight: var(--fw-bold);
  }
  .custom-dropdown__item .res-check {
    opacity: 0; color: var(--accent); transition: opacity var(--dur) var(--ease);
  }
  .custom-dropdown__item--selected .res-check {
    opacity: 1;
  }

  /* Section Cards (.chon) */
  .chon {
    background: var(--bg-3); border: 1px solid var(--line-1);
    border-radius: var(--r-lg); padding: var(--sp-4);
    display: flex; flex-direction: column; gap: var(--sp-3);
  }
  .chon__nhan {
    font-size: var(--fs-xs); font-weight: var(--fw-semibold);
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3);
    display: flex; align-items: center; gap: var(--sp-2);
  }

  /* Aspect Ratio Selector Segment Grid (.seg) */
  .seg {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2);
    background: var(--bg-0); border: 1px solid var(--line-1);
    border-radius: var(--r-md); padding: var(--sp-1);
  }
  .seg__nut {
    height: 46px;
    display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
    background: transparent; border: 1px solid transparent; border-radius: var(--r-sm);
    color: var(--text-2); font-family: var(--font-ui); font-size: var(--fs-sm); font-weight: var(--fw-medium);
    cursor: pointer; transition: all var(--dur) var(--ease);
  }
  .seg__nut:hover { background: var(--bg-hover); color: var(--text-1); }
  .seg__nut--chon {
    background: var(--accent-soft); border-color: var(--accent-line);
    color: var(--accent-text); font-weight: var(--fw-semibold);
    box-shadow: inset 0 0 12px rgb(255 87 20 / 10%);
  }
  .seg__hinh {
    border: 1.5px solid currentColor; border-radius: 3px; flex: none;
    opacity: 0.85; transition: transform var(--dur) var(--ease);
  }
  .seg__nut--chon .seg__hinh { transform: scale(1.1); opacity: 1; }

  /* Buttons */
  .btn-chinh {
    height: var(--h-ctrl-lg);
    border: none; border-radius: var(--r-md);
    background: var(--accent); color: var(--accent-on);
    font-family: var(--font-ui); font-size: var(--fs-md); font-weight: var(--fw-bold);
    cursor: pointer; transition: all var(--dur) var(--ease);
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
    box-shadow: 0 2px 8px rgb(255 87 20 / 25%);
  }
  .btn-chinh:hover:not(:disabled) {
    background: var(--accent-hover);
    box-shadow: 0 4px 14px rgb(255 87 20 / 40%);
  }
  .btn-chinh:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  .btn-phu {
    height: var(--h-ctrl);
    border: 1px solid var(--line-strong); border-radius: var(--r-md);
    background: var(--bg-4); color: var(--text-1);
    font-family: var(--font-ui); font-size: var(--fs-sm); font-weight: var(--fw-medium);
    cursor: pointer; transition: all var(--dur) var(--ease);
    display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
    width: 100%;
  }
  .btn-phu:hover:not(:disabled) { background: var(--bg-5); border-color: var(--line-strong); color: var(--text-1); }
  .btn-phu:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Q&A Segment List (.dsDoan) */
  .ds {
    display: flex; flex-direction: column; gap: var(--sp-2);
    max-height: 240px; overflow-y: auto; padding-right: 2px;
  }
  .ds__muc {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-2) var(--sp-3);
    background: var(--bg-4); border: 1px solid var(--line-2);
    border-radius: var(--r-sm); cursor: pointer;
    transition: all var(--dur) var(--ease);
  }
  .ds__muc:hover { background: var(--bg-5); border-color: var(--line-strong); }
  .ds__muc input { accent-color: var(--accent); width: 15px; height: 15px; flex: none; cursor: pointer; border-radius: 3px; }
  .ds__giay {
    flex: none; padding: 2px 6px; border-radius: var(--r-pill);
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    font-size: var(--fs-2xs); font-weight: var(--fw-bold); color: var(--accent-text);
    font-variant-numeric: tabular-nums;
  }
  .ds__chu {
    flex: 1; font-size: var(--fs-xs); color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Notification Feedback Blocks */
  .canlam {
    padding: var(--sp-3); border-radius: var(--r-md);
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    color: var(--accent-text); font-size: var(--fs-xs); line-height: 1.4;
  }
  .loi {
    padding: var(--sp-3); border-radius: var(--r-md);
    background: rgb(255 95 109 / 12%); border: 1px solid rgb(255 95 109 / 30%);
    color: var(--danger); font-size: var(--fs-xs); white-space: pre-wrap; user-select: text;
  }

  /* Result Summary Box (.ketqua) */
  .ketqua {
    background: var(--bg-0); border: 1px solid var(--accent-line);
    border-radius: var(--r-lg); padding: var(--sp-4);
    display: none; flex-direction: column; gap: var(--sp-3);
    box-shadow: 0 0 16px rgb(255 87 20 / 10%);
  }
  .ketqua--hien { display: flex; }
  .ketqua__so { display: flex; gap: var(--sp-3); }
  .ketqua__so > div {
    flex: 1; background: var(--bg-3); border-radius: var(--r-md);
    border: 1px solid var(--line-1); padding: var(--sp-3); text-align: center;
  }
  .ketqua__so b {
    display: block; font-size: var(--fs-xl); color: var(--accent);
    font-family: var(--font-display); letter-spacing: var(--ls-display);
  }
  .ketqua__so span { color: var(--text-3); font-size: var(--fs-2xs); text-transform: uppercase; }

  /* ── DOAN DANG CHON (vung I-O) ──────────────────────────────────────────
     Khoi nay CHI HIEN khi tren timeline that su co vung khoanh. Khong co
     vung thi panel giu nguyen hinh dang cu — them tinh nang ma khong lam
     roi man hinh cua nguoi chua dung toi no. */
  .vung {
    background: var(--bg-3); border: 1px solid var(--accent-line);
    border-radius: var(--r-lg); padding: var(--sp-4);
    display: flex; flex-direction: column; gap: var(--sp-3);
    box-shadow: inset 0 0 20px rgb(255 87 20 / 6%);
  }
  .vung__dong { display: flex; align-items: center; gap: var(--sp-2); }
  .vung__nhan {
    font-size: var(--fs-xs); font-weight: var(--fw-semibold);
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3);
  }
  .vung__val {
    margin-left: auto; color: var(--accent-text);
    font-size: var(--fs-md); font-weight: var(--fw-bold);
    font-variant-numeric: tabular-nums; user-select: text;
  }
  .vung__chu {
    color: var(--text-2); font-size: var(--fs-xs); line-height: 1.45;
    padding: var(--sp-3); border-radius: var(--r-md);
    background: var(--bg-0); border: 1px solid var(--line-1);
  }
  .ketqua__dong { color: var(--text-2); font-size: var(--fs-xs); user-select: text; }
  .ketqua__dong b { color: var(--text-1); font-weight: var(--fw-semibold); }
</style>
</head>
<body>
  <!-- Topbar Header -->
  <div class="topbar">
    <div class="brand">
      <div class="brand__icon">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 7V4h3M17 4h3v3M4 17v3h3M20 17v3h-3M9 12h6M12 9v6"/></svg>
      </div>
      <span class="topbar__ten">Re-Frames</span>
    </div>
    <span class="topbar__ver">v0.6.0</span>
    <span class="topbar__host" id="host"></span>

    <div class="topbar__actions">
      <button class="btn-icon" title="Hướng dẫn / Guide" onclick="toggleHuongDan()">
        <svg class="ico ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
      </button>
      <button class="lang" id="lang" onclick="doiNgonNgu()"></button>
    </div>
  </div>

  <div class="than">
    <!-- HƯỚNG DẪN LẦN ĐẦU (.hd) -->
    <div class="hd" id="hd" style="display:none">
      <div class="hd__header">
        <span class="hd__title">
          <svg class="ico ico-sm" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span id="hdTitle">Hướng dẫn nhanh</span>
        </span>
      </div>
      <div class="hd__buoc"><span class="hd__so">1</span><span id="hd1"></span></div>
      <div class="hd__buoc"><span class="hd__so">2</span><span id="hd2"></span></div>
      <div class="hd__buoc"><span class="hd__so">3</span><span id="hd3"></span></div>
      <button class="btn-phu hd__ok" id="hdOk" onclick="dongHuongDan()"></button>
    </div>

    <!-- MINH HOẠ BÁM CHỦ THỂ DYNAMIC AI STAGE (.mh) -->
    <div class="mh">
      <div class="mh__header">
        <span class="mh__title">

    var s = t(k)
    Object.keys(thay || {}).forEach(function (kk) { s = s.split('{' + kk + '}').join(String(thay[kk])) })
    return s
  }

    menu.style.display = (menu.style.display === 'none' || !menu.style.display) ? 'flex' : 'none'
  }

    var nutXText = document.getElementById('nutXuatText')
    if (nutXText && !dangXuat) {
      nutXText.textContent = tp('nut_xuat', { res: doNhanXuat + 'p' })
    }
    var items = document.querySelectorAll('.custom-dropdown__item')
    items.forEach(function (it) {
      if (it.getAttribute('data-val') === doNhanXuat) {
        it.classList.add('custom-dropdown__item--selected')
      } else {
        it.classList.remove('custom-dropdown__item--selected')
      }
    })
    var menu = document.getElementById('resMenu')
    if (menu) menu.style.display = 'none'
  }

    var kV = document.getElementById('vung')
    if (typeof capNhatNutVung === 'function' && kV && kV.style.display !== 'none') capNhatNutVung()
  }

  /* DYNAMIC HIGH-TECH CONTINUOUS LOOPING ANIMATION STAGE */
  var animTimer = null
  var buocAnim = 0

  function capNhatKhungCua() {
    var khung = document.querySelector('.mh__khung')
    var cua = document.querySelector('.mh__cua')
    var k = KHUNG[dangChon]
    if (!khung || !cua) return
    var W = khung.clientWidth || 520
    var H = Math.round(W * 9 / 16)
    khung.style.height = H + 'px'
    var vien = 8
    var caoCua = H - vien * 2
    var rongCua = Math.round(caoCua * k.w / k.h)
    cua.style.top = vien + 'px'
    cua.style.height = caoCua + 'px'
    cua.style.width = rongCua + 'px'
  }

  function veMinhHoa() {
    var khung = document.querySelector('.mh__khung')
    var cua = document.querySelector('.mh__cua')
    var nguoi = document.querySelector('.mh__nguoi')
    var dau = document.querySelector('.mh__dau')
    var minh = document.querySelector('.mh__minh')
    var acc = document.getElementById('mhHudAcc')
    var k = KHUNG[dangChon]
    if (!khung || !cua || !nguoi) return

    var W = khung.clientWidth || 520
    if (W < 200) W = 520
    var H = Math.round(W * 9 / 16)
    khung.style.height = H + 'px'

    var caoNguoi = Math.round(H * 0.52)
    var rongNguoi = Math.round(caoNguoi * 0.44)
    var dDau = Math.round(rongNguoi * 0.65)
    nguoi.style.width = rongNguoi + 'px'
    nguoi.style.height = caoNguoi + 'px'
    nguoi.style.bottom = Math.round(H * 0.1) + 'px'
    dau.style.width = dDau + 'px'
    dau.style.height = dDau + 'px'
    minh.style.width = rongNguoi + 'px'
    minh.style.height = (caoNguoi - dDau - 4) + 'px'
    minh.style.marginTop = '4px'

    capNhatKhungCua()
    var vien = 8
    var caoCua = H - vien * 2
    var rongCua = Math.round(caoCua * k.w / k.h)

    var cacViTri = [0.28, 0.68, 0.45, 0.76]
    var posRatio = cacViTri[buocAnim % cacViTri.length]
    buocAnim++

    var tamNguoi = Math.round(W * posRatio)
    var traiNguoi = tamNguoi - Math.round(rongNguoi / 2)
    var traiCua = tamNguoi - Math.round(rongCua / 2)
    if (traiCua < vien) traiCua = vien
    if (traiCua > W - rongCua - vien) traiCua = W - rongCua - vien

    nguoi.style.left = traiNguoi + 'px'
    cua.style.left = traiCua + 'px'

    if (acc) {
      acc.textContent = (98.5 + (Math.random() * 1.2)).toFixed(1) + '%'
    }
  }

  function batDauAnimLoop() {
    if (animTimer) clearInterval(animTimer)
    veMinhHoa()
    animTimer = setInterval(veMinhHoa, 2200)
  }

  window.addEventListener('resize', function () { capNhatKhungCua() })

  function napLaiHost(xong) {
    var ext = cs.getSystemPath(SystemPath.EXTENSION).replace(/\\/g, '/')
    var lenh = 'var __n="OK"; try { $.evalFile("' + ext + '/host/index.jsx") } catch(e) { __n="ERR:"+e } __n'
    cs.evalScript(lenh, function (kq) { xong(String(kq).indexOf('OK') === 0) })
  }

  function hien(id, text) {
    var el = document.getElementById(id)
    el.style.display = text ? '' : 'none'
    el.textContent = text || ''
  }

  /* ════════════════════════════════════════════════════════════════════════
     ĐOẠN ĐANG CHỌN — vùng I–O trên timeline
     ────────────────────────────────────────────────────────────────────────
     ☠️ Adobe KHÔNG bắn sự kiện sang panel khi người dùng bấm I/O. Không có
     onChange nào cả. Panel không tự hỏi thì vĩnh viễn hiện số của lần đọc đầu
     tiên — và hỏng IM LẶNG. `window.addEventListener('focus')` cũng không đủ:
     bấm I/O trên timeline thì panel không hề nhận focus (Autocut đã dính
     đúng chỗ này 19/08).
     ⇒ Vòng thăm dò 1 giây: mỗi nhịp chỉ đọc 2 con số (rẻ), mốc ĐỔI mới gọi
       hàm nặng duyệt clip.
     ════════════════════════════════════════════════════════════════════════ */
  var hostSan = false
  var mocVung = ''       // "in|out" lần đọc trước — để biết vùng có ĐỔI THẬT
  var vungTu = 0, vungDen = 0
  var vungDs = []        // [{srcTu, srcDen, iDuong}]
  var vungDuong = []     // bảng đường dẫn, tách riêng vì đường có dấu phẩy
  var vungChongLan = 0
  var vungTat = 0
  var nhipVung = 0       // đếm nhịp để định kỳ làm mới đầy đủ
  var dangLamVung = false
  var kqCuaVung = false  // khối kết quả đang hiện có phải của đường vùng không

  /** Gọi host, tự nạp lại host nếu hàm chưa có (panel mới + host cũ). */
  function goiHost(lenh, cb) {
    function chay() {
      cs.evalScript(lenh, function (raw) {
        raw = String(raw)
        if (raw.indexOf('OK:') === 0 || raw.indexOf('ERR:') === 0) return cb(raw)
        // Host chưa nạp (hoặc nạp bản cũ) — nạp lại đúng MỘT lần rồi thử lại.
        hostSan = false
        napLaiHost(function (ok) {
          if (!ok) return cb('ERR:KHONG_NAP_HOST|')
          hostSan = true
          cs.evalScript(lenh, function (r2) { cb(String(r2)) })
        })
      })
    }
    if (hostSan) return chay()
    napLaiHost(function (ok) {
      if (!ok) return cb('ERR:KHONG_NAP_HOST|')
      hostSan = true
      chay()
    })
  }

  function docKV(raw) {
    var kv = {}, ds = []
    String(raw).slice(3).split('\n').forEach(function (d) {
      var i = d.indexOf('=')
      if (i <= 0) return
      var k = d.slice(0, i), v = d.slice(i + 1)
      if (k === 'clip') ds.push(v)
      else kv[k] = v
    })
    kv.__clips = ds
    return kv
  }

  function chuDai(giay) {
    var g = Math.round(giay)
    if (g < 60) return tp('vung_giay', { g: g })
    return tp('vung_phut_giay', { p: Math.floor(g / 60), g: g % 60 })
  }

  /** Xoá sạch trạng thái vùng — dùng khi bỏ khoanh vùng hoặc đổi sequence.
   *  ☠️ Để số cũ nằm đó còn tệ hơn hiện "chưa có": nó nói về một vùng KHÔNG
   *  CÒN TỒN TẠI, mà nút bên cạnh thì vẫn bấm được. */
  function xoaVung() {
    mocVung = ''
    vungDs = []; vungDuong = []; vungChongLan = 0; vungTat = 0
    document.getElementById('vung').style.display = 'none'
    hien('vungChu', '')
    if (kqCuaVung) {
      document.getElementById('ketqua').className = 'ketqua'
      kqCuaVung = false
    }
  }

  /** Hàm NẶNG (duyệt mọi clip mọi track) — chỉ gọi khi mốc I–O đã đổi. */
  function docVungDayDu() {
    goiHost('rf_getRangeClips()', function (raw) {
      if (raw.indexOf('OK:') !== 0) {
        // Vùng vẫn còn nhưng không dùng được — nói thẳng, đừng để nút sáng.
        vungDs = []; vungDuong = []
        var ma = raw.indexOf('ERR:') === 0 ? raw.slice(4).split('|')[0] : ''
        hien('vungChu', ma === 'VUNG_KHONG_CO_CLIP' ? t('vung_khong_clip') : '')
        capNhatNutVung()
        return
      }
      var kv = docKV(raw)
      vungChongLan = parseInt(kv.chongLan || '0', 10)
      vungTat = parseInt(kv.soTat || '0', 10)
      vungDs = []; vungDuong = []
      kv.__clips.forEach(function (d) {
        // "kind,tr,cl,seqTu,seqDen,srcTu,srcDen,speed,duong" — đường ở CUỐI
        // vì nó có thể chứa dấu phẩy.
        var p = d.split(',')
        if (p.length < 9) return
        var duong = p.slice(8).join(',').replace(/\\/g, '/')
        var i = vungDuong.indexOf(duong)
        if (i < 0) { vungDuong.push(duong); i = vungDuong.length - 1 }
        vungDs.push({ srcTu: parseFloat(p[5]), srcDen: parseFloat(p[6]), iDuong: i })
      })
      capNhatNutVung()
    })
  }

  function capNhatNutVung() {
    var khoi = document.getElementById('vung')
    var nut = document.getElementById('nutVung')
    var val = document.getElementById('vungVal')
    khoi.style.display = ''
    val.textContent = chuDai(vungDen - vungTu)
    nut.textContent = dangLamVung
      ? t('vung_dang_lam')
      : tp('vung_nut', { ten: tenTiLe().toLowerCase() })

    // Nút chính khi có vùng là nút VÙNG — hạ nút tìm-đoạn xuống nút phụ để
    // màn hình chỉ có một nút chính (luật UI của bộ AiO).
    var nutTim = document.getElementById('nutTim')
    if (nutTim && !document.querySelectorAll('#dsDoan .ds__muc').length) {
      nutTim.className = 'btn-phu'
    }

    if (vungChongLan > 0) {
      hien('vungChu', tp('vung_chong_lan', { n: vungChongLan }))
      nut.disabled = true
      return
    }
    if (!vungDs.length) { nut.disabled = true; return }
    nut.disabled = dangLamVung || dangChay || dangTim || dangXuat
    var chu = vungDs.length > 1
      ? tp('vung_nhieu_clip', { n: vungDs.length, ten: tenTiLe().toLowerCase() })
      : ''
    if (vungTat > 0) chu += tp('vung_bo_clip_tat', { n: vungTat })
    hien('vungChu', chu)
  }

  /** Dựng lại đúng đoạn đang khoanh thành một bản khung đích bám chủ thể.
   *
   *  ☠️ ĐỌC LẠI VÙNG NGAY TRƯỚC KHI DỰNG — không dùng số đang hiện.
   *  Màn hình có thể trễ tới vài giây (vòng thăm dò chỉ so mốc I–O), nhưng
   *  DỰNG thì không được phép trễ một nhịp nào: dựng theo vùng cũ là ra một
   *  bản sai trên project thật. Đọc lại tốn vài chục mili giây, đổi lấy việc
   *  "hiển thị có thể trễ" KHÔNG BAO GIỜ thành "dựng sai".
   */
  function lamVung() {
    if (!vungDs.length || vungChongLan > 0) return
    goiHost('rf_getRangeClips()', function (raw) {
      if (raw.indexOf('OK:') !== 0) { docVungDayDu(); return }
      var kv = docKV(raw)
      var vi = parseFloat(kv['in']), vo = parseFloat(kv.out)
      var mocNay = vi.toFixed(3) + '|' + vo.toFixed(3)
      // Vùng đã khác lúc bấm -> cập nhật rồi DỪNG, bắt bấm lại. Thà bắt bấm
      // thêm một cái còn hơn dựng nhầm đoạn.
      if (mocNay !== mocVung || parseInt(kv.chongLan || '0', 10) > 0) {
        mocVung = mocNay; vungTu = vi; vungDen = vo
        docVungDayDu()
        return
      }
      lamVungThat()
    })
  }

  function lamVungThat() {
    var k = KHUNG[dangChon]
    var soClip = vungDs.length
    var daiCan = vungDen - vungTu
    dangLamVung = true
    dangChay = true
    capNhatNutVung()
    veSeg()
    hien('canlam', ''); hien('loi', '')
    document.getElementById('ketqua').className = 'ketqua'

    var ds = vungDs.map(function (d) {
      return d.srcTu.toFixed(3) + ',' + d.srcDen.toFixed(3) + ',' + d.iDuong
    }).join(';')
    // Tên ASCII (ExtendScript hay vỡ font với dấu tiếng Việt).
    var ten = 'Doan ' + Math.round(vungTu) + 's-' + Math.round(vungDen) + 's - ' + k.nhan

    goiHost(
      'rf_catVung("' + ds + '","' + vungDuong.join('|~|') + '",' + k.w + ',' + k.h + ',"' + ten + '")',
      function (raw) {
        dangLamVung = false
        dangChay = false
        veSeg()
        if (raw.indexOf('OK:') === 0) {
          var kv = docKV(raw)
          document.getElementById('soClip').textContent = kv.daGan || '0'
          document.getElementById('khung').textContent = (kv.khung || '').replace('x', '×')
          var dong = tp('vung_xong', {
            ten: kv.seqMoi || '', dai: chuDai(daiCan), n: soClip,
          })
          // ☠️ Không tin biên lai: so DÀI THẬT với dài cần lấy, lệch thì nói.
          var that = parseFloat(kv.daiThat || '0'), can = parseFloat(kv.daiMongMuon || '0')
          if (can > 0 && Math.abs(that - can) > 0.2) {
            dong += tp('vung_lech', { that: that.toFixed(2), can: can.toFixed(2) })
          }
          document.getElementById('kqDong').innerHTML = dong
          document.getElementById('ketqua').className = 'ketqua ketqua--hien'
          kqCuaVung = true
          if (parseInt(kv.soLoi || '0', 10) > 0) {
            hien('loi', tp('clip_khong_gan', { n: kv.soLoi }) + (kv.loiDau || '?'))
          }
          // Sequence vừa tạo đã được mở ra -> vùng cũ không còn nghĩa gì nữa.
          mocVung = ''
        } else if (raw.indexOf('ERR:') === 0) {
          var ma = raw.slice(4).split('|')[0]
          if (NGON_NGU.vi['cl_' + ma] !== undefined) hien('canlam', t('cl_' + ma))
          else if (NGON_NGU.vi['l_' + ma] !== undefined) hien('loi', t('vung_loi') + t('l_' + ma))
          else hien('loi', t('vung_loi') + '\n' + raw)
        } else {
          hien('loi', t('host_la') + '\n' + raw)
        }
        capNhatNutVung()
      },
    )
  }

  function lamDoc() {
    var k = KHUNG[dangChon]
    var nut = document.getElementById('nut')
    dangChay = true
    nut.disabled = true
    veSeg()
    hien('canlam', ''); hien('loi', '')
    document.getElementById('ketqua').className = 'ketqua'

    napLaiHost(function (ok) {
      if (!ok) { xong(); hien('loi', t('khong_nap_host_file')); return }
      cs.evalScript('rf_lamDoc(' + k.w + ',' + k.h + ',"' + k.nhan + '")', function (raw) {
        xong()
        raw = String(raw)
        if (raw.indexOf('OK:') === 0) {
          var kv = {}
          raw.slice(3).split('\n').forEach(function (d) {
            var i = d.indexOf('=')
            if (i > 0) kv[d.slice(0, i)] = d.slice(i + 1)
          })
          document.getElementById('soClip').textContent = kv.daGan || '0'
          document.getElementById('khung').textContent = (kv.khung || '').replace('x', '×')
          document.getElementById('kqDong').innerHTML = tp('kq_dong', { ten: kv.seqMoi || '' })
          document.getElementById('ketqua').className = 'ketqua ketqua--hien'
          if (parseInt(kv.soLoi || '0', 10) > 0) {
            hien('loi', tp('clip_khong_gan', { n: kv.soLoi }) + (kv.loiDau || '?'))
          }
          if (parseInt(kv.daCoSan || '0', 10) > 0) {
            hien('canlam', tp('da_co_san', { n: kv.daCoSan }))
          }
        } else if (raw.indexOf('ERR:') === 0) {
          var ma = raw.slice(4).split('|')[0]
          if (NGON_NGU.vi['cl_' + ma] !== undefined) hien('canlam', t('cl_' + ma))
          else if (NGON_NGU.vi['l_' + ma] !== undefined) hien('loi', t('l_' + ma) + '\n' + raw)
          else hien('loi', t('loi_khong_ro') + '\n' + raw)
        } else {
          hien('loi', t('host_la') + '\n' + raw)
        }
      })
    })

    function xong() {
      dangChay = false
      document.getElementById('nut').disabled = false
      veSeg()
    }
  }

  function layFs() {
    try { if (window.cep_node && window.cep_node.require) return window.cep_node.require('fs') } catch (e) {}
    try { if (typeof require === 'function') return require('fs') } catch (e) {}
    return null
  }

  function chiaDoan(cau) {
    var viTriHoi = []
    cau.forEach(function (c, i) { if (/\?\s*$/.test(String(c.chu).trim())) viTriHoi.push(i) })
    var ds = []
    for (var k = 0; k < viTriHoi.length; k++) {
      var dau = viTriHoi[k]
      var cuoi = (k + 1 < viTriHoi.length ? viTriHoi[k + 1] : cau.length) - 1
      if (cuoi <= dau) continue
      var dai = cau[cuoi].den - cau[dau].tu
      if (dai < 20 || dai > 180) continue
      ds.push({ tu: cau[dau].tu, den: cau[cuoi].den, dai: dai, hoi: String(cau[dau].chu).trim() })
    }
    return ds.slice(0, 12)
  }

  var dsDoan = []
  var duongMedia = ''
  var dangTim = false
  var dangXuat = false

  function timFfmpeg(fs) {
    var goc = cs.getSystemPath(SystemPath.EXTENSION).replace(/\\/g, '/')
    var ung = ['com.aiostudio.transcript', 'com.aiostudio.autocut']
    for (var i = 0; i < ung.length; i++) {
      var p = goc.replace(/com\.aiostudio\.[a-z]+$/, ung[i]) + '/bin/win64/ffmpeg.exe'
      try { if (fs.existsSync(p)) return p } catch (e) {}
    }
    return null
  }

  function xuatCheck() {
    var nutX = document.getElementById('nutXuat')
    var nutXText = document.getElementById('nutXuatText')
    dangXuat = true
    nutX.disabled = true
    if (nutXText) nutXText.textContent = t('dang_xuat')
    hien('canlam', ''); hien('loi', '')

    function xongXuat(canLamText, loiText) {
      dangXuat = false
      nutX.disabled = false
      if (nutXText) nutXText.textContent = tp('nut_xuat', { res: doNhanXuat + 'p' })
      if (canLamText) hien('canlam', canLamText)
      if (loiText) hien('loi', loiText)
    }

    napLaiHost(function (ok) {
      if (!ok) { xongXuat(null, t('khong_nap_host_file')); return }
      cs.evalScript('rf_thongTinXuat()', function (raw) {
        raw = String(raw)
        if (raw.indexOf('OK:') !== 0) {
          var ma = raw.indexOf('ERR:') === 0 ? raw.slice(4).split('|')[0] : ''
          if (ma === 'NHIEU_CLIP') xongXuat(tp('xuat_nhieu_clip', { n: raw.split('|')[1] || '?' }), null)
          else if (ma === 'CHUA_MO_SEQUENCE') xongXuat(t('cl_CHUA_MO_SEQUENCE'), null)
          else xongXuat(null, t('xuat_loi') + raw)
          return
        }
        var kv = {}
        raw.slice(3).split('\n').forEach(function (d) {
          var i = d.indexOf('=')
          if (i > 0) kv[d.slice(0, i)] = d.slice(i + 1)
        })
        var fs = layFs()
        if (!fs) { xongXuat(null, t('thieu_node')); return }
        var ffmpeg = timFfmpeg(fs)
        if (!ffmpeg) { xongXuat(t('xuat_thieu_ffmpeg'), null); return }

        var goc = String(kv.duong).replace(/\\/g, '/')
        var tu = parseFloat(kv.tuGiay)
        var dai = parseFloat(kv.denGiay) - tu
        var thuMuc = goc.slice(0, goc.lastIndexOf('/'))
        var tenSach = String(kv.ten).replace(/[^\w\- ]/g, '').replace(/\s+/g, ' ').trim() || 'short'
        var resVal = doNhanXuat || '720'
        var ra = thuMuc + '/' + tenSach + '-check-' + resVal + 'p.mp4'

        var cp = null
        try { cp = window.cep_node ? window.cep_node.require('child_process') : require('child_process') } catch (e) {}
        if (!cp) { xongXuat(null, t('thieu_node')); return }

        var nsCpu = AiOTaiNguyen.chiaLuong(1)
        var bitRate = resVal === '360' ? '1200k' : resVal === '480' ? '1800k' : '2500k'
        var thamSo = [
          '-y', '-threads', String(nsCpu.luongMoi),
          '-ss', tu.toFixed(3), '-i', goc, '-t', dai.toFixed(3),
          '-vf', 'scale=-2:' + resVal,
          '-c:v', 'libopenh264', '-b:v', bitRate,
          '-c:a', 'aac', '-b:a', '128k',
          ra,
        ]
        var duoiLoi = ''
        var con = cp.execFile(ffmpeg, thamSo, { windowsHide: true, maxBuffer: AiOTaiNguyen.tranDemLog() }, function (err) {
          if (err) { xongXuat(null, t('xuat_loi') + (duoiLoi.slice(-300) || String(err))); return }
          var mb = '?'
          try { mb = (fs.statSync(ra.replace(/\//g, '\\')).size / 1048576).toFixed(1) } catch (e2) {
            try { mb = (fs.statSync(ra).size / 1048576).toFixed(1) } catch (e3) {}
          }
          xongXuat(tp('xuat_xong', { ten: tenSach + '-check-' + resVal + 'p.mp4', giay: dai.toFixed(0), mb: mb }), null)
        })
        if (con && con.stderr) con.stderr.on('data', function (d) { duoiLoi += String(d) })
      })
    })
  }

  function timDoan() {
    var nutTim = document.getElementById('nutTim')
    dangTim = true
    nutTim.disabled = true
    hien('taoKq', '')
    napLaiHost(function (ok) {
      if (!ok) { dangTim = false; nutTim.disabled = false; return }
      cs.evalScript('rf_duongDanMedia()', function (raw) {
        raw = String(raw)
        if (raw.indexOf('OK:') !== 0) {
          dangTim = false; nutTim.disabled = false
          return
        }
        duongMedia = raw.slice(3)
        var fs = layFs()
        if (!fs) { dangTim = false; nutTim.disabled = false; return }
        var demPath = duongMedia.replace(/\\/g, '/').replace(/\.[^.\/]+$/, '') + '.autocut-nghe.json'
        var j = null
        try { j = JSON.parse(fs.readFileSync(demPath, 'utf8')) } catch (e) {}
        if (!j || !j.cau || !j.cau.length) {
          dangTim = false; nutTim.disabled = false
          return
        }
        dsDoan = chiaDoan(j.cau)
        dangTim = false; nutTim.disabled = false
        if (!dsDoan.length) return
        veDsDoan()
      })
    })
  }

  function veDsDoan() {
    var khungDs = document.getElementById('dsDoan')
    khungDs.innerHTML = ''
    khungDs.style.display = ''
    dsDoan.forEach(function (d) {
      var hang = document.createElement('label')
      hang.className = 'ds__muc'
      var tick = document.createElement('input')
      tick.type = 'checkbox'
      tick.checked = true
      tick.onchange = capNhatNutTao
      hang.appendChild(tick)
      var giay = document.createElement('span')
      giay.className = 'ds__giay'
      giay.textContent = Math.round(d.dai) + 's'
      hang.appendChild(giay)
      var chu = document.createElement('span')
      chu.className = 'ds__chu'
      chu.textContent = d.hoi
      chu.title = d.hoi
      hang.appendChild(chu)
      khungDs.appendChild(hang)
    })
    capNhatNutTao()
  }

  function demTick() {
    return [].filter.call(document.querySelectorAll('#dsDoan input'), function (t) { return t.checked }).length
  }

  function capNhatNutTao() {
    var n = demTick()
    var nutTao = document.getElementById('nutTao')
    var nutTim = document.getElementById('nutTim')
    var coDs = document.querySelectorAll('#dsDoan .ds__muc').length > 0
    nutTao.style.display = n ? '' : 'none'
    nutTao.textContent = tp('tao_short', { n: n, ten: tenTiLe().toLowerCase() })
    nutTim.className = coDs ? 'btn-phu' : 'btn-chinh'
    nutTim.textContent = coDs ? t('tim_lai') : t('tim_doan')
  }

  function taoShorts() {
    var k = KHUNG[dangChon]
    var chon = []
    var ticks = document.querySelectorAll('#dsDoan input')
    dsDoan.forEach(function (d, i) { if (ticks[i] && ticks[i].checked) chon.push(d) })
    if (!chon.length) return
    var nutTao = document.getElementById('nutTao')
    var nutTim = document.getElementById('nutTim')
    dangChay = true
    nutTao.disabled = true
    nutTim.disabled = true
    var xongDs = []
    var i = 0
    ;(function tiep() {
      if (i >= chon.length) {
        dangChay = false
        nutTao.disabled = false
        dangTim = false; nutTim.disabled = false
        capNhatNutTao()
        hien('taoKq', tp('da_tao', { x: xongDs.length, n: chon.length }))
        return
      }
      var d = chon[i]
      nutTao.textContent = tp('dang_tao_short', { i: i + 1, n: chon.length })
      var ten = 'Short ' + (i + 1) + ' - ' + k.nhan
      var duong = duongMedia.replace(/\\/g, '/')
      cs.evalScript(
        'rf_catShort("' + duong + '",' + d.tu.toFixed(3) + ',' + d.den.toFixed(3) + ',' + k.w + ',' + k.h + ',"' + ten + '")',
        function (raw) {
          raw = String(raw)
          if (raw.indexOf('OK:') === 0) xongDs.push(ten)
          else hien('loi', tp('short_loi', { i: i + 1 }) + raw)
          i++
          tiep()
        },
      )
    })()
  }

  var dangSoi = false
  function soi() {
    if (dangChay || dangSoi) return
    dangSoi = true
    cs.evalScript(
      // Nhịp thăm dò phải RẺ: đọc thẳng vài con số, KHÔNG gọi hàm host duyệt
      // clip. Mốc I–O đổi thì mới hỏi tiếp bằng rf_getRangeClips.
      '(function(){try{var v=String(app.version);var p=(app.project&&app.project.name)?String(app.project.name):"";var s=app.project?app.project.activeSequence:null;var t=s?s.getSettings():null;var md="";try{for(var i=0;i<s.videoTracks.numTracks;i++){if(s.videoTracks[i].clips.numItems>0){md=String(s.videoTracks[i].clips[0].projectItem.getMediaPath());break}}}catch(e2){}var vi=-1,vo=-1;try{vi=s.getInPointAsTime().seconds;vo=s.getOutPointAsTime().seconds}catch(e3){}return v+"|~|"+p+"|~|"+(s?String(s.name):"")+"|~|"+(t?t.videoFrameWidth+"x"+t.videoFrameHeight:"")+"|~|"+md+"|~|"+vi+"|~|"+vo}catch(e){return ""}})()',
      function (raw) {
        dangSoi = false
        raw = String(raw)
        var nut = document.getElementById('nut')
        var nutTim = document.getElementById('nutTim')
        var host = document.getElementById('host')
        var phan = raw.split('|~|')
        var khoa = function (batDuoc, coSeq) {
          if (dangChay || dangTim || dangXuat) return
          nut.disabled = !batDuoc
          nutTim.disabled = !batDuoc
          document.getElementById('nutXuat').disabled = !coSeq
        }
        if (phan.length < 4) {
          host.textContent = t('cho_premiere')
          khoa(false, false)
          return
        }
        host.textContent = 'Premiere ' + phan[0] + (phan[1] ? ' · ' + phan[1] : '')
        var ten = phan[2]
        var kich = phan[3].split('x')
        if (!ten) {
          khoa(false, false)
          return
        }
        var ngang = parseInt(kich[0], 10) > parseInt(kich[1], 10)
        if (ngang) {
          khoa(true, true)
        } else {
          khoa(false, true)
        }

        var media = (phan[4] || '').replace(/\\/g, '/')
        if (dsDoan.length && duongMedia && media && media !== duongMedia.replace(/\\/g, '/')) {
          xoaDanhSachDoan()
        }

        // ── VÙNG I–O ─────────────────────────────────────────────────────
        // ☠️ Chưa khoanh vùng thì Premiere trả **-400000**, không phải -1 và
        // không ném lỗi (đo thật 27/08 trên 27.0.0). Phải kiểm "< 0".
        var vi = parseFloat(phan[5]), vo = parseFloat(phan[6])
        if (isNaN(vi) || isNaN(vo) || vi < 0 || vo < 0 || vo <= vi) {
          if (mocVung !== '') xoaVung()
          return
        }
        var moc = vi.toFixed(3) + '|' + vo.toFixed(3)
        if (moc === mocVung) {
          // ☠️ MỐC I–O ĐỨNG YÊN KHÔNG CÓ NGHĨA LÀ VÙNG KHÔNG ĐỔI.
          // Đo thật 27/08: tắt một clip trên track trên thì mốc không nhúc
          // nhích, mà nội dung vùng đổi hẳn (hết chồng lấn) — panel đứng im
          // 5 giây vẫn báo cảnh báo cũ. Nhịp nào cũng duyệt lại mọi clip thì
          // đắt trên sequence lớn, nên làm mới đầy đủ mỗi 4 nhịp.
          nhipVung++
          if (nhipVung % 4 === 0 && vungTu !== vungDen) docVungDayDu()
          return
        }
        mocVung = moc
        nhipVung = 0
        vungTu = vi; vungDen = vo
        // Vùng đổi = mọi số đang hiện thuộc về vùng CŨ. Hiện ngay độ dài mới
        // từ hai con số vừa đọc (khỏi đợi hàm nặng), rồi mới hỏi chi tiết.
        if (kqCuaVung) {
          document.getElementById('ketqua').className = 'ketqua'
          kqCuaVung = false
        }
        vungDs = []; vungChongLan = 0; vungTat = 0
        capNhatNutVung()
        docVungDayDu()
      },
    )
  }

  function xoaDanhSachDoan() {
    dsDoan = []
    duongMedia = ''
    var khungDs = document.getElementById('dsDoan')
    khungDs.innerHTML = ''
    khungDs.style.display = 'none'
    document.getElementById('nutTao').style.display = 'none'
    capNhatNutTao()
  }
  window.setInterval(soi, 1000)
  // Người dựng sửa bên Premiere rồi mới click sang panel — lúc đó là lúc số
  // trên panel phải đúng nhất, nên focus thì làm mới ĐẦY ĐỦ luôn, không đợi
  // đủ 4 nhịp. (Chỉ focus thôi thì KHÔNG đủ: bấm I/O trên timeline panel
  // không hề nhận focus — vì vậy mới có vòng thăm dò ở trên.)
  window.addEventListener('focus', function () {
    soi()
    if (mocVung && !dangChay) docVungDayDu()
  })

  function dongHuongDan() {
    document.getElementById('hd').style.display = 'none'
    try { localStorage.setItem('aio-rf-daXemHuongDan', '1') } catch (e) {}
  }
  function toggleHuongDan() {
    var el = document.getElementById('hd')
    el.style.display = (el.style.display === 'none') ? '' : 'none'
  }
  try {
    if (!localStorage.getItem('aio-rf-daXemHuongDan')) {
      document.getElementById('hd').style.display = ''
    }
  } catch (e) {}

  document.addEventListener('DOMContentLoaded', function () {
    apNgonNgu()
    veSeg()
    batDauAnimLoop()
  })
  window.addEventListener('load', function () {
    veSeg()
    batDauAnimLoop()
  })

  apNgonNgu()
  veSeg()
  batDauAnimLoop()
  soi()
</script>
</body>
</html>
