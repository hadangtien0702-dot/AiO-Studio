<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AiO Studio — Guide Frame · thiết kế mới</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="./CSInterface.js"></script>
<script src="./safe-zones.js"></script>
<script src="./ve-guide.js"></script>
<!--
  AiO Guide Frame — thiết kế mới, dựng theo design system "Studio Console".
  Số liệu safe zone lấy nguyên từ safe-zones.json (phiên bản 2026-08-01).
  Phép tính lệch tỉ lệ khớp đúng host: khung đích lồng GIỮA sequence, fit-inside.

  ☠️ GHÉP VÀO PANEL 2026-08-06 — file này là bản THIẾT KẾ ANH TIẾN CHỐT
  (AiO Design System/AiO Auto Guiline Frame/AiO Guide Frame.html) đã nối dây
  thật vào Premiere. Hình thức giữ nguyên; phần thêm vào đều dùng ĐÚNG class
  CSS có sẵn trong chính file thiết kế. Sửa hình thì sửa ở file thiết kế trước.

  ☠️ SỐ LIỆU: KHÔNG đọc từ mảng NEN_GOC bên dưới nữa — nạp từ safe-zones.js
  (sinh từ safe-zones.json = nguồn chân lý). NEN_GOC chỉ là lưới an toàn khi
  file dữ liệu không nạp được.
-->
<style>
/* ============ FONT ============ */
@font-face{font-family:'Inter var';font-style:normal;font-weight:100 900;
  font-display:swap;src:url('../fonts/Inter.woff2') format('woff2');}
@font-face{font-family:'Inter var';font-style:italic;font-weight:100 900;
  font-display:swap;src:url('../fonts/Inter-Italic.woff2') format('woff2');}

/* ============ TOKENS — chép nguyên từ DESIGN-SYSTEM.md §15 ============ */
:root{
  color-scheme:dark;
  --bg-0:#0e0e0e; --bg-1:#141414; --bg-2:#181818; --bg-3:#1f1f1f;
  --bg-4:#282828; --bg-5:#333333; --bg-6:#161616;
  --bg-hover:rgb(255 255 255 /5%); --bg-active:rgb(255 255 255 /9%);
  --line-1:rgb(255 255 255 /6%); --line-2:rgb(255 255 255 /10%); --line-strong:rgb(255 255 255 /16%);
  --text-1:#f5f5f7; --text-2:#c3c3c8; --text-3:#8d8d95; --text-meta:#9b9ba3; --icon-dim:#8f8f97;
  --accent:#f86820; --accent-hover:#ff7d3c; --accent-pressed:#e0590e;
  --accent-soft:rgb(248 104 32 /16%); --accent-line:rgb(248 104 32 /40%);
  --accent-text:#ffb891; --accent-on:#ffffff;
  --ok:#4ec98a; --warn:#e8c05a; --danger:#ff5f6d; --danger-strong:#ff4757; --heart:#ff6b81;
  --font-ui:'Inter var','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px; --fs-xl:19px;
  --fw-normal:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
  --lh-tight:1.25; --lh:1.45; --ls-display:-0.014em;
  --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:24px;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;
  --shadow-sm:0 1px 2px rgb(0 0 0 /30%); --shadow-md:0 8px 24px rgb(0 0 0 /45%);
  --h-ctrl-sm:24px; --h-ctrl:28px; --h-ctrl-lg:34px; --h-topbar:44px;
  --dur:150ms; --ease:cubic-bezier(.32,.72,0,1);
  --focus-ring:0 0 0 3px var(--accent-soft);
  --z-dropdown:100; --z-sticky:200; --z-modal:300; --z-toast:400; --z-tooltip:500;
  --pr-video:#729ACC; --pr-video-head:#5b7ea8; --pr-audio:#1D7021;
  /* ba LOẠI vùng — ba việc khác nhau nên ba cách vẽ khác nhau, không đỏ tất */
  --z-ui:#ff5f6d;          /* bị UI nền tảng che       */
  --z-crop:#e8c05a;        /* bị CẮT ở ngữ cảnh khác   */
  --z-goi:#7cc4f0;         /* chỉ là khuyến nghị       */
  --z-an:#4ec98a;          /* vùng an toàn             */
}

*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
body{background:var(--bg-2);color:var(--text-1);font:var(--fw-normal) var(--fs-md)/var(--lh) var(--font-ui);
  -webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1;}
svg{display:block}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:14px;height:14px}
:where(button,[tabindex],input,select):focus-visible{
  outline:none;border-color:var(--accent-line);box-shadow:var(--focus-ring)}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:transparent;border-radius:var(--r-pill);
  border:2px solid transparent;background-clip:content-box}
*:hover::-webkit-scrollbar-thumb{background:rgb(255 255 255 /14%)}
*::-webkit-scrollbar-thumb:hover{background:rgb(255 255 255 /22%);background-clip:content-box}

/* ============ THANH TRÊN ============ */
.topbar{height:var(--h-topbar);background:var(--bg-1);border-bottom:1px solid var(--line-1);
  display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5)}
.brand-ico{color:var(--accent)}
.brand-ico[data-host="off"]{color:var(--text-3)}
.brand{font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.ver{font-size:var(--fs-xs);color:var(--text-3)}
.spacer{flex:1}
.host{font-size:var(--fs-sm);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.host b{color:var(--text-2);font-weight:var(--fw-medium)}
.host i{color:var(--text-3);font-style:normal;margin:0 var(--sp-2)}

/* ============ NÚT ============ */
.btn{height:var(--h-ctrl);padding:0 var(--sp-4);display:inline-flex;align-items:center;gap:var(--sp-2);
  background:var(--bg-4);border:1px solid var(--line-2);border-radius:var(--r-sm);
  color:var(--text-1);font:var(--fw-medium) var(--fs-sm)/1 var(--font-ui);
  text-transform:none;letter-spacing:normal;cursor:pointer;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.btn:hover{background:var(--bg-5)}
.btn:active{transform:scale(.97);transition:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn--sm{height:var(--h-ctrl-sm);padding:0 var(--sp-3);font-size:var(--fs-xs)}
.btn--icon{width:var(--h-ctrl-sm);height:var(--h-ctrl-sm);padding:0;justify-content:center;color:var(--text-2)}
.btn--primary{height:var(--h-ctrl-lg);width:100%;justify-content:center;gap:var(--sp-3);
  background:var(--accent);border:none;border-radius:var(--r-md);
  color:var(--accent-on);font-size:var(--fs-lg);font-weight:var(--fw-bold)}
.btn--primary:hover{background:var(--accent-hover)}
.btn--primary:active{background:var(--accent-pressed)}
.btn--primary:disabled{background:var(--bg-4);color:var(--text-2)}
.btn--primary[data-state="done"]{background:var(--ok);color:#0e2a1c}
.btn--danger{color:var(--danger)}
.btn--danger:hover{background:rgb(255 95 109 /14%);border-color:rgb(255 95 109 /40%)}

/* ============ KHUNG ============ */
.wrap{padding:var(--sp-5);max-width:1180px;width:100%;margin-inline:auto;
  height:calc(100vh - var(--h-topbar));overflow:auto;
  display:flex;flex-direction:column;gap:var(--sp-4)}
/* Flex cột MẶC ĐỊNH cho phép co item lại. Panel thấp/hẹp là dải sequence bị
   ép về min-height 36px trong khi chữ bên trong đã xuống 3 dòng -> chữ tràn
   đè lên hàng tab. Khoá co lại, cho .wrap cuộn là đúng. */
.wrap > *{flex:0 0 auto}
.card{background:var(--bg-3);border:1px solid var(--line-1);border-radius:var(--r-lg);padding:var(--sp-5)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.card-t{font-size:var(--fs-md);font-weight:var(--fw-semibold)}

/* ============ DẢI SEQUENCE — nền của mọi con số ============ */
.selbar{display:flex;align-items:center;gap:0;min-width:0;
  background:var(--bg-3);border:1px solid var(--line-1);border-radius:var(--r-md);overflow:hidden}
.selbar-group{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4);
  min-width:0;min-height:36px}
.selbar-group+.selbar-group{border-left:1px solid var(--line-1)}
.selbar-group--fill{flex:1;min-width:0}
.selbar-group--right{margin-left:auto}
.selbar .lbl{font-size:var(--fs-xs);color:var(--text-3);white-space:nowrap}
.selbar .val{font-size:var(--fs-md);font-weight:var(--fw-medium);white-space:nowrap}
.selbar-chip{display:inline-flex;align-items:center;gap:var(--sp-1);
  padding:2px var(--sp-2);background:var(--bg-4);border:1px solid var(--line-2);
  border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:var(--fw-medium);
  color:var(--text-2);white-space:nowrap;line-height:1}
.selbar-chip--accent{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text)}
.selbar-chip .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6;flex:none}

/* ============ COMBOBOX — cùng khuôn với Autocut / Auto Podcast ============ */
.cbx{position:relative;min-width:0;max-width:300px;flex:0 1 auto}
.cbx-btn{width:100%;height:var(--h-ctrl);padding:0 var(--sp-2);display:inline-flex;align-items:center;
  gap:var(--sp-2);min-width:0;text-align:left;background:var(--bg-0);border:1px solid var(--line-2);
  border-radius:var(--r-sm);color:var(--text-1);font:var(--fw-medium) var(--fs-sm)/1 var(--font-ui);cursor:pointer}
.cbx-btn:hover{border-color:var(--line-strong)}
.cbx-btn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbx-btn .chev{margin-left:auto;flex:0 0 auto;color:var(--text-3);transition:transform var(--dur) var(--ease)}
.cbx-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.cbx-list{position:absolute;top:calc(100% + var(--sp-1));left:0;min-width:100%;width:max-content;
  max-width:min(340px,calc(100vw - var(--sp-6)));z-index:var(--z-dropdown);
  margin:0;padding:var(--sp-1);list-style:none;max-height:280px;overflow-y:auto;
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-sm);box-shadow:var(--shadow-md)}
.cbx-nhom{padding:var(--sp-2) var(--sp-3) var(--sp-1);font-size:var(--fs-2xs);font-weight:var(--fw-semibold);
  color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.cbx-opt{padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);font-size:var(--fs-sm);
  color:var(--text-1);cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-2);white-space:normal;overflow-wrap:break-word}
.cbx-opt.active{background:var(--bg-4)}
.cbx-opt[aria-selected="true"]{color:var(--accent-text);font-weight:var(--fw-semibold)}
.cbx-opt .tick{width:14px;height:14px;flex:0 0 auto;color:var(--accent-text);visibility:hidden}
.cbx-opt[aria-selected="true"] .tick{visibility:visible}

/* ============ CHỌN NỀN TẢNG BẰNG ICON ============
   Editor nhớ mặt logo nhanh hơn nhớ chữ trong danh sách xổ. Lưới tự xuống dòng
   nên panel hẹp cỡ nào cũng thấy hết, không phải cuộn ngang như bản cũ. */
.nentang{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:var(--sp-2)}
.nen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);
  padding:var(--sp-2) var(--sp-1);min-height:52px;
  background:var(--bg-4);border:1px solid var(--line-2);border-radius:var(--r-md);
  color:var(--text-2);font:var(--fw-medium) var(--fs-2xs)/1.2 var(--font-ui);cursor:pointer;
  text-align:center;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.nen:hover{background:var(--bg-5);color:var(--text-1)}
.nen .ico{width:20px;height:20px;color:var(--icon-dim);fill:currentColor;stroke:none}
.nen span{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nen[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent-line);
  color:var(--accent-text);font-weight:var(--fw-semibold)}
.nen[aria-checked="true"] .ico{color:var(--accent)}

/* khung hình của nền tảng đang chọn — ít lựa chọn nên bày thẳng, khỏi phải xổ */
.dinhds{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-3)}
.chip{height:var(--h-ctrl);padding:0 var(--sp-3);display:inline-flex;align-items:center;gap:var(--sp-2);
  background:var(--bg-0);border:1px solid var(--line-2);border-radius:var(--r-pill);
  color:var(--text-2);font:var(--fw-medium) var(--fs-sm)/1 var(--font-ui);cursor:pointer;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.chip:hover{background:var(--bg-hover);color:var(--text-1)}
.chip .tl{font-size:var(--fs-2xs);color:var(--text-2)}
.chip[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent-line);
  color:var(--accent-text);font-weight:var(--fw-semibold)}
.chip[aria-checked="true"] .tl{color:var(--accent-text)}

/* ============ TAB ============ */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;padding:3px;height:32px;
  background:var(--bg-0);border:1px solid var(--line-2);border-radius:var(--r-md)}
.tabs button{border:1px solid transparent;border-radius:var(--r-sm);background:transparent;
  color:var(--text-2);font:var(--fw-medium) var(--fs-sm)/1 var(--font-ui);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:var(--sp-2)}
.tabs button:hover{color:var(--text-1)}
.tabs button[aria-selected="true"]{background:var(--bg-4);border-color:var(--line-2);
  color:var(--accent-text);font-weight:var(--fw-semibold)}

/* ============ LƯỚI CHÍNH ============ */
.grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:var(--sp-4);align-items:stretch}
@media (max-width:900px){.grid{grid-template-columns:1fr;align-items:start}}
.col{display:flex;flex-direction:column;gap:var(--sp-4);min-width:0}
.col--xem{min-height:0}

/* ============ SÂN KHẤU XEM TRƯỚC ============ */
.san{background:var(--bg-1);border:1px solid var(--line-1);border-radius:var(--r-lg);
  padding:var(--sp-5);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--sp-4);min-height:100%}
/* khung SEQUENCE — sự thật gốc, mọi thứ vẽ bên trong nó */
.seqbox{position:relative;background:var(--bg-0);border:1px solid var(--line-strong);
  border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--shadow-md);
  max-width:100%;width:var(--bw);height:var(--bh)}
/* phần sequence NẰM NGOÀI khung đích — vẽ gạch chéo mờ, không phải vùng làm việc */
.ngoai{position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,transparent 0 6px,rgb(255 255 255 /5%) 6px 12px)}
/* khung ĐÍCH của nền tảng, lồng giữa sequence */
.dich{position:absolute;background:var(--bg-6);outline:1px solid var(--line-strong);overflow:hidden}
.vung{position:absolute}
.vung[data-loai=ui]{background:rgb(255 95 109 /26%);box-shadow:inset 0 0 0 1px rgb(255 95 109 /55%)}
.vung[data-loai=crop]{background:rgb(232 192 90 /20%);
  background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgb(232 192 90 /26%) 5px 10px);
  box-shadow:inset 0 0 0 1px rgb(232 192 90 /55%)}
.vung[data-loai=khuyen_nghi]{box-shadow:inset 0 0 0 1px rgb(124 196 240 /55%);
  background:rgb(124 196 240 /10%)}
/* vùng an toàn — viền xanh nét liền, thứ editor phải nhắm vào */
.antoan{position:absolute;outline:2px solid var(--z-an);outline-offset:-1px;
  background:rgb(78 201 138 /6%);pointer-events:none}
.antoan b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:var(--fs-2xs);font-weight:var(--fw-semibold);color:var(--z-an);
  background:rgb(14 42 28 /78%);border-radius:var(--r-pill);padding:2px var(--sp-2);white-space:nowrap}
/* nhãn số ĐO trên từng cạnh — không bắt người ta tự đoán vùng đó dày bao nhiêu */
.cs{position:absolute;font-size:var(--fs-2xs);font-weight:var(--fw-semibold);
  color:var(--text-1);background:rgb(0 0 0 /62%);border-radius:var(--r-sm);
  padding:1px var(--sp-1);white-space:nowrap;pointer-events:none}

.chugiai{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--sp-2) var(--sp-4);
  font-size:var(--fs-2xs);color:var(--text-2)}
.chugiai span{display:flex;align-items:center;gap:var(--sp-2)}
.ck{width:10px;height:10px;border-radius:2px;flex:none}
.ck[data-loai=ui]{background:rgb(255 95 109 /35%);box-shadow:inset 0 0 0 1px var(--z-ui)}
.ck[data-loai=crop]{background:rgb(232 192 90 /28%);box-shadow:inset 0 0 0 1px var(--z-crop)}
.ck[data-loai=khuyen_nghi]{box-shadow:inset 0 0 0 1px var(--z-goi)}
.ck[data-loai=an]{box-shadow:inset 0 0 0 2px var(--z-an)}


/* Số chưa chính thức: một dấu ≈ vàng trên chip. Không đủ chính xác thì phải
   nói ra — nhưng nói bằng một ký hiệu, không bằng một đoạn văn. */
.chip .uoc{color:var(--warn);font-weight:var(--fw-bold);font-size:var(--fs-sm)}

/* ============ TAB LƯỚI BỐ CỤC ============ */
.nhan{font-size:var(--fs-2xs);font-weight:var(--fw-semibold);color:var(--text-3);
  text-transform:uppercase;letter-spacing:.06em;margin:var(--sp-4) 0 var(--sp-2)}
.nhan:first-of-type{margin-top:0}
/* đổi Một nơi / Nhiều nơi — 2 lựa chọn nên dùng segmented, đúng luật §segmented */
.doi{display:inline-flex;padding:2px;background:var(--bg-0);border:1px solid var(--line-2);
  border-radius:var(--r-pill)}
.doi button{height:22px;padding:0 var(--sp-3);border:none;border-radius:var(--r-pill);
  background:transparent;color:var(--text-2);font:var(--fw-medium) var(--fs-2xs)/1 var(--font-ui);cursor:pointer}
.doi button:hover{color:var(--text-1)}
.doi button[aria-checked="true"]{background:var(--bg-4);color:var(--accent-text);font-weight:var(--fw-semibold)}

/* đường tự thêm */
.duongs{display:flex;flex-direction:column;gap:var(--sp-2)}
.duong{display:flex;align-items:center;gap:var(--sp-2)}
.duong .huong{height:var(--h-ctrl-sm);padding:0 var(--sp-2);background:var(--bg-0);
  border:1px solid var(--line-2);border-radius:var(--r-sm);color:var(--text-1);
  font:var(--fw-medium) var(--fs-2xs)/1 var(--font-ui);cursor:pointer;flex:none}
.duong input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.duong .so{width:52px;height:var(--h-ctrl-sm);padding:0 var(--sp-1);background:var(--bg-0);
  border:1px solid var(--line-2);border-radius:var(--r-sm);color:var(--text-1);
  font:var(--fw-medium) var(--fs-2xs)/1 var(--font-ui);text-align:right;flex:none}
.duong .xoa{width:22px;height:22px;padding:0;justify-content:center;flex:none;
  background:transparent;border-color:transparent;color:var(--text-3)}
.duong .xoa:hover{background:rgb(255 95 109 /16%);color:var(--danger)}

/* ô số lề đi kèm chip Lề */
.lebox{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-2xs);color:var(--text-2)}
.lebox input{width:52px;height:var(--h-ctrl);padding:0 var(--sp-1);background:var(--bg-0);
  border:1px solid var(--line-2);border-radius:var(--r-sm);color:var(--text-1);
  font:var(--fw-medium) var(--fs-sm)/1 var(--font-ui);text-align:right}

/* màu lưới */
.swatches{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:var(--r-sm);border:2px solid var(--line-2);
  cursor:pointer;padding:0;background:var(--c)}
.swatch:hover{border-color:var(--line-strong)}
.swatch[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.swatch--auto{background:conic-gradient(#fff 0 25%,#e8c05a 0 50%,#40dcff 0 75%,#8d8d95 0)}

/* preset */
.presetrow{display:flex;gap:var(--sp-2)}
.presetrow input{flex:1;min-width:0;height:var(--h-ctrl);padding:0 var(--sp-2);
  background:var(--bg-0);border:1px solid var(--line-2);border-radius:var(--r-sm);
  color:var(--text-1);font:var(--fw-medium) var(--fs-sm)/1 var(--font-ui)}
.presetrow input::placeholder{color:var(--text-3);font-weight:var(--fw-normal)}
.chip .xoaps{margin-left:var(--sp-1);color:var(--text-3);font-weight:var(--fw-bold)}
.chip .xoaps:hover{color:var(--danger)}

/* đường lưới vẽ trên khung xem trước */
.lu{position:absolute;background:var(--c,#fff);opacity:.9;pointer-events:none}
.lure{position:absolute;border:1px solid var(--c,#fff);opacity:.9;pointer-events:none}

/* ============ UI MOCKUP OVERLAY & SAMPLE VIDEO ============ */
@keyframes spinDisc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.video-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;border-radius:inherit;opacity:.65;pointer-events:none;filter:brightness(.95) contrast(1.05)}
.ui-mockup{position:absolute;inset:0;pointer-events:none;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding:8px 4px 8px 10px;opacity:.8;transition:opacity var(--dur) var(--ease)}
.ui-mockup:hover{opacity:.98}
.ui-mockup-top{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:11px;font-weight:600;color:rgba(255,255,255,.85);padding:2px 4px 0 2px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.ui-mockup-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;width:100%}
.ui-mockup-info{display:flex;flex-direction:column;gap:2px;color:#fff;max-width:calc(100% - 42px);text-shadow:0 1px 4px rgba(0,0,0,.9)}
.ui-mockup-user{font-size:10.5px;font-weight:700}
.ui-mockup-cap{font-size:9px;line-height:1.2;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-mockup-audio{font-size:8px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:3px;margin-top:1px}
.ui-mockup-acts{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;margin-left:auto;text-shadow:0 1px 4px rgba(0,0,0,.9);width:36px}
.ui-mockup-act{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:8px;font-weight:600;color:rgba(255,255,255,.9)}
.ui-mockup-act svg{width:18px;height:18px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.ui-mockup-avatar{position:relative;width:26px;height:26px;border-radius:50%;border:1.5px solid #fff;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:1px}
.ui-mockup-avatar svg{width:14px;height:14px;color:#fff}
.ui-mockup-avatar .add-btn{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#ff2c55;color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.ui-mockup-disc{width:20px;height:20px;border-radius:50%;background:#111;border:1.5px solid #333;display:flex;align-items:center;justify-content:center;animation:spinDisc 4s linear infinite;margin-top:1px;box-shadow:0 1px 4px rgba(0,0,0,.7)}
.ui-mockup-disc-inner{width:6px;height:6px;border-radius:50%;background:#e0590e}

/* ============ CHỌN NHIỀU NƠI ============ */
.dsnen{display:flex;flex-direction:column;gap:var(--sp-1);max-height:270px;overflow-y:auto;
  margin:0 calc(var(--sp-1) * -1);padding:0 var(--sp-1)}
.onen{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);
  background:var(--bg-4);border:1px solid var(--line-2);border-radius:var(--r-sm);
  cursor:pointer;font-size:var(--fs-sm)}
.onen:hover{background:var(--bg-5)}
.onen[data-on]{border-color:var(--accent-line);background:var(--accent-soft)}
.onen input{position:absolute;opacity:0;width:0;height:0}
.onen .hop{width:15px;height:15px;flex:none;border-radius:4px;border:1.5px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;color:var(--accent-on)}
.onen[data-on] .hop{background:var(--accent);border-color:var(--accent)}
.onen .hop svg{width:11px;height:11px;stroke-width:3;visibility:hidden}
.onen[data-on] .hop svg{visibility:visible}
.onen .ten{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.onen .dinh{font-size:var(--fs-2xs);color:var(--text-2);white-space:nowrap}
.onen:focus-within{border-color:var(--accent-line);box-shadow:var(--focus-ring)}

/* ============ TRẠNG THÁI + HÀNH ĐỘNG ============ */
.tt{display:flex;align-items:flex-start;gap:var(--sp-2);font-size:var(--fs-sm);
  padding:var(--sp-3);border-radius:var(--r-sm);line-height:var(--lh)}
.tt[data-m=ok]{background:rgb(78 201 138 /10%);color:var(--text-2)}
.tt[data-m=ok] .ico{color:var(--ok)}
.tt[data-m=warn]{background:rgb(232 192 90 /12%);color:var(--text-2)}
.tt[data-m=warn] .ico{color:var(--warn)}
.tt[data-m=err]{background:rgb(255 95 109 /12%);color:var(--text-2)}
.tt[data-m=err] .ico{color:var(--danger)}
.tt b{color:var(--text-1);font-weight:var(--fw-semibold)}
.tt .ico{margin-top:1px}
.hanhdong{display:flex;flex-direction:column;gap:var(--sp-2)}
.phu{display:flex;gap:var(--sp-2)}
.phu .btn{flex:1;justify-content:center}
.ghi{font-size:var(--fs-2xs);color:var(--text-3);line-height:var(--lh)}

/* ============ HỘP THOẠI ============ */
.ov{position:fixed;inset:0;z-index:var(--z-modal);background:rgb(0 0 0 /55%);
  display:flex;align-items:center;justify-content:center;padding:var(--sp-5)}
.ov[hidden]{display:none}
.modal{width:100%;max-width:420px;background:var(--bg-6);border:1px solid var(--line-2);
  border-radius:var(--r-lg);box-shadow:0 18px 52px rgb(0 0 0 /62%);padding:var(--sp-5);
  display:flex;flex-direction:column;gap:var(--sp-4);max-height:min(86vh,660px);overflow:auto}
.modal h3{font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.hang{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.hang .mo{font-size:var(--fs-2xs);color:var(--text-3);display:block;margin-top:1px}
.modal-ft{display:flex;justify-content:flex-end;gap:var(--sp-2);padding-top:var(--sp-3);
  border-top:1px solid var(--line-1)}

/* 26/08/2026 — anh Tiến: "vị trí không đều". Đo được: nút "Dọc" rộng 33px,
   "Ngang" 46px → thanh kéo hai hàng bắt đầu lệch 12,6px nên con trượt 50%
   không thẳng hàng. Sửa THEO CẤU TẠO thay vì ghim bề rộng bằng tay: cả khối
   thành một LƯỚI, mọi hàng góp vào cùng 4 cột → cột nào cũng bằng nhau ở mọi
   hàng, đổi ngôn ngữ ("Horizontal"/"Vertical") hay thêm bao nhiêu đường cũng
   không lệch lại được. */
.duongs{display:grid;grid-template-columns:auto 1fr auto auto;
  gap:var(--sp-2);align-items:center}
.duong{display:contents}
.duongs > div:not(.duong){grid-column:1/-1;justify-self:start}

/* 26/08/2026 — anh Tiến: khung xem trước phải nằm ĐẦU panel.
   DOM đã đặt nó trước, nên dock hẹp (1 cột) thấy nó ngay dưới thanh sequence.
   Dock rộng thì đảo lại bằng `order` để giữ đúng thiết kế gốc: điều khiển
   bên trái (cột 360px), xem trước bên phải. */
@media (min-width:901px){
  .grid > .col--xem{order:2}
  .grid > .col:not(.col--xem){order:1}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- dock hẹp ---- */
@media (max-width:640px){
  .host{display:none}
  .wrap{padding:var(--sp-3)}
  .card,.san{padding:var(--sp-4)}
}
@media (max-width:420px){
  .cbx{max-width:none;flex:1 1 100%}
  .chugiai{gap:var(--sp-1) var(--sp-3)}
}
@media (max-width:340px){
  /* dock cực hẹp: số phiên bản và nút đổi ngôn ngữ là thứ bỏ được trước tiên,
     giữ lại tên panel + nút cài đặt */
  .ver,#lang{display:none}
  .topbar{padding:0 var(--sp-3);gap:var(--sp-2)}
}
</style>
</head>
<body>

<header class="topbar">
  <svg class="ico brand-ico" id="denHost" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
  <h1 class="brand">Guide Frame</h1>
  <span class="ver">v0.3.0</span>
  <span class="host" id="host"></span>
  <span class="spacer"></span>
  <button class="btn btn--sm" id="lang" title="Chuyển sang tiếng Anh" aria-label="Chuyển sang tiếng Anh">EN</button>
  <button class="btn btn--icon" id="moCaiDat" title="Cài đặt" aria-label="Cài đặt">
    <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<div class="wrap">

  <!-- ============ SEQUENCE: nền của mọi con số ============ -->
  <div class="selbar">
    <!-- Nhóm trái: icon + label + picker -->
    <div class="selbar-group selbar-group--fill">
      <svg class="ico ico-sm" viewBox="0 0 24 24" style="color:var(--text-3);flex:none" aria-hidden="true"><path d="M2 6h20v12H2zM8 6v12M16 6v12"/></svg>
      <span class="lbl" id="seqLbl">Sequence</span>
      <div class="cbx" id="seqCbx" style="flex:1;max-width:220px">
        <button type="button" class="cbx-btn" id="seqBtn" aria-haspopup="listbox" aria-expanded="false"
          aria-controls="seqList" aria-labelledby="seqLbl seqBtnLabel">
          <span id="seqBtnLabel"></span>
          <svg class="chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="cbx-list" id="seqList" role="listbox" tabindex="-1" aria-label="Sequence" hidden></ul>
      </div>
    </div>
    <!-- Nhóm phải: kích thước + tỉ lệ dưới dạng chips -->
    <div class="selbar-group selbar-group--right" id="seqInfoGroup" style="gap:var(--sp-2)">
      <!-- Vùng In/Out anh khoanh trên timeline — panel tự nhận qua vòng thăm dò 1,5s,
           chỉ hiện khi có vùng THẬT (khác cả sequence). Guide sẽ đặt đúng trong vùng này. -->
      <!-- ☠️ Ẩn bằng style.display chứ KHÔNG dùng [hidden]: .selbar-chip có
           display:inline-flex đè lên [hidden]{display:none} (đúng bẫy .tt 06/08). -->
      <span class="lbl" id="vungLbl" style="display:none">Vùng chọn</span>
      <span class="selbar-chip" id="vungChip" style="display:none"></span>
      <span class="lbl" id="seqKhungLbl">Khung</span>
      <span class="selbar-chip selbar-chip--accent" id="seqKhung"></span>
    </div>
  </div>

  <div class="grid">
    <!-- ==================== XEM TRƯỚC ====================
         26/08/2026 — anh Tiến: "đưa khung này lên phía đầu tiên của panel".
         Đặt TRƯỚC trong DOM để dock hẹp (1 cột) thấy nó ngay dưới thanh
         sequence. Dock rộng vẫn giữ đúng thiết kế gốc (điều khiển trái, xem
         trước phải) bằng `order` trong media query ở cuối <style>. -->
    <div class="col col--xem">
      <div class="san">
        <div class="seqbox" id="seqbox">
          <div class="ngoai"></div>
          <div class="dich" id="dich"></div>
        </div>
        <div class="chugiai" id="chugiai"></div>
      </div>
    </div>

    <!-- ==================== CỘT ĐIỀU KHIỂN ==================== -->
    <div class="col">

      <!-- ---------- CHỌN NỀN TẢNG ---------- -->
      <section class="card">
        <div class="card-hd">
          <h2 class="card-t" id="lblDangODau">Chọn nền tảng</h2>
        </div>

        <div id="khoiMot">
          <div class="nentang" id="nentang" role="radiogroup" aria-label="Nền tảng"></div>
          <div class="dinhds" id="dinhds" role="radiogroup" aria-label="Khung hình"></div>
        </div>
      </section>

      <!-- ---------- LƯỚI BỐ CỤC ---------- -->
      <section class="card">
        <div class="card-hd"><h2 class="card-t" id="lblLuoi">Lưới bố cục</h2></div>

        <div class="nhan" id="lblLuoiType">Lưới</div>
        <div class="dinhds" id="chipsLuoi"></div>

        <div class="nhan" id="lblDuongTuThem">Đường tự thêm</div>
        <div class="duongs" id="duongs"></div>

        <div class="nhan" id="lblMau">Màu</div>
        <div class="swatches" id="swatches" role="radiogroup" aria-label="Màu lưới"></div>
        <!-- "Preset của tôi" GO BO 26/08/2026 theo yeu cau anh Tien -->
      </section>

      <!-- HÀNH ĐỘNG -->
      <section class="card">
        <div class="hanhdong">
          <!-- Hộp trạng thái: CSS .tt đã có sẵn trong thiết kế, chỉ thiếu thẻ -->
          <div class="tt" id="tt" data-m="ok" role="status" aria-live="polite">
            <svg class="ico ico-sm" id="ttIco" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            <span id="ttChu"></span>
          </div>

          <button class="btn btn--primary" id="go">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
            <span id="goLabel">Tạo guideline lên Premiere</span>
          </button>

          <!-- ☠️ GO BO 26/08/2026 theo yeu cau anh Tien: nut "Luu file .guides",
               nut "Go guideline", va canh bao "dang co N guide tren timeline".
               Duong RA nay la: xoa clip guide tren track V3 bang tay trong
               Premiere (panel tu nhan ra sau ~1,5 giay va doi lai nhan nut).
               Bam nut chinh khi dang co guide van GO CU roi dat MOI. -->
        </div>
      </section>

    </div>

  </div>
</div>

<!-- ============ HỘP THOẠI CÀI ĐẶT ============ -->
<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="ovT">
  <div class="modal">
    <h3 id="ovT">Cài đặt</h3>

    <div class="hang">
      <label for="ttDemo" id="lblTtDemo">Xem thử trạng thái

          <span id="ttBtnLabel"></span>

    <div class="modal-ft">
      <button class="btn" id="dong">Xong</button>
    </div>
  </div>
</div>

/* ============ NỐI HOST PREMIERE ============ */
const PHIEN_BAN = '0.3.0';
let cs = null, extPath = '';
try {
  if (typeof CSInterface !== 'undefined') {
    cs = new CSInterface();
    extPath = cs.getSystemPath(SystemPath.EXTENSION).replace(/\\/g, '/');
  }
} catch(e) {}

function evalP(script, timeoutMs){
  return new Promise((res, rej) => {
    if (!cs) { rej(new Error('NO_CS')); return; }
    let xong = false;
    const dh = setTimeout(() => { if (!xong){ xong = true; rej(new Error('TREO')); } }, timeoutMs || 8000);
    cs.evalScript(script, r => { if (xong) return; xong = true; clearTimeout(dh); res(r); });
  });
}

/* ☠️ Nạp lại host TRƯỚC MỖI lệnh — bệnh "panel mới nói chuyện với host cũ"
   (Premiere chỉ nạp host/*.jsx một lần lúc khởi động). Rồi gọi hàm nằm CUỐI
   FILE để chắc cả file đã nạp trọn vẹn — bệnh "evalFile nuốt file giữa chừng". */
function napHost(){
  const p = extPath + '/host/guideframe.jsx';
  const sc = "var __nap='OK'; try { $.evalFile(\"" + p + "\") } catch(e) { __nap='ERR:'+e } __nap";
  return evalP(sc).then(r => {
    if (String(r).indexOf('OK') !== 0) throw new Error('HOST_CU');
    return evalP('gf_phienBan()');
  }).then(v => { if (String(v) !== PHIEN_BAN) throw new Error('HOST_CU'); });
}

function nodeFs(){
  try {
    if (window.cep_node && window.cep_node.require) return window.cep_node.require('fs');
    if (typeof require === 'function') return require('fs');
  } catch(e) {}
  return null;
}
/* ☠️ KHÔNG dùng %APPDATA% / os.tmpdir() — Premiere ảo hoá thư mục mới tạo
   trong đó nên host mở ra thấy file rỗng (đo 28/07/2026). */
const THU_MUC = 'C:/AiOStudio/GuideFrame';
function ghiFile(duongDan, duLieu, encoding){
  const fs = nodeFs();
  if (!fs) throw new Error('KHONG_NODE');
  try { fs.mkdirSync(THU_MUC, { recursive:true }); } catch(e) {}
  fs.writeFileSync(duongDan, duLieu, encoding ? { encoding } : 'utf8');
  if (!fs.existsSync(duongDan)) throw new Error('KHONG_THAY_FILE');
}

/* ☠️ Ten file PNG phai DUY NHAT moi lan. Ban cu dat ten co dinh theo
   (khung + kich thuoc + ngon ngu) nen bam lan hai cho CUNG mot khung la dinh
   `EBUSY: resource busy or locked` — Premiere van giu file cu du clip da bi go
   (no khong tra lai handle ngay). Do that 26/08/2026, anh Tien bao loi.
   Doi lai: file cu dong lai trong thu muc -> don ngay sau khi ghi thanh cong,
   file nao Premiere con giu thi bo qua, lan sau don tiep. */
function donFileCu(giuLai){
  const fs = nodeFs(); if (!fs) return 0;
  let don = 0;
  try {
    for (const f of fs.readdirSync(THU_MUC)) {
      if (f.indexOf('AIO_GUIDE_') !== 0 || !/\.png$/i.test(f) || f === giuLai) continue;
      try { fs.unlinkSync(THU_MUC + '/' + f); don++; } catch(e) {}   // dang bi giu thi de lai
    }
  } catch(e) {}
  return don;
}

/* ============ SEQUENCE ĐANG MỞ ============
   Bản thiết kế bày 4 sequence mẫu để duyệt hình. Bản thật đọc danh sách
   sequence CÓ THẬT trong project — chọn một cái là Premiere mở đúng cái đó. */
const SEQS_DEMO = [
  { ten:'Reel 60s — Cut 02',        w:1080, h:1920 },
  { ten:'Podcast Ep12 — Bản đầy đủ', w:1920, h:1080 },
  { ten:'Feed vuông — Teaser',      w:1080, h:1080 },
  { ten:'Ep12 — Bản 4:5 cho Feed',  w:1080, h:1350 },
];
let SEQS = SEQS_DEMO.slice();
let iSeq = 0;
let realSeqPremiere = null;
let soLopGuide = 0;              // số clip guide còn nằm trên timeline
let vungChon = null;             // vùng In/Out anh khoanh trên timeline: {a, b} giây
let tinRieng = null;             // thông báo của lần bấm gần nhất, đè lên trạng thái chung
let dangChay = false;
const seq = () => realSeqPremiere || SEQS[iSeq] || SEQS_DEMO[0];

function datTin(m, html){ tinRieng = { m, html }; veHanhDong(); }
function xoaTin(){ if (tinRieng){ tinRieng = null; veHanhDong(); } }

function loiRaChu(raw){
  const s = String(raw && raw.message ? raw.message : raw || '');
  const ma = s.indexOf('ERR:') === 0 ? s.slice(4).split('|')[0] : s;
  const d = DICT[lang];
  return d['l_' + ma] || (d.l_KHAC + ' ' + s);
}

/* ── Vùng chọn In/Out ────────────────────────────────────────────────────
   ☠️ Premiere trả in=0 / out=cuối sequence khi người dùng CHƯA khoanh gì —
   trạng thái đó không phân biệt được với "khoanh trọn sequence", và hai trường
   hợp cho cùng một kết quả (phủ hết) nên gộp làm một: coi là KHÔNG có vùng. */
function tinhVungChon(vIn, vOut, daiSeq){
  if (!isFinite(vIn) || !isFinite(vOut)) return null;
  if (vIn < 0 || vOut <= vIn + 0.01) return null;
  if (vIn <= 0.01 && daiSeq > 0 && vOut >= daiSeq - 0.01) return null;   // = cả sequence
  return { a: Math.max(0, vIn), b: daiSeq > 0 ? Math.min(vOut, daiSeq) : vOut };
}

function veVungChon(){
  const lbl = $('vungLbl'), chip = $('vungChip');
  if (!lbl || !chip) return;
  const co = !!vungChon;
  // style.display chứ không [hidden] — .selbar-chip có display riêng đè [hidden]
  lbl.style.display = co ? '' : 'none';
  chip.style.display = co ? '' : 'none';
  if (co) chip.textContent = (vungChon.b - vungChon.a).toFixed(1) + 's';
}

function datVungChon(v){
  const doi = (v === null) !== (vungChon === null) ||
    (v && vungChon && (Math.abs(v.a - vungChon.a) > 0.01 || Math.abs(v.b - vungChon.b) > 0.01));
  if (doi){ vungChon = v; veVungChon(); }
}

/* ── Đọc trạng thái Premiere theo nhịp ───────────────────────────────────
   ☠️ Panel KHÔNG được tranh CPU với host. Mỗi nhịp chỉ hỏi MỘT câu rẻ
   (gf_thongTinSeq). Danh sách sequence chỉ hỏi lại khi sequence đang mở đổi,
   hoặc mỗi 8 nhịp (~16 giây) để bắt sequence mới người dùng vừa tạo. */
let dsSeqChuoiCu = '';
let nhip = 0;
function docSeqPremiereThucTe(){
  if (!cs || dangChay) return Promise.resolve();
  return evalP('gf_thongTinSeq()')
    .then(r => {
      if (String(r).indexOf('OK:') === 0) return r;
      return napHost().then(() => evalP('gf_thongTinSeq()'));
    })
    .then(r => {
      r = String(r);
      if (r.indexOf('OK:') !== 0) {           // Premiere mở nhưng chưa có sequence
        datVungChon(null);                    // dữ liệu mất thì xoá số cũ, đừng để nó nói dối
        if (realSeqPremiere !== null){ realSeqPremiere = null; iTT = 1; ve(); }
        else if (iTT !== 1){ iTT = 1; veHanhDong(); }
        return;
      }
      const m = r.slice(3).split('|');
      const w = parseInt(m[0], 10), h = parseInt(m[1], 10);
      const ten = m[3] || 'Active Sequence';
      if (!(w > 0 && h > 0)) return;
      const doi = !realSeqPremiere || realSeqPremiere.w !== w || realSeqPremiere.h !== h || realSeqPremiere.ten !== ten;
      const daiS = parseFloat(m[2]) || 0;
      realSeqPremiere = { ten, w, h, dai: daiS };
      datVungChon(tinhVungChon(parseFloat(m[4]), parseFloat(m[5]), daiS));
      if (iTT === 1) iTT = 0;
      nhip++;
      if (!doi && (nhip % 8) !== 0) return;   // không đổi gì: bỏ qua nhịp này
      return evalP('gf_dsSequence()').then(rs => {
        rs = String(rs);
        if (rs.indexOf('OK:') === 0 && rs !== dsSeqChuoiCu){
          dsSeqChuoiCu = rs;
          const phan = rs.slice(3).split('|');
          const hienId = phan.shift();
          const ds = phan.filter(Boolean).map(x => { const [id, t2] = x.split('\t'); return { id, ten:t2 || id, w, h }; });
          if (ds.length){
            SEQS = ds;
            const j = SEQS.findIndex(s => String(s.id) === String(hienId));
            iSeq = j >= 0 ? j : 0;
          }
          return demLop().then(() => ve());
        }
        if (doi) return demLop().then(() => ve());
      });
    })
    .catch(() => { datVungChon(null); if (iTT !== 1){ iTT = 1; realSeqPremiere = null; ve(); } });
}

function demLop(){
  if (!cs) return Promise.resolve();
  return evalP('gf_demOverlay()').then(r => {
    r = String(r);
    if (r.indexOf('OK:') !== 0) return;
    soLopGuide = parseInt(r.slice(3), 10) || 0;
  }).catch(() => {});
}

  if (!s || !d || !s.w || !s.h || !d.w || !d.h) return { w:1080, h:1920, x:0, y:0, khop:true };
  const rS = s.w / s.h, rD = d.w / d.h;
  const w = rS > rD ? s.h * rD : s.w;
  const h = rS > rD ? s.h      : s.w / rD;

}

/* ============ VẼ XEM TRƯỚC ============ */
function veXem(){
  const s = seq(), d = dichDangDung(), box = $('seqbox'), dichEl = $('dich');
  if (!box || !dichEl || !box.parentElement) return;
  const san = box.parentElement;
  const RONG = Math.max(180, san.clientWidth - 32);
  const CAO  = Math.max(200, Math.min(window.innerHeight - 260, 620));
  const r = s.w / s.h;
  let bw = CAO * r, bh = CAO;
  if (bw > RONG) { bw = RONG; bh = RONG / r; }
  box.style.setProperty('--bw', bw + 'px');
  box.style.setProperty('--bh', bh + 'px');

  dichEl.style.background = ''; dichEl.style.outline = '';
  if (!d){ dichEl.hidden = true; return; }
  dichEl.hidden = false;

  const k = khungDich(s, d);
  const px = v => v / s.w * bw, py = v => v / s.h * bh;
  dichEl.style.left = px(k.x) + 'px';  dichEl.style.top = py(k.y) + 'px';
  dichEl.style.width = px(k.w) + 'px'; dichEl.style.height = py(k.h) + 'px';

  const V = gopVung(dsDangDung());
  const dw = px(k.w), dh = py(k.h);
  const isLandscape = d.w > d.h;
  /* ☠️ Bản thiết kế lấy video mẫu từ Internet (mixkit / googleapis). Panel chạy
     TRONG Premiere trên máy khách: có thể offline, và tải file ngoài vào panel
     là thứ không nên có trong sản phẩm bán ra. Thay bằng nền giả lập vẽ bằng
     CSS — không tốn mạng, không phụ thuộc bên thứ ba. */
  let html = `<i class="video-bg" style="background:radial-gradient(120% 80% at 30% 22%,#3d4d66 0%,#1e2632 55%,#0d1117 100%),linear-gradient(155deg,rgba(248,104,32,.20),transparent 62%)"></i>`;
  const dayPx = c => (V[c] ? V[c].pt / 100 * ((c === 'top' || c === 'bottom') ? k.h : k.w) : 0);

  for (const c of ['top','bottom','left','right']){
    const v = V[c]; if (!v) continue;
    const dp = v.pt / 100;
    const st = c === 'top'    ? `left:0;top:0;width:100%;height:${dp * 100}%`
             : c === 'bottom' ? `left:0;bottom:0;width:100%;height:${dp * 100}%`
             : c === 'left'   ? `left:0;top:0;height:100%;width:${dp * 100}%`
             :                  `right:0;top:0;height:100%;width:${dp * 100}%`;
    const canh = (c === 'top' || c === 'bottom') ? k.h : k.w;
    const tip = `${TEN_CANH[c]} · ${TEN_LOAI[v.l]} — ${v.m} · chừa ${Math.round(v.pt / 100 * canh)}px (${vn(v.pt)}%)`
              + (cheDo === 'nhieu' && v.tu ? ` · chặt nhất: ${v.tu}` : '');
    html += `<i class="vung" data-loai="${v.l}" style="${st}" title="${tip}"></i>`;
  }

  const t = (V.top ? V.top.pt : 0), b = (V.bottom ? V.bottom.pt : 0);
  const l = (V.left ? V.left.pt : 0), rr = (V.right ? V.right.pt : 0);
  const anW = k.w * (100 - l - rr) / 100, anH = k.h * (100 - t - b) / 100;
  const nhanAn = DICT[lang].anToan;
  html += `<i class="antoan" style="left:${l}%;top:${t}%;right:${rr}%;bottom:${b}%">`
        + `<b>${nhanAn} ${Math.round(anW)}×${Math.round(anH)}</b></i>`;

  if (hienSo){
    for (const c of ['top','bottom','left','right']){
      const v = V[c]; if (!v) continue;
      const so = Math.round(dayPx(c));
      const chu = `${vn(v.pt)}% · ${so}px`;
      const st = c === 'top'    ? `left:50%;top:2px;transform:translateX(-50%)`
               : c === 'bottom' ? `left:50%;bottom:2px;transform:translateX(-50%)`
               : c === 'left'   ? `left:2px;top:50%;transform:translateY(-50%)`
               :                  `right:2px;top:50%;transform:translateY(-50%)`;
      html += `<i class="cs" style="${st}">${chu}</i>`;
    }
  }

  // Visual UI Mockup Overlay showing real platform UI elements
  if (!isLandscape) {
    html += taoUIMockup(d.nenId);
  }

  // Render Layout Grid lines over Safe Zone
  const M = n => luoiCfg.mau || MAU_NHOM[n];
  const docL = (p, n) => `<i class="lu" style="--c:${M(n)};left:${p}%;top:0;width:1px;height:100%;z-index:3"></i>`;
  const ngangL = (p, n) => `<i class="lu" style="--c:${M(n)};top:${p}%;left:0;height:1px;width:100%;z-index:3"></i>`;
  if (luoiCfg.chia3) html += [33.3333, 66.6667].map(p => docL(p,'chia3') + ngangL(p,'chia3')).join('');
  if (luoiCfg.vang)  html += [38.196, 61.803].map(p => docL(p,'vang') + ngangL(p,'vang')).join('');
  if (luoiCfg.tam)   html += docL(50,'tam') + ngangL(50,'tam');
  if (luoiCfg.le > 0){
    const L = luoiCfg.le;
    html += `<i class="lure" style="--c:${M('le')};left:${L}%;top:${L}%;right:${L}%;bottom:${L}%;z-index:3"></i>`;
  }
  for (const dt of luoiCfg.tuyChinh)
    html += dt.huong === 'ngang' ? ngangL(dt.pt,'tuyChinh') : docL(dt.pt,'tuyChinh');

  dichEl.innerHTML = html;

  if ($('chugiai')) {
    const co = new Set(Object.values(V).map(v => v.l));
    $('chugiai').innerHTML =
      [...co].map(l => `<span><i class="ck" data-loai="${l}"></i>${TEN_LOAI[l]}</span>`).join('')
      + `<span><i class="ck" data-loai="an"></i>Vùng an toàn</span>`
      + (k.khop ? '' : `<span style="color:var(--warn)">Khung đích hẹp hơn sequence — phần gạch chéo nằm ngoài</span>`);
  }
}

/* ============ VẼ LƯỚI BỐ CỤC ============ */
function khungLuoi(s){
  const tl = TI_LE.find(t => t.id === luoiCfg.tiLe);
  if (!tl || !tl.w) return { w:s.w, h:s.h, x:0, y:0, khop:true };
  return khungDich(s, tl);
}
function veLuoi(s, bw, bh){
  const el = $('dich'); el.hidden = false;
  const k = khungLuoi(s);
  const px = v => v / s.w * bw, py = v => v / s.h * bh;
  el.style.left = px(k.x) + 'px';  el.style.top = py(k.y) + 'px';
  el.style.width = px(k.w) + 'px'; el.style.height = py(k.h) + 'px';
  el.style.background = 'var(--bg-6)';
  el.style.outline = '1px solid var(--line-strong)';

  const M = n => luoiCfg.mau || MAU_NHOM[n];
  const doc = (p, n) => `<i class="lu" style="--c:${M(n)};left:${p}%;top:0;width:1px;height:100%"></i>`;
  const ngang = (p, n) => `<i class="lu" style="--c:${M(n)};top:${p}%;left:0;height:1px;width:100%"></i>`;
  let h = '';
  if (luoiCfg.chia3) h += [33.3333, 66.6667].map(p => doc(p,'chia3') + ngang(p,'chia3')).join('');
  if (luoiCfg.vang)  h += [38.196, 61.803].map(p => doc(p,'vang') + ngang(p,'vang')).join('');
  if (luoiCfg.tam)   h += doc(50,'tam') + ngang(50,'tam');
  if (luoiCfg.le > 0){
    const L = luoiCfg.le;
    h += `<i class="lure" style="--c:${M('le')};left:${L}%;top:${L}%;right:${L}%;bottom:${L}%"></i>`;
  }
  for (const d of luoiCfg.tuyChinh)
    h += d.huong === 'ngang' ? ngang(d.pt,'tuyChinh') : doc(d.pt,'tuyChinh');
  el.innerHTML = h;

  const dem = (luoiCfg.chia3 ? 4 : 0) + (luoiCfg.vang ? 4 : 0) + (luoiCfg.tam ? 2 : 0)
            + (luoiCfg.le > 0 ? 4 : 0) + luoiCfg.tuyChinh.length;
  if ($('chugiai')) {
    $('chugiai').innerHTML = dem
      ? `<span>${dem} đường · khung ${Math.round(k.w)}×${Math.round(k.h)}</span>`
        + (k.khop ? '' : `<span style="color:var(--warn)">Khung hẹp hơn sequence — phần gạch chéo nằm ngoài</span>`)
      : `<span style="color:var(--warn)">Chưa bật lưới nào — chọn một kiểu lưới hoặc thêm một đường</span>`;
  }
}

/* ============ TRẠNG THÁI + NÚT ============ */
function veHanhDong(){
  const s = seq(), d = dichDangDung(), k = d ? khungDich(s, d) : null;
  const t = tt(), hop = $('tt'), chu = $('ttChu'), ico = $('ttIco'), go = $('go');
  const P = {
    check:'M20 6 9 17l-5-5',
    canh :'M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z',
    tat  :'M18 6 6 18M6 6l12 12',
  };
  const dic = DICT[lang];
  let m = 'ok', p = P.check, html = '', khoa = false, nhan = dic.goSafe;

  if (t.id === 'chua'){
    m = 'err'; p = P.tat; khoa = true;
    html = lang === 'en'
      ? `<b>Not connected to Premiere.</b> Open a sequence and try again — the panel needs the real frame size.`
      : `<b>Chưa nối được với Premiere.</b> Mở một sequence rồi bấm lại — panel cần biết khung hình thật để tính.`;
  } else if (t.id === 'hettrack'){
    m = 'err'; p = P.canh; khoa = true;
    html = lang === 'en'
      ? `<b>No empty video track.</b> The guide needs an empty track on top so it never covers your clips — add one in Premiere and try again.`
      : `<b>Không còn track video trống.</b> Guide cần một track trống trên cùng để không đè lên clip của anh —
            thêm một track video trong Premiere rồi bấm lại.`;
  } else if (!d){
    m = 'warn'; p = P.canh; khoa = true;
    html = `<b>Chưa chọn nơi đăng nào.</b> Tick ít nhất một nơi để panel biết phải chừa những đâu.`;
  } else if (k && !k.khop){
    m = 'warn'; p = P.canh;
    html = `<b>Lệch tỉ lệ</b> — guide chỉ vẽ vùng giữa <b>${Math.round(k.w)}×${Math.round(k.h)}</b>.`;
  } else {
    html = `<b>Khớp tỉ lệ</b>`;
  }

  // Còn guide cũ trên timeline: nút đổi nhãn thành "Thay bằng…" và bấm vào thì
  // GỠ CŨ rồi đặt MỚI. Không bày thêm dòng cảnh báo nào (anh Tiến chốt 06/08) —
  // lời nhắc thật đã nung sẵn trong chính tấm ảnh guide.
  if (soLopGuide > 0 && !khoa) nhan = dic.goSafeReplace;

  // Thông báo của lần bấm gần nhất đè lên trạng thái chung — nó cụ thể hơn.
  if (tinRieng){ m = tinRieng.m; html = tinRieng.html;
    p = m === 'ok' ? P.check : (m === 'err' ? P.tat : P.canh); }

  if (hop && ico && chu) {
    hop.dataset.m = m; ico.innerHTML = `<path d="${p}"/>`; chu.innerHTML = html;
    // ☠️ "Chi bao khi THAT BAI" (luat anh Tien) — dat xong thi im, nguoi dung da
    // nhin thay guide tren timeline roi. Chi hien khi canh bao hoac loi.
    // Dung style.display chu KHONG dung [hidden]: `.tt{display:flex}` de len
    // quy tac [hidden]{display:none} cua trinh duyet nen an khong an.
    hop.style.display = (m === 'ok') ? 'none' : '';
  }
  if (go && !dangChay) go.disabled = khoa;
  if ($('goLabel') && !dangChay) $('goLabel').textContent = nhan;

  if ($('denHost')) $('denHost').dataset.host = t.id === 'chua' ? 'off' : '';
}

/* ============ COMBOBOX DÙNG CHUNG ============ */
function comboBox({ btn, list, nhan, dsFn, dangChon, khiChon, nhomFn }){
  if (!btn || !list) return;
  let active = 0;
  const dung = () => {
    const ds = dsFn(); let html = '', nhomCu = null, i = 0;
    for (const m of ds){
      const g = nhomFn ? nhomFn(m) : null;
      if (g && g !== nhomCu){ html += `<li class="cbx-nhom" role="presentation">${g}</li>`; nhomCu = g; }
      html += `<li class="cbx-opt" id="${btn.id}Opt${i}" role="option" aria-selected="${i === dangChon()}">
        <span>${m.nhan}</span>
        <svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </li>`;
      i++;
    }
    list.innerHTML = html;
  };
  const os = () => [...list.querySelectorAll('.cbx-opt')];
  const sang = () => {
    os().forEach((li, i) => li.classList.toggle('active', i === active));
    list.setAttribute('aria-activedescendant', btn.id + 'Opt' + active);
    os()[active]?.scrollIntoView({ block:'nearest' });
  };
  const ngoai = e => { if (!btn.parentElement.contains(e.target)) dong(false); };
  /* ☠️ Ô xổ nằm trong `.selbar` (overflow:hidden) và `.wrap` (overflow:auto) —
     để nguyên `position:absolute` là nó bị CẮT CỤT: đo 06/08 trên Premiere,
     danh sách cao 69px mà thanh sequence chỉ cao 42px nên mục thứ 2 biến mất.
     Neo bằng `position:fixed` theo toạ độ nút thì không tổ tiên nào cắt được,
     và không phải sửa một dòng CSS nào của bản thiết kế. */
  function datViTri(){
    const r = btn.getBoundingClientRect();
    list.style.position = 'fixed';
    list.style.left = Math.round(r.left) + 'px';
    list.style.minWidth = Math.round(r.width) + 'px';
    list.style.top = Math.round(r.bottom + 4) + 'px';
    const cao = list.offsetHeight;
    if (r.bottom + 4 + cao > innerHeight - 8)          // tràn đáy panel thì lật lên trên
      list.style.top = Math.round(Math.max(8, r.top - 4 - cao)) + 'px';
  }
  const theoNut = () => { if (!list.hidden) datViTri(); };
  function mo(){
    dung(); active = dangChon(); list.hidden = false; btn.setAttribute('aria-expanded','true');
    datViTri(); sang(); list.focus();
    document.addEventListener('click', ngoai, true);
    window.addEventListener('scroll', theoNut, true);
    window.addEventListener('resize', theoNut);
  }
  function dong(veNut){
    list.hidden = true; btn.setAttribute('aria-expanded','false');
    list.style.position = ''; list.style.left = ''; list.style.top = ''; list.style.minWidth = '';
    document.removeEventListener('click', ngoai, true);
    window.removeEventListener('scroll', theoNut, true);
    window.removeEventListener('resize', theoNut);
    if (veNut) btn.focus();
  }
  btn.addEventListener('click', () => { list.hidden ? mo() : dong(true); });
  list.addEventListener('keydown', e => {
    const n = os().length;
    if (e.key === 'ArrowDown'){ e.preventDefault(); active = Math.min(n - 1, active + 1); sang(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(0, active - 1); sang(); }
    else if (e.key === 'Home'){ e.preventDefault(); active = 0; sang(); }
    else if (e.key === 'End'){ e.preventDefault(); active = n - 1; sang(); }
    else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); khiChon(active); dong(true); ve(); }
    else if (e.key === 'Escape'){ e.preventDefault(); dong(true); }
    else if (e.key === 'Tab'){ dong(false); }
  });
  list.addEventListener('click', e => {
    const li = e.target.closest('.cbx-opt'); if (!li) return;
    khiChon(os().indexOf(li)); dong(true); ve();
  });
  dung();
}

function laiRadio(hop, e){
  const ds = [...hop.querySelectorAll('[role=radio]')];
  const i = ds.indexOf(document.activeElement); if (i < 0) return false;
  const map = { ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1 };
  let j = null;
  if (map[e.key] !== undefined) j = (i + map[e.key] + ds.length) % ds.length;
  else if (e.key === 'Home') j = 0;
  else if (e.key === 'End') j = ds.length - 1;
  if (j === null) return false;
  e.preventDefault(); ds[j].click();
  hop.querySelectorAll('[role=radio]')[j]?.focus();
  return true;
}

function tudongKhopSeq(){
  const d = dinh(); if (!d) return;
  const ratioD = d.w / d.h;
  const idx = SEQS.findIndex(s => Math.abs((s.w / s.h) - ratioD) < 0.01);
  if (idx >= 0) iSeq = idx;
}

/* ============ VẼ PNG GUIDE — DÙNG CHUNG ve-guide.js ============
   ☠️ Bộ vẽ dùng chung là lý do khung xem trước và ảnh đặt lên timeline giống
   nhau. Nó cũng là chỗ nhúng dòng "LOP GUIDE — TAT TRUOC KHI XUAT VIDEO" vào
   chính tấm ảnh: Premiere KHÔNG có guide-layer kiểu After Effects, mọi công
   tắc ẩn clip đều ẩn luôn khỏi preview, nên lời cảnh báo phải nằm trong ảnh. */
function fmtDeVe(){
  const V = gopVung(dsDangDung());
  const d = dichDangDung();
  return {
    id: d ? d.id : 'guide',
    vung: Object.keys(V).map(c => ({
      canh:c, pt:V[c].pt, loai:V[c].l,
      trangThai: d ? d.tin : 'chinh_thuc',
      ui: { vi:V[c].m, en:V[c].mEn || V[c].m }
    }))
  };
}

function taoPngGuideline(seqInfo, dFormat, cfgLuoi){
  const W = seqInfo.w || 1080, H = seqInfo.h || 1920;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const k = khungDich(seqInfo, dFormat || { w:W, h:H });
  const coVung = !!(dFormat && dFormat.vung && dFormat.vung.length);
  const opts = {};   // khong nhan, khong tag — anh guide chi co duong va vung

  // Khung đích hẹp hơn sequence: làm tối phần nằm ngoài, guide vẽ vào vùng giữa
  if (!k.khop){
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.clearRect(k.x, k.y, k.w, k.h);
  }
  ctx.save();
  ctx.translate(k.x, k.y);
  if (coVung) VeGuide.ve(ctx, k.w, k.h, fmtDeVe(), lang, opts);
  if (VeGuide.duongLuoi(cfgLuoi).length) VeGuide.veLuoi(ctx, k.w, k.h, cfgLuoi, lang, opts);
  ctx.restore();
  if (!k.khop){
    ctx.strokeStyle = 'rgba(64,220,255,0.9)';
    ctx.lineWidth = Math.max(1.5, W / 1080 * 2);
    ctx.strokeRect(k.x, k.y, k.w, k.h);
  }
  return cv;
}

/* ============ HÀNH ĐỘNG ============ */
function hienGuide(){
  if (dangChay) return;
  const d = dichDangDung();
  const coVung = !!(d && d.vung && d.vung.length);
  if (!coVung && VeGuide.duongLuoi(luoiCfg).length === 0){ datTin('warn', DICT[lang].luoiTrong); return; }

  dangChay = true; tinRieng = null;
  const nut = $('go');
  nut.disabled = true; delete nut.dataset.state;
  if ($('goLabel')) $('goLabel').textContent = DICT[lang].dangHien;

  napHost()
    // ☠️ Con guide cu tren timeline thi phai GO TRUOC. Nut luc do ghi "Thay bang
    // khung an toan moi" — khong go thi track tren cung khong con trong, lenh se
    // truot voi HET_TRACK va nhan nut thanh noi doi (do 26/08/2026).
    .then(() => soLopGuide > 0 ? evalP('gf_tatOverlay()', 20000) : null)
    .then(() => evalP('gf_thongTinSeq()'))
    .then(r => {
      r = String(r);
      if (r.indexOf('OK:') !== 0) throw new Error(r);
      const m = r.slice(3).split('|');
      const s = { w:parseInt(m[0],10), h:parseInt(m[1],10), dai:parseFloat(m[2]) || 0, ten:m[3] || '' };
      if (!(s.w > 0 && s.h > 0)) throw new Error('ERR:KHONG_DOC_DUOC_KHUNG|');
      realSeqPremiere = s;
      // Vùng In/Out đọc TƯƠI ngay trong lần bấm này (không tin bản cache của
      // vòng thăm dò — anh có thể vừa đổi I/O xong bấm liền). Có vùng thì guide
      // chỉ phủ đúng vùng đó; không có thì phủ cả sequence như cũ.
      const vX = tinhVungChon(parseFloat(m[4]), parseFloat(m[5]), s.dai);
      datVungChon(vX);
      const b64 = taoPngGuideline(s, d, luoiCfg).toDataURL('image/png').split(',')[1];
      const tenFile = 'AIO_GUIDE_' + (d ? d.id : 'luoi') + '_' + s.w + 'x' + s.h + '_' + Date.now() + '.png';
      const duongDan = THU_MUC + '/' + tenFile;
      ghiFile(duongDan, b64, 'base64');
      donFileCu(tenFile);
      const a = vX ? vX.a : 0, b = vX ? vX.b : s.dai;
      return evalP('gf_datOverlay("' + duongDan + '",' + a + ',' + b + ')', 20000);
    })
    .then(r => {
      r = String(r);
      if (r.indexOf('OK:') !== 0) throw new Error(r);
      const p = {}; r.slice(3).split('|').forEach(c => { const x = c.split('='); p[x[0]] = x[1]; });
      // Host trả batDau/ketThuc THẬT đã kẹp — tin nó chứ không tin số mình gửi đi
      const coVungThuc = parseFloat(p.batDau) > 0.01 || parseFloat(p.ketThuc) < parseFloat(p.daiSeq) - 0.01;
      let chu = coVungThuc
        ? tm('daDatVung', { track:p.track, dai:p.daiThuc, a:p.batDau, b:p.ketThuc })
        : tm('daDat', { track:p.track, dai:p.daiThuc, seq:p.daiSeq });
      const kyVong = parseFloat(p.ketThuc) - parseFloat(p.batDau);
      if (parseFloat(p.daiThuc) < kyVong - 0.5) chu += tm('phuThieu', { dai:p.daiThuc });
      nut.dataset.state = 'done';
      return demLop().then(() => { tinRieng = { m:'ok', html:chu }; });
    })
    .catch(e => { tinRieng = { m:'err', html:loiRaChu(e) }; })
    .then(() => {
      dangChay = false; nut.disabled = false; ve();
      setTimeout(() => { delete nut.dataset.state; veHanhDong(); }, 4000);
    });
}
