<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Hen gio chup</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    .vong {
      width: 112px; height: 112px; border-radius: 50%;
      background: rgb(22 22 22 / 92%); border: 2px solid #f86820;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 24px rgb(0 0 0 / 45%);
    }
    #n { font-size: 56px; font-weight: 700; color: #fff; line-height: 1; animation: nay 900ms ease-out; }
    @keyframes nay { from { transform: scale(1.35); opacity: .3 } to { transform: scale(1); opacity: 1 } }
  </style>
</head>
<body>
  <div class="vong"><div id="n">&nbsp;</div></div>
  <script>
    const n0 = new URLSearchParams(location.search).get('n') || '3'
    const el = document.getElementById('n')
    window.datSo = (s) => { el.textContent = String(s); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '' }
    window.datSo(n0)
  </script>
</body>
</html>
