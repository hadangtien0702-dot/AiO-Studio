<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data:; style-src 'unsafe-inline' 'self' file:; font-src file:; script-src 'self'" />
  <title>AiO — Khay ảnh</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="shelf.css" />
</head>
<body>
  <div id="shelf">
    <!-- Tay nam DOI CO (14/09 goc tren-trai; 15/09 anh xin CA 4 GOC): hien khi re chuot len khay.
         #grip giu id cu cho harness; 3 goc kia la .grip-goc. Goc DOI DIEN dung yen khi keo. -->
    <div id="grip" class="grip-goc" data-goc="tl" data-i18n-title="khay.doiCo"></div>
    <div id="grip-tr" class="grip-goc" data-goc="tr" data-i18n-title="khay.doiCo"></div>
    <div id="grip-bl" class="grip-goc" data-goc="bl" data-i18n-title="khay.doiCo"></div>
    <div id="grip-br" class="grip-goc" data-goc="br" data-i18n-title="khay.doiCo"></div>
    <header id="bar">
      <span id="logo" title="AiO Shot &amp; Save — kéo để di chuyển khay">
        <svg viewBox="0 0 385.89 351.31" width="13" height="12" aria-hidden="true">
          <path fill="currentColor" d="M71.66,232.56h61.05v46.15c0,39.55-32.11,71.66-71.66,71.66H0v-46.15C0,264.67,32.11,232.56,71.66,232.56Z"/>
          <path fill="currentColor" d="M385.89,351.31h-53.03c-96.53-2.15-100.18,5.1-136.92-40.6l-116.4-144.82c-36.73-45.7-28.47-110.09,16.24-149.27L116.47,0l269.42,351.31Z"/>
        </svg>
      </span>
      <span id="title" data-i18n="khay.tieuDe">Khay ảnh</span>
      <span id="count">0</span>
      <span class="spacer"></span>
      <button id="storyboard" data-i18n-title="khay.storyboard">
        <!-- 29/09 anh: "icon ... gom qua" (o luoi # 4 net, day o 13px) -> clapperboard Lucide, net 1.9 theo luat icon AiO (MASTER.md). Cung hinh voi 2 nut Storyboard o overlay. -->
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9M12.4 3.4l3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      </button>
      <!-- 01/10: mo Khay video (quay vung man hinh). Icon Lucide video, cung hinh nut Quay tren thanh cong cu chup. -->
      <button id="video" data-i18n-title="khay.video">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
      </button>
      <button id="folder" data-i18n-title="khay.moThuMuc">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button id="clear" data-i18n-title="khay.don">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
      </button>
      <button id="hide" data-i18n-title="khay.an">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
      </button>
    </header>

    <div id="list" role="list"></div>

    <p id="empty"></p>
  </div>
  <script src="shelf.js"></script>
</body>
</html>
