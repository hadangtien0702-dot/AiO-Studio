<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; media-src file:; img-src data:; style-src 'unsafe-inline' 'self' file:; font-src file:; script-src 'self'" />
  <title>AiO Shot &amp; Save · Video</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <!-- 01/10 KHAY VIDEO (anh chot "khay rieng cho video"). Dung CHUNG storyboard.css (header 46px, the .dai, nut .nut,
       thong bao .toast = khuon man Cai dat) de 2 khay khong lech nhau; video.css chi them phan rieng cua video. -->
  <link rel="stylesheet" href="../storyboard/storyboard.css" />
  <link rel="stylesheet" href="video.css" />
</head>
<body>
  <header id="tieu-de">
    <div class="hieu">
      <svg class="logo" viewBox="0 0 385.89 351.31" width="18" height="16" aria-hidden="true">
        <path fill="currentColor" d="M71.66,232.56h61.05v46.15c0,39.55-32.11,71.66-71.66,71.66H0v-46.15C0,264.67,32.11,232.56,71.66,232.56Z"/>
        <path fill="currentColor" d="M385.89,351.31h-53.03c-96.53-2.15-100.18,5.1-136.92-40.6l-116.4-144.82c-36.73-45.7-28.47-110.09,16.24-149.27L116.47,0l269.42,351.31Z"/>
      </svg>
      <span id="title" data-i18n="vd.tieuDe">Khay video</span>
      <span id="shot-badge">0</span>
    </div>
    <div class="dieu-khien">
      <button id="btn-close" class="dong" data-i18n-title="vd.dong">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <!-- Moi doan quay 1 hang (video.js dung the .dai.vd). Ca hang la mon keo duoc: tha vao Premiere / Zalo / Messenger. -->
  <main id="viewport">
    <div id="ds-video"></div>
    <p id="trong" class="trong" hidden data-i18n="vd.chuaCo"></p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="video.js"></script>
</body>
</html>
