<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data:; style-src 'unsafe-inline' 'self' file:; font-src file:; script-src 'self'" />
  <title>AiO Shot &amp; Save · Nút khay</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="nut.css" />
  <!-- 01/10 NUT TRON: khay anh thu ve day khi khong dung (main: src/khay-thu.js). Cua so 80x80 trong suot, vong tron 52 px
       nam giua. Bam = mo khay (chuyen dong "ong kinh"). Re chuot hien nut x nho = an han nut. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: var(--font-ui); }
    #nut { left: 14px; top: 14px; border: 0; padding: 0; cursor: pointer; transition: box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease); }
    #nut:hover { box-shadow: 0 4px 10px rgb(0 0 0 / 55%), 0 0 0 2px var(--accent), inset 0 1px 0 rgb(255 255 255 / 12%); }
    #nut:active { transform: scale(.94); }
    #an {
      position: absolute; left: 6px; top: 6px; width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      border: 0; border-radius: 10px; background: rgb(10 10 10 / 86%); color: var(--text-2);
      cursor: pointer; opacity: 0; transition: opacity var(--dur) var(--ease), background var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    body:hover #an { opacity: 1; }
    #an:hover { background: var(--danger-strong); color: #fff; }
  </style>
</head>
<body>
  <button class="nut" id="nut">
    <span class="mat logo hien"><svg viewBox="0 0 385.89 351.31" width="21" height="19" aria-hidden="true"><path fill="currentColor" d="M71.66,232.56h61.05v46.15c0,39.55-32.11,71.66-71.66,71.66H0v-46.15C0,264.67,32.11,232.56,71.66,232.56Z"/><path fill="currentColor" d="M385.89,351.31h-53.03c-96.53-2.15-100.18,5.1-136.92-40.6l-116.4-144.82c-36.73-45.7-28.47-110.09,16.24-149.27L116.47,0l269.42,351.31Z"/></svg></span>
    <span class="mat anh"><img id="anh" alt="" draggable="false" /></span>
    <i class="so" id="so"></i>
  </button>
  <button id="an">
    <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <script src="nut.js"></script>
</body>
</html>
