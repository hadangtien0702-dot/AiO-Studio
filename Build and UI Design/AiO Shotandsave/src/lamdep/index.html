<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline' 'self' file:; font-src file:; script-src 'self'" />
  <title>AiO Shot &amp; Save</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="lamdep.css" />
</head>
<body>
  <header id="tieu-de">
    <div class="hieu">
      <svg class="logo" viewBox="0 0 385.89 351.31" width="18" height="16" aria-hidden="true">
        <path fill="currentColor" d="M71.66,232.56h61.05v46.15c0,39.55-32.11,71.66-71.66,71.66H0v-46.15C0,264.67,32.11,232.56,71.66,232.56Z"/>
        <path fill="currentColor" d="M385.89,351.31h-53.03c-96.53-2.15-100.18,5.1-136.92-40.6l-116.4-144.82c-36.73-45.7-28.47-110.09,16.24-149.27L116.47,0l269.42,351.31Z"/>
      </svg>
      <span id="title" data-i18n="ld.tieuDe"></span>
      <span id="kich-thuoc" title=""></span>
    </div>
    <div class="dieu-khien">
      <button id="btn-close" class="dong" data-i18n-title="ld.dong">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <main id="than">
    <section id="xem">
      <div id="ban-co"><canvas id="cv"></canvas></div>
    </section>

    <aside id="bang">
      <div id="cuon">
        <div class="nhom">
          <div class="nhan" data-i18n="ld.tiLe"></div>
          <div class="chon-nhom" id="g-tile">
            <button class="chon-nut" data-v="free" data-i18n="ld.tuDo"></button>
            <button class="chon-nut" data-v="1:1">1:1</button>
            <button class="chon-nut" data-v="4:5">4:5</button>
            <button class="chon-nut" data-v="9:16">9:16</button>
            <button class="chon-nut" data-v="16:9">16:9</button>
          </div>
        </div>

        <div class="nhom">
          <div class="nhan" data-i18n="ld.nen"></div>
          <div class="chon-nhom luoi2" id="g-nen">
            <button class="chon-nut" data-v="chuyen" data-i18n="ld.nenChuyen"></button>
            <button class="chon-nut" data-v="dac" data-i18n="ld.nenDac"></button>
            <button class="chon-nut" data-v="mo" data-i18n="ld.nenMo"></button>
            <button class="chon-nut" data-v="trong" data-i18n="ld.nenTrong"></button>
          </div>
          <div id="mau-hang"></div>
        </div>

        <div class="nhom">
          <label class="hang"><span class="nhan-hang" data-i18n="ld.le"></span><input id="s-le" type="range" min="0" max="30" step="1" /><output id="o-le"></output></label>
          <label class="hang"><span class="nhan-hang" data-i18n="ld.bo"></span><input id="s-bo" type="range" min="0" max="20" step="1" /><output id="o-bo"></output></label>
          <label class="hang"><span class="nhan-hang" data-i18n="ld.bong"></span><input id="s-bong" type="range" min="0" max="100" step="1" /><output id="o-bong"></output></label>
        </div>
      </div>

      <footer id="chan">
        <div id="tt" role="status"><span id="tt-nhan"></span><span id="tt-ten"></span></div>
        <div class="nut-hang">
          <button id="btn-chep" class="nut" data-i18n="ld.chep"></button>
          <button id="btn-luu" class="nut chinh" data-i18n="ld.luu"></button>
        </div>
      </footer>
    </aside>
  </main>
  <script src="render.js"></script>
  <script src="lamdep.js"></script>
</body>
</html>
