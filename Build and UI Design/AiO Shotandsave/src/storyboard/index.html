<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data: blob: file:; style-src 'unsafe-inline' 'self' file:; font-src file:; script-src 'self'" />
  <title>AiO Shot &amp; Save · Storyboard Strip</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="storyboard.css" />
</head>
<body>
  <!-- [28/09 Claude, anh Tien: "chua chuan nhu UI dang co · font chu - pill - cach em sap xep"]
       Chuan = man Cai dat (src/settings): header 46px chu trang 13px/700, nut dong tron 28px, cum pill bo tron
       nen --bg-0 voi lua chon CAM DAC chu trang dam, nhan chu ben trai + cum pill ben phai, nut .nut vien thuoc. -->
  <header id="tieu-de">
    <div class="hieu">
      <svg class="logo" viewBox="0 0 385.89 351.31" width="18" height="16" aria-hidden="true">
        <path fill="currentColor" d="M71.66,232.56h61.05v46.15c0,39.55-32.11,71.66-71.66,71.66H0v-46.15C0,264.67,32.11,232.56,71.66,232.56Z"/>
        <path fill="currentColor" d="M385.89,351.31h-53.03c-96.53-2.15-100.18,5.1-136.92-40.6l-116.4-144.82c-36.73-45.7-28.47-110.09,16.24-149.27L116.47,0l269.42,351.31Z"/>
      </svg>
      <span id="title" data-i18n="sb.tieuDe">Dải phân cảnh Storyboard</span>
      <span id="shot-badge">0</span>
    </div>
    <div class="dieu-khien">
      <button id="btn-drag" class="dong keo" draggable="true" data-i18n-title="sb.keo">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/>
          <line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/>
        </svg>
      </button>
      <button id="btn-close" class="dong" data-i18n-title="sb.dong">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <div id="toolbar">
    <div class="hang-chon">
      <span class="nhan-chon" data-i18n="sb.boCuc">Bố cục</span>
      <div class="chon-nhom" role="radiogroup">
        <button id="btn-filmstrip" class="chon-nut active" data-layout="filmstrip" data-i18n="sb.ngang">Dải cuộn phim</button>
        <button id="btn-grid" class="chon-nut" data-layout="grid" data-i18n="sb.luoi">Lưới phân cảnh</button>
      </div>
    </div>

    <!-- [28/09] anh bo cum "Hien thi" (Nhan SHOT / Ngay gio): "tu dong hien shot la duoc" -->

    <span class="spacer"></span>

    <button id="btn-save" class="nut" data-i18n="sb.luuNut" data-i18n-title="sb.luu">Lưu PNG</button>
    <button id="btn-copy" class="nut chinh" data-i18n="sb.copyNut" data-i18n-title="sb.copy">Sao chép</button>
  </div>

  <main id="viewport">
    <div id="canvas-wrapper">
      <canvas id="main-canvas"></canvas>
      <div id="shot-overlays"></div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="storyboard.js"></script>
</body>
</html>
