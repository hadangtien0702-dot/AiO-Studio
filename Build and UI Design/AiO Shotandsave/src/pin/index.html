<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data:; style-src 'unsafe-inline' 'self' file:; script-src 'self'" />
  <title>AiO Pin</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="pin.css" />
</head>
<body>
  <div id="frame">
    <img id="img" alt="" draggable="true" data-i18n-title="ghim.goiY" />
    <!-- Lop ve khung/mui ten len anh ghim (an; bam nut but de bat). -->
    <canvas id="ve" hidden></canvas>
    <div id="bar">
      <div id="drag-file" draggable="true" data-i18n-title="ghim.keoFile" role="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </div>
      <button id="copy" data-i18n-title="ghim.copy">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <button id="close" data-i18n-title="ghim.dong">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <!-- Thanh cong cu ve — hien khi dang o che do ve. Markup tai dung tu overlay. -->
    <div id="toolbar">
      <button class="cong-cu" data-tool="select" data-i18n-title="overlay.select" aria-label="select">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 7 18 3-7 7-3L3 3z"/></svg><i class="so">V</i>
      </button>
      <button class="cong-cu" data-tool="rect" data-i18n-title="overlay.rect" aria-label="rect">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><i class="so">1</i>
      </button>
      <button class="cong-cu" data-tool="arrow" data-i18n-title="overlay.arrow" aria-label="arrow">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M11 5h8v8"/></svg><i class="so">2</i>
      </button>
      <button class="cong-cu" data-tool="text" data-i18n-title="overlay.text" aria-label="text">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg><i class="so">3</i>
      </button>
      <button class="cong-cu" data-tool="blur" data-i18n-title="overlay.blur" aria-label="blur">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="8" height="8" rx="1.5"/>
          <rect x="13" y="3" width="8" height="8" rx="1.5" fill="currentColor" fill-opacity="0.3"/>
          <rect x="3" y="13" width="8" height="8" rx="1.5" fill="currentColor" fill-opacity="0.3"/>
          <rect x="13" y="13" width="8" height="8" rx="1.5"/>
        </svg><i class="so">4</i>
      </button>
      <!-- 02/10 DANH SO BUOC (phim 6, cung phim voi man chup; phim 5 la Doc chu ben man chup). -->
      <button class="cong-cu" data-tool="so" data-i18n-title="overlay.so" aria-label="step number">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10.2 9.7 12.6 8v8.2"/></svg><i class="so">6</i>
      </button>
      <!-- 06/10 BUT VE TAY (phim 7) + BUT DA QUANG (phim 8). Icon Lucide pencil / highlighter, net 1.9. -->
      <button class="cong-cu" data-tool="but" data-i18n-title="overlay.but" aria-label="pen">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg><i class="so">7</i>
      </button>
      <button class="cong-cu" data-tool="daquang" data-i18n-title="overlay.daquang" aria-label="highlighter">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg><i class="so">8</i>
      </button>
      <span class="chia"></span>
      <div id="mau-nhom" role="group" aria-label="color">
        <button class="mau" data-color="#f86820" style="background:#f86820" aria-label="cam"></button>
        <button class="mau" data-color="#ff3b30" style="background:#ff3b30" aria-label="do"></button>
        <button class="mau" data-color="#ffcc00" style="background:#ffcc00" aria-label="vang"></button>
        <button class="mau" data-color="#34c759" style="background:#34c759" aria-label="xanh la"></button>
        <button class="mau" data-color="#0a84ff" style="background:#0a84ff" aria-label="xanh duong"></button>
        <button class="mau" data-color="#ffffff" style="background:#ffffff" aria-label="trang"></button>
        <button class="mau" data-color="#111111" style="background:#111111" aria-label="den"></button>
      </div>
      <span class="chia"></span>
      <button id="undo" class="cong-cu" data-i18n-title="overlay.undo" aria-label="undo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
      </button>
      <span class="chia"></span>
      <button id="huy" class="cong-cu huy" data-i18n-title="overlay.cancel" aria-label="cancel">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <button id="xong" class="cong-cu xong" data-i18n-title="ghim.veXong" aria-label="done">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </div>
  </div>
  <script src="pin.js"></script>
</body>
</html>
