<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data: aioshot:; style-src 'unsafe-inline' 'self' file:; script-src 'self'" />
  <title>AiO Shot — chon vung</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="shot"></div>
  <div id="dim"></div>
  <div id="sel" hidden>
    <div id="size" title="Kéo để di chuyển khung"></div>
    <button id="sel-storyboard-btn" class="sel-opt-chip" type="button" data-i18n-title="overlay.storyboard_btn" aria-label="Storyboard Strip">
      <!-- 29/09: clapperboard Lucide (cung hinh nut Storyboard o khay); khung chia 3 o cu de nham voi cong cu Khung -->
      <svg class="ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/>
        <path d="m6.2 5.3 3.1 3.9M12.4 3.4l3.1 4"/>
        <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
      </svg>
      <span class="chip-text" data-i18n="overlay.storyboard_chip">Storyboard Strip</span>
      <span class="chip-hotkey">S</span>
    </button>
    <!-- 29/09 anh chon huong B "Xoe 6 khung": bam S -> 5 khung mo xoe ra sau roi thu lai + 1..6 (CSS #sel.sb) -->
    <div class="sb-ma n1" aria-hidden="true"></div><div class="sb-ma n2" aria-hidden="true"></div><div class="sb-ma n3" aria-hidden="true"></div>
    <div class="sb-ma n4" aria-hidden="true"></div><div class="sb-ma n5" aria-hidden="true"></div>
    <div id="sb-dem" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
    <!-- 8 tay nắm chỉnh cỡ khung -->
    <div class="sel-handle handle-nw" data-handle="nw" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-n" data-handle="n" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-ne" data-handle="ne" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-e" data-handle="e" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-se" data-handle="se" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-s" data-handle="s" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-sw" data-handle="sw" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-w" data-handle="w" title="Kéo để đổi cỡ"></div>
    <!-- 4 viền để kéo đổi cỡ các cạnh khung -->
    <div class="sel-edge edge-t" data-edge="n" title="Kéo để đổi cỡ"></div>
    <div class="sel-edge edge-b" data-edge="s" title="Kéo để đổi cỡ"></div>
    <div class="sel-edge edge-l" data-edge="w" title="Kéo để đổi cỡ"></div>
    <div class="sel-edge edge-r" data-edge="e" title="Kéo để đổi cỡ"></div>
  </div>
  <!-- Guong vung chon tu man KHAC: 4 tam mo + khung cam phan giao (KHONG dung
       box-shadow — cach do gay vet sang/toi khi rect ngoai ria, vap 25/08). -->
  <div id="guong" hidden>
    <div class="g-dim" id="g-t"></div><div class="g-dim" id="g-b"></div>
    <div class="g-dim" id="g-l"></div><div class="g-dim" id="g-r"></div>
    <div id="g-khung"></div>
    <div id="g-size" hidden></div>
  </div>
  <!-- Lop ve shape (khung/mui ten) — nam TREN vung chon khi annotate. -->
  <canvas id="ve" hidden></canvas>
  <!-- Thanh cong cu ve — hien sau khi chon vung xong. -->
  <div id="toolbar" hidden>
    <button class="cong-cu" data-tool="select" data-i18n-title="overlay.select" aria-label="select">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 7 18 3-7 7-3L3 3z"/></svg><i class="so">V</i>
    </button>
    <button class="cong-cu" data-tool="rect" data-i18n-title="overlay.rect" aria-label="rect">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><i class="so">1</i>
    </button>
    <button class="cong-cu" data-tool="arrow" data-i18n-title="overlay.arrow" aria-label="arrow">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M11 5h8v8"/></svg><i class="so">2</i>
    </button>
    <button class="cong-cu" data-tool="text" data-i18n-title="overlay.text" aria-label="text">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg><i class="so">3</i>
    </button>
    <button class="cong-cu" data-tool="blur" data-i18n-title="overlay.blur" aria-label="blur">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="8" height="8" rx="1.5"/>
        <rect x="13" y="3" width="8" height="8" rx="1.5" fill="currentColor" fill-opacity="0.3"/>
        <rect x="3" y="13" width="8" height="8" rx="1.5" fill="currentColor" fill-opacity="0.3"/>
        <rect x="13" y="13" width="8" height="8" rx="1.5"/>
      </svg><i class="so">4</i>
    </button>
    <!-- 29/09 anh: "khoanh vung, bam phim so 5, sinh ra bang cac dong text va nut copy". Icon Lucide scan-text. -->
    <button class="cong-cu" data-tool="ocr" data-i18n-title="overlay.ocr" aria-label="ocr">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8h8M7 12h10M7 16h6"/></svg><i class="so">5</i>
    </button>
    <button class="cong-cu" data-tool="storyboard" data-i18n-title="overlay.storyboard" aria-label="storyboard">
      <svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/>
        <path d="m6.2 5.3 3.1 3.9M12.4 3.4l3.1 4"/>
        <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
      </svg><i class="so">S</i>
    </button>
    <span class="chia"></span>
    <!-- Bang chon mau — mac dinh cam (accent) -->
    <div id="mau-nhom" role="group" aria-label="color">
      <button class="mau" data-color="#f86820" style="background:#f86820" aria-label="cam"></button>
      <button class="mau" data-color="#ff3b30" style="background:#ff3b30" aria-label="do"></button>
      <button class="mau" data-color="#ffcc00" style="background:#ffcc00" aria-label="vang"></button>
      <button class="mau" data-color="#34c759" style="background:#34c759" aria-label="xanh la"></button>
      <button class="mau" data-color="#0a84ff" style="background:#0a84ff" aria-label="xanh duong"></button>
      <button class="mau" data-color="#ffffff" style="background:#ffffff" aria-label="trang"></button>
      <button class="mau" data-color="#111111" style="background:#111111" aria-label="den"></button>
    </div>
    <span class="chia"></span>
    <button id="undo" class="cong-cu" data-i18n-title="overlay.undo" aria-label="undo">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
    </button>
    <span class="chia"></span>
    <button id="huy" class="cong-cu huy" data-i18n-title="overlay.cancel" aria-label="cancel">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button id="xong" class="cong-cu xong" data-i18n-title="overlay.done" aria-label="done">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </button>
  </div>
  <!-- 29/09 BANG CHU (phim 5): cac dong chu doc duoc trong vung + nut Sao chep. Chu CHON duoc de chep 1 phan. -->
  <div id="ocr-bang" role="dialog" aria-labelledby="ocr-tieu-de" hidden>
    <div class="ocr-dau">
      <span id="ocr-tieu-de" data-i18n="ocr.tieuDe">Chữ trong vùng chọn</span>
      <span id="ocr-dem"></span>
      <button id="ocr-dong" class="ocr-x" type="button" data-i18n-title="ocr.dong" aria-label="close">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="ocr-ds" tabindex="0"></div>
    <p id="ocr-ghichu" hidden></p>
    <div class="ocr-chan">
      <!-- 29/09: doc lai bang bo doc KIA (Tesseract tieng Viet <-> bo doc Windows). Chi hien tren Windows. -->
      <button id="ocr-doi" class="ocr-doi" type="button" hidden></button>
      <button id="ocr-chep" class="ocr-nut" type="button"><span data-i18n="ocr.chep">Sao chép</span><kbd>Enter</kbd></button>
    </div>
  </div>
  <div id="hint">
    <svg class="logo" viewBox="0 0 385.89 351.31" width="13" height="12" aria-hidden="true">
      <path fill="currentColor" d="M71.66,232.56h61.05v46.15c0,39.55-32.11,71.66-71.66,71.66H0v-46.15C0,264.67,32.11,232.56,71.66,232.56Z"/>
      <path fill="currentColor" d="M385.89,351.31h-53.03c-96.53-2.15-100.18,5.1-136.92-40.6l-116.4-144.82c-36.73-45.7-28.47-110.09,16.24-149.27L116.47,0l269.42,351.31Z"/>
    </svg>
    <span><span data-i18n="overlay.hint"></span> · <b data-i18n="overlay.esc"></b> <span data-i18n="overlay.huy"></span></span>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
