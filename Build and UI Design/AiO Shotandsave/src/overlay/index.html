<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data: aioshot:; style-src 'unsafe-inline' 'self' file:; script-src 'self'" />
  <title>AiO Shot — chon vung</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="shot"></div>
  <div id="dim"></div>
  <div id="sel" hidden>
    <div id="size" title="Kéo để di chuyển khung"></div>
    <button id="sel-storyboard-btn" class="sel-opt-chip" type="button" data-i18n-title="overlay.storyboard_btn" aria-label="Storyboard Strip">
      <!-- 29/09: clapperboard Lucide (cung hinh nut Storyboard o khay); khung chia 3 o cu de nham voi cong cu Khung -->
      <svg class="ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/>
        <path d="m6.2 5.3 3.1 3.9M12.4 3.4l3.1 4"/>
        <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
      </svg>
      <span class="chip-text" data-i18n="overlay.storyboard_chip">Storyboard Strip</span>
      <span class="chip-hotkey">S</span>
    </button>
    <!-- 29/09 anh chon huong B "Xoe 6 khung": bam S -> 5 khung mo xoe ra sau roi thu lai + 1..6 (CSS #sel.sb) -->
    <div class="sb-ma n1" aria-hidden="true"></div><div class="sb-ma n2" aria-hidden="true"></div><div class="sb-ma n3" aria-hidden="true"></div>
    <div class="sb-ma n4" aria-hidden="true"></div><div class="sb-ma n5" aria-hidden="true"></div>
    <div id="sb-dem" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
    <!-- 8 tay nắm chỉnh cỡ khung -->
    <div class="sel-handle handle-nw" data-handle="nw" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-n" data-handle="n" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-ne" data-handle="ne" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-e" data-handle="e" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-se" data-handle="se" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-s" data-handle="s" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-sw" data-handle="sw" title="Kéo để đổi cỡ"></div>
    <div class="sel-handle handle-w" data-handle="w" title="Kéo để đổi cỡ"></div>
    <!-- 4 viền để kéo đổi cỡ các cạnh khung -->
    <div class="sel-edge edge-t" data-edge="n" title="Kéo để đổi cỡ"></div>
    <div class="sel-edge edge-b" data-edge="s" title="Kéo để đổi cỡ"></div>
    <div class="sel-edge edge-l" data-edge="w" title="Kéo để đổi cỡ"></div>
    <div class="sel-edge edge-r" data-edge="e" title="Kéo để đổi cỡ"></div>
  </div>
  <!-- Guong vung chon tu man KHAC: 4 tam mo + khung cam phan giao (KHONG dung
       box-shadow — cach do gay vet sang/toi khi rect ngoai ria, vap 25/08). -->
  <div id="guong" hidden>
    <div class="g-dim" id="g-t"></div><div class="g-dim" id="g-b"></div>
    <div class="g-dim" id="g-l"></div><div class="g-dim" id="g-r"></div>
    <div id="g-khung"></div>
    <div id="g-size" hidden></div>
  </div>
  <!-- Lop ve shape (khung/mui ten) — nam TREN vung chon khi annotate. -->
  <canvas id="ve" hidden></canvas>
  <!-- Thanh cong cu ve — hien sau khi chon vung xong. -->
  <div id="toolbar" hidden>
    <button class="cong-cu" data-tool="select" data-i18n-title="overlay.select" aria-label="select">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 7 18 3-7 7-3L3 3z"/></svg><i class="so">V</i>
    </button>
    <!-- 06/10 anh: "phim tat chu V ... them dau | phan vung voi so 1-2-3-4-5-6-7": vach ngan nut V (phim CHU) voi day nut danh SO -->
    <span class="chia chia-v"></span>
    <button class="cong-cu" data-tool="rect" data-i18n-title="overlay.rect" aria-label="rect">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><i class="so">1</i>
    </button>
    <button class="cong-cu" data-tool="arrow" data-i18n-title="overlay.arrow" aria-label="arrow">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M11 5h8v8"/></svg><i class="so">2</i>
    </button>
    <button class="cong-cu" data-tool="text" data-i18n-title="overlay.text" aria-label="text">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg><i class="so">3</i>
    </button>
    <button class="cong-cu" data-tool="blur" data-i18n-title="overlay.blur" aria-label="blur">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <!-- 04/10 anh: "icon lam mo nhin no cung khong hieu gi het" -> anh chon kieu D = KHUNG CO O KHAM (mot vung anh bi
             kham thanh o vuong). Cung hinh o src/pin/index.html. -->
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <rect x="7" y="8" width="3.4" height="3.4" fill="currentColor" stroke="none"/>
        <rect x="13.6" y="8" width="3.4" height="3.4" fill="currentColor" stroke="none"/>
        <rect x="10.3" y="11.4" width="3.4" height="3.4" fill="currentColor" stroke="none"/>
        <rect x="7" y="14.6" width="3.4" height="1.6" fill="currentColor" stroke="none"/>
        <rect x="13.6" y="14.6" width="3.4" height="1.6" fill="currentColor" stroke="none"/>
      </svg><i class="so">4</i>
    </button>
    <!-- 29/09 anh: "khoanh vung, bam phim so 5, sinh ra bang cac dong text va nut copy". Icon Lucide scan-text. -->
    <button class="cong-cu" data-tool="ocr" data-i18n-title="overlay.ocr" aria-label="ocr">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8h8M7 12h10M7 16h6"/></svg><i class="so">5</i>
    </button>
    <!-- 02/10 DANH SO BUOC (phim 6): bam len anh = huy hieu tron 1, 2, 3 tu tang.
         04/10 anh: "de so 1 do anh nhin vao khong hieu ngay no la gi", icon phai la "mark" -> anh chon kieu A = GHIM VI TRI
         (vong tron so 1 dung canh chu phim "6" la hai con so canh nhau). Cung hinh o src/pin/index.html. -->
    <button class="cong-cu" data-tool="so" data-i18n-title="overlay.so" aria-label="number marker">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><i class="so">6</i>
    </button>
    <!-- 12/11 GOP bút vẽ (phím 7) + bút dạ quang (phím 8) thành MỘT nút: rê chuột vào thì xổ menu dọc 2 lựa chọn; nút hiện icon của loại đang dùng. -->
    <div id="but-nhom" class="nhom-xo">
      <button id="but-chinh" class="cong-cu" data-tool="but" data-i18n-title="overlay.but" data-so="7" aria-haspopup="true" aria-label="pen">
        <svg class="ic-but" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg><svg class="ic-dq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
      </button>
      <div id="but-menu" class="menu-xo" role="menu" hidden>
        <button class="muc-xo" type="button" role="menuitem" data-tool="but" data-i18n-title="overlay.but" aria-label="pen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg><span data-i18n="overlay.butTen">Bút vẽ</span><i class="so">7</i>
        </button>
        <button class="muc-xo" type="button" role="menuitem" data-tool="daquang" data-i18n-title="overlay.daquang" aria-label="highlighter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg><span data-i18n="overlay.daquangTen">Dạ quang</span><i class="so">8</i>
        </button>
      </div>
    </div>
    <!-- 06/10 CHUP CUON trang dai (phim 9): bam roi tu lan chuot cuon trang, app ghep thanh mot anh dai.
         Icon: Tabler "arrow-autofit-height" (MIT), anh chon 06/10 sau khi che icon to giay + mui ten va 4 kieu em tu ve. -->
    <button class="cong-cu" data-tool="cuon" data-i18n-title="overlay.cuon" aria-label="scrolling capture">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h-6a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h6"/><path d="M18 14v7"/><path d="M18 3v7"/><path d="M15 18l3 3l3 -3"/><path d="M15 6l3 -3l3 3"/></svg><i class="so">9</i>
    </button>
    <!-- 06/10 anh chot THU TU thanh cong cu: "v o dau - toi day so - roi toi chu - toi day mau".
         V | 1 2 3 4 5 6 7 8 9 | S R | mau. Them nut moi thi dat dung nhom (so / chu) va giu 3 vach ngan nay. -->
    <span class="chia chia-chu"></span>
    <button class="cong-cu" data-tool="storyboard" data-i18n-title="overlay.storyboard" aria-label="storyboard">
      <svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/>
        <path d="m6.2 5.3 3.1 3.9M12.4 3.4l3.1 4"/>
        <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
      </svg><i class="so">S</i>
    </button>
    <!-- 01/10 QUAY VIDEO. Bam nut / phim R = quay NGAY vung nay (khong qua nut Xong), LUON co tieng may. Icon Lucide video.
         Anh chot 01/10 10:4x: BO nut loa o day; chon "Co tieng / Khong tieng" nam trong Khay video, sau khi quay xong. -->
    <button class="cong-cu quay" data-tool="quay" data-i18n-title="overlay.quay" aria-label="record">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg><i class="so">R</i>
    </button>
    <!-- 05/11 HUT MAU (phim I) + THUOC DO (phim M) gop MOT nut, re chuot xo menu (cung khuon nut but). Nut hien icon loai dang dung. -->
    <div id="do-nhom" class="nhom-xo">
      <button id="do-chinh" class="cong-cu" data-tool="hut" data-i18n-title="overlay.hut" data-so="I" aria-haspopup="true" aria-label="eyedropper">
        <svg class="ic-hut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3z"/></svg><svg class="ic-thuoc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/></svg>
      </button>
      <div id="do-menu" class="menu-xo" role="menu" hidden>
        <button class="muc-xo" type="button" role="menuitem" data-tool="hut" data-i18n-title="overlay.hut" aria-label="eyedropper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3z"/></svg><span data-i18n="overlay.hutTen">Hút màu</span><i class="so">I</i>
        </button>
        <button class="muc-xo" type="button" role="menuitem" data-tool="thuoc" data-i18n-title="overlay.thuoc" aria-label="ruler">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/></svg><span data-i18n="overlay.thuocTen">Thước đo</span><i class="so">M</i>
        </button>
      </div>
    </div>
    <span class="chia"></span>
    <!-- Bảng chọn màu, mặc định cam (accent) -->
    <div id="mau-nhom" role="group" aria-label="color">
      <!-- 12/11: thanh chỉ còn MỘT chấm màu đang chọn; bấm thì xổ bảng 7 màu -->
      <button id="mau-hien" class="mau-hien" type="button" data-i18n-title="overlay.mau" aria-haspopup="true" aria-expanded="false"><span class="cham"></span></button>
      <div id="mau-pop" role="group" hidden>
        <button class="mau" data-color="#f86820" style="background:#f86820" aria-label="cam"></button>
        <button class="mau" data-color="#ff3b30" style="background:#ff3b30" aria-label="do"></button>
        <button class="mau" data-color="#ffcc00" style="background:#ffcc00" aria-label="vang"></button>
        <button class="mau" data-color="#34c759" style="background:#34c759" aria-label="xanh la"></button>
        <button class="mau" data-color="#0a84ff" style="background:#0a84ff" aria-label="xanh duong"></button>
        <button class="mau" data-color="#ffffff" style="background:#ffffff" aria-label="trang"></button>
        <button class="mau" data-color="#111111" style="background:#111111" aria-label="den"></button>
      </div>
    </div>
    <span class="chia"></span>
    <button id="undo" class="cong-cu" data-i18n-title="overlay.undo" aria-label="undo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
    </button>
    <button id="redo" class="cong-cu" data-i18n-title="overlay.redo" aria-label="redo" disabled>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H12"/></svg>
    </button>
    <span class="chia"></span>
    <button id="huy" class="cong-cu huy" data-i18n-title="overlay.cancel" aria-label="cancel">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button id="xong" class="cong-cu xong" data-i18n-title="overlay.done" aria-label="done">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </button>
  </div>
  <!-- 29/09 BANG CHU (phim 5): cac dong chu doc duoc trong vung + nut Sao chep. Chu CHON duoc de chep 1 phan. -->
  <div id="ocr-bang" role="dialog" aria-labelledby="ocr-tieu-de" hidden>
    <div class="ocr-dau">
      <span id="ocr-tieu-de" data-i18n="ocr.tieuDe">Chữ trong vùng chọn</span>
      <span id="ocr-dem"></span>
      <button id="ocr-dong" class="ocr-x" type="button" data-i18n-title="ocr.dong" aria-label="close">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="ocr-ds" tabindex="0"></div>
    <p id="ocr-ghichu" hidden></p>
    <div class="ocr-chan">
      <!-- 29/09: doc lai bang bo doc KIA (Tesseract tieng Viet <-> bo doc Windows). Chi hien tren Windows. -->
      <button id="ocr-doi" class="ocr-doi" type="button" hidden></button>
      <button id="ocr-chep" class="ocr-nut" type="button"><span data-i18n="ocr.chep">Sao chép</span><kbd>Enter</kbd></button>
    </div>
  </div>
  <!-- 05/11 HUT MAU: kinh phong to + ma HEX bam theo con tro · dong bao da chep · bang 5 mau chu dao. THUOC DO: lop duong do + nhan so pixel that.
       Tat ca nam NGOAI canvas ve (#ve) nen KHONG vao anh xuat. -->
  <div id="hut-kinh" hidden aria-hidden="true">
    <canvas id="hut-cv" width="121" height="121"></canvas>
    <div id="hut-ma"><span id="hut-mau"></span><b id="hut-hex"></b></div>
  </div>
  <div id="hut-bao" role="status" hidden><span id="hut-bao-mau"></span><span id="hut-bao-chu"></span></div>
  <div id="hut-bang" role="group" aria-labelledby="hut-bang-td" hidden>
    <div class="hut-dau"><span id="hut-bang-td" data-i18n="hut.chuDao">Màu chủ đạo của vùng chọn</span></div>
    <div id="hut-ds"></div>
  </div>
  <div id="thuoc-lop" hidden aria-hidden="true">
    <svg id="thuoc-svg" width="100%" height="100%">
      <path id="thuoc-chan" fill="none"/>
      <line id="thuoc-vien"/><line id="thuoc-duong"/>
      <circle id="thuoc-d1" r="3.5"/><circle id="thuoc-d2" r="3.5"/>
    </svg>
    <div id="thuoc-nhan"><b id="thuoc-so"></b><span id="thuoc-kt"></span></div>
  </div>
  <div id="hint">
    <svg class="logo" viewBox="0 0 385.89 351.31" width="13" height="12" aria-hidden="true">
      <path fill="currentColor" d="M71.66,232.56h61.05v46.15c0,39.55-32.11,71.66-71.66,71.66H0v-46.15C0,264.67,32.11,232.56,71.66,232.56Z"/>
      <path fill="currentColor" d="M385.89,351.31h-53.03c-96.53-2.15-100.18,5.1-136.92-40.6l-116.4-144.82c-36.73-45.7-28.47-110.09,16.24-149.27L116.47,0l269.42,351.31Z"/>
    </svg>
    <span><span data-i18n="overlay.hint"></span><span id="hint-cs" hidden>, <span data-i18n="overlay.hintCuaSo"></span></span> · <b data-i18n="overlay.esc"></b> <span data-i18n="overlay.huy"></span></span>
  </div>
