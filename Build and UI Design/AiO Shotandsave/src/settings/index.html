<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data:; style-src 'unsafe-inline' 'self' file:; font-src file:; script-src 'self'" />
  <title>AiO Shot &amp; Save</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <!-- Header (frameless): logo AiO + tieu de + doi ngon ngu + dong -->
  <header id="tieu-de">
    <div class="hieu">
      <svg class="logo" viewBox="0 0 385.89 351.31" width="18" height="16" aria-hidden="true">
        <path fill="currentColor" d="M71.66,232.56h61.05v46.15c0,39.55-32.11,71.66-71.66,71.66H0v-46.15C0,264.67,32.11,232.56,71.66,232.56Z"/>
        <path fill="currentColor" d="M385.89,351.31h-53.03c-96.53-2.15-100.18,5.1-136.92-40.6l-116.4-144.82c-36.73-45.7-28.47-110.09,16.24-149.27L116.47,0l269.42,351.31Z"/>
      </svg>
      <span data-i18n="set.tieuDe">Cài đặt</span>
    </div>
    <div class="dieu-khien">
      <div id="lang" class="lang" role="group" data-i18n-aria="set.ngonNgu">
        <button data-lang="vi" class="lang-nut">VI</button>
        <button data-lang="en" class="lang-nut">EN</button>
      </div>
      <button id="close" class="dong" data-i18n-aria="set.dong">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <!-- 29/09 anh: "lon xon qua" -> huong B anh chon: danh sach NHOM (ten nhom nam ngoai, hang ke manh, lua chon
       dang bat mau xam noi; cam chi con o nut chinh + thanh ngay dung thu). Giu NGUYEN moi id settings.js dung. -->
  <main>
    <!-- ── Ban quyen: dung thu 14 ngay / nhap ma / huy kich hoat ─────── -->
    <section class="nhom bq" id="the-bq">
      <!-- 29/09 anh "text phu lam gon lai": Mua ban quyen don len goc phai hang tieu de (bot 1 hang) -->
      <div class="bq-dau">
        <div class="bq-trai"><h1 id="bq-tieu-de" data-i18n="bq.tieuDe">Bản quyền</h1><span id="bq-ngay" class="bq-ngay"></span></div>
        <button id="bq-mua" class="lien-ket mua" data-i18n="bq.mua"></button>
      </div>
      <div id="bq-tien-do" class="tien-do" hidden><i id="bq-tien-do-i"></i></div>
      <p class="goi-y" id="bq-mo-ta"></p>
      <!-- chua kich hoat: o nhap ma + Kich hoat + Mua -->
      <div id="bq-nhap">
        <div class="bq-hang">
          <input id="bq-ma" class="bq-o" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="bq.nhapMa" />
          <button id="bq-kich-hoat" class="nut chinh" data-i18n="bq.kichHoat"></button>
        </div>
      </div>
      <!-- da kich hoat: nut huy (bam 2 lan) -->
      <div id="bq-co" hidden>
        <button id="bq-huy" class="nut phu" data-i18n="bq.huy"></button>
      </div>
      <p id="bq-msg" class="msg"></p>
    </section>

    <!-- ── Chup anh ─────────────────────────────────────────────────── -->
    <h2 class="nhom-ten" data-i18n="set.nhom.chup">Chụp ảnh</h2>
    <section class="nhom">
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.phim.chup">Phím chụp</span>
        <div class="phai">
          <!-- idle: keycaps · recording: dong chu nhap nhay (nhan to hop = luu ngay) -->
          <div id="keys" class="keycaps" aria-live="polite"></div>
          <button id="doi" class="nut" data-i18n="set.phim.doiPhim"></button>
          <!-- Ve mac dinh = nut icon (chu o title, settings.js dat) thay dong goi y 2 hang -->
          <button id="reset" class="nut icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
          <button id="huy-ghi" class="nut phu" data-i18n="set.phim.huyNgan" hidden></button>
        </div>
      </div>
      <p id="msg" class="msg hang-msg"></p>
      <div class="hang cot">
        <span class="nhan-chon" data-i18n="set.phim.lai"></span>
        <div class="phai">
          <div id="keys-lai" class="keycaps" aria-live="polite"></div>
          <button id="doi-lai" class="nut" data-i18n="set.phim.doiPhim"></button>
          <button id="reset-lai" class="nut icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
          <button id="tat-lai" class="nut phu" data-i18n="set.phim.tat"></button>
          <button id="huy-lai" class="nut phu" data-i18n="set.phim.huyNgan" hidden></button>
        </div>
      </div>
      <p id="msg-lai" class="msg hang-msg"></p>
      <div class="hang cot">
        <span class="nhan-chon" data-i18n="set.phim.canvas"></span>
        <div class="phai">
          <div id="keys-canvas" class="keycaps" aria-live="polite"></div>
          <button id="doi-canvas" class="nut" data-i18n="set.phim.doiPhim"></button>
          <button id="reset-canvas" class="nut icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
          <button id="tat-canvas" class="nut phu" data-i18n="set.phim.tat"></button>
          <button id="huy-canvas" class="nut phu" data-i18n="set.phim.huyNgan" hidden></button>
        </div>
      </div>
      <p id="msg-canvas" class="msg hang-msg"></p>

      <div class="hang">
        <div class="nhan">
          <span class="nhan-chon" data-i18n="set.tuChep"></span>
          <span class="goi-y" data-i18n="set.tuChep.goiY"></span>
        </div>
        <div class="chon-nhom nho" id="tu-chep" role="group">
          <button class="chon-nut" data-v="1" data-i18n="set.bat"></button>
          <button class="chon-nut" data-v="0" data-i18n="set.tat2"></button>
        </div>
      </div>

      <div class="hang">
        <span class="nhan-chon" data-i18n="set.anh.dinhDang"></span>
        <div class="chon-nhom" id="anh-loai" role="group">
          <button class="chon-nut" data-v="jpeg">JPEG</button>
          <button class="chon-nut" data-v="png">PNG</button>
          <button class="chon-nut" data-v="webp">WebP</button>
        </div>
      </div>
      <div class="hang" id="hang-chat-luong">
        <span class="nhan-chon" id="nhan-chat-luong" data-i18n="set.anh.chatLuong"></span>
        <div class="chon-nhom" id="anh-chat-luong" role="group">
          <button class="chon-nut" data-v="thap" data-i18n="set.anh.thap"></button>
          <button class="chon-nut" data-v="cao" data-i18n="set.anh.cao"></button>
          <button class="chon-nut" data-v="sieu" data-i18n="set.anh.sieu"></button>
        </div>
      </div>
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.lamMo.kieu"></span>
        <div class="chon-nhom" id="lam-mo-kieu" role="group">
          <button class="chon-nut" data-v="mosaic" data-i18n="set.lamMo.mosaic"></button>
          <button class="chon-nut" data-v="blur" data-i18n="set.lamMo.blur"></button>
          <button class="chon-nut" data-v="kin" data-i18n="set.lamMo.kin"></button>
        </div>
      </div>
    </section>

    <!-- ── Ten file (06/11): tu dat ten theo noi dung anh, MAC DINH TAT ─────────────────────────────── -->
    <h2 class="nhom-ten" data-i18n="set.ten.tieuDe">Tên file</h2>
    <section class="nhom">
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.ten.tuDat"></span>
        <div class="chon-nhom nho" id="ten-tu-dat" role="group">
          <button class="chon-nut" data-v="1" data-i18n="set.bat"></button>
          <button class="chon-nut" data-v="0" data-i18n="set.tat2"></button>
        </div>
      </div>
      <div class="hang cot" id="hang-ten-mau">
        <span class="nhan-chon" data-i18n="set.ten.mau"></span>
        <div class="bq-hang">
          <input id="ten-mau" class="bq-o" type="text" spellcheck="false" autocomplete="off" maxlength="80" />
          <button id="ten-mau-mac-dinh" class="nut icon" data-i18n-title="set.ten.macDinh"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        </div>
        <p class="goi-y" id="ten-vi-du"></p>
        <p class="goi-y" data-i18n="set.ten.goiY"></p>
      </div>
    </section>

    <!-- ── Thanh cong cu (05/11): chon nut nao hien tren thanh cong cu man chup; kinh lup khi chon vung ───── -->
    <h2 class="nhom-ten" data-i18n="set.nhom.thanh">Thanh công cụ</h2>
    <section class="nhom">
      <div class="hang cot">
        <span class="nhan-chon" data-i18n="set.thanh.nut"></span>
        <div class="nut-chips" id="thanh-nut" role="group">
          <button type="button" class="nut-chip chon" data-k="rect"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><span data-i18n="set.nut.rect"></span></button>
          <button type="button" class="nut-chip chon" data-k="arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M11 5h8v8"/></svg><span data-i18n="set.nut.arrow"></span></button>
          <button type="button" class="nut-chip chon" data-k="text"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M12 6v13M9 19h6"/></svg><span data-i18n="set.nut.text"></span></button>
          <button type="button" class="nut-chip chon" data-k="blur"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="7" y="8" width="3.4" height="3.4" fill="currentColor" stroke="none"/><rect x="13.6" y="8" width="3.4" height="3.4" fill="currentColor" stroke="none"/><rect x="10.3" y="11.4" width="3.4" height="3.4" fill="currentColor" stroke="none"/></svg><span data-i18n="set.nut.blur"></span></button>
          <button type="button" class="nut-chip chon" data-k="ocr"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8h8M7 12h10M7 16h6"/></svg><span id="chip-ocr-nhan" data-i18n="set.nut.ocrChi"></span></button>
          <button type="button" class="nut-chip chon" data-k="so"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><span data-i18n="set.nut.so"></span></button>
          <button type="button" class="nut-chip chon" data-k="but"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg><span data-i18n="set.nut.but"></span></button>
          <button type="button" class="nut-chip chon" data-k="cuon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h-6a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h6"/><path d="M18 14v7"/><path d="M18 3v7"/><path d="M15 18l3 3l3 -3"/><path d="M15 6l3 -3l3 3"/></svg><span data-i18n="set.nut.cuon"></span></button>
          <button type="button" class="nut-chip chon" data-k="storyboard"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9M12.4 3.4l3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span data-i18n="set.nut.storyboard"></span></button>
          <button type="button" class="nut-chip chon" data-k="quay"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg><span data-i18n="set.nut.quay"></span></button>
          <button type="button" class="nut-chip chon" data-k="do"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg><span data-i18n="set.nut.do"></span></button>
        </div>
        <p class="goi-y" data-i18n="set.thanh.goiY"></p>
      </div>
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.kinhLup.nhan"></span>
        <div class="chon-nhom nho" id="kinh-lup-bat" role="group">
          <button class="chon-nut" data-v="1" data-i18n="set.bat"></button>
          <button class="chon-nut" data-v="0" data-i18n="set.tat2"></button>
        </div>
      </div>
    </section>

    <!-- ── Khay anh ──────────────────────────────────────────────────── -->
    <h2 class="nhom-ten" data-i18n="set.nhom.khay">Khay ảnh</h2>
    <section class="nhom">
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.khay.kieu"></span>
        <div class="chon-nhom" id="khay-kieu" role="group">
          <button class="chon-nut" data-v="ngang" data-i18n="set.khay.ngang"></button>
          <button class="chon-nut" data-v="doc" data-i18n="set.khay.doc"></button>
        </div>
      </div>
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.khay.soAnh"></span>
        <div class="chon-nhom nho" id="khay-so-anh" role="group">
          <button class="chon-nut" data-v="0" data-i18n="set.khay.tat"></button>
          <button class="chon-nut" data-v="5">5</button>
          <button class="chon-nut" data-v="10">10</button>
          <button class="chon-nut" data-v="20">20</button>
        </div>
      </div>
      <!-- 01/10 anh chot: khay tu thu ve nut tron o goc sau 5 giay khong dung; cho chon 5 / 10 / 15 giay -->
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.khay.tuThu"></span>
        <div class="chon-nhom nho" id="khay-tu-thu" role="group">
          <button class="chon-nut" data-v="5">5s</button>
          <button class="chon-nut" data-v="10">10s</button>
          <button class="chon-nut" data-v="15">15s</button>
          <button class="chon-nut" data-v="0" data-i18n="set.khay.khongThu">Không thu</button>
        </div>
      </div>
    </section>

    <!-- ── Quay video (05/11) ─────────────────────────────────────────── -->
    <h2 class="nhom-ten" data-i18n="set.nhom.quay">Quay video</h2>
    <section class="nhom">
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.quay.mic"></span>
        <div class="chon-nhom nho" id="quay-mic" role="group">
          <button class="chon-nut" data-v="1" data-i18n="set.moCung.bat"></button>
          <button class="chon-nut" data-v="0" data-i18n="set.moCung.tat"></button>
        </div>
      </div>
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.quay.chuot"></span>
        <div class="chon-nhom nho" id="quay-chuot" role="group">
          <button class="chon-nut" data-v="1" data-i18n="set.moCung.bat"></button>
          <button class="chon-nut" data-v="0" data-i18n="set.moCung.tat"></button>
        </div>
      </div>
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.quay.phim"></span>
        <div class="chon-nhom nho" id="quay-phim" role="group">
          <button class="chon-nut" data-v="1" data-i18n="set.moCung.bat"></button>
          <button class="chon-nut" data-v="0" data-i18n="set.moCung.tat"></button>
        </div>
      </div>
    </section>

    <!-- ── Luu anh ───────────────────────────────────────────────────── -->
    <h2 class="nhom-ten" data-i18n="set.nhom.luu">Lưu ảnh</h2>
    <section class="nhom">
      <div class="hang">
        <div class="thu-muc">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <div class="tm-chu">
            <div id="folder-ten" class="tm-ten">—</div>
            <div id="folder-path" class="tm-duong" title="">—</div>
          </div>
        </div>
        <div class="phai">
          <button id="open-folder" class="nut" data-i18n="set.thuMuc.mo"></button>
          <button id="pick-folder" class="nut" data-i18n="set.thuMuc.doi"></button>
        </div>
      </div>
      <p id="msg-folder" class="msg hang-msg"></p>
    </section>

    <!-- ── Ung dung (04/11 Mo cung Windows + 05/11 Cap nhat): MOT nhom chung. Hang Mo cung chi hien tren ban Windows dong goi (settings.js),
         hang Cap nhat hien o moi he dieu hanh. Cap nhat tu chay ngam; hang nay chi de xem + bam kiem tra tay ─── -->
    <h2 class="nhom-ten" id="nhom-ung-dung-ten" data-i18n="set.nhom.ungDung">Ứng dụng</h2>
    <section class="nhom" id="nhom-ung-dung">
      <div class="hang" id="hang-mo-cung" hidden>
        <span class="nhan-chon" data-i18n="set.moCung.tieuDe"></span>
        <div class="chon-nhom nho" id="mo-cung" role="group">
          <button class="chon-nut" data-v="1" data-i18n="set.moCung.bat"></button>
          <button class="chon-nut" data-v="0" data-i18n="set.moCung.tat"></button>
        </div>
      </div>
      <p id="msg-mo-cung" class="msg err hang-msg"></p>
      <div class="hang" id="the-cn">
        <div class="tm-chu">
          <div id="cn-dong" class="tm-ten"></div>
          <div id="cn-ghi-chu" class="tm-duong"></div>
        </div>
        <div class="phai">
          <button id="cn-tai" class="nut chinh" data-i18n="cn.taiVe" hidden></button>
          <button id="cn-kiem" class="nut" data-i18n="cn.kiemNgay"></button>
        </div>
      </div>
    </section>

    <!-- 06/11: lien ket dieu khien tu ngoai (src/lien-ket.js) — chi de xem + sao chep -->
    <h2 class="nhom-ten" data-i18n="set.lienKet.ten">Điều khiển bằng link</h2>
    <section class="nhom" id="nhom-lien-ket">
      <p class="hang-msg" style="margin-top:0;padding-top:var(--sp-3)" data-i18n="set.lienKet.moTa"></p>
      <div id="lk-ds"></div>
    </section>
  </main>

  <footer id="chan">
    <span id="ver">AiO Shot &amp; Save</span>
  </footer>

  <script src="settings.js"></script>
</body>
</html>
