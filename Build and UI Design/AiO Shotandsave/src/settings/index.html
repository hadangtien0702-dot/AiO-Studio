<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data:; style-src 'unsafe-inline' 'self' file:; font-src file:; script-src 'self'" />
  <title>AiO Shot & Save — Cài đặt</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <!-- Header (frameless): logo AiO + tieu de + doi ngon ngu + dong -->
  <header id="tieu-de">
    <div class="hieu">
      <svg class="logo" viewBox="0 0 385.89 351.31" width="18" height="16" aria-hidden="true">
        <path fill="currentColor" d="M71.66,232.56h61.05v46.15c0,39.55-32.11,71.66-71.66,71.66H0v-46.15C0,264.67,32.11,232.56,71.66,232.56Z"/>
        <path fill="currentColor" d="M385.89,351.31h-53.03c-96.53-2.15-100.18,5.1-136.92-40.6l-116.4-144.82c-36.73-45.7-28.47-110.09,16.24-149.27L116.47,0l269.42,351.31Z"/>
      </svg>
      <span data-i18n="set.tieuDe">Cài đặt</span>
    </div>
    <div class="dieu-khien">
      <div id="lang" class="lang" role="group" aria-label="Language">
        <button data-lang="vi" class="lang-nut">VI</button>
        <button data-lang="en" class="lang-nut">EN</button>
      </div>
      <button id="close" class="dong" aria-label="Close">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <!-- 29/09 anh: "lon xon qua" -> huong B anh chon: danh sach NHOM (ten nhom nam ngoai, hang ke manh, lua chon
       dang bat mau xam noi; cam chi con o nut chinh + thanh ngay dung thu). Giu NGUYEN moi id settings.js dung. -->
  <main>
    <!-- ── Ban quyen: dung thu 14 ngay / nhap ma / huy kich hoat ─────── -->
    <section class="nhom bq" id="the-bq">
      <!-- 29/09 anh "text phu lam gon lai": Mua ban quyen don len goc phai hang tieu de (bot 1 hang) -->
      <div class="bq-dau">
        <div class="bq-trai"><h1 id="bq-tieu-de" data-i18n="bq.tieuDe">Bản quyền</h1><span id="bq-ngay" class="bq-ngay"></span></div>
        <button id="bq-mua" class="lien-ket mua" data-i18n="bq.mua"></button>
      </div>
      <div id="bq-tien-do" class="tien-do" hidden><i id="bq-tien-do-i"></i></div>
      <p class="goi-y" id="bq-mo-ta"></p>
      <!-- chua kich hoat: o nhap ma + Kich hoat + Mua -->
      <div id="bq-nhap">
        <div class="bq-hang">
          <input id="bq-ma" class="bq-o" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="bq.nhapMa" />
          <button id="bq-kich-hoat" class="nut chinh" data-i18n="bq.kichHoat"></button>
        </div>
      </div>
      <!-- da kich hoat: nut huy (bam 2 lan) -->
      <div id="bq-co" hidden>
        <button id="bq-huy" class="nut phu" data-i18n="bq.huy"></button>
      </div>
      <p id="bq-msg" class="msg"></p>
    </section>

    <!-- ── Chup anh ─────────────────────────────────────────────────── -->
    <h2 class="nhom-ten" data-i18n="set.nhom.chup">Chụp ảnh</h2>
    <section class="nhom">
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.phim.tieuDe">Phím tắt</span>
        <div class="phai">
          <!-- idle: keycaps · recording: dong chu nhap nhay (nhan to hop = luu ngay) -->
          <div id="keys" class="keycaps" aria-live="polite"></div>
          <button id="doi" class="nut" data-i18n="set.phim.doiPhim"></button>
          <!-- Ve mac dinh = nut icon (chu o title, settings.js dat) thay dong goi y 2 hang -->
          <button id="reset" class="nut icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
          <button id="huy-ghi" class="nut phu" data-i18n="set.phim.huyNgan" hidden></button>
        </div>
      </div>
      <p id="msg" class="msg hang-msg"></p>

      <div class="hang">
        <span class="nhan-chon" data-i18n="set.anh.dinhDang"></span>
        <div class="chon-nhom" id="anh-loai" role="group">
          <button class="chon-nut" data-v="jpeg">JPEG</button>
          <button class="chon-nut" data-v="png">PNG</button>
        </div>
      </div>
      <div class="hang" id="hang-chat-luong">
        <span class="nhan-chon" data-i18n="set.anh.chatLuong"></span>
        <div class="chon-nhom" id="anh-chat-luong" role="group">
          <button class="chon-nut" data-v="thap" data-i18n="set.anh.thap"></button>
          <button class="chon-nut" data-v="cao" data-i18n="set.anh.cao"></button>
          <button class="chon-nut" data-v="sieu" data-i18n="set.anh.sieu"></button>
        </div>
      </div>
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.lamMo.kieu"></span>
        <div class="chon-nhom" id="lam-mo-kieu" role="group">
          <button class="chon-nut" data-v="mosaic" data-i18n="set.lamMo.mosaic"></button>
          <button class="chon-nut" data-v="blur" data-i18n="set.lamMo.blur"></button>
        </div>
      </div>
    </section>

    <!-- ── Khay anh ──────────────────────────────────────────────────── -->
    <h2 class="nhom-ten" data-i18n="set.nhom.khay">Khay ảnh</h2>
    <section class="nhom">
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.khay.kieu"></span>
        <div class="chon-nhom" id="khay-kieu" role="group">
          <button class="chon-nut" data-v="ngang" data-i18n="set.khay.ngang"></button>
          <button class="chon-nut" data-v="doc" data-i18n="set.khay.doc"></button>
        </div>
      </div>
      <div class="hang">
        <span class="nhan-chon" data-i18n="set.khay.soAnh"></span>
        <div class="chon-nhom nho" id="khay-so-anh" role="group">
          <button class="chon-nut" data-v="0" data-i18n="set.khay.tat"></button>
          <button class="chon-nut" data-v="5">5</button>
          <button class="chon-nut" data-v="10">10</button>
          <button class="chon-nut" data-v="20">20</button>
        </div>
      </div>
    </section>

    <!-- ── Luu anh ───────────────────────────────────────────────────── -->
    <h2 class="nhom-ten" data-i18n="set.nhom.luu">Lưu ảnh</h2>
    <section class="nhom">
      <div class="hang">
        <div class="thu-muc">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <div class="tm-chu">
            <div id="folder-ten" class="tm-ten">—</div>
            <div id="folder-path" class="tm-duong" title="">—</div>
          </div>
        </div>
        <div class="phai">
          <button id="open-folder" class="nut" data-i18n="set.thuMuc.mo"></button>
          <button id="pick-folder" class="nut" data-i18n="set.thuMuc.doi"></button>
        </div>
      </div>
      <p id="msg-folder" class="msg hang-msg"></p>
    </section>
  </main>

  <footer id="chan">
    <span id="ver">AiO Shot &amp; Save</span>
  </footer>

  <script src="settings.js"></script>
</body>
</html>
