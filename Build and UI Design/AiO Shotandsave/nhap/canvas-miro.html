<title>Shot &amp; Save · Canvas ý tưởng (nháp 3)</title>
<!-- NHAP 3, 12/10/2026. Anh Tien xem nhap 2 (o mau phang + cot thu muc): "xau qua creative hon di em".
     Y cua anh: canvas giong app MIRO, tong hop y tuong; anh + video + dai Storyboard deu mo trong canvas; khung tren canvas = thu muc
     cung ten, dong bo hai chieu. Ban thu bam duoc de DUYET HUONG, KHONG phai ma cua app, khong dung file that.
     Y tuong lay tu chinh san pham (bai hoc 29/09 + 01/10: khac nhau o Y, khong o easing):
     - KHUNG la THU MUC: moi khung co TAI THU MUC mau rieng mang ten nhom, so dem nhay khi tha anh vao.
     - ANH la TAM IN: vien trang, nam hoi nghieng; re chuot hien 4 GOC CAM (khung chon cua app).
     - Y tuong BAY RA TU NUT TRON (nut cua khay): mo bang la cac tam chia ra tu nut; bam nut = "chup" them mot tam.
     - Ghi chu dan + mui ten ve tay noi y; tieu de chu lon nam tren bang.
     Thu: keo nen · Ctrl / Cmd + lan de phong · keo tam anh / ghi chu · tha vao khung · keo tai thu muc de doi cho khung · keo goc de doi co
     · bam ten tren tai de doi ten · bam "Finder" de xem thu muc tren may doi theo · bam nut tron de chup them. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Inter;src:url(../assets/fonts/Inter.woff2) format("woff2");font-weight:100 900}
:root{--bg0:#0c0c0d;--bg2:#181818;--bg4:#262628;--bg5:#333;--line:rgba(255,255,255,.1);--t1:#f5f5f7;--t3:#8d8d95;--cam:#f86820}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--t1);font:13px/1.45 Inter,system-ui,sans-serif}
button,input{font-family:inherit;font-size:inherit;color:inherit}
.bang{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--bg0);background-image:radial-gradient(rgba(255,255,255,.11) 1.1px,transparent 1.1px)}
.bang.keo{cursor:grabbing}
.the{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.tieu{position:absolute;font-weight:800;font-size:92px;line-height:.95;letter-spacing:-.045em;white-space:nowrap;pointer-events:none}
.tieu em{font-style:normal;color:var(--cam)}
.tieu small{display:block;margin-top:30px;font:600 30px/1 Caveat,cursive;letter-spacing:0;color:var(--t3);transform:rotate(-2deg);transform-origin:0 0}
.khung{position:absolute;border:1.5px solid color-mix(in srgb,var(--m) 55%,transparent);border-radius:4px 18px 18px 18px;background:color-mix(in srgb,var(--m) 7%,transparent);transition:background .2s,box-shadow .2s}
.khung.vao{background:color-mix(in srgb,var(--m) 16%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--m) 35%,transparent)}
.khung .tai{position:absolute;left:-1.5px;top:-33px;height:33px;display:flex;align-items:center;gap:6px;padding:0 10px 0 9px;border-radius:11px 14px 0 0;background:var(--m);color:#17120d;cursor:grab;max-width:calc(100% + 3px)}
.khung .tai::after{content:"";position:absolute;right:-13px;bottom:0;width:14px;height:14px;background:radial-gradient(circle at 100% 0,transparent 13px,var(--m) 13.5px)}
.khung .tai svg{flex:none}
.khung .tai input{background:transparent;border:1px solid transparent;border-radius:6px;padding:1px 4px;font-weight:800;color:#17120d;min-width:40px}
.khung .tai input:hover{border-color:rgba(0,0,0,.25)}
.khung .tai input:focus{outline:none;border-color:rgba(0,0,0,.55);background:rgba(255,255,255,.35)}
.khung .tai b{flex:none;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:rgba(0,0,0,.78);color:#fff;font:700 11px/20px Inter;text-align:center;font-variant-numeric:tabular-nums}
.khung .tai b.nay{animation:nay .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes nay{40%{transform:scale(1.45)}}
.khung .goc{position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;border-radius:6px;background:var(--m);opacity:.85;cursor:nwse-resize}
.o{position:absolute;padding:6px 6px 22px;background:#f4f1ea;border-radius:4px;cursor:grab;box-shadow:0 3px 10px rgba(0,0,0,.45);transform:rotate(var(--r,0deg));transition:transform .55s cubic-bezier(.2,.9,.25,1.12),opacity .3s,box-shadow .2s}
.o svg.anh{display:block;width:100%;height:100%;border-radius:2px}
.o .ngay{position:absolute;left:8px;bottom:3px;font:600 16px/1 Caveat,cursive;color:#3a342b}
.o .loai{position:absolute;right:7px;bottom:5px;font:700 9px/1 Inter;letter-spacing:.06em;text-transform:uppercase;color:#8a8275}
.o.video{background:#16161a;padding:14px 6px 22px}
.o.video::before,.o.video::after{content:"";position:absolute;left:6px;right:6px;height:6px;background:repeating-linear-gradient(90deg,#f4f1ea 0 7px,transparent 7px 14px);opacity:.75}
.o.video::before{top:4px}.o.video::after{bottom:22px;display:none}
.o.video .ngay{color:#f4f1ea}.o.video .loai{color:#9a9aa3}
.o .phat{position:absolute;left:0;right:0;top:0;bottom:16px;margin:auto;width:34px;height:34px;border-radius:17px;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;pointer-events:none}
.o.dai{padding:6px 6px 22px;background:#16161a}
.o.dai .dayk{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;height:100%}
.o.dai .dayk svg{width:100%;height:100%;border-radius:2px;display:block}
.o.dai .ngay{color:#f4f1ea}.o.dai .loai{color:#9a9aa3}
.o i.g{position:absolute;width:14px;height:14px;border:3px solid var(--cam);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none}
.o i.g1{left:-7px;top:-7px;border-right:0;border-bottom:0;transform:translate(5px,5px)}
.o i.g2{right:-7px;top:-7px;border-left:0;border-bottom:0;transform:translate(-5px,5px)}
.o i.g3{left:-7px;bottom:-7px;border-right:0;border-top:0;transform:translate(5px,-5px)}
.o i.g4{right:-7px;bottom:-7px;border-left:0;border-top:0;transform:translate(-5px,-5px)}
.o:hover i.g,.o.nang i.g{opacity:1;transform:none}
.o:hover{transform:rotate(0deg) scale(1.03);box-shadow:0 10px 26px rgba(0,0,0,.55);z-index:4}
.o.nang{cursor:grabbing;transition:none;transform:rotate(0deg) scale(1.06);box-shadow:0 18px 40px rgba(0,0,0,.6);z-index:6}
.o.bay{transform:translate(var(--ix,0px),var(--iy,0px)) scale(.12) rotate(50deg);opacity:0}
.ghi{position:absolute;width:176px;min-height:128px;padding:14px 14px 18px;background:var(--g,#ffd65a);color:#2b2204;font:700 23px/1.08 Caveat,cursive;box-shadow:0 6px 16px rgba(0,0,0,.45);transform:rotate(var(--r,0deg));cursor:grab;transition:transform .55s cubic-bezier(.2,.9,.25,1.12),opacity .3s}
.ghi::before{content:"";position:absolute;left:50%;top:-9px;width:62px;height:18px;margin-left:-31px;background:rgba(255,255,255,.42);transform:rotate(-3deg)}
.ghi.nang{cursor:grabbing;transition:none;transform:rotate(0deg) scale(1.05);z-index:6}
.ghi.bay{transform:translate(var(--ix,0px),var(--iy,0px)) scale(.12) rotate(-40deg);opacity:0}
svg.day{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.noi{position:fixed;z-index:20;background:rgba(24,24,24,.9);border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.ten{left:16px;top:16px;height:40px;border-radius:12px;display:flex;align-items:center;gap:9px;padding:0 14px 0 11px}
.ten b{font-size:14px;font-weight:800}.ten span{color:var(--t3)}
.thanh{left:50%;bottom:18px;transform:translateX(-50%);height:46px;border-radius:23px;display:flex;align-items:center;gap:4px;padding:0 8px}
.thanh button{height:32px;padding:0 12px;border-radius:16px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.thanh button:hover{background:var(--bg5)}
.thanh .vach{width:1px;height:20px;background:var(--line);margin:0 4px}
.thanh .ti{min-width:46px;text-align:center;color:var(--t3);font-variant-numeric:tabular-nums}
.fd{right:16px;top:16px;width:236px;border-radius:14px;overflow:hidden}
.fd h4{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;font-weight:700;cursor:pointer}
.fd h4 span{color:var(--t3);font-weight:500;margin-left:auto}
.fd .ds{padding:0 12px 10px;display:none}
.fd.mo .ds{display:block}
.hang{display:flex;align-items:center;gap:8px;height:30px;border-top:1px solid var(--line)}
.hang.con{padding-left:16px}
.hang i{flex:none;width:10px;height:10px;border-radius:3px;background:var(--m,#777)}
.hang input{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 5px}
.hang input:hover:not(:disabled){border-color:var(--line)}
.hang input:focus{outline:none;border-color:var(--cam);background:var(--bg2)}
.hang span{color:var(--t3);flex:none;font-variant-numeric:tabular-nums}
.ntr{position:fixed;z-index:21;right:22px;bottom:20px;width:58px;height:58px;border-radius:29px;border:0;cursor:pointer;background:radial-gradient(circle at 34% 28%,#3a3a42,#19191c 62%);box-shadow:0 6px 16px rgba(0,0,0,.6),0 0 0 2px rgba(248,104,32,.75);display:flex;align-items:center;justify-content:center;color:var(--cam);transition:transform .15s}
.ntr:hover{transform:scale(1.07)}.ntr:active{transform:scale(.93)}
.ntr b{position:absolute;right:-5px;top:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--cam);color:#fff;font:700 11px/22px Inter;box-shadow:0 0 0 2px #0c0c0d}
.ntr u{position:absolute;right:66px;top:50%;transform:translateY(-50%);white-space:nowrap;text-decoration:none;font:700 21px/1 Caveat,cursive;color:var(--t3)}
.chop{position:fixed;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none}
.chop.nay{animation:chop .32s ease-out}
@keyframes chop{0%{opacity:.5}100%{opacity:0}}
@media(max-width:820px){.fd{display:none}.thanh .chu{display:none}.ntr u{display:none}}
@media(prefers-reduced-motion:reduce){.o,.ghi{transition:none}}
</style>
</head>
<body>
<div class="bang" id="bang"><div class="the" id="the"><svg class="day" id="day" width="10" height="10"></svg></div></div>
<div class="noi ten"><svg width="20" height="18" viewBox="0 0 385.89 351.31" aria-hidden="true"><path fill="#f86820" d="M71.66,232.56h61.05v46.15c0,39.55-32.11,71.66-71.66,71.66H0v-46.15c0-39.55,32.11-71.66,71.66-71.66Z"/><path fill="#f86820" d="M385.89,351.31h-104.2c-32.9,0-62.6-19.73-75.36-50.06L79.21,0h104.2c32.9,0,62.6,19.73,75.36,50.06l127.12,301.25Z"/></svg><b>Canvas</b><span id="dem"></span></div>

<script>
(() => {
  // ---- "anh chup" ve bang SVG: moi kieu la mot thu editor hay chup lai ----
  const VE = {
    mau: () => '<rect width="160" height="110" fill="#1b1b1f"/>' + ["#f86820", "#ffd65a", "#2dd4bf", "#3b6fe0", "#f4f1ea"].map((c, i) => '<rect x="' + (10 + i * 28.5) + '" y="12" width="25" height="70" rx="4" fill="' + c + '"/>').join("") + '<rect x="10" y="90" width="60" height="6" rx="3" fill="#55555c"/><rect x="76" y="90" width="34" height="6" rx="3" fill="#3a3a40"/>',
    thumb: () => '<rect width="160" height="110" fill="#101822"/><rect x="0" y="78" width="160" height="32" fill="#ffd65a"/><text x="10" y="50" font-family="Inter,sans-serif" font-weight="900" font-size="34" fill="#fff" letter-spacing="-2">5 MẸO</text><text x="10" y="100" font-family="Inter,sans-serif" font-weight="900" font-size="17" fill="#101822">DỰNG NHANH</text><circle cx="126" cy="46" r="26" fill="#f86820"/><circle cx="126" cy="40" r="10" fill="#101822"/><path d="M106 62a20 14 0 0 1 40 0z" fill="#101822"/>',
    chat: () => '<rect width="160" height="110" fill="#eef1f6"/><rect x="10" y="12" width="96" height="24" rx="12" fill="#fff"/><rect x="20" y="21" width="70" height="6" rx="3" fill="#c4c9d4"/><rect x="54" y="44" width="96" height="24" rx="12" fill="#3b6fe0"/><rect x="66" y="53" width="60" height="6" rx="3" fill="#b9cdf5"/><rect x="10" y="76" width="74" height="24" rx="12" fill="#fff"/><rect x="20" y="85" width="44" height="6" rx="3" fill="#c4c9d4"/>',
    tl: () => '<rect width="160" height="110" fill="#17171b"/><rect x="0" y="0" width="160" height="16" fill="#222228"/>' + [["#3b6fe0", 8, 46], ["#3b6fe0", 58, 30], ["#3b6fe0", 92, 58], ["#2dd4bf", 8, 70], ["#2dd4bf", 84, 40], ["#f86820", 30, 90]].map((c, i) => '<rect x="' + c[1] + '" y="' + (26 + Math.floor(i / 2.01) * 24 + (i % 2 && i < 4 ? 0 : 0)) + '" width="' + c[2] + '" height="16" rx="3" fill="' + c[0] + '" opacity=".9"/>').join("") + '<rect x="70" y="16" width="2" height="94" fill="#ff5f6d"/><path d="M65 16h12l-6 8z" fill="#ff5f6d"/>',
    chu: () => '<rect width="160" height="110" fill="#f4f1ea"/><text x="12" y="70" font-family="Inter,sans-serif" font-weight="900" font-size="74" fill="#17120d" letter-spacing="-5">Aa</text><rect x="108" y="22" width="40" height="7" rx="3" fill="#17120d"/><rect x="108" y="36" width="30" height="7" rx="3" fill="#b9b2a3"/><rect x="108" y="50" width="36" height="7" rx="3" fill="#b9b2a3"/><rect x="12" y="86" width="136" height="8" rx="4" fill="#f86820"/>',
    canh: (a, b) => '<rect width="160" height="110" fill="' + (a || "#2b3a67") + '"/><circle cx="118" cy="34" r="16" fill="' + (b || "#ffd65a") + '"/><path d="M0 110V78l34-26 30 22 26-16 34 24 36-20v48z" fill="#0f1424" opacity=".85"/><path d="M0 110V92l40-16 44 18 40-12 36 10v18z" fill="#0b0e19"/>',
    ui: () => '<rect width="160" height="110" fill="#fff"/><rect width="160" height="18" fill="#17120d"/><circle cx="10" cy="9" r="3" fill="#f86820"/><rect x="10" y="28" width="66" height="34" rx="5" fill="#f4f1ea"/><rect x="84" y="28" width="66" height="34" rx="5" fill="#f4f1ea"/><rect x="10" y="70" width="140" height="8" rx="4" fill="#d9d4c7"/><rect x="10" y="84" width="90" height="8" rx="4" fill="#d9d4c7"/><rect x="112" y="80" width="38" height="16" rx="8" fill="#f86820"/>',
  };
  const svg = (k, a, b) => '<svg class="anh" viewBox="0 0 160 110" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + VE[k](a, b) + "</svg>";
  const MAU_K = ["#f86820", "#2dd4bf", "#a78bfa", "#ffd65a", "#f472b6", "#4ade80"];
  let so = 0;
  const nghieng = () => (Math.round((Math.random() * 7 - 3.5) * 10) / 10);
  const muc = (kieu, ve, ten, x, y, a, b) => ({ id: ++so, kieu, ve, ten, x, y, w: kieu === "dai" ? 372 : kieu === "ghi" ? 176 : 184, h: kieu === "ghi" ? 128 : kieu === "video" ? 156 : 150, r: nghieng(), a, b });
  const khung = [
    { id: "k1", ten: "Tham khảo màu", m: MAU_K[0], x: 40, y: 300, w: 640, h: 380 },
    { id: "k2", ten: "Brief khách Thinksmart", m: MAU_K[1], x: 780, y: 300, w: 700, h: 560 },
    { id: "k3", ten: "Thumbnail YouTube", m: MAU_K[2], x: 40, y: 800, w: 640, h: 330 },
  ];
  const mucs = [
    muc("anh", "mau", "07/10", 70, 330), muc("anh", "canh", "07/10", 276, 352, "#5b2a3c", "#f86820"), muc("anh", "canh", "06/10", 470, 326, "#1f4e5f", "#ffd65a"), muc("anh", "chu", "06/10", 170, 506),
    muc("anh", "chat", "04/10", 812, 336), muc("dai", "canh", "Storyboard 04", 1036, 346), muc("video", "canh", "0:48", 824, 530, "#3a2a5c", "#f472b6"), muc("anh", "ui", "02/10", 1048, 540), muc("anh", "tl", "02/10", 1262, 640),
    muc("anh", "thumb", "30/09", 76, 836), muc("anh", "thumb", "29/09", 290, 862),
    muc("anh", "canh", "11:54", 800, 950, "#24452f", "#ffd65a"), muc("anh", "tl", "11:38", 1010, 980), muc("video", "canh", "0:12", 1230, 944, "#4a3020", "#f4f1ea"),
    Object.assign(muc("ghi", null, "Màu cam này hợp intro phim Tết", 462, 512), { g: "#ffd65a" }),
    Object.assign(muc("ghi", null, "Hỏi khách: bản dọc hay bản ngang?", 1276, 506), { g: "#ffb3c7" }),
  ];
  const NOI = [[15, 2], [16, 6]]; // mui ten ve tay: ghi chu -> tam anh
  const bang = document.getElementById("bang"), the = document.getElementById("the"), cay = document.getElementById("cay"), day = document.getElementById("day"), nutChup = document.getElementById("chup");
  const TM = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  const PHAT = '<span class="phat"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></span>';
  const G4 = '<i class="g g1"></i><i class="g g2"></i><i class="g g3"></i><i class="g g4"></i>';
  const V = { x: 0, y: 0, s: 1 };
  const elK = new Map(), elO = new Map(), demCu = new Map();
  const laFile = (m) => m.kieu !== "ghi";
  const cuaKhung = (m) => khung.find(k => m.x + m.w / 2 >= k.x && m.x + m.w / 2 <= k.x + k.w && m.y + m.h / 2 >= k.y && m.y + m.h / 2 <= k.y + k.h) || null;
  const tenHopLe = (s, bo) => { s = String(s || "").replace(/[\\/:*?"<>|]/g, "").trim().slice(0, 60); if (!s) return null; return khung.some(k => k !== bo && k.ten.toLowerCase() === s.toLowerCase()) ? null : s; };
  function datNhin() {
    the.style.transform = "translate(" + V.x + "px," + V.y + "px) scale(" + V.s + ")";
    const o = 26 * V.s; bang.style.backgroundSize = o + "px " + o + "px"; bang.style.backgroundPosition = V.x + "px " + V.y + "px";
    document.getElementById("ti").textContent = Math.round(V.s * 100) + "%";
  }
  function dungKhung(k) {
    const e = document.createElement("div"); e.className = "khung"; e.dataset.k = k.id; e.style.setProperty("--m", k.m);
    e.innerHTML = '<div class="tai">' + TM + '<input aria-label="Tên khung" data-ten="' + k.id + '"><b></b></div><div class="goc" aria-hidden="true"></div>';
    the.insertBefore(e, day); elK.set(k.id, e); return e;
  }
  function dungO(m) {
    const e = document.createElement("div"); e.dataset.id = m.id; e.style.setProperty("--r", m.r + "deg");
    if (m.kieu === "ghi") { e.className = "ghi"; e.style.setProperty("--g", m.g); e.textContent = m.ten; }
    else if (m.kieu === "dai") { e.className = "o dai"; e.innerHTML = '<div class="dayk">' + [["#2b3a67", "#ffd65a"], ["#5b2a3c", "#f86820"], ["#1f4e5f", "#f4f1ea"], ["#3a2a5c", "#f472b6"], ["#24452f", "#ffd65a"], ["#4a3020", "#2dd4bf"]].map(c => svg("canh", c[0], c[1])).join("") + '</div><span class="ngay">' + m.ten + '</span><span class="loai">6 shot</span>' + G4; }
    else { e.className = "o" + (m.kieu === "video" ? " video" : ""); e.innerHTML = svg(m.ve, m.a, m.b) + (m.kieu === "video" ? PHAT : "") + '<span class="ngay">' + m.ten + '</span><span class="loai">' + (m.kieu === "video" ? "video" : "ảnh") + "</span>" + G4; }
    the.append(e); elO.set(m.id, e); return e;
  }
  const tam = (m) => [m.x + m.w / 2, m.y + m.h / 2];
  function veDay() {
    day.innerHTML = '<defs><marker id="mt" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2 10 6 2 10" fill="none" stroke="#f4f1ea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>' + NOI.map(([a, b]) => {
      const A = mucs.find(m => m.id === a), B = mucs.find(m => m.id === b); if (!A || !B) return "";
      const [x1, y1] = tam(A), [x2, y2] = tam(B), dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
      const sx = x1 + ux * 96, sy = y1 + uy * 70, ex = x2 - ux * 104, ey = y2 - uy * 84, cx = (sx + ex) / 2 - uy * 46, cy = (sy + ey) / 2 + ux * 46;
      return '<path d="M' + sx.toFixed(1) + " " + sy.toFixed(1) + " Q" + cx.toFixed(1) + " " + cy.toFixed(1) + " " + ex.toFixed(1) + " " + ey.toFixed(1) + '" fill="none" stroke="#f4f1ea" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 7" marker-end="url(#mt)" opacity=".8"/>';
    }).join("");
  }
  function capNhat() {
    for (const k of khung) {
      const e = elK.get(k.id) || dungKhung(k); e.style.left = k.x + "px"; e.style.top = k.y + "px"; e.style.width = k.w + "px"; e.style.height = k.h + "px";
      const i = e.querySelector("input"); if (document.activeElement !== i) { i.value = k.ten; i.style.width = Math.min(320, Math.max(60, Math.round(k.ten.length * 8.6 + 16))) + "px"; }
      const n = mucs.filter(m => laFile(m) && cuaKhung(m) === k).length, b = e.querySelector("b"); b.textContent = n;
      if (demCu.has(k.id) && demCu.get(k.id) !== n) { b.classList.remove("nay"); void b.offsetWidth; b.classList.add("nay"); }
      demCu.set(k.id, n);
    }
    for (const m of mucs) { const e = elO.get(m.id) || dungO(m); e.style.left = m.x + "px"; e.style.top = m.y + "px"; e.style.width = m.w + "px"; if (m.kieu !== "ghi") e.style.height = m.h + "px"; }
    veDay();
    const file = mucs.filter(laFile), ngoai = file.filter(m => !cuaKhung(m)).length, tr = document.activeElement && document.activeElement.closest && document.activeElement.closest("#cay");
    if (!tr) cay.innerHTML = '<div class="hang"><i></i><input value="shotandsave" disabled><span>' + ngoai + "</span></div>" + khung.map(k => '<div class="hang con"><i style="--m:' + k.m + '"></i><input value="' + k.ten.replace(/"/g, "&quot;") + '" aria-label="Tên thư mục" data-ten="' + k.id + '"><span>' + file.filter(m => cuaKhung(m) === k).length + "</span></div>").join("");
    document.getElementById("dem").textContent = file.length + " ý tưởng · " + khung.length + " thư mục";
    document.getElementById("soNut").textContent = file.length;
  }
  document.addEventListener("change", e => {
    const id = e.target.dataset && e.target.dataset.ten; if (!id) return;
    const k = khung.find(x => x.id === id), moi = tenHopLe(e.target.value, k);
    if (moi) k.ten = moi;
    e.target.blur(); capNhat();
  });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.ten) e.target.blur(); });
  document.querySelector("#fd h4").addEventListener("click", () => { const mo = document.getElementById("fd").classList.toggle("mo"); document.getElementById("fdm").textContent = mo ? "đóng" : "mở"; });
  // ---- keo: tam anh / ghi chu / khung / goc khung / nen ----
  let keo = null;
  const batDau = (e, loai, them) => { keo = Object.assign({ loai, x0: e.clientX, y0: e.clientY }, them); try { bang.setPointerCapture(e.pointerId); } catch (err) {} };
  bang.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest("input")) return;
    const o = e.target.closest(".o,.ghi"), goc = e.target.closest(".goc"), tai = e.target.closest(".tai");
    if (o) { const m = mucs.find(x => x.id === Number(o.dataset.id)); the.append(o); o.classList.add("nang"); batDau(e, "o", { m, gx: m.x, gy: m.y, el: o }); }
    else if (goc) { const k = khung.find(x => x.id === goc.parentElement.dataset.k); batDau(e, "co", { k, gw: k.w, gh: k.h }); }
    else if (tai) { const k = khung.find(x => x.id === tai.parentElement.dataset.k); batDau(e, "khung", { k, gx: k.x, gy: k.y, trong: mucs.filter(m => cuaKhung(m) === k).map(m => ({ m, x: m.x, y: m.y })) }); }
    else { bang.classList.add("keo"); batDau(e, "nen", { gx: V.x, gy: V.y }); }
    e.preventDefault();
  });
  bang.addEventListener("pointermove", e => {
    if (!keo) return;
    const dx = e.clientX - keo.x0, dy = e.clientY - keo.y0, s = V.s;
    if (keo.loai === "nen") { V.x = keo.gx + dx; V.y = keo.gy + dy; datNhin(); return; }
    if (keo.loai === "o") { keo.m.x = keo.gx + dx / s; keo.m.y = keo.gy + dy / s; const k = laFile(keo.m) ? cuaKhung(keo.m) : null; elK.forEach((el, id) => el.classList.toggle("vao", !!k && k.id === id)); }
    if (keo.loai === "khung") { keo.k.x = keo.gx + dx / s; keo.k.y = keo.gy + dy / s; keo.trong.forEach(t => { t.m.x = t.x + dx / s; t.m.y = t.y + dy / s; }); }
    if (keo.loai === "co") { keo.k.w = Math.max(240, keo.gw + dx / s); keo.k.h = Math.max(180, keo.gh + dy / s); }
    capNhat();
  });
  const tha = () => { if (!keo) return; if (keo.el) keo.el.classList.remove("nang"); bang.classList.remove("keo"); elK.forEach(el => el.classList.remove("vao")); keo = null; capNhat(); };
  bang.addEventListener("pointerup", tha); bang.addEventListener("pointercancel", tha);
  function phong(k, cx, cy) { const s2 = Math.min(3, Math.max(.15, V.s * k)), r = bang.getBoundingClientRect(), px = cx - r.left, py = cy - r.top; V.x = px - (px - V.x) * (s2 / V.s); V.y = py - (py - V.y) * (s2 / V.s); V.s = s2; datNhin(); }
  bang.addEventListener("wheel", e => { e.preventDefault(); if (e.ctrlKey || e.metaKey) phong(Math.exp(-e.deltaY * .01), e.clientX, e.clientY); else { V.x -= e.deltaX; V.y -= e.deltaY; datNhin(); } }, { passive: false });
  const giua = () => [innerWidth / 2, innerHeight / 2];
  document.getElementById("to").addEventListener("click", () => phong(1.25, ...giua()));
  document.getElementById("nho").addEventListener("click", () => phong(.8, ...giua()));
  function vua() {
    const tat = [{ x: 40, y: 60, w: 900, h: 190 }, ...khung.map(k => ({ x: k.x, y: k.y - 36, w: k.w, h: k.h + 36 })), ...mucs];
    const x0 = Math.min(...tat.map(a => a.x)), y0 = Math.min(...tat.map(a => a.y)), x1 = Math.max(...tat.map(a => a.x + a.w)), y1 = Math.max(...tat.map(a => a.y + a.h));
    const leX = 40, tren = 70, duoi = 84; V.s = Math.min(1.4, Math.max(.15, Math.min((innerWidth - leX * 2) / (x1 - x0), (innerHeight - tren - duoi) / (y1 - y0))));
    V.x = (innerWidth - (x1 - x0) * V.s) / 2 - x0 * V.s; V.y = tren + (innerHeight - tren - duoi - (y1 - y0) * V.s) / 2 - y0 * V.s; datNhin();
  }
  document.getElementById("vua").addEventListener("click", vua);
  document.getElementById("them").addEventListener("click", () => {
    let n = 1, ten; do { ten = "Thư mục mới" + (n > 1 ? " " + n : ""); n++; } while (!tenHopLe(ten));
    const k = { id: "k" + Date.now(), ten, m: MAU_K[khung.length % MAU_K.length], x: (innerWidth / 2 - V.x) / V.s - 200, y: (innerHeight / 2 - V.y) / V.s - 130, w: 400, h: 260 };
    khung.push(k); capNhat(); const i = elK.get(k.id).querySelector("input"); i.focus(); i.select();
  });
  // ---- bay ra tu nut tron: toa do nut (man hinh) -> toa do bang ----
  function bayTuNut(m, tre) {
    const e = elO.get(m.id), r = nutChup.getBoundingClientRect(), nx = (r.left + r.width / 2 - V.x) / V.s, ny = (r.top + r.height / 2 - V.y) / V.s;
    e.style.setProperty("--ix", (nx - (m.x + m.w / 2)) + "px"); e.style.setProperty("--iy", (ny - (m.y + m.h / 2)) + "px");
    e.classList.add("bay"); void e.offsetWidth; setTimeout(() => e.classList.remove("bay"), tre);
  }
  document.getElementById("themGhi").addEventListener("click", () => {
    const m = Object.assign(muc("ghi", null, "Ý mới...", (innerWidth / 2 - V.x) / V.s - 88 + Math.random() * 60, (innerHeight / 2 - V.y) / V.s - 64 + Math.random() * 60), { g: ["#ffd65a", "#ffb3c7", "#b8f2c8"][so % 3] });
    mucs.push(m); capNhat(); bayTuNut(m, 20);
  });
  const KIEU = ["canh", "ui", "chat", "mau", "thumb", "tl", "chu"];
  nutChup.addEventListener("click", () => {
    const chop = document.getElementById("chop"); chop.classList.remove("nay"); void chop.offsetWidth; chop.classList.add("nay");
    const bay = new Date(), gio = String(bay.getHours()).padStart(2, "0") + ":" + String(bay.getMinutes()).padStart(2, "0");
    const m = muc("anh", KIEU[so % KIEU.length], gio, 800 + Math.random() * 520, 930 + Math.random() * 120, MAU_K[so % 6] + "", "#ffd65a");
    if (m.ve === "canh") { m.a = ["#2b3a67", "#5b2a3c", "#1f4e5f"][so % 3]; }
    mucs.push(m); capNhat(); bayTuNut(m, 30);
  });
  window.__cv = { khung, mucs, V, capNhat, cuaKhung, vua };
  // tieu de chu lon nam tren bang
  const t = document.createElement("div"); t.className = "tieu"; t.style.left = "40px"; t.style.top = "64px"; t.innerHTML = 'Mọi <em>ý tưởng</em>, một bảng.<small>chụp ở đâu, nó về đây. xếp ở đây, thư mục đi theo.</small>'; the.prepend(t);
  capNhat(); vua();
  // mo bang: cac tam CHIA RA tu nut tron (cu nhat truoc), nhu luc khay bung
  if (!matchMedia("(prefers-reduced-motion:reduce)").matches) { // cho trang ve xong roi moi chia bai (font tai cham thi luot chia van duoc thay)
    const chia = () => requestAnimationFrame(() => mucs.forEach((m, i) => bayTuNut(m, 160 + i * 60)));
    if (document.readyState === "complete") chia(); else addEventListener("load", chia, { once: true });
  }
})();
</script>
